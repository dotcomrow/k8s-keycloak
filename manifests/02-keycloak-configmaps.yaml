apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-client-config-internal
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  ollama-service.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-ollama-service#value>",
      "name": "Ollama Service",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-ollama-service#value>",
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": true
    }
  drools-workbench.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-drools-workbench#value>",
      "name": "Drools Workbench",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-drools-workbench#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": true,
      "redirectUris": [
        "https://workbench-drools.teleport.app.suncoast.systems/*",
        "https://workbench-drools.teleport.app.suncoast.systems/oauth2/callback",
        "https://workbench-drools.teleport.app.suncoast.systems/business-central/*",
        "http://localhost/*"
      ],
      "webOrigins": ["https://workbench-drools.teleport.app.suncoast.systems"]
    }
  drools-kie-server.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-drools-kie-server#value>",
      "name": "Drools KIE Server API",
      "protocol": "openid-connect",
      "publicClient": false,
      "secret": "<path:secret/data/keycloak-client-secret-drools-kie-server#value>",
      "bearerOnly": false,
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "serviceAccountsEnabled": false
    }
  drools-kie-server-service.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-drools-kie-server-service#value>",
      "name": "Drools KIE Server Service Account",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-drools-kie-server-service#value>",
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": true
    }
  drools-workbench-proxy.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-drools-workbench-proxy#value>",
      "name": "Drools Workbench OAuth2 Proxy",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-drools-workbench-proxy#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": [
        "https://workbench-drools.teleport.app.suncoast.systems/oauth2/callback",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://workbench-drools.teleport.app.suncoast.systems"
      ],
      "protocolMappers": [
        {
          "name": "audience-drools-workbench",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-drools-workbench#value>",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        }
      ]
    }
  hasura-console-proxy.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-hasura-console-proxy#value>",
      "name": "Hasura Console OAuth2 Proxy",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-hasura-console-proxy#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": [
        "https://graphql-gui.teleport.app.suncoast.systems/oauth2/callback",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://graphql-gui.teleport.app.suncoast.systems"
      ],
      "protocolMappers": [
        {
          "name": "audience-hasura-console-proxy",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-hasura-console-proxy#value>",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        },
        {
          "name": "hasura-claims",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "https://hasura.io/jwt/claims",
            "claim.value": "{\"x-hasura-default-role\":\"admin\",\"x-hasura-allowed-roles\":[\"admin\"]}",
            "jsonType.label": "JSON",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        }
      ]
    }
  flink-gui-proxy.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-flink-gui-proxy#value>",
      "name": "Flink GUI OAuth2 Proxy",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-flink-gui-proxy#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": [
        "https://flink-gui.teleport.app.suncoast.systems/oauth2/callback",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://flink-gui.teleport.app.suncoast.systems"
      ],
      "protocolMappers": [
        {
          "name": "audience-flink-gui-proxy",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-flink-gui-proxy#value>",
            "access.token.claim": "true",
            "id.token.claim": "true"
          }
        }
      ]
    }
  nifi-gui.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-nifi-gui#value>",
      "name": "NiFi GUI",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-nifi-gui#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": [
        "https://nifi-gui.teleport.app.suncoast.systems/nifi-api/access/oidc/callback",
        "https://nifi-gui.teleport.app.suncoast.systems/nifi-api/access/oidc/callback/consumer",
        "https://nifi-gui.teleport.app.suncoast.systems:443/nifi-api/access/oidc/callback",
        "https://nifi-gui.teleport.app.suncoast.systems:443/*",
        "https://nifi-gui.teleport.app.suncoast.systems/*",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://nifi-gui.teleport.app.suncoast.systems",
        "https://nifi-gui.teleport.app.suncoast.systems:443"
      ],
      "protocolMappers": [
        {
          "name": "realm-roles-groups",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-realm-role-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "groups",
            "jsonType.label": "String",
            "multivalued": "true",
            "access.token.claim": "true",
            "id.token.claim": "true",
            "userinfo.token.claim": "true",
            "introspection.token.claim": "true"
          }
        }
      ]
    }
  kafka-gui-proxy.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-kafka-gui-proxy#value>",
      "name": "Kafka GUI OAuth2 Proxy",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-kafka-gui-proxy#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": [
        "https://kafka-gui.teleport.app.suncoast.systems/oauth2/callback",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://kafka-gui.teleport.app.suncoast.systems"
      ],
      "protocolMappers": [
        {
          "name": "audience-kafka-gui-proxy",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-kafka-gui-proxy#value>",
            "access.token.claim": "true",
            "id.token.claim": "true"
          }
        }
      ]
    }
  cms-site-internal.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-cms-site-internal#value>",
      "name": "CMS Site Internal (Cloudflare Worker)",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-cms-site-internal#value>",
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": false,
      "protocolMappers": [
        {
          "name": "audience-auth-gateway-exchange",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "auth-gateway-exchange",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        },
        {
          "name": "audience-graphql-api",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-graphql-api#value>",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        },
        {
          "name": "hasura-claims",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "https://hasura.io/jwt/claims",
            "claim.value": "{\"x-hasura-default-role\":\"user\",\"x-hasura-allowed-roles\":[\"user\"],\"x-hasura-role\":\"user\"}",
            "jsonType.label": "JSON",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        }
      ]
    }
  graphql-api.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-graphql-api#value>",
      "name": "GraphQL API",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-graphql-api#value>",
      "attributes": {
        "standard.token.exchange.enabled": "true"
      },
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": true,
      "redirectUris": [
        "https://oauth.pstmn.io/v1/callback",
        "http://localhost/*"
      ],
      "webOrigins": [],
      "protocolMappers": [
        {
          "name": "audience-graphql-api",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "<path:secret/data/keycloak-client-id-graphql-api#value>",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        },
        {
          "name": "hasura-allowed-roles",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-client-role-mapper",
          "consentRequired": false,
          "config": {
            "usermodel.clientRoleMapping.clientId": "<path:secret/data/keycloak-client-id-graphql-api#value>",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-allowed-roles",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false",
            "multivalued": "true"
          }
        },
        {
          "name": "hasura-default-role",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-default-role",
            "claim.value": "user",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        },
        {
          "name": "hasura-user-id",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-property-mapper",
          "consentRequired": false,
          "config": {
            "user.attribute": "id",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-user-id",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        }
      ]
    }
  auth-gateway-exchange.json: |
    {
      "clientId": "auth-gateway-exchange",
      "name": "Auth Gateway Exchange Client",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-auth-gateway-exchange#value>",
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": false,
      "attributes": {
        "standard.token.exchange.enabled": "true"
      },
      "protocolMappers": [
        {
          "name": "hasura-allowed-roles",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-client-role-mapper",
          "consentRequired": false,
          "config": {
            "usermodel.clientRoleMapping.clientId": "<path:secret/data/keycloak-client-id-graphql-api#value>",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-allowed-roles",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false",
            "multivalued": "true"
          }
        },
        {
          "name": "hasura-default-role",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-default-role",
            "claim.value": "user",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        },
        {
          "name": "hasura-user-id",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-property-mapper",
          "consentRequired": false,
          "config": {
            "user.attribute": "id",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-user-id",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        }
      ]
    }
  auth-gateway-public.json: |
    {
      "clientId": "auth-gateway-public",
      "name": "Application",
      "protocol": "openid-connect",
      "publicClient": true,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "redirectUris": [
        "https://login.suncoast.systems/callback",
        "https://login-internal.suncoast.systems/callback",
        "http://localhost:8080/callback",
        "http://localhost/*",
        "https://localhost/*",
        "http://127.0.0.1/*",
        "https://127.0.0.1/*",
        "https://*.suncoast.systems/*",
        "https://*.app.suncoast.systems/*",
        "https://internal.suncoast.systems/*",
        "https://internal-preview.suncoast.systems/*",
        "https://external.suncoast.systems",
        "https://external.suncoast.systems/",
        "https://external.suncoast.systems/*",
        "https://external-preview.suncoast.systems",
        "https://external-preview.suncoast.systems/",
        "https://external-preview.suncoast.systems/*",
        "https://www.suncoast.systems/*",
        "https://www-preview.suncoast.systems/*",
        "http://localhost:4173/*",
        "https://localhost:4173/*",
        "http://127.0.0.1:4173/*",
        "https://127.0.0.1:4173/*"
      ],
      "webOrigins": [
        "+",
        "http://localhost",
        "https://localhost",
        "http://localhost:4173",
        "https://localhost:4173",
        "http://127.0.0.1",
        "https://127.0.0.1",
        "http://127.0.0.1:4173",
        "https://127.0.0.1:4173",
        "https://login.suncoast.systems",
        "https://login-internal.suncoast.systems",
        "https://external.suncoast.systems",
        "https://external-preview.suncoast.systems"
      ],
      "attributes": {
        "pkce.code.challenge.method": "S256",
        "standard.token.exchange.enabled": "true",
        "post.logout.redirect.uris": "+"
      },
      "protocolMappers": [
        {
          "name": "audience-auth-gateway-exchange",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "auth-gateway-exchange",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-role-config-internal
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  internal-realm-roles: "openwebui_access,ollama_access,ollama_service_access,drools_access,drools_service_access,drools_admin,hasura_admins,admin,analyst,developer,user,rest-all,rest-user,kie-server,process-admin,manager,rest-project,platform_batch_internal_ui_user"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-token-exchange-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  rules: |
    # Format: <realm>:<allowed-client>=<target1>,<target2>
    # Client IDs can be overridden via /vault/secrets/client-id-<name> files.
    # Example: external:gravitee-introspection=openwebui,ollama
    internal:auth-gateway-exchange=graphql-api
    external:auth-gateway-exchange=graphql-api
    external:graphql-api=openwebui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-client-config-external
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  openwebui.json: |
    {
      "clientId": "<path:secret/data/keycloak-client-id-openwebui#value>",
      "name": "OpenWebUI",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-openwebui#value>",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": true,
      "redirectUris": [
        "https://open-webui.teleport.app.suncoast.systems/*",
        "http://localhost/*"
      ],
      "webOrigins": [
        "https://open-webui.teleport.app.suncoast.systems"
      ],
      "attributes": {
        "pkce.code.challenge.method": "S256",
        "standard.token.exchange.enabled": "true"
      }
    }
  auth-gateway-exchange.json: |
    {
      "clientId": "auth-gateway-exchange",
      "name": "Auth Gateway Exchange Client",
      "protocol": "openid-connect",
      "publicClient": false,
      "clientAuthenticatorType": "client-secret",
      "secret": "<path:secret/data/keycloak-client-secret-auth-gateway-exchange#value>",
      "standardFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": true,
      "authorizationServicesEnabled": false,
      "attributes": {
        "standard.token.exchange.enabled": "true"
      },
      "protocolMappers": [
        {
          "name": "hasura-allowed-roles",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-client-role-mapper",
          "consentRequired": false,
          "config": {
            "usermodel.clientRoleMapping.clientId": "<path:secret/data/keycloak-client-id-graphql-api#value>",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-allowed-roles",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false",
            "multivalued": "true"
          }
        },
        {
          "name": "hasura-default-role",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-default-role",
            "claim.value": "user",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        },
        {
          "name": "hasura-user-id",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-property-mapper",
          "consentRequired": false,
          "config": {
            "user.attribute": "id",
            "claim.name": "https://hasura.io/jwt/claims.x-hasura-user-id",
            "jsonType.label": "String",
            "access.token.claim": "true",
            "id.token.claim": "false",
            "userinfo.token.claim": "false"
          }
        }
      ]
    }
  auth-gateway-public.json: |
    {
      "clientId": "auth-gateway-public",
      "name": "Application",
      "protocol": "openid-connect",
      "publicClient": true,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "redirectUris": [
        "https://login.suncoast.systems/callback",
        "https://login-internal.suncoast.systems/callback",
        "http://localhost:8080/callback",
        "http://localhost/*",
        "https://localhost/*",
        "http://127.0.0.1/*",
        "https://127.0.0.1/*",
        "https://*.suncoast.systems/*",
        "https://*.app.suncoast.systems/*",
        "https://internal.suncoast.systems/*",
        "https://internal-preview.suncoast.systems/*",
        "https://external.suncoast.systems",
