apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-admin-redirect-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location / {
        return 302 https://keycloak-admin.teleport.app.suncoast.systems$request_uri;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin-internal-link
  namespace: keycloak
  annotations:
    teleport.dev/name: "keycloak-admin-internal"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "keycloak-admin-internal.teleport.app.suncoast.systems"
    teleport.dev/description: "Keycloak Admin Console (Internal)"
    teleport.dev/path: "admin/internal/console"
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: keycloak-admin-redirect
    app.kubernetes.io/name: keycloak-admin-redirect
    app.kubernetes.io/component: authentication
    teleport.dev/enroll: "true"
spec:
  type: ClusterIP
  selector:
    app: keycloak-admin-redirect
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin-external-link
  namespace: keycloak
  annotations:
    teleport.dev/name: "keycloak-admin-external"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "keycloak-admin-external.teleport.app.suncoast.systems"
    teleport.dev/description: "Keycloak Admin Console (External)"
    teleport.dev/path: "admin/external/console"
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: keycloak-admin-redirect
    app.kubernetes.io/name: keycloak-admin-redirect
    app.kubernetes.io/component: authentication
    teleport.dev/enroll: "true"
spec:
  type: ClusterIP
  selector:
    app: keycloak-admin-redirect
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-admin-redirect
  namespace: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-admin-redirect
  template:
    metadata:
      labels:
        app: keycloak-admin-redirect
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: redirect
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: redirect-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: redirect-config
          configMap:
            name: keycloak-admin-redirect-config
