apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-auth-gateway-seed-apps
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "9"
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        # Run Vault as init-only so the Job can complete without a long-running sidecar.
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}
    spec:
      serviceAccountName: keycloak
      restartPolicy: Never
      containers:
        - name: seed-apps
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: yb-tserver-service.yugabyte.svc.cluster.local
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: keycloak
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              DB_USER="$(cat /vault/secrets/db-username)"
              DB_PASSWORD="$(cat /vault/secrets/db-password)"
              export PGPASSWORD="${DB_PASSWORD}"

              for attempt in $(seq 1 120); do
                if psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -tAc "SELECT 1" >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for database (${attempt}/120)..."
                sleep 5
              done

              for attempt in $(seq 1 120); do
                if psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 <<'SQL'
              DELETE FROM keycloak.auth_gateway_allowed_apps
              WHERE slug IN (
                'example-mfe-preview',
                'example-mfe-local',
                'example-mfe',
                'nifi-flow-mfe-preview',
                'nifi-flow-mfe-local',
                'nifi-flow-mfe'
              );

              CREATE TEMP TABLE _seed_apps (
                slug text,
                display_name text,
                base_url text,
                base_urls jsonb,
                enabled boolean
              );

              INSERT INTO _seed_apps (slug, display_name, base_url, base_urls, enabled) VALUES
                (
                  'shell',
                  'Cloudflare Shell Template Preview',
                  'https://cloudflare-shell-template-app-preview.suncoast.systems',
                  '["https://cloudflare-shell-template-app-preview.suncoast.systems"]'::jsonb,
                  TRUE
                ),
                (
                  'shell-prod',
                  'Cloudflare Shell Template',
                  'https://cloudflare-shell-template-app.suncoast.systems',
                  '["https://cloudflare-shell-template-app.suncoast.systems"]'::jsonb,
                  TRUE
                ),
                (
                  'example-mfe-dev',
                  'Example MFE Dev',
                  'http://localhost:4173',
                  '["http://localhost:4173","https://cloudflare-shell-template-app-preview.suncoast.systems"]'::jsonb,
                  TRUE
                ),
                (
                  'example-mfe-prod',
                  'Example MFE Prod',
                  'https://cloudflare-shell-template-app.suncoast.systems',
                  '["https://cloudflare-shell-template-app.suncoast.systems"]'::jsonb,
                  TRUE
                ),
                (
                  'nifi-flow-mfe-dev',
                  'NiFi Flow MFE Dev',
                  'http://localhost:4173',
                  '["http://localhost:4173","https://cloudflare-shell-template-app-preview.suncoast.systems"]'::jsonb,
                  TRUE
                ),
                (
                  'nifi-flow-mfe-prod',
                  'NiFi Flow MFE Prod',
                  'https://cloudflare-shell-template-app.suncoast.systems',
                  '["https://cloudflare-shell-template-app.suncoast.systems"]'::jsonb,
                  TRUE
                );

              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'keycloak'
                    AND table_name = 'auth_gateway_allowed_apps'
                    AND column_name = 'base_urls'
                ) THEN
                  INSERT INTO keycloak.auth_gateway_allowed_apps (slug, display_name, base_url, base_urls, enabled)
                  SELECT slug, display_name, base_url, base_urls, enabled
                  FROM _seed_apps
                  ON CONFLICT (slug) DO UPDATE
                  SET
                    display_name = EXCLUDED.display_name,
                    base_url = EXCLUDED.base_url,
                    base_urls = EXCLUDED.base_urls,
                    enabled = EXCLUDED.enabled,
                    updated_at = NOW();
                ELSE
                  INSERT INTO keycloak.auth_gateway_allowed_apps (slug, display_name, base_url, enabled)
                  SELECT slug, display_name, base_url, enabled
                  FROM _seed_apps
                  ON CONFLICT (slug) DO UPDATE
                  SET
                    display_name = EXCLUDED.display_name,
                    base_url = EXCLUDED.base_url,
                    enabled = EXCLUDED.enabled,
                    updated_at = NOW();
                END IF;
              END $$;
              SQL
                then
                  echo "auth gateway app seed completed"
                  exit 0
                fi
                echo "seed attempt ${attempt}/120 failed; retrying..."
                sleep 5
              done

              echo "failed to seed auth gateway apps"
              exit 1
