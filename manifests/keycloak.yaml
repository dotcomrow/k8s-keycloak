# ============================================================================
# PreSync (-60): Ensure target namespace exists BEFORE anything else
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-60"
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
# ============================================================================
# PreSync (-50..-40): SA + RBAC so copier in 'vault' can touch secrets in BOTH namespaces
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-copier
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-50"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-50"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-root-token-binding
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-50"
subjects:
- kind: ServiceAccount
  name: secret-copier
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-root-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: write-root-token
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-50"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","list","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: write-root-token-binding
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-50"
subjects:
- kind: ServiceAccount
  name: secret-copier
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: write-root-token
---
# ============================================================================
# PreSync (-40): Copy 'vault-root-token' into keycloak (idempotent; no jq needed)
# ============================================================================
# PreSync (-40): Copy 'vault-root-token' into keycloak (idempotent; kubectl-only)
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-40"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: secret-copier
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: bitnami/kubectl:1.31
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              SRC_NS="vault"
              DST_NS="keycloak"
              NAME="vault-root-token"

              echo "🔎 Waiting for source secret ${SRC_NS}/${NAME} to exist..."
              for i in $(seq 1 60); do
                if kubectl -n "${SRC_NS}" get secret "${NAME}" >/dev/null 2>&1; then break; fi
                sleep 2
              done

              echo "♻️  Recreating ${DST_NS}/${NAME}..."
              kubectl -n "${DST_NS}" delete secret "${NAME}" --ignore-not-found

              # Read type and data (assumes key 'VAULT_TOKEN'; preserve type)
              TYPE="$(kubectl -n "${SRC_NS}" get secret "${NAME}" -o jsonpath='{.type}')"
              [ -z "${TYPE}" ] && TYPE="Opaque"
              VAL="$(kubectl -n "${SRC_NS}" get secret "${NAME}" -o jsonpath='{.data.VAULT_TOKEN}')"
              if [ -z "${VAL}" ]; then
                echo "❌ Could not read .data.VAULT_TOKEN from ${SRC_NS}/${NAME}"
                kubectl -n "${SRC_NS}" get secret "${NAME}" -o yaml || true
                exit 1
              fi

              # Recreate in target namespace (no double-encoding; we inject base64 directly)
              cat <<EOF | kubectl -n "${DST_NS}" apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${NAME}
              type: ${TYPE}
              data:
                VAULT_TOKEN: ${VAL}
              EOF

              echo "✅ Secret ${DST_NS}/${NAME} in place:"
              kubectl -n "${DST_NS}" get secret "${NAME}" -o go-template='type={{.type}}{{"\n"}}'
---
# ============================================================================
# PreSync (-30): Nuke schema hard (drop keycloak schema + stray public changelog)
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-nuke-schema
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-30"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: nuke
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              PGDB="keycloak"   # must match KC_DB_URL
              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              apk add --no-cache postgresql15-client curl netcat-openbsd >/dev/null

              # fetch vaultadmin password from KV
              VAULTADMIN_USER="vaultadmin"
              VAULTADMIN_PASS="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/secret/data/${VAULTADMIN_USER}" \
                | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
              [ -n "${VAULTADMIN_PASS}" ] || { echo "❌ no vaultadmin password"; exit 1; }
              export PGPASSWORD="${VAULTADMIN_PASS}"

              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ waiting for DB…"; sleep 2; done

              echo "🧹 Drop stray liquibase tables in public (if any)…"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$PGDB" -v ON_ERROR_STOP=0 <<'SQL'
              DROP TABLE IF EXISTS public.databasechangeloglock CASCADE;
              DROP TABLE IF EXISTS public.databasechangelog     CASCADE;
              SQL

              echo "💣 DROP SCHEMA keycloak CASCADE (if exists)…"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$PGDB" -v ON_ERROR_STOP=0 -c "DROP SCHEMA IF EXISTS keycloak CASCADE;"

              echo "🔎 Verify schema is gone…"
              CNT="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$PGDB" -At -c "SELECT count(*) FROM pg_namespace WHERE nspname='keycloak'")"
              [ "${CNT:-0}" = "0" ] || { echo "❌ schema still present"; exit 1; }

              echo "✅ Nuked."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
# ============================================================================
# PreSync (-20): DB prep / recreate schema / roles / grants (runs in vault ns)
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-20"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              # --- Config ---
              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE_GROUP=keycloak
              ROLE_OWNER=keycloak_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client netcat-openbsd curl >/dev/null

              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              # Fetch vaultadmin password (KV v2)
              VAULTADMIN_PASS="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/secret/data/${VAULTADMIN_USER}" \
                | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
              [ -n "$VAULTADMIN_PASS" ] || { echo "❌ missing secret/${VAULTADMIN_USER}"; exit 1; }
              export PGPASSWORD="$VAULTADMIN_PASS"

              until getent hosts "$PGHOST" >/dev/null 2>&1; do sleep 2; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 2; done

              # Ensure DB exists
              if ! psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -At -c "SELECT 1 FROM pg_database WHERE datname='${DB}'" | grep -q 1; then
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB"
              fi

              # pgcrypto for gen_random_uuid
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

              # Roles & grants
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              # Recreate empty schema & default privileges (idempotent)
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${ROLE_OWNER};
              ALTER SCHEMA keycloak OWNER TO ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} IN DATABASE ${DB} SET search_path = keycloak, public;

              SET ROLE ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA keycloak TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT USAGE,SELECT ON SEQUENCES TO ${ROLE_GROUP};
              RESET ROLE;
              EOSQL

              echo "✅ DB '${DB}' ready; schema 'keycloak' empty & owned by ${ROLE_OWNER}."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
# ============================================================================
# ServiceAccount Keycloak (for pod Vault auth)
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
# ============================================================================
# Script ConfigMap required by the Deployment
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kc-script-github-admin
  namespace: keycloak
data:
  github-team-admin.js: |
    // Minimal placeholder script: replace with your real logic
    var SimpleHttp = Java.type("org.keycloak.broker.provider.util.SimpleHttp");
    function authenticate(context) { context.success(); }
---
# ============================================================================
# Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels: { app: keycloak }
spec:
  type: ClusterIP
  selector: { app: keycloak }
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# ============================================================================
# Deployment (guard refuses to start if schema has any tables)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: { app: keycloak }
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}
        config.linkerd.io/skip-outbound-ports: "8200"
    spec:
      serviceAccountName: keycloak
      volumes:
        - name: kc-scripts
          configMap: { name: kc-script-github-admin }
      initContainers:
        # Wait for PreSync config job to complete
        - name: wait-for-config-job
          image: bitnami/kubectl:1.31
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/keycloak-yugabyte-config to complete…"
              until kubectl -n vault get job keycloak-yugabyte-config >/dev/null 2>&1; do sleep 3; done
              kubectl -n vault wait --for=condition=complete job/keycloak-yugabyte-config --timeout=600s
        # Hard guard: refuse to start if schema not empty
        - name: db-guard-empty-schema
          image: alpine:3.20
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              apk add --no-cache postgresql15-client netcat-openbsd >/dev/null
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              PGDB="keycloak"
              DB_USER="$(cat /vault/secrets/db-username)"
              DB_PASS="$(cat /vault/secrets/db-password)"
              export PGPASSWORD="$DB_PASS"
              until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 2; done
              CNT="$(psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$PGDB" -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='keycloak'")"
              echo "Tables in schema 'keycloak' before start: $CNT"
              [ "$CNT" = "0" ] || { echo "❌ Schema not empty. Failing init to block Keycloak."; exit 1; }
      containers:
        - name: keycloak-configurator
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash","-lc"]
          volumeMounts:
            - name: kc-scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true
          args:
            - |
              set -euo pipefail
              REALM="master"
              SERVER="http://127.0.0.1:8080"
              FLOW_ALIAS="GitHub-PostLogin"
              FIRST_LOGIN_FLOW_ALIAS="github-first-login-nolink"
              source /vault/secrets/keycloak-admin
              CLIENT_ID="<path:secret/data/keycloak-oauth-client-id#value>"
              CLIENT_SECRET="<path:secret/data/keycloak-oauth-client-secret#value>"
              json_objects_onelines(){ tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g'; }
              wait_admin(){ until /opt/keycloak/bin/kcadm.sh config credentials --server "$SERVER" --realm "$REALM" --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; do sleep 3; done; }
              wait_idp(){ until /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1; do sleep 1; done; }
              flow_present(){ /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${FLOW_ALIAS//\//\\/}\""; }
              ensure_flow_exists(){ if ! flow_present; then /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" -s "alias=${FLOW_ALIAS}" -s 'description=Grant realm-admin to members of a GitHub team' -s providerId=basic-flow -s topLevel=true -s builtIn=false >/dev/null 2>&1 || true; fi; for i in $(seq 1 60); do flow_present && break || sleep 1; done; }
              purge_flow_executions(){ for _ in $(seq 1 20); do EXECS="$(
                  /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null || true)"; IDS="$(printf '%s' "$EXECS" | json_objects_onelines | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"; [ -z "$IDS" ] && break; echo "$IDS" | while read -r EID; do [ -n "$EID" ] && /opt/keycloak/bin/kcadm.sh delete "authentication/executions/${EID}" -r "$REALM" >/dev/null 2>&1 || true; done; sleep 1; done; }
              ensure_script_execution(){ if ! /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q '"providerId"[[:space:]]*:[[:space:]]*"script"'; then /opt/keycloak/bin/kcadm.sh create "authentication/flows/${FLOW_ALIAS}/executions/execution" -r "$REALM" -s provider=script >/dev/null 2>&1 || true; fi
                for i in $(seq 1 30); do EXEC_ID="$(
                  /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null \
                  | json_objects_onelines | grep -E '"providerId"[[:space:]]*:[[:space:]]*"script"' \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"; [ -n "${EXEC_ID:-}" ] && break || sleep 1; done
                [ -n "${EXEC_ID:-}" ] || { echo "FATAL: no script exec id"; exit 1; }
                /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}" -r "$REALM" -s 'requirement=REQUIRED'
                SCRIPT_ESCAPED="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' /opt/keycloak/scripts/github-team-admin.js)"
                cat >/tmp/script-cfg.json <<EOF
              { "alias":"GitHub Team Admin","config":{"script":"${SCRIPT_ESCAPED}"}}
              EOF
                /opt/keycloak/bin/kcadm.sh create "authentication/executions/${EXEC_ID}/config" -r "$REALM" -f /tmp/script-cfg.json >/dev/null 2>&1 || {
                  CFG_ID=$(/opt/keycloak/bin/kcadm.sh get "authentication/executions/${EXEC_ID}/config" -r "$REALM" | json_objects_onelines | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
                  [ -n "${CFG_ID:-}" ] && /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}/config/${CFG_ID}" -r "$REALM" -f /tmp/script-cfg.json
                }
              }
              ensure_named_flow_exists(){ alias="$1"; desc="$2"; /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${alias//\//\\/}\"" || /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" -s "alias=${alias}" -s "description=${desc}" -s providerId=basic-flow -s topLevel=true -s builtIn=false >/dev/null 2>&1 || true; for i in $(seq 1 60); do /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${alias//\//\\/}\"" && break || sleep 1; done; }
              ensure_exec_req(){ alias="$1"; provider="$2"; req="$3"; /opt/keycloak/bin/kcadm.sh get "authentication/flows/${alias}/executions" -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"providerId\"[[:space:]]*:[[:space:]]*\"${provider}\"" || /opt/keycloak/bin/kcadm.sh create "authentication/flows/${alias}/executions/execution" -r "$REALM" -s "provider=${provider}" >/dev/null 2>&1 || true; for i in $(seq 1 30); do EID="$(
                /opt/keycloak/bin/kcadm.sh get "authentication/flows/${alias}/executions" -r "$REALM" | json_objects_onelines \
                | awk -v p="\"providerId\"[[:space:]]*:[[:space:]]*\"${provider}\"" '$0 ~ p { if (match($0, /"id"[[:space:]]*:[[:space:]]*"([^"]*)"/, m)) { print m[1]; exit } }')"; [ -n "${EID:-}" ] && break || sleep 1; done; [ -n "${EID:-}" ] || { echo "FATAL: no exec id for ${provider}"; exit 1; }; /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EID}" -r "$REALM" -s "requirement=${req}"; }
              ensure_first_broker_login_flow(){ ensure_named_flow_exists "${FIRST_LOGIN_FLOW_ALIAS}" "Auto-create user, no link prompt"; ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-create-user-if-unique" "REQUIRED"; ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-confirm-link" "DISABLED"; ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-review-profile" "OPTIONAL"; ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-verify-email" "DISABLED"; }

              wait_admin
              set -x
              /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1 && /opt/keycloak/bin/kcadm.sh delete identity-provider/instances/github -r "$REALM" || true
              /opt/keycloak/bin/kcadm.sh create identity-provider/instances -r "$REALM" \
                -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                -s "config.clientId=$CLIENT_ID" -s "config.clientSecret=$CLIENT_SECRET" \
                -s 'config.defaultScope=read:user user:email read:org' \
                -s 'config.guiOrder=1' -s 'config.hideOnLoginPage=false' \
                -s 'config.syncMode=IMPORT' -s 'config.trustEmail=true'
              wait_idp

              cat >/tmp/mapper-email.json <<'JSON'
              { "name":"email","identityProviderAlias":"github","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"claim":"email","user.attribute":"email","syncMode":"INHERIT"}}
              JSON
              cat >/tmp/mapper-username.json <<'JSON'
              { "name":"username","identityProviderAlias":"github","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"claim":"login","user.attribute":"username","syncMode":"INHERIT"}}
              JSON
              cat >/tmp/mapper-name.json <<'JSON'
              { "name":"name","identityProviderAlias":"github","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"claim":"name","user.attribute":"firstName","syncMode":"INHERIT"}}
              JSON
              cat >/tmp/mapper-username-template.json <<'JSON'
              { "name":"username-template","identityProviderAlias":"github","identityProviderMapper":"username-template-importer","config":{"template":"${ALIAS}.${CLAIM.sub}","syncMode":"INHERIT"}}
              JSON

              for f in /tmp/mapper-*.json; do /opt/keycloak/bin/kcadm.sh create identity-provider/instances/github/mappers -r "$REALM" -f "$f" || true; done
              ensure_flow_exists; purge_flow_executions; ensure_script_execution
              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" -s "postBrokerLoginFlowAlias=${FLOW_ALIAS}"
              ensure_first_broker_login_flow
              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" -s "firstBrokerLoginFlowAlias=${FIRST_LOGIN_FLOW_ALIAS}"

              /opt/keycloak/bin/kcadm.sh update "realms/${REALM}" -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false
              set +x
              echo "✔ Keycloak post-config done."
              sleep 365d
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }

        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          ports:
          - { containerPort: 8080, name: http }
          env:
          - { name: KC_DB, value: "postgres" }
          - { name: KC_DB_URL, value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak" }
          - { name: KC_DB_SCHEMA, value: "keycloak" }
          - { name: KC_HOSTNAME_URL, value: "https://keycloak.app.suncoast.systems" }
          - { name: KC_HOSTNAME_ADMIN_URL, value: "https://keycloak.app.suncoast.systems" }
          - { name: KC_HEALTH_ENABLED, value: "true" }
          - { name: KC_HOSTNAME_STRICT, value: "false" }
          - { name: KC_HTTP_ENABLED, value: "true" }
          - { name: KC_TRANSACTION_XA_ENABLED, value: "false" }
          - { name: KC_HOSTNAME_STRICT_HTTPS, value: "true" }
          - { name: KC_HTTP_RELATIVE_PATH, value: "/" }
          - { name: KC_HTTP_COOKIE_SAME_SITE, value: "LAX" }
          - { name: KC_FEATURES, value: "scripts" }
          - { name: KC_PROFILE, value: "preview" }
          - { name: KC_LOG_LEVEL, value: "DEBUG" }
          - { name: QUARKUS_LOG_CATEGORY__LIQUIBASE__LEVEL, value: "DEBUG" }
          - { name: QUARKUS_LOG_CATEGORY__org.keycloak.quarkus.runtime.storage.legacy.liquibase__LEVEL, value: "DEBUG" }
          command: ["/bin/sh","-lc"]
          args:
            - >
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)" &&
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)" &&
              /opt/keycloak/bin/kc.sh start --features=scripts
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "3Gi" }
