apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-keycloak
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ printf "%q" .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ printf "%q" .Data.data.password }}
          {{- end -}}

        # GitHub OAuth + org/team for provider
        vault.hashicorp.com/agent-inject-secret-github-client-id: "secret/data/keycloak-oauth-client-id"
        vault.hashicorp.com/agent-inject-template-github-client-id: |
          {{- with secret "secret/data/keycloak-oauth-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-client-secret: "secret/data/keycloak-oauth-client-secret"
        vault.hashicorp.com/agent-inject-template-github-client-secret: |
          {{- with secret "secret/data/keycloak-oauth-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-org: "secret/data/k8s-teleport-teleport-github-org"
        vault.hashicorp.com/agent-inject-template-github-org: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-org" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin-team: "secret/data/keycloak-admin-team"
        vault.hashicorp.com/agent-inject-template-keycloak-admin-team: |
          {{- with secret "secret/data/keycloak-admin-team" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-role-map: "secret/data/keycloak-github-role-map"
        vault.hashicorp.com/agent-inject-template-github-role-map: |
          {{- with secret "secret/data/keycloak-github-role-map" -}}{{ .Data.data.value }}{{- end -}}

        # Google OIDC + Groups (Cloud Identity)
        vault.hashicorp.com/agent-inject-secret-google-client-id: "secret/data/keycloak-google-client-id"
        vault.hashicorp.com/agent-inject-template-google-client-id: |
          {{- with secret "secret/data/keycloak-google-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-client-secret: "secret/data/keycloak-google-client-secret"
        vault.hashicorp.com/agent-inject-template-google-client-secret: |
          {{- with secret "secret/data/keycloak-google-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-email: "secret/data/keycloak-google-admin-email"
        vault.hashicorp.com/agent-inject-template-google-admin-email: |
          {{- with secret "secret/data/keycloak-google-admin-email" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-group: "secret/data/keycloak-google-admin-group"
        vault.hashicorp.com/agent-inject-template-google-admin-group: |
          {{- with secret "secret/data/keycloak-google-admin-group" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-sa-json: "secret/data/keycloak-google-sa-json"
        vault.hashicorp.com/agent-inject-template-google-sa-json: |
          {{- with secret "secret/data/keycloak-google-sa-json" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-group-role-map: "secret/data/keycloak-google-group-role-map"
        vault.hashicorp.com/agent-inject-template-google-group-role-map: |
          {{- with secret "secret/data/keycloak-google-group-role-map" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-configurator-client-secret: "secret/data/keycloak-configurator-client-secret"
        vault.hashicorp.com/agent-inject-template-keycloak-configurator-client-secret: |
          {{- with secret "secret/data/keycloak-configurator-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-gravitee-introspection: "secret/data/keycloak-client-id-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-id-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-id-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-gravitee-introspection: "secret/data/keycloak-client-secret-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-secret-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-secret-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-openwebui: "secret/data/keycloak-client-id-openwebui"
        vault.hashicorp.com/agent-inject-template-client-id-openwebui: |
          {{- with secret "secret/data/keycloak-client-id-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-openwebui: "secret/data/keycloak-client-secret-openwebui"
        vault.hashicorp.com/agent-inject-template-client-secret-openwebui: |
          {{- with secret "secret/data/keycloak-client-secret-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-workbench: "secret/data/keycloak-client-id-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-id-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-workbench: "secret/data/keycloak-client-secret-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-kie-server-service: "secret/data/keycloak-client-id-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-id-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-id-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-kie-server-service: "secret/data/keycloak-client-secret-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-secret-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-ollama-service: "secret/data/keycloak-client-id-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-id-ollama-service: |
          {{- with secret "secret/data/keycloak-client-id-ollama-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-ollama-service: "secret/data/keycloak-client-secret-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-secret-ollama-service: |
          {{- with secret "secret/data/keycloak-client-secret-ollama-service" -}}{{ .Data.data.value }}{{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        vault.hashicorp.com/agent-inject-secret-vaultadmin: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-vaultadmin: |
          {{- with secret "secret/data/vaultadmin" -}}
          {{- if .Data.data.password -}}{{ .Data.data.password }}{{ else }}{{ .Data.data.value }}{{ end -}}
          {{- end -}}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: dedicated
                    operator: In
                    values:
                      - srvr-node
      serviceAccountName: keycloak

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: keycloak-client-config-internal
          configMap:
            name: keycloak-client-config-internal
        - name: keycloak-client-config-external
          configMap:
            name: keycloak-client-config-external
            optional: true

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              wait_job() {
                local JOB="$1"
                echo "Waiting for Job vault/${JOB} to complete (will retry until ready)..."
                while true; do
                  if ! kubectl -n vault get job "${JOB}" >/dev/null 2>&1; then
                    echo "  └─ job ${JOB} not found yet..."
                    sleep 5
                    continue
                  fi
                  SUCC="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                  if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  if kubectl -n vault wait --for=condition=complete "job/${JOB}" --timeout=10s >/dev/null 2>&1; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  FAIL="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                  ACTV="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                  echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                  sleep 5
                done
              }

              for job in keycloak-vault-k8s-role keycloak-yugabyte-config; do
                wait_job "$job"
              done

        - name: kc-db-preflight
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: PGHOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: PGPORT
              value: "5433"
            - name: PGDATABASE
              value: "keycloak"
            - name: PGSCHEMA
              value: "keycloak"
            - name: PGSCHEMA_OWNER
              value: "keycloak_app"
            - name: PGADMIN_USER
              value: "vaultadmin"
            # Optional schema reset controls (leave false to preserve existing data)
            - name: KC_FORCE_DROP_SCHEMA
              value: "false"
            - name: KC_FORCE_RESET_SCHEMA_ON_CONFLICT
              value: "true"
            - name: KC_CLEAR_CHANGELOG_CHECKSUMS
              value: "false"
            - name: KC_BOOTSTRAP_MASTER_DIRECT_GRANT
              value: "true"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -Eeuo pipefail
              apk add --no-cache postgresql15-client jq bind-tools busybox-extras

              # Wait for Vault agent to write the secret file
              for i in $(seq 1 60); do
                if [ -s /vault/secrets/vaultadmin ]; then break; fi
                echo "⏳ waiting for /vault/secrets/vaultadmin..."
                sleep 1
              done
              if [ ! -s /vault/secrets/vaultadmin ]; then
                echo "❌ /vault/secrets/vaultadmin not found or empty"; exit 1
              fi

              export PGUSER="${PGADMIN_USER}"
              export PGPASSWORD="$(tr -d '\r\n' < /vault/secrets/vaultadmin)"
              if [ -s /vault/secrets/keycloak-admin ]; then
                . /vault/secrets/keycloak-admin
              fi
              ADMIN_USER="${KEYCLOAK_ADMIN:-admin}"

              echo "🔎 DNS for ${PGHOST}"; getent hosts "${PGHOST}" || true
              echo "🔎 TCP ${PGHOST}:${PGPORT}"; nc -vz -w 3 "${PGHOST}" "${PGPORT}" || true

              echo "🔎 Preflight (admin): connecting to ${PGHOST}:${PGPORT}/${PGDATABASE} as ${PGUSER}…"
              until psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "select 1" >/dev/null 2>&1; do
                echo "  ⏳ waiting for DB…"
                sleep 2
              done
              echo "✅ DB reachable"

              # Ensure schema exists so DROP works deterministically
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA};"

              # Log what exists
              TABLES=$(
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                  "select table_schema||'.'||table_name
                    from information_schema.tables
                    where table_schema='${PGSCHEMA}'
                    order by 1"
              )
              COUNT="$(printf '%s\n' "$TABLES" | sed '/^$/d' | wc -l | tr -d ' ')"
              echo "ℹ️  ${PGSCHEMA} currently has ${COUNT:-0} table(s)."
              if [ -n "${TABLES:-}" ]; then echo "$TABLES" | sed 's/^/   • /'; fi

              CHANGELOG_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                "select 1 from information_schema.tables where table_schema='${PGSCHEMA}' and table_name='databasechangelog' limit 1" \
                2>/dev/null || true)"
              CHANGELOG_EXISTS="${CHANGELOG_EXISTS:-0}"
              CHANGELOG_ROWS="0"
              if [ "${CHANGELOG_EXISTS}" = "1" ]; then
                CHANGELOG_ROWS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                  "select count(*) from ${PGSCHEMA}.databasechangelog" 2>/dev/null || echo 0)"
                CHANGELOG_ROWS="${CHANGELOG_ROWS:-0}"
              fi

              if [ "${COUNT:-0}" -gt 0 ] && [ "${KC_FORCE_DROP_SCHEMA:-false}" != "true" ]; then
                if [ "${KC_FORCE_RESET_SCHEMA_ON_CONFLICT:-false}" = "true" ] && \
                   { [ "${CHANGELOG_EXISTS}" != "1" ] || [ "${CHANGELOG_ROWS}" = "0" ]; }; then
                  echo "⚠️  Existing tables without Liquibase history; resetting schema."
                else
                  if [ "${KC_CLEAR_CHANGELOG_CHECKSUMS:-false}" = "true" ] && [ "${CHANGELOG_EXISTS}" = "1" ]; then
                    echo "🧹 Clearing Liquibase checksums in ${PGSCHEMA}.databasechangelog"
                    psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                      -c "UPDATE ${PGSCHEMA}.databasechangelog SET md5sum=NULL;"
                  fi
                  if [ "${KC_BOOTSTRAP_MASTER_DIRECT_GRANT:-true}" = "true" ]; then
                    HAS_REALM_TABLE="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "SELECT to_regclass('${PGSCHEMA}.realm');" || true)"
                    if [ -n "${HAS_REALM_TABLE:-}" ] && [ "${HAS_REALM_TABLE}" != "null" ]; then
                      REALM_ID="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "SELECT id FROM ${PGSCHEMA}.realm WHERE name='master' LIMIT 1;" || true)"
                      if [ -n "${REALM_ID:-}" ]; then
                        psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                          -c "UPDATE ${PGSCHEMA}.user_entity SET enabled=true WHERE realm_id='${REALM_ID}' AND username='${ADMIN_USER}';"
                        psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                          -c "UPDATE ${PGSCHEMA}.client SET direct_access_grants_enabled=true WHERE realm_id='${REALM_ID}' AND client_id='admin-cli';"
                        DG_ID="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "SELECT id FROM ${PGSCHEMA}.authentication_flow WHERE realm_id='${REALM_ID}' AND lower(alias) IN ('direct grant','direct grant flow','direct-grant') LIMIT 1;" || true)"
                        if [ -n "${DG_ID:-}" ]; then
                          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                            -c "UPDATE ${PGSCHEMA}.realm SET direct_grant_flow='${DG_ID}' WHERE id='${REALM_ID}';"
                          echo "✅ Enabled master direct-grant flow for configurator bootstrap."
                        else
                          echo "⚠️  Direct-grant flow not found in master realm; bootstrap may fail."
                        fi
                      fi
                    fi
                  fi
                  echo "✅ Existing schema detected; skipping destructive reset."
                  exit 0
                fi
              fi

              echo "🧨 Dropping schema ${PGSCHEMA} (CASCADE) for a clean migration…"
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<EOSQL
              DROP SCHEMA IF EXISTS ${PGSCHEMA} CASCADE;
              CREATE SCHEMA ${PGSCHEMA} AUTHORIZATION ${PGSCHEMA_OWNER};
              ALTER ROLE ${PGSCHEMA_OWNER} SET search_path = ${PGSCHEMA};
              GRANT USAGE, CREATE ON SCHEMA ${PGSCHEMA} TO ${PGSCHEMA_OWNER};
              EOSQL

              # NOTE: unquoted heredoc so $PGSCHEMA expands in the shell.
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=0 <<EOSQL || true
              DO \$blk\$
              DECLARE
                sch text := quote_ident('$PGSCHEMA');  -- safe identifier quoting
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangelog'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangelog RESTART IDENTITY CASCADE';
                END IF;

                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangeloglock'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangeloglock RESTART IDENTITY CASCADE';
                END IF;
              END
              \$blk\$ LANGUAGE plpgsql;
              EOSQL

              echo "✅ Preflight complete."

      containers:
        # --- One-time configuration sidecar (IdPs + flows + attach providers) ---
        - name: keycloak-configurator
          image: ghcr.io/dotcomrow/keycloak-image:sha-8aac993
          imagePullPolicy: Always
          env:
            - name: KEYCLOAK_REALM
              value: "external"
            - name: KEYCLOAK_INTERNAL_REALM
              value: "internal"
            - name: KEYCLOAK_EXTERNAL_REALM
              value: "external"
            - name: KEYCLOAK_LEGACY_EXTERNAL_REALM
              value: "apps"
            - name: KEYCLOAK_MIGRATE_APPS_REALM
              value: "true"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_MODE
              value: "auto"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_DELETE_SOURCE
              value: "true"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_FORCE_DELETE
              value: "false"
            - name: KEYCLOAK_INTERNAL_REALM_ROLES
              valueFrom:
                configMapKeyRef:
                  name: keycloak-role-config-internal
                  key: internal-realm-roles
            - name: APPS_GITHUB_ENABLED
              value: "true"
            - name: APPS_GITHUB_ONLY
              value: "true"
            - name: EXTERNAL_GITHUB_ENABLED
              value: "false"
            - name: EXTERNAL_DISABLE_LOCAL_LOGIN
              value: "true"
            - name: KEYCLOAK_EXTERNAL_ADMIN_MODE
              value: "group"
            - name: KEYCLOAK_RULES_ADMIN_TEAM
              value: "rules_admin"
            - name: ADMIN_GITHUB_ENABLED
              value: "false"
            - name: PROVIDER_WARN
              value: "false"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              
              ADMIN_REALM="master"
              INTERNAL_REALM="${KEYCLOAK_INTERNAL_REALM:-internal}"
              EXTERNAL_REALM="${KEYCLOAK_EXTERNAL_REALM:-${KEYCLOAK_REALM:-apps}}"
              LEGACY_EXTERNAL_REALM="${KEYCLOAK_LEGACY_EXTERNAL_REALM:-apps}"
              MIGRATE_APPS_REALM="${KEYCLOAK_MIGRATE_APPS_REALM:-false}"
              MIGRATE_APPS_REALM_MODE="${KEYCLOAK_MIGRATE_APPS_REALM_MODE:-auto}"
              MIGRATE_APPS_REALM_DELETE_SOURCE="${KEYCLOAK_MIGRATE_APPS_REALM_DELETE_SOURCE:-false}"
              MIGRATE_APPS_REALM_FORCE_DELETE="${KEYCLOAK_MIGRATE_APPS_REALM_FORCE_DELETE:-false}"
              SERVER="http://127.0.0.1:8080"
              FLOW_GH="GitHub-PostLogin"
              FLOW_GGL="Google-PostLogin"
              PROVIDER_GH="github-team-admin"
              PROVIDER_GGL="google-groups-authenticator"
              FLOW_BROWSER_GH="browser-github-only"
              FLOW_BROWSER_GGL="browser-google-only"
              FIRST_BROKER_FLOW="first-broker-login-autolink"
              FIRST_BROKER_BASE="first broker login"
              PROVIDER_IDP_AUTO_LINK="idp-auto-link"
              PROVIDER_WARN="${PROVIDER_WARN:-false}"
              ADMIN_REALM_FORCE_GITHUB_REDIRECT="${ADMIN_REALM_FORCE_GITHUB_REDIRECT:-false}"
              ADMIN_GITHUB_ENABLED="${ADMIN_GITHUB_ENABLED:-false}"
              INTERNAL_GITHUB_ENABLED="${APPS_GITHUB_ENABLED:-true}"
              INTERNAL_GITHUB_HIDE_ON_LOGIN="${APPS_GITHUB_HIDE_ON_LOGIN:-false}"
              INTERNAL_GITHUB_ONLY="${APPS_GITHUB_ONLY:-false}"
              EXTERNAL_GITHUB_ENABLED="${EXTERNAL_GITHUB_ENABLED:-false}"
              KCADM="/opt/keycloak/bin/kcadm.sh"
              KCADM_CONFIG="/tmp/kcadm.config"
              export KCADM_CONFIG
                            
              hold(){ echo "Configurator will stay running for logs…"; tail -f /dev/null; }
              on_err(){ code=$?; echo "Configurator error (exit $code) at line ${BASH_LINENO[0]}: ${BASH_COMMAND:-unknown}"; hold; }
              on_exit(){ code=$?; if [ "$code" -ne 0 ]; then echo "Configurator exiting (code $code)."; hold; fi; }
              trap on_err ERR
              trap on_exit EXIT
              fatal(){ echo "❌ $*"; hold; }
              
              for f in /vault/secrets/keycloak-admin \
                       /vault/secrets/github-client-id \
                       /vault/secrets/github-client-secret \
                       /vault/secrets/github-org \
                       /vault/secrets/keycloak-admin-team; do
                for i in {1..60}; do
                  [ -s "$f" ] && break
                  sleep 1
                done
                if [ ! -s "$f" ]; then
                  fatal "Missing required secret file: $f"
                fi
              done

              source /vault/secrets/keycloak-admin
              CLIENT_ID="$(cat /vault/secrets/github-client-id)"
              CLIENT_SECRET="$(cat /vault/secrets/github-client-secret)"
              GITHUB_ORG="$(cat /vault/secrets/github-org)"
              GITHUB_TEAM="$(cat /vault/secrets/keycloak-admin-team)"
              RULES_ADMIN_TEAM="${KEYCLOAK_RULES_ADMIN_TEAM:-rules_admin}"
              GOOGLE_CLIENT_ID="$(cat /vault/secrets/google-client-id 2>/dev/null || true)"
              GOOGLE_CLIENT_SECRET="$(cat /vault/secrets/google-client-secret 2>/dev/null || true)"
              GITHUB_ROLE_MAP_JSON="$(cat /vault/secrets/github-role-map 2>/dev/null || true)"
              GOOGLE_GROUP_ROLE_MAP_JSON="$(cat /vault/secrets/google-group-role-map 2>/dev/null || true)"
              EXTERNAL_ADMIN_EMAIL=""
              if [ -s /vault/secrets/google-admin-email ]; then
                EXTERNAL_ADMIN_EMAIL="$(tr -d '\r\n' < /vault/secrets/google-admin-email)"
              fi
              EXTERNAL_ADMIN_GROUP=""
              if [ -s /vault/secrets/google-admin-group ]; then
                EXTERNAL_ADMIN_GROUP="$(tr -d '\r\n' < /vault/secrets/google-admin-group)"
              fi
              EXTERNAL_ADMIN_MODE="${KEYCLOAK_EXTERNAL_ADMIN_MODE:-user}"
              INTERNAL_REALM_ROLES_RAW="${KEYCLOAK_INTERNAL_REALM_ROLES:-}"
              CONFIG_CLIENT_ID="keycloak-configurator"
              CONFIG_CLIENT_SECRET="$(cat /vault/secrets/keycloak-configurator-client-secret 2>/dev/null || true)"
              CONFIGURATOR_DELETE_CLIENT="${CONFIGURATOR_DELETE_CLIENT:-false}"
              CLIENT_SECRET_MAP_FILE="/vault/secrets/client-secrets"
              CLIENT_SECRET_DIR="/vault/secrets"
              CLIENT_SECRET_PREFIX="client-secret-"
              CLIENT_ID_DIR="/vault/secrets"
              CLIENT_CONFIG_DIR_INTERNAL="/opt/keycloak/data/clients/internal"
              CLIENT_CONFIG_DIR_EXTERNAL="/opt/keycloak/data/clients/external"
              EXTERNAL_DISABLE_LOCAL_LOGIN="${EXTERNAL_DISABLE_LOCAL_LOGIN:-true}"
              OPENWEBUI_CLIENT_ID="openwebui"
              OLLAMA_SERVICE_CLIENT_ID="ollama-service"
              DROOLS_WORKBENCH_CLIENT_ID="drools-workbench"
              DROOLS_SERVICE_CLIENT_ID="drools-kie-server-service"
              PUBLIC_APP_CLIENT_ID="public-app"
              GRAVITEE_INTROSPECT_CLIENT_ID="gravitee-introspection"
              GRAVITEE_INTROSPECT_CLIENT_SECRET="$(cat /vault/secrets/client-secret-gravitee-introspection 2>/dev/null || true)"
              if [ -s "${CLIENT_ID_DIR}/client-id-openwebui" ]; then
                OPENWEBUI_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-openwebui")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-ollama-service" ]; then
                OLLAMA_SERVICE_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-ollama-service")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-drools-workbench" ]; then
                DROOLS_WORKBENCH_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-drools-workbench")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-drools-kie-server-service" ]; then
                DROOLS_SERVICE_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-drools-kie-server-service")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-public-app" ]; then
                PUBLIC_APP_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-public-app")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-gravitee-introspection" ]; then
                GRAVITEE_INTROSPECT_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-gravitee-introspection")"
              fi
              
              login_with_client() {
                [ -n "${CONFIG_CLIENT_SECRET:-}" ] || return 1
                $KCADM config credentials --server "$SERVER" --realm "$ADMIN_REALM" \
                  --client "$CONFIG_CLIENT_ID" --secret "$CONFIG_CLIENT_SECRET" >/dev/null 2>&1
              }

              login_with_admin() {
                $KCADM config credentials --server "$SERVER" --realm "$ADMIN_REALM" \
                  --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1
              }

              clean_id() {
                printf '%s' "$1" | tr -d '"' | tr -d '[:space:]'
              }

              append_role_map_entry() {
                local json="$1"
                local key="$2"
                local role="$3"
                local trimmed=""
                local json_flat=""
                local role_escaped=""
                local key_regex=""
                local role_regex=""
                local key_repl=""
                if [ -z "${key:-}" ] || [ -z "${role:-}" ]; then
                  printf '%s' "$json"
                  return 0
                fi
                if [ -z "${json:-}" ]; then
                  printf '{"%s":["%s"]}' "$key" "$role"
                  return 0
                fi
                json_flat="$(printf '%s' "$json" | tr -d '\n')"
                key_regex="$(printf '%s' "$key" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                role_regex="$(printf '%s' "$role" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                key_repl="$(printf '%s' "$key" | sed 's/[&|]/\\\\&/g')"
                if printf '%s' "$json_flat" | grep -q "\"${key_regex}\""; then
                  if printf '%s' "$json_flat" | grep -q "\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[[^]]*\"${role_regex}\""; then
                    printf '%s' "$json_flat"
                    return 0
                  fi
                  role_escaped="$(printf '%s' "$role" | sed 's/[&|]/\\\\&/g')"
                  printf '%s' "$json_flat" | sed "s|\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[\\([^]]*\\)\\]|\"${key_repl}\":[\\1,\"${role_escaped}\"]|"
                  return 0
                fi
                trimmed="$(printf '%s' "$json_flat" | sed 's/[[:space:]]*$//')"
                if printf '%s' "$trimmed" | grep -q '^{' && printf '%s' "$trimmed" | grep -q '}$'; then
                  local inner="${trimmed#\{}"
                  inner="${inner%\}}"
                  if [ -z "${inner//[[:space:]]/}" ]; then
                    printf '{"%s":["%s"]}' "$key" "$role"
                  else
                    printf '%s' "${trimmed%\}}"
                    printf ',\"%s\":[\"%s\"]}' "$key" "$role"
                  fi
                  return 0
                fi
                printf '%s' "$json"
              }

              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${GITHUB_TEAM:-}" ]; then
                admin_key="${GITHUB_ORG}/${GITHUB_TEAM}"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$admin_key" "client:realm-management:realm-admin")"
              fi
              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${RULES_ADMIN_TEAM:-}" ]; then
                rules_admin_key="${GITHUB_ORG}/${RULES_ADMIN_TEAM}"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:rest-all")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_access")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_service_access")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:kie-server")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:realm-management:realm-admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:admin")"
              fi
              if [ "$EXTERNAL_ADMIN_MODE" = "group" ] && [ -n "${EXTERNAL_ADMIN_GROUP:-}" ]; then
                GOOGLE_GROUP_ROLE_MAP_JSON="$(append_role_map_entry "$GOOGLE_GROUP_ROLE_MAP_JSON" "$EXTERNAL_ADMIN_GROUP" "client:realm-management:realm-admin")"
              fi

              ensure_configurator_client() {
                [ -n "${CONFIG_CLIENT_SECRET:-}" ] || { echo "⚠️  Missing configurator client secret (skipping client auth)"; return 1; }
                CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -z "${CID:-}" ]; then
                  if ! $KCADM create clients -r "$ADMIN_REALM" \
                    -s "clientId=$CONFIG_CLIENT_ID" \
                    -s "name=Keycloak Configurator" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$CONFIG_CLIENT_SECRET"; then
                    echo "⚠️  Failed to create configurator client"
                    return 1
                  fi
                  CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  CID="$(clean_id "$CID")"
                else
                  $KCADM update "clients/$CID" -r "$ADMIN_REALM" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$CONFIG_CLIENT_SECRET" || true
                fi
                if [ -z "${CID:-}" ]; then
                  echo "⚠️  Configurator client id not found after create/update"
                  return 1
                fi
                SA_ID=$($KCADM get "clients/$CID/service-account-user" -r "$ADMIN_REALM" 2>/dev/null \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" | head -n1 || true)
                SA_ID="$(clean_id "$SA_ID")"
                if [ -n "${SA_ID:-}" ]; then
                  for role in realm-admin admin create-realm manage-realm view-realm manage-users manage-clients manage-identity-providers manage-authorization manage-events view-events query-realms query-users query-clients query-groups view-users view-clients view-identity-providers; do
                    $KCADM add-roles -r "$ADMIN_REALM" --uuserid "$SA_ID" \
                      --cclientid realm-management --rolename "$role" >/dev/null 2>&1 || true
                  done
                fi
              }

              ensure_confidential_service_client() {
                local realm="$1"
                local client_id="$2"
                local client_secret="$3"
                if [ -z "${client_id:-}" ] || [ -z "${client_secret:-}" ]; then
                  return 0
                fi
                local cid
                cid=$($KCADM get clients -r "$realm" -q "clientId=$client_id" --fields id --format csv 2>/dev/null | tail -n1 || true)
                cid="$(clean_id "$cid")"
                if [ -z "${cid:-}" ]; then
                  $KCADM create clients -r "$realm" \
                    -s "clientId=$client_id" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$client_secret" >/dev/null 2>&1 || true
                else
                  $KCADM update "clients/$cid" -r "$realm" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$client_secret" >/dev/null 2>&1 || true
                fi
              }

              ensure_user_admin() {
                local realm="$1"
                local email="$2"
                local username="${3:-}"
                local uid=""
                if [ -z "${realm:-}" ] || [ -z "${email:-}" ]; then
                  return 0
                fi
                uid=$($KCADM get users -r "$realm" -q email="$email" --fields id --format csv 2>/dev/null | tail -n1 || true)
                uid="$(clean_id "$uid")"
                if [ -z "${uid:-}" ] && [ -n "${username:-}" ]; then
                  uid=$($KCADM get users -r "$realm" -q username="$username" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  uid="$(clean_id "$uid")"
                fi
                if [ -z "${uid:-}" ]; then
                  local uname="${username:-$email}"
                  $KCADM create users -r "$realm" \
                    -s "username=$uname" \
                    -s "email=$email" \
                    -s enabled=true \
                    -s emailVerified=true >/dev/null 2>&1 || true
                  uid=$($KCADM get users -r "$realm" -q email="$email" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  uid="$(clean_id "$uid")"
                fi
                if [ -z "${uid:-}" ]; then
                  echo "⚠️  Unable to ensure admin user in realm ${realm} for ${email}"
                  return 1
                fi
                $KCADM add-roles -r "$realm" --uuserid "$uid" \
                  --cclientid realm-management --rolename realm-admin >/dev/null 2>&1 || true
              }

              echo "Waiting for Keycloak admin API..."
              AUTH_MODE=""
              ADMIN_ESCALATED="false"
              for i in {1..120}; do
                if login_with_admin; then
                  AUTH_MODE="admin"
                  break
                fi
                if login_with_client; then
                  AUTH_MODE="client"
                  break
                fi
                sleep 2
              done
              if [ -z "${AUTH_MODE:-}" ]; then
                echo "❌ Unable to authenticate to Keycloak admin API"
                fatal "Unable to authenticate to Keycloak admin API"
              fi
              if [ "$AUTH_MODE" = "admin" ]; then
                ADMIN_ESCALATED="true"
                ensure_configurator_client || true
                if [ "${PREFER_CLIENT_AUTH:-false}" = "true" ] && login_with_client; then
                  AUTH_MODE="client"
                else
                  AUTH_MODE="admin"
                fi
              fi
              echo "✅ Admin API ready (auth: $AUTH_MODE)."

              kcadm_create_realm() {
                local realm="$1"
                local out=""
                out="$($KCADM create realms -s "realm=${realm}" -s enabled=true 2>&1 || true)"
                if [ -z "${out:-}" ]; then
                  return 0
                fi
                if ! echo "$out" | grep -qiE "Conflict|already exists|duplicate"; then
                  echo "$out" | grep -qiE "error|exception|failed" || return 0
                fi
                if echo "$out" | grep -qiE "Conflict|already exists|duplicate"; then
                  echo "⚠️  Realm already exists; continuing."
                  return 0
                fi
                echo "❌ kcadm create realm failed: ${out}"
                return 1
              }

              realm_exists() {
                local realm="$1"
                if $KCADM get "realms/${realm}" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get realms -q "realm=${realm}" --fields realm >/dev/null 2>&1; then
                  if $KCADM get realms -q "realm=${realm}" --fields realm | grep -q "\"realm\"[[:space:]]*:[[:space:]]*\"${realm}\""; then
                    return 0
                  fi
                fi
                return 1
              }

              ensure_realm() {
                local realm="$1"
                if realm_exists "$realm"; then
                  return 0
                fi
                # Prefer admin for realm creation if available (avoids permission/409 noise)
                if login_with_admin; then
                  ADMIN_ESCALATED="true"
                  if realm_exists "$realm"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  echo "Creating realm: ${realm}"
                  if kcadm_create_realm "${realm}"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  if realm_exists "$realm"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  echo "⚠️  Realm create failed with admin; falling back to client."
                  login_with_client >/dev/null 2>&1 || true
                fi
                echo "Creating realm: ${realm}"
                if kcadm_create_realm "${realm}"; then
                  return 0
                fi
                if realm_exists "$realm"; then
                  return 0
                fi
                fatal "Failed to ensure realm: ${realm}"
              }

              export_partial_realm() {
                local realm="$1"
                local outfile="$2"
                local errfile="${outfile}.err"
                if ! $KCADM create "realms/${realm}/partial-export" \
                  -s exportClients=true \
                  -s exportGroupsAndRoles=true \
                  -s exportUsers=true \
                  > "$outfile" 2> "$errfile"; then
                  echo "⚠️  Partial export failed for realm ${realm}: $(tail -n1 "$errfile" 2>/dev/null || true)"
                  return 1
                fi
                if ! grep -q '^[[:space:]]*[{[]' "$outfile"; then
                  echo "⚠️  Partial export output missing JSON for realm ${realm}"
                  if [ -s "$errfile" ]; then
                    echo "⚠️  Partial export stderr: $(tail -n1 "$errfile")"
                  fi
                  return 1
                fi
                return 0
              }

              import_partial_realm() {
                local realm="$1"
                local infile="$2"
                local out=""
                out="$($KCADM create "realms/${realm}/partialImport" \
                  -s ifResourceExists=OVERWRITE -f "$infile" 2>&1 || true)"
                if echo "$out" | grep -qiE "error|exception|failed"; then
                  echo "⚠️  Partial import failed for realm ${realm}: ${out}"
                  return 1
                fi
                return 0
              }

              try_rename_realm() {
                local from="$1"
                local to="$2"
                local out=""
                out="$($KCADM update "realms/${from}" -s "realm=${to}" -s enabled=true 2>&1 || true)"
                if [ -z "${out:-}" ]; then
                  return 0
                fi
                if echo "$out" | grep -qiE "error|exception|failed"; then
                  echo "⚠️  Rename realm failed (${from} -> ${to}): ${out}"
                  return 1
                fi
                return 0
              }

              delete_realm() {
                local realm="$1"
                if ! realm_exists "$realm"; then
                  return 0
                fi
                $KCADM delete "realms/${realm}" >/dev/null 2>&1 || true
                if realm_exists "$realm"; then
                  echo "⚠️  Failed to delete realm: ${realm}"
                  return 1
                fi
                echo "✅ Deleted realm: ${realm}"
                return 0
              }

              migrate_apps_realm() {
                if [ "${MIGRATE_APPS_REALM}" != "true" ]; then
                  return 0
                fi
                local source="${LEGACY_EXTERNAL_REALM}"
                local target="${EXTERNAL_REALM}"
                if [ -z "${source:-}" ] || [ -z "${target:-}" ]; then
                  echo "⚠️  Migration skipped: missing source/target realm names."
                  return 0
                fi
                if [ "$source" = "$target" ]; then
                  echo "ℹ️  Legacy realm matches target (${target}); no migration needed."
                  return 0
                fi
                if ! realm_exists "$source"; then
                  echo "ℹ️  Legacy realm not found (${source}); skipping migration."
                  return 0
                fi
                if realm_exists "$target"; then
                  echo "⚠️  Both legacy (${source}) and target (${target}) realms exist; skipping migration to avoid overwrite."
                  if [ "$MIGRATE_APPS_REALM_DELETE_SOURCE" = "true" ] && [ "$MIGRATE_APPS_REALM_FORCE_DELETE" = "true" ]; then
                    delete_realm "$source" || true
                  fi
                  return 0
                fi

                echo "🔁 Migrating realm '${source}' -> '${target}' (mode: ${MIGRATE_APPS_REALM_MODE})"

                if [ "$MIGRATE_APPS_REALM_MODE" != "export-import" ]; then
                  if try_rename_realm "$source" "$target"; then
                    if realm_exists "$target" && ! realm_exists "$source"; then
                      echo "✅ Realm renamed: ${source} -> ${target}"
                      return 0
                    fi
                  fi
                  if [ "$MIGRATE_APPS_REALM_MODE" = "rename" ]; then
                    fatal "Realm rename failed; set KEYCLOAK_MIGRATE_APPS_REALM_MODE=export-import to fallback."
                  fi
                  echo "⚠️  Realm rename failed; falling back to export/import."
                fi

                ensure_realm "$target"

                local tmp_dir="/tmp/keycloak-migrations"
                local export_file=""
                mkdir -p "$tmp_dir"
                export_file="${tmp_dir}/realm-${source}-partial-export.json"

                if ! export_partial_realm "$source" "$export_file"; then
                  fatal "Partial export failed for realm '${source}'"
                fi

                if ! import_partial_realm "$target" "$export_file"; then
                  fatal "Partial import failed for realm '${target}'"
                fi

                echo "✅ Partial export/import completed for '${source}' -> '${target}'"

                if [ "$MIGRATE_APPS_REALM_DELETE_SOURCE" = "true" ]; then
                  delete_realm "$source" || true
                fi
              }

              migrate_apps_realm

              ensure_realm "${INTERNAL_REALM}"
              ensure_realm "${EXTERNAL_REALM}"
              if [ "$EXTERNAL_ADMIN_MODE" = "user" ]; then
                ensure_user_admin "$EXTERNAL_REALM" "$EXTERNAL_ADMIN_EMAIL"
              fi
              
              # Use admin creds for master realm config to avoid permission edge cases
              if login_with_admin; then
                AUTH_MODE="admin"
              else
                echo "⚠️  Unable to login with admin; continuing with client creds for master realm."
              fi

              ensure_confidential_service_client "$INTERNAL_REALM" "$GRAVITEE_INTROSPECT_CLIENT_ID" "$GRAVITEE_INTROSPECT_CLIENT_SECRET"

              ensure_flow() {
                local realm="$1"
                local flow="$2"
                local desc="$3"
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=$flow" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc" || true
                fi
              }

              PROVIDER_LIST_LOADED="false"
              load_provider_list() {
                local out=""
                for i in {1..12}; do
                  out="$($KCADM get authentication/execution-providers -r "$ADMIN_REALM" --fields id,providerId --format csv 2>/dev/null || true)"
                  if printf '%s' "$out" | grep -qiE "Resource not found|No server specified|Try 'kcadm|error"; then
                    out=""
                  fi
                  if [ -n "${out:-}" ]; then
                    out="$(printf '%s\n' "$out" | sed '1d' | tr -d '\r' | tr ',' '\n' | tr -d '"' | sed '/^$/d' || true)"
                  fi
                  if [ -z "${out:-}" ]; then
                    out="$($KCADM get authentication/execution-providers -r "$ADMIN_REALM" 2>/dev/null || true)"
                    if ! printf '%s' "$out" | grep -q '^[[:space:]]*\[\|^[[:space:]]*{' ; then
                      out=""
                    fi
                    out="$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*"\(id\|providerId\)"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\2/p' | sed '/^$/d' || true)"
                  fi
                  if [ -n "${out:-}" ]; then
                    break
                  fi
                  sleep 1
                done
                PROVIDER_LIST_GLOBAL="${out:-}"
                PROVIDER_LIST_LOADED="true"
                if [ -z "${PROVIDER_LIST_GLOBAL:-}" ] && [ "$PROVIDER_WARN" = "true" ]; then
                  echo "⚠️  Unable to read execution providers list; will attempt to attach executions without pre-checks."
                fi
              }

              provider_exists() {
                local provider="$1"
                local out=""
                if [ "${PROVIDER_LIST_LOADED:-false}" != "true" ]; then
                  load_provider_list
                fi
                out="${PROVIDER_LIST_GLOBAL:-}"
                [ -z "${out:-}" ] && return 0
                if printf '%s\n' "$out" | grep -xq "$provider"; then
                  return 0
                fi
                return 1
              }

              flow_has_execution() {
                local realm="$1"
                local flow="$2"
                if $KCADM get "authentication/flows/$flow/executions" -r "$realm" 2>/dev/null \
                  | grep -q "\"id\"[[:space:]]*:[[:space:]]*\""; then
                  return 0
                fi
                return 1
              }

              flow_alias_exists() {
                local realm="$1"
                local alias="$2"
                if $KCADM get authentication/flows -r "$realm" 2>/dev/null \
                  | tr -d '\r' | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$alias\""; then
                  return 0
                fi
                return 1
              }

              add_exec_with_requirement() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                local requirement="$4"
                local existing_id=""
                EXECS=$($KCADM get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                existing_id=$(
                      echo "$EXECS" \
                        | tr -d "\n" \
                        | sed "s/},[[:space:]]*{/}\n{/g" \
                        | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$provider\"" \
                        | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" \
                        | head -n1 || true
                    )
                if [ -z "${existing_id:-}" ]; then
                  $KCADM create "authentication/flows/$flow/executions/execution" -r "$realm" -s provider="$provider" || true
                fi
                EID=""
                for i in {1..40}; do
                  EXECS=$($KCADM get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                  EID=$(
                        echo "$EXECS" \
                          | tr -d "\n" \
                          | sed "s/},[[:space:]]*{/}\n{/g" \
                          | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$provider\"" \
                          | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" \
                          | head -n1 || true
                      )
                  [ -n "$EID" ] && break || sleep 1
                done
                if [ -z "${EID:-}" ]; then
                  echo "⚠️  Could not discover execution id for provider '$provider'. Skipping execution."
                  echo "$EXECS"
                  return 0
                fi
                printf '{ "id":"%s", "requirement":"%s" }\n' "$EID" "$requirement" >/tmp/r.json
                $KCADM update "authentication/flows/$flow/executions" -r "$realm" -f /tmp/r.json || true
              }

              add_exec_required() {
                add_exec_with_requirement "$1" "$2" "$3" "REQUIRED"
              }

              add_exec_alternative() {
                add_exec_with_requirement "$1" "$2" "$3" "ALTERNATIVE"
              }
              
              ensure_redirect_flow() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                local desc="$4"
              
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=${flow}" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc" || true
                  $KCADM create "authentication/flows/${flow}/executions/execution" -r "$realm" \
                    -s provider=identity-provider-redirector || true
                fi
              
                REDIR_ID=""
                for i in {1..30}; do
                  EXECS=$($KCADM get "authentication/flows/${flow}/executions" -r "$realm" || echo "[]")
                  REDIR_ID=$(
                            echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                              | grep -E '"providerId" *: *"identity-provider-redirector"' \
                              | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" | head -n1 || true
                          )
                  [ -n "$REDIR_ID" ] && break || sleep 1
                done
                if [ -z "$REDIR_ID" ]; then
                  $KCADM create "authentication/flows/${flow}/executions/execution" -r "$realm" \
                    -s provider=identity-provider-redirector || true
                  for i in {1..10}; do
                    EXECS=$($KCADM get "authentication/flows/${flow}/executions" -r "$realm" || echo "[]")
                    REDIR_ID=$(
                              echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                                | grep -E '"providerId" *: *"identity-provider-redirector"' \
                                | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" | head -n1 || true
                            )
                    [ -n "$REDIR_ID" ] && break || sleep 1
                  done
                fi
                [ -z "$REDIR_ID" ] && { echo "⚠️  cannot find redirector execution for ${flow}; skipping"; return 0; }
              
                printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$REDIR_ID" >/tmp/r2.json
                $KCADM update "authentication/flows/${flow}/executions" -r "$realm" -f /tmp/r2.json || true
              
                CFG_ID=""
                for i in {1..30}; do
                  CFG_ID=$($KCADM get "authentication/executions/${REDIR_ID}/config" -r "$realm" 2>/dev/null \
                          | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1 || true)
                  [ -n "${CFG_ID:-}" ] && break || sleep 1
                done
                if [ -n "${CFG_ID:-}" ]; then
                  if ! $KCADM update "authentication/executions/${REDIR_ID}/config/${CFG_ID}" -r "$realm" \
                    -s "alias=redirect-to-${provider}" -s "config.defaultProvider=${provider}"; then
                    $KCADM create "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                      -s "alias=redirect-to-${provider}" -s "config.defaultProvider=${provider}" || true
                  fi
                else
                  $KCADM create "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                  -s "alias=redirect-to-${provider}" -s "config.defaultProvider=${provider}" || true
                fi
              }

              ensure_first_broker_flow_autolink() {
                local realm="$1"
                local flow="$FIRST_BROKER_FLOW"
                local base="$FIRST_BROKER_BASE"

                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  base_path="$(printf '%s' "$base" | sed 's/ /%20/g')"
                  if ! $KCADM create "authentication/flows/${base_path}/copy" -r "$realm" -s "newName=${flow}" >/dev/null 2>&1; then
                    echo "⚠️  Unable to copy base broker flow in ${realm}; leaving default."
                    return 0
                  fi
                fi

                if provider_exists "$PROVIDER_IDP_AUTO_LINK"; then
                  add_exec_alternative "$realm" "$flow" "$PROVIDER_IDP_AUTO_LINK"
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${realm}: ${PROVIDER_IDP_AUTO_LINK} (skipping auto-link)"
                  fi
                fi

                $KCADM update "realms/${realm}" -s "firstBrokerLoginFlow=$flow" || true
              }
              
              ensure_github_idp() {
                local realm="$1"
                local hide_on_login="$2"
                if [ -z "${hide_on_login:-}" ]; then
                  hide_on_login="false"
                fi
                if $KCADM get identity-provider/instances/github -r "$realm" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/github -r "$realm" \
                    -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                    -s "config.clientId=$CLIENT_ID" \
                    -s "config.clientSecret=$CLIENT_SECRET" \
                    -s 'config.defaultScope=read:user user:email read:org' \
                    -s 'config.trustEmail=true' \
                    -s 'config.guiOrder=1' -s "config.hideOnLoginPage=${hide_on_login}" \
                    -s 'config.syncMode=FORCE' || true
                else
                  $KCADM create identity-provider/instances -r "$realm" \
                    -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                    -s "config.clientId=$CLIENT_ID" \
                    -s "config.clientSecret=$CLIENT_SECRET" \
                    -s 'config.defaultScope=read:user user:email read:org' \
                    -s 'config.trustEmail=true' \
                    -s 'config.guiOrder=1' -s "config.hideOnLoginPage=${hide_on_login}" \
                    -s 'config.syncMode=FORCE' || true
                fi
              }
              
              ensure_google_idp() {
                local realm="$1"
                if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
                  return 1
                fi
              
                if $KCADM get identity-provider/instances/google -r "$realm" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/google -r "$realm" \
                    -s enabled=true -s storeToken=false -s alias=google -s providerId=google \
                    -s "config.clientId=$GOOGLE_CLIENT_ID" \
                    -s "config.clientSecret=$GOOGLE_CLIENT_SECRET" \
                    -s 'config.defaultScope=openid email profile' \
                    -s 'config.trustEmail=true' \
                    -s 'config.guiOrder=2' -s 'config.hideOnLoginPage=false' \
                    -s 'config.syncMode=FORCE' || true
                else
                  $KCADM create identity-provider/instances -r "$realm" \
                    -s enabled=true -s storeToken=false -s alias=google -s providerId=google \
                    -s "config.clientId=$GOOGLE_CLIENT_ID" \
                    -s "config.clientSecret=$GOOGLE_CLIENT_SECRET" \
                    -s 'config.defaultScope=openid email profile' \
                    -s 'config.trustEmail=true' \
                    -s 'config.guiOrder=2' -s 'config.hideOnLoginPage=false' \
                    -s 'config.syncMode=FORCE' || true
                fi
              }

              ensure_github_user_attribute_mapper() {
                local realm="$1"
                local mapper_name="$2"
                local json_field="$3"
                local user_attribute="$4"
                local sync_mode="${5:-INHERIT}"

                if ! $KCADM get identity-provider/instances/github -r "$realm" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get "identity-provider/instances/github/mappers" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name}\""; then
                  return 0
                fi
                $KCADM create "identity-provider/instances/github/mappers" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "identityProviderAlias=github" \
                  -s "identityProviderMapper=github-user-attribute-mapper" \
                  -s "config.\"jsonField\"=${json_field}" \
                  -s "config.\"userAttribute\"=${user_attribute}" \
                  -s "config.\"syncMode\"=${sync_mode}" || true
              }
              
              echo "Configuring admin realm: ${ADMIN_REALM}"
              echo "admin: load providers"
              load_provider_list || true
              if [ "$ADMIN_GITHUB_ENABLED" = "true" ]; then
                echo "admin: ensure github idp"
                ensure_github_idp "$ADMIN_REALM" "false" || true
                echo "admin: ensure first-broker flow"
                ensure_first_broker_flow_autolink "$ADMIN_REALM" || true
                echo "admin: ensure post-broker flow"
                ensure_flow "$ADMIN_REALM" "$FLOW_GH" "Post-broker: GitHub team admin" || true
                if provider_exists "$PROVIDER_GH"; then
                  echo "admin: add github-team-admin execution"
                  add_exec_required "$ADMIN_REALM" "$FLOW_GH" "$PROVIDER_GH" || true
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${ADMIN_REALM}: ${PROVIDER_GH} (skipping execution)"
                  fi
                fi
                if flow_has_execution "$ADMIN_REALM" "$FLOW_GH"; then
                echo "admin: set postBrokerLoginFlowAlias"
                $KCADM update identity-provider/instances/github -r "$ADMIN_REALM" \
                  -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
                else
                  echo "⚠️  GitHub post-broker flow has no executions in ${ADMIN_REALM}; skipping postBrokerLoginFlowAlias."
                fi
                if [ "$ADMIN_REALM_FORCE_GITHUB_REDIRECT" = "true" ]; then
                  echo "admin: ensure github-only browser flow"
                  ensure_redirect_flow "$ADMIN_REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
                  $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=${FLOW_BROWSER_GH}" || true
                else
                  $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=browser" || true
                fi
              else
                if $KCADM get identity-provider/instances/github -r "$ADMIN_REALM" >/dev/null 2>&1; then
                  $KCADM delete identity-provider/instances/github -r "$ADMIN_REALM" || true
                fi
                $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=browser" || true
              fi
              
              # Prefer admin for app realm config unless explicitly forced to client
              if [ "${PREFER_CLIENT_AUTH:-false}" = "true" ]; then
                if login_with_client; then
                  AUTH_MODE="client"
                else
                  echo "⚠️  Unable to switch to client creds; continuing with admin."
                fi
              fi

              echo "Configuring internal realm: ${INTERNAL_REALM}"
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ]; then
                ensure_github_idp "$INTERNAL_REALM" "$INTERNAL_GITHUB_HIDE_ON_LOGIN"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-avatar-url" "avatar_url" "picture" "INHERIT"
              else
                echo "ℹ️  GitHub IdP disabled in internal realm by config."
                if $KCADM get identity-provider/instances/github -r "$INTERNAL_REALM" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/github -r "$INTERNAL_REALM" \
                    -s enabled=false -s 'config.hideOnLoginPage=true' || true
                fi
              fi
              ensure_first_broker_flow_autolink "$INTERNAL_REALM"
              ensure_flow "$INTERNAL_REALM" "$FLOW_GH" "Post-broker: GitHub teams"
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ] && provider_exists "$PROVIDER_GH"; then
                add_exec_required "$INTERNAL_REALM" "$FLOW_GH" "$PROVIDER_GH"
              else
                if [ "$PROVIDER_WARN" = "true" ]; then
                  echo "⚠️  Missing provider in ${INTERNAL_REALM}: ${PROVIDER_GH} (skipping execution)"
                fi
              fi
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ] && flow_has_execution "$INTERNAL_REALM" "$FLOW_GH"; then
              $KCADM update identity-provider/instances/github -r "$INTERNAL_REALM" \
                -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
              else
                echo "⚠️  GitHub post-broker flow has no executions in ${INTERNAL_REALM}; skipping postBrokerLoginFlowAlias."
              fi
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ]; then
                ensure_redirect_flow "$INTERNAL_REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
              fi
              
              EXTERNAL_GOOGLE_READY="false"
              echo "Configuring external realm: ${EXTERNAL_REALM}"
              if [ "$EXTERNAL_GITHUB_ENABLED" = "true" ]; then
                ensure_github_idp "$EXTERNAL_REALM" "true"
              else
                if $KCADM get identity-provider/instances/github -r "$EXTERNAL_REALM" >/dev/null 2>&1; then
                  $KCADM delete identity-provider/instances/github -r "$EXTERNAL_REALM" || true
                fi
              fi
              ensure_first_broker_flow_autolink "$EXTERNAL_REALM"
              if ensure_google_idp "$EXTERNAL_REALM"; then
                EXTERNAL_GOOGLE_READY="true"
                ensure_flow "$EXTERNAL_REALM" "$FLOW_GGL" "Post-broker: Google groups only"
                if provider_exists "$PROVIDER_GGL"; then
                  add_exec_required "$EXTERNAL_REALM" "$FLOW_GGL" "$PROVIDER_GGL"
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${EXTERNAL_REALM}: ${PROVIDER_GGL} (skipping execution)"
                  fi
                fi
                if flow_has_execution "$EXTERNAL_REALM" "$FLOW_GGL"; then
                  $KCADM update identity-provider/instances/google -r "$EXTERNAL_REALM" \
                    -s "postBrokerLoginFlowAlias=$FLOW_GGL" || true
                else
                  echo "⚠️  Google post-broker flow has no executions in ${EXTERNAL_REALM}; skipping postBrokerLoginFlowAlias."
                fi
              else
                echo "⚠️  Google IdP not configured (missing client id/secret)."
              fi
              if [ "$EXTERNAL_GOOGLE_READY" = "true" ]; then
                ensure_redirect_flow "$EXTERNAL_REALM" "$FLOW_BROWSER_GGL" "google" "Browser flow that redirects to Google"
              fi
              
              if [ "$INTERNAL_REALM" != "$ADMIN_REALM" ]; then
                if [ "$INTERNAL_GITHUB_ONLY" = "true" ]; then
                  $KCADM update "realms/${INTERNAL_REALM}" -s "browserFlow=${FLOW_BROWSER_GH}" || true
                else
                  $KCADM update "realms/${INTERNAL_REALM}" -s "browserFlow=browser" || true
                fi
              fi
              if [ "$EXTERNAL_REALM" != "$ADMIN_REALM" ]; then
                if [ "$EXTERNAL_DISABLE_LOCAL_LOGIN" = "true" ] && [ "$EXTERNAL_GOOGLE_READY" = "true" ]; then
                  $KCADM update "realms/${EXTERNAL_REALM}" -s "browserFlow=${FLOW_BROWSER_GGL}" || true
                else
                  $KCADM update "realms/${EXTERNAL_REALM}" -s "browserFlow=browser" || true
                fi
              fi
              
              # Realm hygiene (unchanged)
              $KCADM update "realms/$INTERNAL_REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false || true
              $KCADM update "realms/$EXTERNAL_REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=false -s resetPasswordAllowed=false -s bruteForceProtected=true -s permanentLockout=false || true
              
              # 1) Disable Direct Access Grants (password grant)
              DG="disabled-direct-grant"
              ensure_disabled_direct_grant_flow() {
                local realm="$1"
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\" *: *\"$DG\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=$DG" -s providerId=basic-flow -s topLevel=true -s builtIn=false || true
                fi
                $KCADM update "realms/$realm" -s "directGrantFlow=$DG" || true
              }
              ensure_disabled_direct_grant_flow "$INTERNAL_REALM"
              ensure_disabled_direct_grant_flow "$EXTERNAL_REALM"
              
              # 2) Disable the bootstrap admin user in master (only after configurator client auth is working)
              if [ "${DISABLE_BOOTSTRAP_ADMIN:-false}" = "true" ] && [ "${AUTH_MODE:-}" = "client" ]; then
                ADMIN_ID=$($KCADM get users -r "$ADMIN_REALM" -q username="$KEYCLOAK_ADMIN" 2>/dev/null \
                  | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1 || true)
                if [ -n "$ADMIN_ID" ]; then
                  $KCADM update "users/$ADMIN_ID" -r "$ADMIN_REALM" -s enabled=false -s 'credentials=[]' || true
                fi
              fi
              
              apply_clients_from_dir() {
                local realm="$1"
                local dir="$2"
                if [ -z "${dir:-}" ] || [ ! -d "$dir" ]; then
                  echo "ℹ️  client config dir missing or empty: $dir"
                  return 0
                fi
                echo "📦 Applying clients for realm '${realm}' from ${dir}"
                ls -al "$dir" || true
                for f in "$dir"/*.json; do
                  [ -f "$f" ] || continue
                  client_id=$(sed -n "s/.*\"clientId\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$f" | head -n1)
                  if [ -z "${client_id:-}" ]; then
                    echo "info: missing clientId in $f"
                    continue
                  fi
                  effective_id="$client_id"
                  override_id_file="${CLIENT_ID_DIR:-/vault/secrets}/client-id-${client_id}"
                  if [ -s "$override_id_file" ]; then
                    override_id="$(tr -d '\r\n' < "$override_id_file")"
                    if [ -n "${override_id:-}" ]; then
                      effective_id="$override_id"
                    fi
                  fi
                  echo "↳ Applying client config: $f (clientId=$client_id, effectiveId=$effective_id)"
                  json_file="$f"
                  if [ "$effective_id" != "$client_id" ]; then
                    esc_id="$(printf '%s' "$effective_id" | sed 's/[&|]/\\&/g')"
                    json_file="$(mktemp)"
                    sed "s|\"clientId\"[[:space:]]*:[[:space:]]*\"[^\"]*\"|\"clientId\":\"$esc_id\"|" "$f" > "$json_file"
                  fi
                  CID=$($KCADM get clients -r "$realm" -q "clientId=$effective_id" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  CID="$(clean_id "$CID")"
                  if [ -n "${CID:-}" ]; then
                    $KCADM update "clients/$CID" -r "$realm" -f "$json_file" || true
                  else
                    $KCADM create clients -r "$realm" -f "$json_file" || true
                    CID=$($KCADM get clients -r "$realm" -q "clientId=$effective_id" --fields id --format csv 2>/dev/null | tail -n1 || true)
                    CID="$(clean_id "$CID")"
                  fi
                  if [ -z "${CID:-}" ]; then
                    echo "⚠️  client not found after apply: ${effective_id} in realm ${realm}"
                  fi
                  if [ -n "${CID:-}" ]; then
                    secret=""
                    secret_file="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${client_id}"
                    secret_file_effective="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${effective_id}"
                    if [ -s "$secret_file" ]; then
                      secret="$(tr -d '\r\n' < "$secret_file")"
                    elif [ -s "$secret_file_effective" ]; then
                      secret="$(tr -d '\r\n' < "$secret_file_effective")"
                    elif [ -s "$CLIENT_SECRET_MAP_FILE" ]; then
                      secret="$(awk -F= -v cid="$client_id" '$1==cid { $1=""; sub(/^=/,""); print; exit }' "$CLIENT_SECRET_MAP_FILE")"
                    fi
                    if [ -n "${secret:-}" ]; then
                      $KCADM update "clients/$CID" -r "$realm" \
                        -s publicClient=false \
                        -s "clientAuthenticatorType=client-secret" \
                        -s "secret=$secret" || true
                      echo "🔐 Set client secret for $effective_id"
                    fi
                  fi
                  if [ "$json_file" != "$f" ] && [ -f "$json_file" ]; then
                    rm -f "$json_file"
                  fi
                done
              }

              disable_direct_grants_for_clients() {
                local realm="$1"
                ($KCADM get clients -r "$realm" --fields id,clientId,directAccessGrantsEnabled --format csv 2>/dev/null || true) \
                  | tail -n +2 | while IFS=, read -r id cid dag; do
                      id="$(clean_id "$id")"
                      cid="$(clean_id "$cid")"
                      [ -z "${id:-}" ] && continue
                      if [ "$dag" = "true" ] || [ "$dag" = "TRUE" ]; then
                        echo "🔒 Disabling direct grants for client: $cid"
                        $KCADM update "clients/$id" -r "$realm" -s directAccessGrantsEnabled=false || true
                      fi
                    done
              }

              enforce_pkce_for_client() {
                local realm="$1"
                local clientId="$2"
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -n "${CID:-}" ]; then
                  $KCADM update "clients/$CID" -r "$realm" \
                    -s "standardFlowEnabled=true" \
                    -s "directAccessGrantsEnabled=false" \
                    -s "implicitFlowEnabled=false" \
                    -s "serviceAccountsEnabled=false" \
                    -s "attributes.\"pkce.code.challenge.method\"=S256" || true
                else
                  echo "ℹ️  client not found for PKCE enforcement: $clientId"
                fi
              }

              clear_pkce_for_client() {
                local realm="$1"
                local clientId="$2"
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -n "${CID:-}" ]; then
                  $KCADM update "clients/$CID" -r "$realm" \
                    -s "attributes.\"pkce.code.challenge.method\"=" || true
                else
                  echo "ℹ️  client not found for PKCE clear: $clientId"
                fi
              }

              ensure_realm_roles_in_scope_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="realm-roles-as-scope"
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                [ -z "${CID:-}" ] && return 0
                if $KCADM get "clients/$CID/protocol-mappers/models" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name}\""; then
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                  -s "config.\"claim.name\"=scope" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=false" \
                  -s "config.\"userinfo.token.claim\"=false" \
                  -s "config.\"multivalued\"=true" || true
              }

              ensure_client_attribute_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="$3"
                local user_attribute="$4"
                local claim_name="$5"
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                [ -z "${CID:-}" ] && return 0
                if $KCADM get "clients/$CID/protocol-mappers/models" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name}\""; then
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-attribute-mapper" \
                  -s "config.\"user.attribute\"=${user_attribute}" \
                  -s "config.\"claim.name\"=${claim_name}" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=true" || true
              }
              
              apply_clients_from_dir "$INTERNAL_REALM" "$CLIENT_CONFIG_DIR_INTERNAL"
              disable_direct_grants_for_clients "$INTERNAL_REALM"
              enforce_pkce_for_client "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID"
              clear_pkce_for_client "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID"
              ensure_realm_roles_in_scope_mapper "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID"
              ensure_client_attribute_mapper "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "openwebui-picture" "picture" "picture"
              if ! $KCADM get clients -r "$INTERNAL_REALM" -q "clientId=$OPENWEBUI_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 | grep -q .; then
                echo "⚠️  openwebui client not present in internal realm (${INTERNAL_REALM})"
              fi

              apply_clients_from_dir "$EXTERNAL_REALM" "$CLIENT_CONFIG_DIR_EXTERNAL"
              disable_direct_grants_for_clients "$EXTERNAL_REALM"

              # Sample roles for mapping (edit/remove as needed)
              if [ -n "${INTERNAL_REALM_ROLES_RAW:-}" ]; then
                roles_list="$(echo "$INTERNAL_REALM_ROLES_RAW" | tr ',\n' ' ')"
                for role in $roles_list; do
                  [ -z "${role:-}" ] && continue
                  $KCADM get "roles/$role" -r "$INTERNAL_REALM" >/dev/null 2>&1 || \
                    $KCADM create roles -r "$INTERNAL_REALM" -s "name=$role" || true
                done
              else
                for role in openwebui_access ollama_access ollama_service_access; do
                  $KCADM get "roles/$role" -r "$INTERNAL_REALM" >/dev/null 2>&1 || \
                    $KCADM create roles -r "$INTERNAL_REALM" -s "name=$role" || true
                done
              fi
              for role in tier_free tier_pro feature_x drools_access; do
                $KCADM get "roles/$role" -r "$EXTERNAL_REALM" >/dev/null 2>&1 || \
                  $KCADM create roles -r "$EXTERNAL_REALM" -s "name=$role" || true
              done
              
              ensure_default_role_member() {
                local realm="$1"
                local role="$2"
                local default_role="default-roles-${realm}"
                if ! $KCADM get "roles/$role" -r "$realm" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get "roles/${default_role}/composites" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${role}\""; then
                  return 0
                fi
                $KCADM add-roles -r "$realm" --rname "$default_role" --rolename "$role" >/dev/null 2>&1 || true
              }

              ensure_default_role_member "$INTERNAL_REALM" "drools_access"
              ensure_default_role_member "$INTERNAL_REALM" "user"
              ensure_default_role_member "$EXTERNAL_REALM" "drools_access"

              ensure_roles_from_map() {
                local realm="$1"
                local json="$2"
                if [ -z "${json:-}" ]; then
                  return 0
                fi
                local specs
                specs=$(printf '%s' "$json" | tr -d '\n' | grep -o '"\\(realm\\|client\\):[^"]*"' | tr -d '"' || true)
                if [ -z "${specs:-}" ]; then
                  return 0
                fi
                while read -r spec; do
                  [ -z "${spec:-}" ] && continue
                  case "$spec" in
                    realm:*)
                      role="${spec#realm:}"
                      [ -z "${role:-}" ] && continue
                      $KCADM get "roles/$role" -r "$realm" >/dev/null 2>&1 || \
                        $KCADM create roles -r "$realm" -s "name=$role" || true
                      ;;
                    client:*)
                      rest="${spec#client:}"
                      cid="${rest%%:*}"
                      role="${rest#*:}"
                      if [ -z "${cid:-}" ] || [ -z "${role:-}" ] || [ "$cid" = "$role" ]; then
                        continue
                      fi
                      CLIENT_UUID=$($KCADM get clients -r "$realm" -q "clientId=$cid" --fields id --format csv 2>/dev/null | tail -n1 || true)
                      if [ -n "${CLIENT_UUID:-}" ]; then
                        $KCADM get "clients/$CLIENT_UUID/roles/$role" -r "$realm" >/dev/null 2>&1 || \
                          $KCADM create "clients/$CLIENT_UUID/roles" -r "$realm" -s "name=$role" || true
                      else
                        echo "info: client not found for role spec: $spec"
                      fi
                      ;;
                  esac
                done <<<"$specs"
              }
              
              ensure_roles_from_map "$INTERNAL_REALM" "$GITHUB_ROLE_MAP_JSON"
              ensure_roles_from_map "$EXTERNAL_REALM" "$GOOGLE_GROUP_ROLE_MAP_JSON"

              ensure_client_roles() {
                local realm="$1"
                local clientId="$2"
                shift 2
                local CLIENT_UUID=""
                CLIENT_UUID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CLIENT_UUID="$(clean_id "$CLIENT_UUID")"
                [ -z "${CLIENT_UUID:-}" ] && return 0
                for role in "$@"; do
                  [ -z "${role:-}" ] && continue
                  $KCADM get "clients/$CLIENT_UUID/roles/$role" -r "$realm" >/dev/null 2>&1 || \
                    $KCADM create "clients/$CLIENT_UUID/roles" -r "$realm" -s "name=$role" >/dev/null 2>&1 || true
                done
              }

              ensure_default_client_role_member() {
                local realm="$1"
                local clientId="$2"
                local role="$3"
                local default_role="default-roles-${realm}"
                [ -z "${role:-}" ] && return 0
                $KCADM add-roles -r "$realm" --rname "$default_role" --cclientid "$clientId" --rolename "$role" >/dev/null 2>&1 || true
              }

              ensure_client_roles "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" \
                admin analyst developer user manager process-admin rest-all rest-project
              ensure_default_client_role_member "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "user"

              assign_realm_role_to_service_account() {
                local realm="$1"
                local clientId="$2"
                local role="$3"
                CLIENT_UUID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CLIENT_UUID="$(clean_id "$CLIENT_UUID")"
                [ -z "${CLIENT_UUID:-}" ] && return 0
                SA_ID=$($KCADM get "clients/$CLIENT_UUID/service-account-user" -r "$realm" 2>/dev/null \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" | head -n1 || true)
                SA_ID="$(clean_id "$SA_ID")"
                [ -z "${SA_ID:-}" ] && return 0
                $KCADM add-roles -r "$realm" --uuserid "$SA_ID" --rolename "$role" >/dev/null 2>&1 || true
              }

              assign_client_role_to_service_account() {
                local realm="$1"
                local serviceClientId="$2"
                local targetClientId="$3"
                local role="$4"
                local service_uuid=""
                local target_uuid=""
                local sa_id=""
                service_uuid=$($KCADM get clients -r "$realm" -q "clientId=$serviceClientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                service_uuid="$(clean_id "$service_uuid")"
                [ -z "${service_uuid:-}" ] && return 0
                target_uuid=$($KCADM get clients -r "$realm" -q "clientId=$targetClientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                target_uuid="$(clean_id "$target_uuid")"
                [ -z "${target_uuid:-}" ] && return 0
                sa_id=$($KCADM get "clients/$service_uuid/service-account-user" -r "$realm" 2>/dev/null \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" | head -n1 || true)
                sa_id="$(clean_id "$sa_id")"
                [ -z "${sa_id:-}" ] && return 0
                $KCADM add-roles -r "$realm" --uuserid "$sa_id" --cclientid "$targetClientId" --rolename "$role" >/dev/null 2>&1 || true
              }

              assign_realm_role_to_service_account "$INTERNAL_REALM" "$OLLAMA_SERVICE_CLIENT_ID" "ollama_service_access"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "drools_service_access"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "kie-server"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "rest-all"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "admin"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-all"

              enable_token_exchange_for_client() {
                local realm="$1"
                local target_client_id="$2"
                local allowed_client_id="$3"
                local target_uuid=""
                local allowed_uuid=""
                local perm_json=""
                local perm_id=""
                local policy_name=""
                local policy_id=""
                if [ -z "${realm:-}" ] || [ -z "${target_client_id:-}" ] || [ -z "${allowed_client_id:-}" ]; then
                  return 0
                fi
                target_uuid=$($KCADM get clients -r "$realm" -q "clientId=$target_client_id" --fields id --format csv 2>/dev/null | tail -n1 || true)
                target_uuid="$(clean_id "$target_uuid")"
                if [ -z "${target_uuid:-}" ]; then
                  echo "⚠️  token exchange target client not found: $target_client_id"
                  return 0
                fi
                allowed_uuid=$($KCADM get clients -r "$realm" -q "clientId=$allowed_client_id" --fields id --format csv 2>/dev/null | tail -n1 || true)
                allowed_uuid="$(clean_id "$allowed_uuid")"
                if [ -z "${allowed_uuid:-}" ]; then
                  echo "⚠️  token exchange allowed client not found: $allowed_client_id"
                  return 0
                fi

                $KCADM update "clients/$target_uuid/management/permissions" -r "$realm" -s enabled=true >/dev/null 2>&1 || true

                policy_name="token-exchange-${allowed_client_id}"
                policy_id=$($KCADM get "clients/$target_uuid/authz/resource-server/policy/client" -r "$realm" -q "name=$policy_name" --fields id --format csv 2>/dev/null | tail -n1 || true)
                policy_id="$(clean_id "$policy_id")"
                if [ -z "${policy_id:-}" ]; then
                  $KCADM create "clients/$target_uuid/authz/resource-server/policy/client" -r "$realm" \
                    -s "name=$policy_name" \
                    -s "logic=POSITIVE" \
                    -s "decisionStrategy=UNANIMOUS" \
                    -s "clients=[\"$allowed_uuid\"]" >/dev/null 2>&1 || true
                else
                  $KCADM update "clients/$target_uuid/authz/resource-server/policy/client/$policy_id" -r "$realm" \
                    -s "clients=[\"$allowed_uuid\"]" >/dev/null 2>&1 || true
                fi

                perm_json="$($KCADM get "clients/$target_uuid/management/permissions" -r "$realm" 2>/dev/null || true)"
                perm_id="$(printf '%s' "$perm_json" | sed -n 's/.*"token-exchange"[[:space:]]*:[[:space:]]*"\\([^"]*\\)".*/\\1/p')"
                perm_id="$(clean_id "$perm_id")"
                if [ -n "${perm_id:-}" ]; then
                  $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id" -r "$realm" \
                    -s "policies=[\"$policy_name\"]" >/dev/null 2>&1 || true
                else
                  $KCADM create "clients/$target_uuid/authz/resource-server/permission/scope" -r "$realm" \
                    -s "name=token-exchange" \
                    -s "logic=POSITIVE" \
                    -s "decisionStrategy=UNANIMOUS" \
                    -s "scopes=[\"token-exchange\"]" \
                    -s "policies=[\"$policy_name\"]" >/dev/null 2>&1 || true
                fi
              }

              enable_token_exchange_for_client "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_SERVICE_CLIENT_ID"

              set_client_flow_override() {
                local realm="$1"
                local clientId="$2"
                local flow="$3"
                local override=""
                if [ -z "${flow:-}" ]; then
                  echo "ℹ️  flow not set (skipping override for $clientId)"
                  return 0
                fi
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -n "${CID:-}" ]; then
                  override=$($KCADM get "clients/$CID" -r "$realm" 2>/dev/null \
                    | tr -d "\n" \
                    | sed -n "s/.*\"authenticationFlowBindingOverrides\"[[:space:]]*:[[:space:]]*{[^}]*\"browser\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" \
                    | head -n1 || true)
                  if [ -n "${override:-}" ] && ! flow_alias_exists "$realm" "$override"; then
                    $KCADM update "clients/$CID" -r "$realm" -s "authenticationFlowBindingOverrides={}" >/dev/null 2>&1 || true
                    echo "ℹ️  cleared invalid browser flow override '$override' for $clientId"
                  fi
                  if ! flow_alias_exists "$realm" "$flow"; then
                    echo "ℹ️  flow not found: $flow (skipping override for $clientId)"
                    return 0
                  fi
                  if ! $KCADM get "authentication/flows/$flow" -r "$realm" >/dev/null 2>&1; then
                    echo "ℹ️  flow alias not resolvable: $flow (skipping override for $clientId)"
                    return 0
                  fi
                  if ! $KCADM update "clients/$CID" -r "$realm" \
                    -s "authenticationFlowBindingOverrides.browser=$flow" >/dev/null 2>&1; then
                    echo "⚠️  Unable to set browser flow override ($flow) for client $clientId; skipping."
                  fi
                else
                  echo "ℹ️  client not found: $clientId (skipping override)"
                fi
              }

              clear_client_flow_override() {
                local realm="$1"
                local clientId="$2"
                local expected_flow="${3:-}"
                local override=""
                CID=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -z "${CID:-}" ]; then
                  return 0
                fi
                override=$($KCADM get "clients/$CID" -r "$realm" 2>/dev/null \
                  | tr -d "\n" \
                  | sed -n "s/.*\"authenticationFlowBindingOverrides\"[[:space:]]*:[[:space:]]*{[^}]*\"browser\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" \
                  | head -n1 || true)
                if [ -z "${override:-}" ]; then
                  return 0
                fi
                if [ -n "${expected_flow:-}" ] && [ "$override" != "$expected_flow" ]; then
                  return 0
                fi
                $KCADM update "clients/$CID" -r "$realm" -s "authenticationFlowBindingOverrides={}" >/dev/null 2>&1 || true
                echo "ℹ️  cleared browser flow override '$override' for $clientId"
              }
              
              # Optionally enforce GitHub-only for internal apps
              if [ "$INTERNAL_GITHUB_ONLY" = "true" ]; then
                set_client_flow_override "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "$FLOW_BROWSER_GH"
              else
                clear_client_flow_override "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "$FLOW_BROWSER_GH"
              fi
              
              # Enforce Google-only for external apps (example clientId)
              if [ "$EXTERNAL_GOOGLE_READY" = "true" ]; then
                set_client_flow_override "$EXTERNAL_REALM" "$PUBLIC_APP_CLIENT_ID" "$FLOW_BROWSER_GGL"
              fi

              if [ "$CONFIGURATOR_DELETE_CLIENT" = "true" ]; then
                CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                if [ -n "${CID:-}" ]; then
                  $KCADM delete "clients/$CID" -r "$ADMIN_REALM" || true
                fi
              fi

              echo "✔ Configurator finished. Holding for logs."
              hold
          volumeMounts:
            - name: keycloak-client-config-internal
              mountPath: /opt/keycloak/data/clients/internal
              readOnly: true
            - name: keycloak-client-config-external
              mountPath: /opt/keycloak/data/clients/external
              readOnly: true

        # --- Keycloak runtime ---
        - name: keycloak
          image: ghcr.io/dotcomrow/keycloak-image:24.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KEYCLOAK_REALM
              value: "external"
            # DB
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "currentSchema=keycloak"
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "10"

            # Logging
            - name: KC_LOG
              value: "console,file"
            - name: KC_LOG_FILE
              value: "/opt/keycloak/data/log/keycloak.log"
            - name: KC_LOG_LEVEL
              value: "INFO,systems.suncoast.kc.github:DEBUG,systems.suncoast.kc.google:DEBUG,org.keycloak.authentication:DEBUG,org.keycloak.events:INFO,org.keycloak.protocol.oidc:DEBUG,org.keycloak.protocol.oidc.endpoints.TokenEndpoint:DEBUG"
            - name: KC_PROXY
              value: "edge"

            # Hostname & HTTP
            - name: KC_HOSTNAME_URL
              value: "https://auth.suncoast.systems"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "https://keycloak-admin.teleport.app.suncoast.systems"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_TRANSACTION_XA_ENABLED
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_HTTP_COOKIE_SAME_SITE
              value: "LAX"
            - name: KEYCLOAK_RULES_ADMIN_TEAM
              value: "rules_admin"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /opt/keycloak/data/log

              # Admin + DB creds from Vault agent
              source /vault/secrets/keycloak-admin
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)"
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)"

              # Export org/team for the custom provider
              export GITHUB_ORG="$(cat /vault/secrets/github-org)"
              export GITHUB_TEAM="$(cat /vault/secrets/keycloak-admin-team)"
              export RULES_ADMIN_TEAM="${KEYCLOAK_RULES_ADMIN_TEAM:-rules_admin}"
              DROOLS_WORKBENCH_CLIENT_ID="drools-workbench"
              if [ -s /vault/secrets/client-id-drools-workbench ]; then
                DROOLS_WORKBENCH_CLIENT_ID="$(tr -d '\r\n' < /vault/secrets/client-id-drools-workbench)"
              fi
              export DROOLS_WORKBENCH_CLIENT_ID
              export DEBUG_ALWAYS_GRANT="${DEBUG_ALWAYS_GRANT:-false}"
              export GITHUB_ADMIN_USERNAMES="${GITHUB_ADMIN_USERNAMES:-}"
              append_role_map_entry() {
                local json="$1"
                local key="$2"
                local role="$3"
                local trimmed=""
                local json_flat=""
                local role_escaped=""
                local key_regex=""
                local role_regex=""
                local key_repl=""
                if [ -z "${key:-}" ] || [ -z "${role:-}" ]; then
                  printf '%s' "$json"
                  return 0
                fi
                if [ -z "${json:-}" ]; then
                  printf '{"%s":["%s"]}' "$key" "$role"
                  return 0
                fi
                json_flat="$(printf '%s' "$json" | tr -d '\n')"
                key_regex="$(printf '%s' "$key" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                role_regex="$(printf '%s' "$role" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                key_repl="$(printf '%s' "$key" | sed 's/[&|]/\\\\&/g')"
                if printf '%s' "$json_flat" | grep -q "\"${key_regex}\""; then
                  if printf '%s' "$json_flat" | grep -q "\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[[^]]*\"${role_regex}\""; then
                    printf '%s' "$json_flat"
                    return 0
                  fi
                  role_escaped="$(printf '%s' "$role" | sed 's/[&|]/\\\\&/g')"
                  printf '%s' "$json_flat" | sed "s|\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[\\([^]]*\\)\\]|\"${key_repl}\":[\\1,\"${role_escaped}\"]|"
                  return 0
                fi
                trimmed="$(printf '%s' "$json_flat" | sed 's/[[:space:]]*$//')"
                if printf '%s' "$trimmed" | grep -q '^{' && printf '%s' "$trimmed" | grep -q '}$'; then
                  local inner="${trimmed#\{}"
                  inner="${inner%\}}"
                  if [ -z "${inner//[[:space:]]/}" ]; then
                    printf '{"%s":["%s"]}' "$key" "$role"
                  else
                    printf '%s' "${trimmed%\}}"
                    printf ',\"%s\":[\"%s\"]}' "$key" "$role"
                  fi
                  return 0
                fi
                printf '%s' "$json"
              }
              if [ -s /vault/secrets/github-role-map ]; then
                export GITHUB_ROLE_MAP="$(cat /vault/secrets/github-role-map)"
              else
                export GITHUB_ROLE_MAP='{"myorg/openwebui":["realm:openwebui_access"]}'
              fi
              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${GITHUB_TEAM:-}" ]; then
                admin_key="${GITHUB_ORG}/${GITHUB_TEAM}"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$admin_key" "client:realm-management:realm-admin")"
              fi
              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${RULES_ADMIN_TEAM:-}" ]; then
                rules_admin_key="${GITHUB_ORG}/${RULES_ADMIN_TEAM}"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:admin")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:rest-all")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:drools_access")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:drools_admin")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:drools_service_access")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "realm:kie-server")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "client:realm-management:realm-admin")"
                export GITHUB_ROLE_MAP="$(append_role_map_entry "$GITHUB_ROLE_MAP" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:admin")"
              fi

              # Google Groups auth (Cloud Identity)
              export GOOGLE_ADMIN_EMAIL="$(cat /vault/secrets/google-admin-email)"
              EXTERNAL_ADMIN_GROUP=""
              if [ -s /vault/secrets/google-admin-group ]; then
                EXTERNAL_ADMIN_GROUP="$(tr -d '\r\n' < /vault/secrets/google-admin-group)"
              fi
              export GOOGLE_SA_JSON_PATH="/vault/secrets/google-sa-json"
              export GOOGLE_GROUP_ROLE_MAP="$(cat /vault/secrets/google-group-role-map 2>/dev/null || true)"
              export GOOGLE_ROLE_PREFIX="ggl:"
              export GOOGLE_AUTO_ROLES="true"
              export GOOGLE_STRICT_REVOKE="true"
              export GOOGLE_GROUPS_TTL_SECONDS="600"
              if [ -z "${GOOGLE_GROUP_ROLE_MAP:-}" ]; then
                export GOOGLE_GROUP_ROLE_MAP='{"tier-pro@yourdomain.com":["realm:tier_pro"],"feature-x@yourdomain.com":["realm:feature_x"]}'
              fi
              if [ -n "${EXTERNAL_ADMIN_GROUP:-}" ]; then
                export GOOGLE_GROUP_ROLE_MAP="$(append_role_map_entry "$GOOGLE_GROUP_ROLE_MAP" "$EXTERNAL_ADMIN_GROUP" "client:realm-management:realm-admin")"
              fi

              echo "▶️  Starting Keycloak (image already built with provider)…"
              exec /opt/keycloak/bin/kc.sh start --optimized
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: keycloak-client-config-internal
              mountPath: /opt/keycloak/data/clients/internal
              readOnly: true
            - name: keycloak-client-config-external
              mountPath: /opt/keycloak/data/clients/external
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-admin-redirect
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-admin-redirect
  template:
    metadata:
      labels:
        app: keycloak-admin-redirect
    spec:
      containers:
        - name: redirect
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: redirect-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: redirect-config
          configMap:
            name: keycloak-admin-redirect-config
