apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-client-config
  namespace: keycloak
data:
  openwebui.json: |
    {
      "clientId": "openwebui",
      "name": "OpenWebUI",
      "protocol": "openid-connect",
      "publicClient": false,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": ["https://open-webui.teleport.app.suncoast.systems/*"],
      "webOrigins": ["https://open-webui.teleport.app.suncoast.systems"]
    }
  public-app.json: |
    {
      "clientId": "public-app",
      "name": "Public App",
      "protocol": "openid-connect",
      "publicClient": false,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "serviceAccountsEnabled": false,
      "redirectUris": ["https://app.example.com/*"],
      "webOrigins": ["https://app.example.com"]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → keycloak..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: keycloak/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  selector:
    matchLabels:
      job-name: keycloak-yugabyte-config
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
      labels:
        job-name: keycloak-yugabyte-config
        app: keycloak-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              #!/bin/sh
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE_GROUP=keycloak
              ROLE_OWNER=keycloak_app
              VAULTADMIN_USER=vaultadmin

              # Basic retry helpers for transient Yugabyte/Vault hiccups
              psql_retry() {
                # Usage: psql_retry <database> <label> <<'SQL' ... SQL
                # Retries the psql command with ON_ERROR_STOP enabled.
                local db="$1"; local label="$2"; shift 2
                local max="${MAX_PSQL_RETRIES:-10}"; local delay="${PSQL_RETRY_DELAY:-3}"
                local attempt=0 tmp
                tmp="$(mktemp)"
                cat >"$tmp"
                while :; do
                  attempt=$((attempt+1))
                  if psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$db" -v ON_ERROR_STOP=1 -f "$tmp"; then
                    rm -f "$tmp"
                    return 0
                  fi
                  if [ "$attempt" -ge "$max" ]; then
                    echo "❌ ${label} failed after ${attempt} attempts"
                    rm -f "$tmp"
                    return 1
                  fi
                  echo "🔁 ${label} failed (attempt ${attempt}/${max}); retrying in ${delay}s..."
                  sleep "$delay"
                done
              }

              retry_cmd() {
                # Usage: retry_cmd <label> <cmd...>
                local label="$1"; shift
                local max="${MAX_CMD_RETRIES:-10}"; local delay="${CMD_RETRY_DELAY:-5}"
                local attempt=0
                while :; do
                  attempt=$((attempt+1))
                  if "$@"; then return 0; fi
                  if [ "$attempt" -ge "$max" ]; then
                    echo "❌ ${label} failed after ${attempt} attempts"
                    return 1
                  fi
                  echo "🔁 ${label} failed (attempt ${attempt}/${max}); retrying in ${delay}s..."
                  sleep "$delay"
                done
              }

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                # already KVv2?
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"
                  break
                fi

                # path exists but not KVv2 → bail
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."
                  exit 1
                fi

                # try to enable KVv2; if it works, we're done; otherwise, retry after a short pause
                vault secrets enable -path=secret -version=2 kv && break

                sleep 2
              done

              echo "🔐 Seeding Keycloak admin creds at secret/keycloak/admin (if missing)..."
              if ! vault kv get -format=json secret/keycloak/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/keycloak/admin username=admin password="$PASS"
                echo "✅ Seeded admin secret at secret/keycloak/admin"
              else
                echo "✅ Admin secret already present"
              fi

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/${VAULTADMIN_USER} to exist in Vault..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
                if [ -n "${OUT}" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  if [ -n "${VAULTADMIN_PASS}" ] && [ "${VAULTADMIN_PASS}" != "null" ]; then
                    echo "✅ Found secret/${VAULTADMIN_USER}"
                    break
                  fi
                fi
                echo "⏳ secret/${VAULTADMIN_USER} not ready yet; retrying in 5s..."
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB' owned by $VAULTADMIN_USER..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                echo "🔁 Retry create DB in 3s..."; sleep 3
              done

              psql_retry yugabyte "role + group creation" <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              psql_retry "$DB" "schema creation + connect grants" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${ROLE_OWNER};
              ALTER SCHEMA keycloak OWNER TO ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} SET search_path = keycloak;
              GRANT CONNECT ON DATABASE ${DB} TO ${ROLE_OWNER};
              EOSQL

              psql_retry "$DB" "table ownership fixes" <<EOSQL
              ALTER TABLE IF EXISTS keycloak.databasechangeloglock OWNER TO ${ROLE_OWNER};
              ALTER TABLE IF EXISTS keycloak.databasechangelog    OWNER TO ${ROLE_OWNER};
              EOSQL

              psql_retry "$DB" "schema grants" <<EOSQL
              SET ROLE ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA keycloak TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES   TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT USAGE, SELECT                ON SEQUENCES TO ${ROLE_GROUP};
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES    TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON SEQUENCES TO ${VAULTADMIN_USER};
              RESET ROLE;
              EOSQL

              echo "✅ Schema & privileges prepared"

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
              fi

              retry_cmd "vault static role keycloak-app" \
                vault write yugabyte-db/static-roles/keycloak-app \
                  db_name="yugabyte" \
                  username="${ROLE_OWNER}" \
                  rotation_statements="ALTER ROLE ${ROLE_OWNER} WITH PASSWORD '{{password}}';" \
                  rotation_period="720h"

              vault policy write "keycloak" - <<'EOF'
              path "yugabyte-db/static-creds/keycloak-app"        { capabilities = ["read"] }
              path "secret/data/keycloak/admin"                   { capabilities = ["read"] }
              path "secret/data/vaultadmin"                       { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-id"         { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-secret"     { capabilities = ["read"] }
              path "secret/data/keycloak-github-role-map"         { capabilities = ["read"] }
              path "secret/data/keycloak-google-client-id"        { capabilities = ["read"] }
              path "secret/data/keycloak-google-client-secret"    { capabilities = ["read"] }
              path "secret/data/keycloak-google-admin-email"      { capabilities = ["read"] }
              path "secret/data/keycloak-google-sa-json"          { capabilities = ["read"] }
              path "secret/data/keycloak-google-group-role-map"   { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-*"         { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-org" { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-admin-team" { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/keycloak \
                bound_service_account_names="keycloak" \
                bound_service_account_namespaces="keycloak" \
                policies="keycloak" \
                ttl="48h"

              CREDS_JSON=""
              for i in $(seq 1 "${MAX_CMD_RETRIES:-10}"); do
                CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/keycloak-app 2>/dev/null || true)"
                [ -n "${CREDS_JSON}" ] && break
                echo "🔁 Waiting for static creds keycloak-app (attempt $i/${MAX_CMD_RETRIES:-10})..."
                sleep "${CMD_RETRY_DELAY:-5}"
              done
              if [ -z "${CREDS_JSON}" ]; then
                echo "❌ Unable to read static creds for keycloak-app"
                exit 1
              fi
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as \$DB_USER=$DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"

              echo "🎉 Keycloak DB prepared; Vault static role + policy + K8s binding ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-vault-k8s-role
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  selector:
    matchLabels:
      job-name: keycloak-vault-k8s-role
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
      labels:
        job-name: keycloak-vault-k8s-role
        app: keycloak-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: ensure-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -s /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔎 Checking for auth/kubernetes/role/keycloak..."
              if vault read auth/kubernetes/role/keycloak >/dev/null 2>&1; then
                echo "✅ Role already exists; nothing to do."
                exit 0
              fi

              echo "⚙️  (Re)creating policy 'keycloak' and Kubernetes role..."
              vault policy write "keycloak" - <<'EOF'
              path "yugabyte-db/static-creds/keycloak-app"        { capabilities = ["read"] }
              path "secret/data/keycloak/admin"                   { capabilities = ["read"] }
              path "secret/data/vaultadmin"                       { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-id"         { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-secret"     { capabilities = ["read"] }
              path "secret/data/keycloak-github-role-map"         { capabilities = ["read"] }
              path "secret/data/keycloak-google-client-id"        { capabilities = ["read"] }
              path "secret/data/keycloak-google-client-secret"    { capabilities = ["read"] }
              path "secret/data/keycloak-google-admin-email"      { capabilities = ["read"] }
              path "secret/data/keycloak-google-sa-json"          { capabilities = ["read"] }
              path "secret/data/keycloak-google-group-role-map"   { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-*"         { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-org" { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-admin-team" { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/keycloak \
                bound_service_account_names="keycloak" \
                bound_service_account_namespaces="keycloak" \
                policies="keycloak" \
                ttl="48h"

              vault read auth/kubernetes/role/keycloak >/dev/null
              echo "🎉 Vault Kubernetes role 'keycloak' ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    teleport.dev/name: "keycloak"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "keycloak.teleport.app.suncoast.systems"
    teleport.dev/description: "Keycloak Service"
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
    teleport.dev/enroll: "true"
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-keycloak
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # GitHub OAuth + org/team for provider
        vault.hashicorp.com/agent-inject-secret-github-client-id: "secret/data/keycloak-oauth-client-id"
        vault.hashicorp.com/agent-inject-template-github-client-id: |
          {{- with secret "secret/data/keycloak-oauth-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-client-secret: "secret/data/keycloak-oauth-client-secret"
        vault.hashicorp.com/agent-inject-template-github-client-secret: |
          {{- with secret "secret/data/keycloak-oauth-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-org: "secret/data/k8s-teleport-teleport-github-org"
        vault.hashicorp.com/agent-inject-template-github-org: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-org" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-admin-team: "secret/data/k8s-teleport-teleport-github-admin-team"
        vault.hashicorp.com/agent-inject-template-github-admin-team: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-admin-team" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-role-map: "secret/data/keycloak-github-role-map"
        vault.hashicorp.com/agent-inject-template-github-role-map: |
          {{- with secret "secret/data/keycloak-github-role-map" -}}{{ .Data.data.value }}{{- end -}}

        # Google OIDC + Groups (Cloud Identity)
        vault.hashicorp.com/agent-inject-secret-google-client-id: "secret/data/keycloak-google-client-id"
        vault.hashicorp.com/agent-inject-template-google-client-id: |
          {{- with secret "secret/data/keycloak-google-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-client-secret: "secret/data/keycloak-google-client-secret"
        vault.hashicorp.com/agent-inject-template-google-client-secret: |
          {{- with secret "secret/data/keycloak-google-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-email: "secret/data/keycloak-google-admin-email"
        vault.hashicorp.com/agent-inject-template-google-admin-email: |
          {{- with secret "secret/data/keycloak-google-admin-email" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-sa-json: "secret/data/keycloak-google-sa-json"
        vault.hashicorp.com/agent-inject-template-google-sa-json: |
          {{- with secret "secret/data/keycloak-google-sa-json" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-group-role-map: "secret/data/keycloak-google-group-role-map"
        vault.hashicorp.com/agent-inject-template-google-group-role-map: |
          {{- with secret "secret/data/keycloak-google-group-role-map" -}}{{ .Data.data.value }}{{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        vault.hashicorp.com/agent-inject-secret-vaultadmin: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-vaultadmin: |
          {{- with secret "secret/data/vaultadmin" -}}
          {{- if .Data.data.password -}}{{ .Data.data.password }}{{ else }}{{ .Data.data.value }}{{ end -}}
          {{- end -}}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: dedicated
                    operator: In
                    values:
                      - srvr-node
      serviceAccountName: keycloak

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: keycloak-realm-import
          configMap:
            name: keycloak-realm-import
            optional: true
        - name: keycloak-client-config
          configMap:
            name: keycloak-client-config
            optional: true

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              wait_job() {
                local JOB="$1"
                echo "Waiting for Job vault/${JOB} to complete (will retry until ready)..."
                while true; do
                  if ! kubectl -n vault get job "${JOB}" >/dev/null 2>&1; then
                    echo "  └─ job ${JOB} not found yet..."
                    sleep 5
                    continue
                  fi
                  SUCC="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                  if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  if kubectl -n vault wait --for=condition=complete "job/${JOB}" --timeout=10s >/dev/null 2>&1; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  FAIL="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                  ACTV="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                  echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                  sleep 5
                done
              }

              for job in keycloak-vault-k8s-role keycloak-yugabyte-config; do
                wait_job "$job"
              done

        - name: kc-db-preflight
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: PGHOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: PGPORT
              value: "5433"
            - name: PGDATABASE
              value: "keycloak"
            - name: PGSCHEMA
              value: "keycloak"
            - name: PGSCHEMA_OWNER
              value: "keycloak_app"
            - name: PGADMIN_USER
              value: "vaultadmin"
            # Optional schema reset controls (leave false to preserve existing data)
            - name: KC_FORCE_DROP_SCHEMA
              value: "false"
            - name: KC_FORCE_RESET_SCHEMA_ON_CONFLICT
              value: "true"
            - name: KC_CLEAR_CHANGELOG_CHECKSUMS
              value: "false"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache postgresql15-client jq bind-tools busybox-extras

              # Wait for Vault agent to write the secret file
              for i in $(seq 1 60); do
                if [ -s /vault/secrets/vaultadmin ]; then break; fi
                echo "⏳ waiting for /vault/secrets/vaultadmin..."
                sleep 1
              done
              if [ ! -s /vault/secrets/vaultadmin ]; then
                echo "❌ /vault/secrets/vaultadmin not found or empty"; exit 1
              fi

              export PGUSER="${PGADMIN_USER}"
              export PGPASSWORD="$(tr -d '\r\n' < /vault/secrets/vaultadmin)"

              echo "🔎 DNS for ${PGHOST}"; getent hosts "${PGHOST}" || true
              echo "🔎 TCP ${PGHOST}:${PGPORT}"; nc -vz -w 3 "${PGHOST}" "${PGPORT}" || true

              echo "🔎 Preflight (admin): connecting to ${PGHOST}:${PGPORT}/${PGDATABASE} as ${PGUSER}…"
              until psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "select 1" >/dev/null 2>&1; do
                echo "  ⏳ waiting for DB…"
                sleep 2
              done
              echo "✅ DB reachable"

              # Ensure schema exists so DROP works deterministically
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA};"

              # Log what exists
              TABLES=$(
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                  "select table_schema||'.'||table_name
                    from information_schema.tables
                    where table_schema='${PGSCHEMA}'
                    order by 1"
              )
              COUNT="$(printf '%s\n' "$TABLES" | sed '/^$/d' | wc -l | tr -d ' ')"
              echo "ℹ️  ${PGSCHEMA} currently has ${COUNT:-0} table(s)."
              if [ -n "${TABLES:-}" ]; then echo "$TABLES" | sed 's/^/   • /'; fi

              CHANGELOG_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                "select 1 from information_schema.tables where table_schema='${PGSCHEMA}' and table_name='databasechangelog' limit 1" \
                2>/dev/null || true)"
              CHANGELOG_EXISTS="${CHANGELOG_EXISTS:-0}"
              CHANGELOG_ROWS="0"
              if [ "${CHANGELOG_EXISTS}" = "1" ]; then
                CHANGELOG_ROWS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                  "select count(*) from ${PGSCHEMA}.databasechangelog" 2>/dev/null || echo 0)"
                CHANGELOG_ROWS="${CHANGELOG_ROWS:-0}"
              fi

              if [ "${COUNT:-0}" -gt 0 ] && [ "${KC_FORCE_DROP_SCHEMA:-false}" != "true" ]; then
                if [ "${KC_FORCE_RESET_SCHEMA_ON_CONFLICT:-false}" = "true" ] && \
                   { [ "${CHANGELOG_EXISTS}" != "1" ] || [ "${CHANGELOG_ROWS}" = "0" ]; }; then
                  echo "⚠️  Existing tables without Liquibase history; resetting schema."
                else
                  if [ "${KC_CLEAR_CHANGELOG_CHECKSUMS:-false}" = "true" ] && [ "${CHANGELOG_EXISTS}" = "1" ]; then
                    echo "🧹 Clearing Liquibase checksums in ${PGSCHEMA}.databasechangelog"
                    psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                      -c "UPDATE ${PGSCHEMA}.databasechangelog SET md5sum=NULL;"
                  fi
                  echo "✅ Existing schema detected; skipping destructive reset."
                  exit 0
                fi
              fi

              echo "🧨 Dropping schema ${PGSCHEMA} (CASCADE) for a clean migration…"
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<EOSQL
              DROP SCHEMA IF EXISTS ${PGSCHEMA} CASCADE;
              CREATE SCHEMA ${PGSCHEMA} AUTHORIZATION ${PGSCHEMA_OWNER};
              ALTER ROLE ${PGSCHEMA_OWNER} SET search_path = ${PGSCHEMA};
              GRANT USAGE, CREATE ON SCHEMA ${PGSCHEMA} TO ${PGSCHEMA_OWNER};
              EOSQL

              # NOTE: unquoted heredoc so $PGSCHEMA expands in the shell.
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=0 <<EOSQL || true
              DO \$blk\$
              DECLARE
                sch text := quote_ident('$PGSCHEMA');  -- safe identifier quoting
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangelog'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangelog RESTART IDENTITY CASCADE';
                END IF;

                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangeloglock'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangeloglock RESTART IDENTITY CASCADE';
                END IF;
              END
              \$blk\$ LANGUAGE plpgsql;
              EOSQL

              echo "✅ Preflight complete."

      containers:
        # --- One-time configuration sidecar (IdPs + flows + attach providers) ---
        - name: keycloak-configurator
          image: ghcr.io/dotcomrow/keycloak-image:24.0.5
          imagePullPolicy: Always
          env:
            - name: KEYCLOAK_REALM
              value: "apps"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              
              ADMIN_REALM="master"
              REALM="${KEYCLOAK_REALM:-apps}"
              SERVER="http://127.0.0.1:8080"
              FLOW_GH="GitHub-PostLogin"
              FLOW_GGL="Google-PostLogin"
              PROVIDER_GH="github-team-admin"
              PROVIDER_GGL="google-groups-authenticator"
              FLOW_BROWSER_GH="browser-github-only"
              FLOW_BROWSER_GGL="browser-google-only"
              KCADM="/opt/keycloak/bin/kcadm.sh"
              KCADM_CONFIG="/tmp/kcadm.config"
              export KCADM_CONFIG
              kc(){ "$KCADM" --server "$SERVER" "$@"; }
              
              hold(){ echo "Configurator will stay running for logs…"; tail -f /dev/null; }
              on_err(){ code=$?; echo "Configurator error (exit $code)"; hold; }
              trap on_err ERR
              
              source /vault/secrets/keycloak-admin
              CLIENT_ID="$(cat /vault/secrets/github-client-id)"
              CLIENT_SECRET="$(cat /vault/secrets/github-client-secret)"
              GITHUB_ORG="$(cat /vault/secrets/github-org)"
              GITHUB_TEAM="$(cat /vault/secrets/github-admin-team)"
              GOOGLE_CLIENT_ID="$(cat /vault/secrets/google-client-id 2>/dev/null || true)"
              GOOGLE_CLIENT_SECRET="$(cat /vault/secrets/google-client-secret 2>/dev/null || true)"
              GITHUB_ROLE_MAP_JSON="$(cat /vault/secrets/github-role-map 2>/dev/null || true)"
              GOOGLE_GROUP_ROLE_MAP_JSON="$(cat /vault/secrets/google-group-role-map 2>/dev/null || true)"
              CLIENT_SECRET_MAP_FILE="/vault/secrets/client-secrets"
              CLIENT_SECRET_DIR="/vault/secrets"
              CLIENT_SECRET_PREFIX="client-secret-"
              CLIENT_CONFIG_DIR="/opt/keycloak/data/clients"
              
              echo "Waiting for Keycloak admin API..."
              for i in {1..120}; do
                if kc config credentials --realm "$ADMIN_REALM" --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              echo "✅ Admin API ready."
              
              if ! kc get "realms/${REALM}" >/dev/null 2>&1; then
                echo "Creating realm: ${REALM}"
                kc create realms -s "realm=${REALM}" -s enabled=true
              fi
              
              ensure_flow() {
                local realm="$1"
                local flow="$2"
                local desc="$3"
                if ! kc get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  kc create authentication/flows -r "$realm" \
                    -s "alias=$flow" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc"
                fi
                EXECS=$(kc get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                IDS=$(echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p")
                if [ -n "$IDS" ]; then
                  while read -r EID; do
                    [ -n "$EID" ] && kc delete "authentication/executions/$EID" -r "$realm" || true
                  done <<<"$IDS"
                fi
              }
              
              add_exec_required() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                kc create "authentication/flows/$flow/executions/execution" -r "$realm" -s provider="$provider"
                EID=""
                for i in {1..40}; do
                  EXECS=$(kc get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                  EID=$(echo "$EXECS" \
                        | tr -d "\n" \
                        | sed "s/},[[:space:]]*{/}\n{/g" \
                        | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$provider\"" \
                        | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" \
                        | head -n1)
                  [ -n "$EID" ] && break || sleep 1
                done
                if [ -z "${EID:-}" ]; then
                  echo "❌ Could not discover execution id for provider '$provider'. Dumping executions for debugging:"
                  echo "$EXECS"
                  exit 1
                fi
                if ! kc update "authentication/executions/$EID" -r "$realm" -s 'requirement=REQUIRED'; then
                  printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$EID" >/tmp/r.json
                  kc update "authentication/flows/$flow/executions" -r "$realm" -f /tmp/r.json
                fi
              }
              
              ensure_redirect_flow() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                local desc="$4"
              
                if ! kc get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  kc create authentication/flows -r "$realm" \
                    -s "alias=${flow}" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc"
                  kc create "authentication/flows/${flow}/executions/execution" -r "$realm" \
                    -s provider=identity-provider-redirector
                fi
              
                EXECS=$(kc get "authentication/flows/${flow}/executions" -r "$realm")
                REDIR_ID=$(echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                          | grep -E '"providerId" *: *"identity-provider-redirector"' \
                          | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" | head -n1)
                [ -z "$REDIR_ID" ] && { echo "❌ cannot find redirector execution for ${flow}"; exit 1; }
              
                if ! kc update "authentication/executions/${REDIR_ID}" -r "$realm" -s requirement=REQUIRED >/dev/null 2>&1; then
                  printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$REDIR_ID" >/tmp/r2.json
                  kc update "authentication/flows/${flow}/executions" -r "$realm" -f /tmp/r2.json
                fi
              
                CFG_ID=$(kc get "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                        | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1 || true)
                if [ -n "${CFG_ID:-}" ]; then
                  kc update "authentication/executions/${REDIR_ID}/config/${CFG_ID}" -r "$realm" \
                    -s "alias=redirect-to-${provider}" -s "config.defaultProvider=${provider}"
                else
                  kc create "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                    -s "alias=redirect-to-${provider}" -s "config.defaultProvider=${provider}"
                fi
              }
              
              ensure_github_idp() {
                local realm="$1"
                kc get identity-provider/instances/github -r "$realm" >/dev/null 2>&1 && \
                  kc delete identity-provider/instances/github -r "$realm" || true
              
                kc create identity-provider/instances -r "$realm" \
                  -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                  -s "config.clientId=$CLIENT_ID" \
                  -s "config.clientSecret=$CLIENT_SECRET" \
                  -s 'config.defaultScope=read:user user:email read:org' \
                  -s 'config.guiOrder=1' -s 'config.hideOnLoginPage=false' \
                  -s 'config.syncMode=FORCE' || true
              }
              
              ensure_google_idp() {
                local realm="$1"
                if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
                  return 1
                fi
              
                kc get identity-provider/instances/google -r "$realm" >/dev/null 2>&1 && \
                  kc delete identity-provider/instances/google -r "$realm" || true
              
                kc create identity-provider/instances -r "$realm" \
                  -s enabled=true -s storeToken=false -s alias=google -s providerId=google \
                  -s "config.clientId=$GOOGLE_CLIENT_ID" \
                  -s "config.clientSecret=$GOOGLE_CLIENT_SECRET" \
                  -s 'config.defaultScope=openid email profile' \
                  -s 'config.guiOrder=2' -s 'config.hideOnLoginPage=false' \
                  -s 'config.syncMode=FORCE' || true
              }
              
              echo "Configuring admin realm: ${ADMIN_REALM}"
              ensure_github_idp "$ADMIN_REALM"
              ensure_flow "$ADMIN_REALM" "$FLOW_GH" "Post-broker: GitHub team admin"
              add_exec_required "$ADMIN_REALM" "$FLOW_GH" "$PROVIDER_GH"
              kc update identity-provider/instances/github -r "$ADMIN_REALM" \
                -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
              
              ensure_redirect_flow "$ADMIN_REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
              kc update "realms/${ADMIN_REALM}" -s "browserFlow=${FLOW_BROWSER_GH}"
              
              echo "Configuring app realm: ${REALM}"
              ensure_github_idp "$REALM"
              ensure_flow "$REALM" "$FLOW_GH" "Post-broker: GitHub teams + Google groups"
              add_exec_required "$REALM" "$FLOW_GH" "$PROVIDER_GH"
              add_exec_required "$REALM" "$FLOW_GH" "$PROVIDER_GGL"
              kc update identity-provider/instances/github -r "$REALM" \
                -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
              
              GOOGLE_READY="false"
              if ensure_google_idp "$REALM"; then
                GOOGLE_READY="true"
                ensure_flow "$REALM" "$FLOW_GGL" "Post-broker: Google groups only"
                add_exec_required "$REALM" "$FLOW_GGL" "$PROVIDER_GGL"
                kc update identity-provider/instances/google -r "$REALM" \
                  -s "postBrokerLoginFlowAlias=$FLOW_GGL" || true
              else
                echo "⚠️  Google IdP not configured (missing client id/secret)."
              fi
              
              ensure_redirect_flow "$REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
              if [ "$GOOGLE_READY" = "true" ]; then
                ensure_redirect_flow "$REALM" "$FLOW_BROWSER_GGL" "google" "Browser flow that redirects to Google"
              fi
              
              if [ "$REALM" != "$ADMIN_REALM" ]; then
                kc update "realms/${REALM}" -s "browserFlow=browser"
              fi
              
              # Realm hygiene (unchanged)
              kc update "realms/$REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false || true
              
              # 1) Disable Direct Access Grants (password grant)
              DG="disabled-direct-grant"
              if ! kc get authentication/flows -r "$REALM" | grep -q "\"alias\" *: *\"$DG\""; then
                kc create authentication/flows -r "$REALM" \
                  -s "alias=$DG" -s providerId=basic-flow -s topLevel=true -s builtIn=false
              fi
              kc update "realms/$REALM" -s "directGrantFlow=$DG" || true
              
              # 2) Disable the bootstrap admin user in master (safer than delete; not recreated; no password logins)
              ADMIN_ID=$(kc get users -r "$ADMIN_REALM" -q username="$KEYCLOAK_ADMIN" \
                | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1)
              if [ -n "$ADMIN_ID" ]; then
                kc update "users/$ADMIN_ID" -r "$ADMIN_REALM" -s enabled=false -s 'credentials=[]' || true
              fi
              
              apply_clients_from_dir() {
                local realm="$1"
                if [ ! -d "$CLIENT_CONFIG_DIR" ]; then
                  return 0
                fi
                for f in "$CLIENT_CONFIG_DIR"/*.json; do
                  [ -f "$f" ] || continue
                  client_id=$(sed -n "s/.*\"clientId\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$f" | head -n1)
                  if [ -z "${client_id:-}" ]; then
                    echo "info: missing clientId in $f"
                    continue
                  fi
                  CID=$(kc get clients -r "$realm" -q "clientId=$client_id" --fields id --format csv | tail -n1)
                  if [ -n "${CID:-}" ]; then
                    kc update "clients/$CID" -r "$realm" -f "$f"
                  else
                    kc create clients -r "$realm" -f "$f"
                    CID=$(kc get clients -r "$realm" -q "clientId=$client_id" --fields id --format csv | tail -n1)
                  fi
                  if [ -n "${CID:-}" ]; then
                    secret=""
                    secret_file="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${client_id}"
                    if [ -s "$secret_file" ]; then
                      secret="$(tr -d '\r\n' < "$secret_file")"
                    elif [ -s "$CLIENT_SECRET_MAP_FILE" ]; then
                      secret="$(awk -F= -v cid="$client_id" '$1==cid { $1=""; sub(/^=/,""); print; exit }' "$CLIENT_SECRET_MAP_FILE")"
                    fi
                    if [ -n "${secret:-}" ]; then
                      kc update "clients/$CID" -r "$realm" -s "secret=$secret"
                    fi
                  fi
                done
              }
              
              apply_clients_from_dir "$REALM"

              # Sample roles for mapping (edit/remove as needed)
              for role in tier_free tier_pro feature_x openwebui_access; do
                kc get "roles/$role" -r "$REALM" >/dev/null 2>&1 || \
                  kc create roles -r "$REALM" -s "name=$role" || true
              done
              
              ensure_roles_from_map() {
                local realm="$1"
                local json="$2"
                if [ -z "${json:-}" ]; then
                  return 0
                fi
                local specs
                specs=$(printf '%s' "$json" | tr -d '\n' | grep -o '"\\(realm\\|client\\):[^"]*"' | tr -d '"' || true)
                if [ -z "${specs:-}" ]; then
                  return 0
                fi
                while read -r spec; do
                  [ -z "${spec:-}" ] && continue
                  case "$spec" in
                    realm:*)
                      role="${spec#realm:}"
                      [ -z "${role:-}" ] && continue
                      kc get "roles/$role" -r "$realm" >/dev/null 2>&1 || \
                        kc create roles -r "$realm" -s "name=$role" || true
                      ;;
                    client:*)
                      rest="${spec#client:}"
                      cid="${rest%%:*}"
                      role="${rest#*:}"
                      if [ -z "${cid:-}" ] || [ -z "${role:-}" ] || [ "$cid" = "$role" ]; then
                        continue
                      fi
                      CLIENT_UUID=$(kc get clients -r "$realm" -q "clientId=$cid" --fields id --format csv | tail -n1)
                      if [ -n "${CLIENT_UUID:-}" ]; then
                        kc get "clients/$CLIENT_UUID/roles/$role" -r "$realm" >/dev/null 2>&1 || \
                          kc create "clients/$CLIENT_UUID/roles" -r "$realm" -s "name=$role" || true
                      else
                        echo "info: client not found for role spec: $spec"
                      fi
                      ;;
                  esac
                done <<<"$specs"
              }
              
              ensure_roles_from_map "$REALM" "$GITHUB_ROLE_MAP_JSON"
              ensure_roles_from_map "$REALM" "$GOOGLE_GROUP_ROLE_MAP_JSON"

              set_client_flow_override() {
                local realm="$1"
                local clientId="$2"
                local flow="$3"
                CID=$(kc get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv | tail -n1)
                if [ -n "${CID:-}" ]; then
                  kc update "clients/$CID" -r "$realm" \
                    -s "authenticationFlowBindingOverrides={\"browser\":\"$flow\"}"
                else
                  echo "ℹ️  client not found: $clientId (skipping override)"
                fi
              }
              
              # Enforce GitHub-only for internal apps
              set_client_flow_override "$REALM" "openwebui" "$FLOW_BROWSER_GH"
              
              # Enforce Google-only for external apps (example clientId)
              if [ "$GOOGLE_READY" = "true" ]; then
                set_client_flow_override "$REALM" "public-app" "$FLOW_BROWSER_GGL"
              fi

              echo "✔ Configurator finished. Holding for logs."
              hold
          volumeMounts:
            - name: keycloak-client-config
              mountPath: /opt/keycloak/data/clients
              readOnly: true

        # --- Keycloak runtime ---
        - name: keycloak
          image: ghcr.io/dotcomrow/keycloak-image:24.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KEYCLOAK_REALM
              value: "apps"
            # DB
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "currentSchema=keycloak"
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "10"

            # Logging
            - name: KC_LOG
              value: "console,file"
            - name: KC_LOG_FILE
              value: "/opt/keycloak/data/log/keycloak.log"
            - name: KC_LOG_LEVEL
              value: "INFO,com.example.kc.github:DEBUG,org.keycloak.authentication:DEBUG,org.keycloak.events:INFO"
            - name: KC_PROXY
              value: "edge" 

            # Hostname & HTTP
            - name: KC_HOSTNAME_URL
              value: "https://keycloak.teleport.app.suncoast.systems"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "https://keycloak.teleport.app.suncoast.systems"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_TRANSACTION_XA_ENABLED
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_HTTP_COOKIE_SAME_SITE
              value: "LAX"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /opt/keycloak/data/log

              # Admin + DB creds from Vault agent
              source /vault/secrets/keycloak-admin
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)"
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)"

              # Export org/team for the custom provider
              export GITHUB_ORG="$(cat /vault/secrets/github-org)"
              export GITHUB_TEAM="$(cat /vault/secrets/github-admin-team)"
              if [ -s /vault/secrets/github-role-map ]; then
                export GITHUB_ROLE_MAP="$(cat /vault/secrets/github-role-map)"
              else
                export GITHUB_ROLE_MAP='{"myorg/openwebui":["realm:openwebui_access"]}'
              fi

              # Google Groups auth (Cloud Identity)
              export GOOGLE_ADMIN_EMAIL="$(cat /vault/secrets/google-admin-email)"
              export GOOGLE_SA_JSON_PATH="/vault/secrets/google-sa-json"
              export GOOGLE_GROUP_ROLE_MAP="$(cat /vault/secrets/google-group-role-map 2>/dev/null || true)"
              export GOOGLE_ROLE_PREFIX="ggl:"
              export GOOGLE_AUTO_ROLES="true"
              export GOOGLE_STRICT_REVOKE="true"
              export GOOGLE_GROUPS_TTL_SECONDS="600"
              if [ -z "${GOOGLE_GROUP_ROLE_MAP:-}" ]; then
                export GOOGLE_GROUP_ROLE_MAP='{"tier-pro@yourdomain.com":["realm:tier_pro"],"feature-x@yourdomain.com":["realm:feature_x"]}'
              fi

              echo "▶️  Starting Keycloak (image already built with provider)…"
              IMPORT_ARGS=""
              if ls /opt/keycloak/data/import/*.json >/dev/null 2>&1; then
                IMPORT_ARGS="--import-realm"
              fi
              exec /opt/keycloak/bin/kc.sh start --optimized $IMPORT_ARGS
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: keycloak-realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: keycloak-client-config
              mountPath: /opt/keycloak/data/clients
              readOnly: true
