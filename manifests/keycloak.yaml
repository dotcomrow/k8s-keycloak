apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → keycloak..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: keycloak/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              #!/bin/sh
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE_GROUP=keycloak
              ROLE_OWNER=keycloak_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                # already KVv2?
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"
                  break
                fi

                # path exists but not KVv2 → bail
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."
                  exit 1
                fi

                # try to enable KVv2; if it works, we're done; otherwise, retry after a short pause
                vault secrets enable -path=secret -version=2 kv && break

                sleep 2
              done

              echo "🔐 Seeding Keycloak admin creds at secret/keycloak/admin (if missing)..."
              if ! vault kv get -format=json secret/keycloak/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/keycloak/admin username=admin password="$PASS"
                echo "✅ Seeded admin secret at secret/keycloak/admin"
              else
                echo "✅ Admin secret already present"
              fi

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/${VAULTADMIN_USER} to exist in Vault..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
                if [ -n "${OUT}" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  if [ -n "${VAULTADMIN_PASS}" ] && [ "${VAULTADMIN_PASS}" != "null" ]; then
                    echo "✅ Found secret/${VAULTADMIN_USER}"
                    break
                  fi
                fi
                echo "⏳ secret/${VAULTADMIN_USER} not ready yet; retrying in 5s..."
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB' owned by $VAULTADMIN_USER..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                echo "🔁 Retry create DB in 3s..."; sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${ROLE_OWNER};
              ALTER SCHEMA keycloak OWNER TO ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} SET search_path = keycloak;
              GRANT CONNECT ON DATABASE ${DB} TO ${ROLE_OWNER};
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" -v ON_ERROR_STOP=0 <<EOSQL
              ALTER TABLE IF EXISTS keycloak.databasechangeloglock OWNER TO ${ROLE_OWNER};
              ALTER TABLE IF EXISTS keycloak.databasechangelog    OWNER TO ${ROLE_OWNER};
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              SET ROLE ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA keycloak TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES   TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT USAGE, SELECT                ON SEQUENCES TO ${ROLE_GROUP};
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES    TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON SEQUENCES TO ${VAULTADMIN_USER};
              RESET ROLE;
              EOSQL

              echo "✅ Schema & privileges prepared"

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
              fi

              vault write yugabyte-db/static-roles/keycloak-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE ${ROLE_OWNER} WITH PASSWORD '{{password}}';" \
                rotation_period="720h"

              vault policy write "keycloak" - <<'EOF'
              path "yugabyte-db/static-creds/keycloak-app"        { capabilities = ["read"] }
              path "secret/data/keycloak/admin"                   { capabilities = ["read"] }
              path "secret/data/vaultadmin"                       { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-id"         { capabilities = ["read"] }
              path "secret/data/keycloak-oauth-client-secret"     { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-org" { capabilities = ["read"] }
              path "secret/data/k8s-teleport-teleport-github-admin-team" { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/keycloak \
                bound_service_account_names="keycloak" \
                bound_service_account_namespaces="keycloak" \
                policies="keycloak" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/keycloak-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as \$DB_USER=$DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"

              echo "🎉 Keycloak DB prepared; Vault static role + policy + K8s binding ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-keycloak
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # GitHub OAuth + org/team for provider
        vault.hashicorp.com/agent-inject-secret-github-client-id: "secret/data/keycloak-oauth-client-id"
        vault.hashicorp.com/agent-inject-template-github-client-id: |
          {{- with secret "secret/data/keycloak-oauth-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-client-secret: "secret/data/keycloak-oauth-client-secret"
        vault.hashicorp.com/agent-inject-template-github-client-secret: |
          {{- with secret "secret/data/keycloak-oauth-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-org: "secret/data/k8s-teleport-teleport-github-org"
        vault.hashicorp.com/agent-inject-template-github-org: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-org" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-admin-team: "secret/data/k8s-teleport-teleport-github-admin-team"
        vault.hashicorp.com/agent-inject-template-github-admin-team: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-admin-team" -}}{{ .Data.data.value }}{{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        vault.hashicorp.com/agent-inject-secret-vaultadmin: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-vaultadmin: |
          {{- with secret "secret/data/vaultadmin" -}}
          {{- if .Data.data.password -}}{{ .Data.data.password }}{{ else }}{{ .Data.data.value }}{{ end -}}
          {{- end -}}
    spec:
      serviceAccountName: keycloak

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      volumes:
        - name: keycloak-data
          emptyDir: {}

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/keycloak-yugabyte-config to complete (will retry until ready)..."
              while true; do
                if ! kubectl -n vault get job keycloak-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi
                SUCC="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi
                if kubectl -n vault wait --for=condition=complete job/keycloak-yugabyte-config --timeout=10s >/dev/null 2>&1; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi
                FAIL="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                ACTV="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                sleep 5
              done

        - name: kc-db-preflight
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: PGHOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: PGPORT
              value: "5433"
            - name: PGDATABASE
              value: "keycloak"
            - name: PGSCHEMA
              value: "keycloak"
            - name: PGSCHEMA_OWNER
              value: "keycloak_app"
            - name: PGADMIN_USER
              value: "vaultadmin"
            # Always drop schema before Keycloak boots
            - name: KC_FORCE_DROP_SCHEMA
              value: "true"
            - name: KC_FORCE_RESET_SCHEMA_ON_CONFLICT
              value: "true"
            - name: KC_CLEAR_CHANGELOG_CHECKSUMS
              value: "true"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache postgresql15-client jq bind-tools busybox-extras

              # Wait for Vault agent to write the secret file
              for i in $(seq 1 60); do
                if [ -s /vault/secrets/vaultadmin ]; then break; fi
                echo "⏳ waiting for /vault/secrets/vaultadmin..."
                sleep 1
              done
              if [ ! -s /vault/secrets/vaultadmin ]; then
                echo "❌ /vault/secrets/vaultadmin not found or empty"; exit 1
              fi

              export PGUSER="${PGADMIN_USER}"
              export PGPASSWORD="$(tr -d '\r\n' < /vault/secrets/vaultadmin)"

              echo "🔎 DNS for ${PGHOST}"; getent hosts "${PGHOST}" || true
              echo "🔎 TCP ${PGHOST}:${PGPORT}"; nc -vz -w 3 "${PGHOST}" "${PGPORT}" || true

              echo "🔎 Preflight (admin): connecting to ${PGHOST}:${PGPORT}/${PGDATABASE} as ${PGUSER}…"
              until psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc "select 1" >/dev/null 2>&1; do
                echo "  ⏳ waiting for DB…"
                sleep 2
              done
              echo "✅ DB reachable"

              # Ensure schema exists so DROP works deterministically
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA};"

              # Log what exists
              TABLES=$(
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -Atc \
                  "select table_schema||'.'||table_name
                    from information_schema.tables
                    where table_schema='${PGSCHEMA}'
                    order by 1"
              )
              COUNT="$(printf '%s\n' "$TABLES" | sed '/^$/d' | wc -l | tr -d ' ')"
              echo "ℹ️  ${PGSCHEMA} currently has ${COUNT:-0} table(s)."
              if [ -n "${TABLES:-}" ]; then echo "$TABLES" | sed 's/^/   • /'; fi

              echo "🧨 Dropping schema ${PGSCHEMA} (CASCADE) for a clean migration…"
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<EOSQL
              DROP SCHEMA IF EXISTS ${PGSCHEMA} CASCADE;
              CREATE SCHEMA ${PGSCHEMA} AUTHORIZATION ${PGSCHEMA_OWNER};
              ALTER ROLE ${PGSCHEMA_OWNER} SET search_path = ${PGSCHEMA};
              GRANT USAGE, CREATE ON SCHEMA ${PGSCHEMA} TO ${PGSCHEMA_OWNER};
              EOSQL

              # NOTE: unquoted heredoc so $PGSCHEMA expands in the shell.
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=0 <<EOSQL || true
              DO \$blk\$
              DECLARE
                sch text := quote_ident('$PGSCHEMA');  -- safe identifier quoting
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangelog'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangelog RESTART IDENTITY CASCADE';
                END IF;

                IF EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = '$PGSCHEMA' AND table_name = 'databasechangeloglock'
                ) THEN
                  EXECUTE 'TRUNCATE TABLE ' || sch || '.databasechangeloglock RESTART IDENTITY CASCADE';
                END IF;
              END
              \$blk\$ LANGUAGE plpgsql;
              EOSQL

              echo "✅ Preflight complete."

      containers:
        # --- One-time configuration sidecar (GitHub IdP + flow + attach provider) ---
        - name: keycloak-configurator
          image: ghcr.io/dotcomrow/keycloak-image:24.0.5
          imagePullPolicy: Always
          command: ["/bin/bash","-lc"]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          args:
            - |
              set -euo pipefail

              REALM="master"
              SERVER="http://127.0.0.1:8080"
              FLOW="GitHub-PostLogin"
              PROVIDER_ID="github-team-admin"

              hold(){ echo "Configurator will stay running for logs…"; tail -f /dev/null; }
              on_err(){ code=$?; echo "Configurator error (exit $code)"; hold; }
              trap on_err ERR

              source /vault/secrets/keycloak-admin
              CLIENT_ID="$(cat /vault/secrets/github-client-id)"
              CLIENT_SECRET="$(cat /vault/secrets/github-client-secret)"
              GITHUB_ORG="$(cat /vault/secrets/github-org)"
              GITHUB_TEAM="$(cat /vault/secrets/github-admin-team)"

              echo "Waiting for Keycloak admin API..."
              for i in {1..120}; do
                if /opt/keycloak/bin/kcadm.sh config credentials --server "$SERVER" --realm "$REALM" --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              echo "✅ Admin API ready."

              # GitHub IdP (OIDC)
              /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1 && \
                /opt/keycloak/bin/kcadm.sh delete identity-provider/instances/github -r "$REALM" || true

              /opt/keycloak/bin/kcadm.sh create identity-provider/instances -r "$REALM" \
                -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                -s "config.clientId=$CLIENT_ID" \
                -s "config.clientSecret=$CLIENT_SECRET" \
                -s 'config.defaultScope=read:user user:email read:org' \
                -s 'config.guiOrder=1' -s 'config.hideOnLoginPage=false' || true

              # Flow create/reset
              if ! /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$FLOW\""; then
                /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
                  -s "alias=$FLOW" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                  -s 'description=Grant realm-admin to members of a GitHub team'
              fi

              # Purge executions
              EXECS=$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
              IDS=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              if [ -n "$IDS" ]; then
                while read -r EID; do
                  [ -n "$EID" ] && /opt/keycloak/bin/kcadm.sh delete "authentication/executions/$EID" -r "$REALM" || true
                done <<<"$IDS"
              fi

              # Add our provider and set REQUIRED (with fallback path)
              /opt/keycloak/bin/kcadm.sh create "authentication/flows/$FLOW/executions/execution" -r "$REALM" -s provider="$PROVIDER_ID"

              EID=""
              for i in {1..40}; do
                EXECS=$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
                EID=$(echo "$EXECS" \
                      | tr -d '\n' \
                      | sed 's/},[[:space:]]*{/}\n{/g' \
                      | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$PROVIDER_ID\"" \
                      | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]\+\)".*/\1/p' \
                      | head -n1)
                [ -n "$EID" ] && break || sleep 1
              done

              if [ -z "${EID:-}" ]; then
                echo "❌ Could not discover execution id for provider '$PROVIDER_ID'. Dumping executions for debugging:"
                echo "$EXECS"
                exit 1
              fi

              ok=""
              for i in {1..10}; do
                if /opt/keycloak/bin/kcadm.sh update "authentication/executions/$EID" -r "$REALM" -s 'requirement=REQUIRED'; then
                  ok="yes"; break
                else
                  sleep 1
                fi
              done

              if [ -z "$ok" ]; then
                echo "Falling back to flow-level update…"
                printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$EID" >/tmp/r.json
                /opt/keycloak/bin/kcadm.sh update "authentication/flows/$FLOW/executions" -r "$REALM" -f /tmp/r.json
              fi

              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" \
                -s "postBrokerLoginFlowAlias=$FLOW" || true

              # --- GitHub-only Browser flow (forces redirect; hides local username/password form) ---
              FLOW_BROWSER="browser-github-only"

              if ! /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$FLOW_BROWSER\""; then
                /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
                  -s "alias=${FLOW_BROWSER}" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                  -s 'description=Browser flow that redirects to GitHub'
                /opt/keycloak/bin/kcadm.sh create "authentication/flows/${FLOW_BROWSER}/executions/execution" -r "$REALM" \
                  -s provider=identity-provider-redirector
              fi

              EXECS=$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_BROWSER}/executions" -r "$REALM")
              REDIR_ID=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' \
                        | grep -E '"providerId" *: *"identity-provider-redirector"' \
                        | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]\+\)".*/\1/p' | head -n1)
              [ -z "$REDIR_ID" ] && { echo "❌ cannot find redirector execution"; exit 1; }

              if ! /opt/keycloak/bin/kcadm.sh update "authentication/executions/${REDIR_ID}" -r "$REALM" -s requirement=REQUIRED >/dev/null 2>&1; then
                printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$REDIR_ID" >/tmp/r2.json
                /opt/keycloak/bin/kcadm.sh update "authentication/flows/${FLOW_BROWSER}/executions" -r "$REALM" -f /tmp/r2.json
              fi

              CFG_ID=$(/opt/keycloak/bin/kcadm.sh get "authentication/executions/${REDIR_ID}/config" -r "$REALM" \
                      | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)
              if [ -n "${CFG_ID:-}" ]; then
                /opt/keycloak/bin/kcadm.sh update "authentication/executions/${REDIR_ID}/config/${CFG_ID}" -r "$REALM" \
                  -s alias=redirect-to-github -s 'config.defaultProvider=github'
              else
                /opt/keycloak/bin/kcadm.sh create "authentication/executions/${REDIR_ID}/config" -r "$REALM" \
                  -s alias=redirect-to-github -s 'config.defaultProvider=github'
              fi

              /opt/keycloak/bin/kcadm.sh update "realms/${REALM}" -s "browserFlow=${FLOW_BROWSER}"

              # Realm hygiene (unchanged)
              /opt/keycloak/bin/kcadm.sh update "realms/$REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false || true

              echo "✔ Configurator finished. Holding for logs."
              hold

        # --- Keycloak runtime ---
        - name: keycloak
          image: ghcr.io/dotcomrow/keycloak-image:24.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # DB
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "currentSchema=keycloak"
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "10"

            # Logging
            - name: KC_LOG
              value: "console,file"
            - name: KC_LOG_FILE
              value: "/opt/keycloak/data/log/keycloak.log"
            - name: KC_LOG_LEVEL
              value: "INFO,com.example.kc.github:DEBUG,org.keycloak.authentication:DEBUG,org.keycloak.events:INFO"
            - name: KC_PROXY
              value: "edge" 

            # Hostname & HTTP
            - name: KC_HOSTNAME_URL
              value: "https://keycloak.app.suncoast.systems"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "https://keycloak.app.suncoast.systems"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_TRANSACTION_XA_ENABLED
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_HTTP_COOKIE_SAME_SITE
              value: "LAX"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /opt/keycloak/data/log

              # Admin + DB creds from Vault agent
              source /vault/secrets/keycloak-admin
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)"
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)"

              # Export org/team for the custom provider
              export GITHUB_ORG="$(cat /vault/secrets/github-org)"
              export GITHUB_TEAM="$(cat /vault/secrets/github-admin-team)"

              echo "▶️  Starting Keycloak (image already built with provider)…"
              exec /opt/keycloak/bin/kc.sh start --optimized
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
