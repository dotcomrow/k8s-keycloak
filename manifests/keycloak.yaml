apiVersion: v1
kind: ConfigMap
metadata:
  name: kc-script-github-admin
  namespace: keycloak
data:
  github-team-admin.js: |
    var SimpleHttp = Java.type("org.keycloak.broker.provider.util.SimpleHttp");
    var WANT_ORG  = "<path:secret/data/k8s-teleport-teleport-github-org#value>";
    var WANT_TEAM = "keycloak_admins";
    var IDP_ALIAS = "github";
    function authenticate(context) {
      var session = context.getSession();
      var realm   = context.getRealm();
      var user    = context.getUser();
      var fed = session.users().getFederatedIdentity(realm, user, IDP_ALIAS);
      if (fed == null || fed.getToken() == null) { context.success(); return; }
      var token = fed.getToken();
      var resp = SimpleHttp.doGet("https://api.github.com/user/teams", session)
          .header("Authorization", "Bearer " + token)
          .asJson();
      var it = resp.iterator();
      var isMember = false;
      while (it.hasNext()) {
        var t = it.next();
        var slug = t.get("slug").asText();
        var org  = t.get("organization").get("login").asText();
        if (slug.equals(WANT_TEAM) && org.equalsIgnoreCase(WANT_ORG)) { isMember = true; break; }
      }
      var client = session.clients().getClientByClientId(realm, "realm-management");
      var adminRole = client.getRole("realm-admin");
      if (isMember) user.grantRole(adminRole); else user.deleteRoleMapping(adminRole);
      context.success();
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}
        config.linkerd.io/skip-outbound-ports: "8200"
    spec:
      serviceAccountName: keycloak
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-github
        - name: kc-scripts
          configMap:
            name: kc-script-github-admin
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/keycloak-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job keycloak-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
                SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then echo "✅ DB bootstrap job is complete."; break; fi
                if kubectl -n vault wait --for=condition=complete job/keycloak-yugabyte-config --timeout=10s >/dev/null 2>&1; then
                  echo "✅ DB bootstrap job is complete."; break
                fi
                FAIL="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.failed}' 2>/dev/null || true)"; FAIL="${FAIL:-0}"
                ACTV="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.active}' 2>/dev/null || true)"; ACTV="${ACTV:-0}"
                echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                sleep 5
              done
        - name: db-guard-empty-schema
          image: alpine:3.20
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              apk add --no-cache postgresql15-client netcat-openbsd >/dev/null
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              PGDB="keycloak"
              DB_USER="$(cat /vault/secrets/db-username)"
              DB_PASS="$(cat /vault/secrets/db-password)"
              export PGPASSWORD="$DB_PASS"
              until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 2; done
              CNT="$(psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$PGDB" -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='keycloak'")"
              echo "Tables in keycloak schema before start: $CNT"
              [ "$CNT" = "0" ] || { echo "❌ Refusing to start: schema not empty"; exit 1; }
      containers:
        - name: keycloak-configurator
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash","-lc"]
          volumeMounts:
            - name: kc-scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true
          args:
            - |
              set -euo pipefail
              REALM="master"
              SERVER="http://127.0.0.1:8080"
              FLOW_ALIAS="GitHub-PostLogin"
              FIRST_LOGIN_FLOW_ALIAS="github-first-login-nolink"
              source /vault/secrets/keycloak-admin
              CLIENT_ID="<path:secret/data/keycloak-oauth-client-id#value>"
              CLIENT_SECRET="<path:secret/data/keycloak-oauth-client-secret#value>"
              json_objects_onelines() { tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g'; }
              wait_admin() {
                until /opt/keycloak/bin/kcadm.sh config credentials --server "$SERVER" --realm "$REALM" --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; do sleep 3; done
              }
              wait_idp() {
                until /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1; do sleep 1; done
              }
              flow_present() {
                /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${FLOW_ALIAS//\//\\/}\""
              }
              ensure_flow_exists() {
                if ! flow_present; then
                  /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" -s "alias=${FLOW_ALIAS}" -s 'description=Grant realm-admin to members of a GitHub team' -s providerId=basic-flow -s topLevel=true -s builtIn=false >/dev/null 2>&1 || true
                fi
                for i in $(seq 1 60); do flow_present && break || sleep 1; done
              }
              purge_flow_executions() {
                for _ in $(seq 1 20); do
                  EXECS="$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null || true)"
                  IDS="$(printf '%s' "$EXECS" | json_objects_onelines | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                  [ -z "${IDS:-}" ] && break
                  while read -r EID; do [ -n "$EID" ] && /opt/keycloak/bin/kcadm.sh delete "authentication/executions/${EID}" -r "$REALM" >/dev/null 2>&1 || true; done <<< "$IDS"
                  sleep 1
                done
              }
              wait_script_feature() {
                for i in $(seq 1 60); do
                  /opt/keycloak/bin/kcadm.sh get authentication/authenticator-providers -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q '"id"[[:space:]]*:[[:space:]]*"script"' && exit 0 || sleep 2
                done
                echo "FATAL: 'script' authenticator not registered."; exit 1
              }
              wait_script_available_for_flow() {
                for i in $(seq 1 60); do
                  /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions/available" -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q '"providerId"[[:space:]]*:[[:space:]]*"script"' && exit 0 || sleep 1
                done
                echo "FATAL: script provider not listed for flow '${FLOW_ALIAS}'"; exit 1
              }
              create_mapper_file() {
                local file="$1"; for _ in $(seq 1 12); do /opt/keycloak/bin/kcadm.sh create identity-provider/instances/github/mappers -r "$REALM" -f "$file" && return 0 || sleep 2; done; echo "FATAL: failed to create mapper $file"; exit 1
              }
              ensure_script_execution() {
                /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q '"providerId"[[:space:]]*:[[:space:]]*"script"' || \
                  /opt/keycloak/bin/kcadm.sh create "authentication/flows/${FLOW_ALIAS}/executions/execution" -r "$REALM" -s provider=script >/dev/null 2>&1 || true
                EXEC_ID=""
                for i in $(seq 1 30); do
                  EXEC_ID="$(
                    /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null \
                    | json_objects_onelines | grep -E '"providerId"[[:space:]]*:[[:space:]]*"script"' \
                    | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1
                  )"; [ -n "${EXEC_ID:-}" ] && break || sleep 1
                done
                [ -n "${EXEC_ID:-}" ] || { echo "FATAL: could not find script execution id"; exit 1; }
                /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}" -r "$REALM" -s 'requirement=REQUIRED'
                SCRIPT_ESCAPED="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' /opt/keycloak/scripts/github-team-admin.js)"
                cat >/tmp/script-cfg.json <<EOF
              { "alias": "GitHub Team Admin", "config": { "script": "${SCRIPT_ESCAPED}" } }
              EOF
                /opt/keycloak/bin/kcadm.sh create "authentication/executions/${EXEC_ID}/config" -r "$REALM" -f /tmp/script-cfg.json >/dev/null 2>&1 || {
                  CFG_ID=$(/opt/keycloak/bin/kcadm.sh get "authentication/executions/${EXEC_ID}/config" -r "$REALM" | json_objects_onelines | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
                  [ -n "${CFG_ID:-}" ] && /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}/config/${CFG_ID}" -r "$REALM" -f /tmp/script-cfg.json
                }
              }
              ensure_named_flow_exists() {
                local alias="$1" desc="$2"
                /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${alias//\//\\/}\"" || \
                  /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" -s "alias=${alias}" -s "description=${desc}" -s providerId=basic-flow -s topLevel=true -s builtIn=false >/dev/null 2>&1 || true
                for i in $(seq 1 60); do /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"${alias//\//\\/}\"" && break || sleep 1; done
              }
              ensure_exec_req() { 
                local alias="$1" provider="$2" req="$3"
                /opt/keycloak/bin/kcadm.sh get "authentication/flows/${alias}/executions" -r "$REALM" 2>/dev/null | json_objects_onelines | grep -q "\"providerId\"[[:space:]]*:[[:space:]]*\"${provider}\"" || \
                  /opt/keycloak/bin/kcadm.sh create "authentication/flows/${alias}/executions/execution" -r "$REALM" -s "provider=${provider}" >/dev/null 2>&1 || true
                EID=""
                for i in $(seq 1 30); do
                  EID="$(
                    /opt/keycloak/bin/kcadm.sh get "authentication/flows/${alias}/executions" -r "$REALM" \
                      | json_objects_onelines \
                      | awk -v p="\"providerId\"[[:space:]]*:[[:space:]]*\"${provider}\"" '$0 ~ p { if (match($0, /"id"[[:space:]]*:[[:space:]]*"([^"]*)"/, m)) { print m[1]; exit } }'
                  )"; [ -n "${EID:-}" ] && break || sleep 1
                done
                [ -n "${EID:-}" ] || { echo "FATAL: couldn't find execution id for ${provider} in ${alias}"; exit 1; }
                /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EID}" -r "$REALM" -s "requirement=${req}"
              }
              ensure_first_broker_login_flow() {
                ensure_named_flow_exists "${FIRST_LOGIN_FLOW_ALIAS}" "Auto-create user, no link prompt"
                ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-create-user-if-unique" "REQUIRED"
                ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-confirm-link" "DISABLED"
                ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-review-profile" "OPTIONAL"
                ensure_exec_req "${FIRST_LOGIN_FLOW_ALIAS}" "idp-verify-email" "DISABLED"
              }
              wait_admin
              set -x
              /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1 && /opt/keycloak/bin/kcadm.sh delete identity-provider/instances/github -r "$REALM" || true
              /opt/keycloak/bin/kcadm.sh create identity-provider/instances -r "$REALM" \
                -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                -s "config.clientId=$CLIENT_ID" -s "config.clientSecret=$CLIENT_SECRET" \
                -s 'config.defaultScope=read:user user:email read:org' -s 'config.guiOrder=1' \
                -s 'config.hideOnLoginPage=false' -s 'config.syncMode=IMPORT' -s 'config.trustEmail=true'
              wait_idp
              cat >/tmp/mapper-email.json <<'JSON'
              { "name":"email", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"email", "user.attribute":"email", "syncMode":"INHERIT" } }
              JSON
              cat >/tmp/mapper-username.json <<'JSON'
              { "name":"username", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"login", "user.attribute":"username", "syncMode":"INHERIT" } }
              JSON
              cat >/tmp/mapper-name.json <<'JSON'
              { "name":"name", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"name", "user.attribute":"firstName", "syncMode":"INHERIT" } }
              JSON
              cat >/tmp/mapper-username-template.json <<'JSON'
              { "name":"username-template", "identityProviderAlias":"github",
                "identityProviderMapper":"username-template-importer",
                "config":{ "template":"${ALIAS}.${CLAIM.sub}", "syncMode":"INHERIT" } }
              JSON
              create_mapper_file /tmp/mapper-email.json
              create_mapper_file /tmp/mapper-username.json
              create_mapper_file /tmp/mapper-name.json
              create_mapper_file /tmp/mapper-username-template.json
              ensure_flow_exists
              purge_flow_executions
              wait_script_feature
              wait_script_available_for_flow
              ensure_script_execution
              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" -s "postBrokerLoginFlowAlias=${FLOW_ALIAS}"
              ensure_first_broker_login_flow
              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" -s "firstBrokerLoginFlowAlias=${FIRST_LOGIN_FLOW_ALIAS}"
              /opt/keycloak/bin/kcadm.sh update "realms/${REALM}" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false
              set +x
              echo "✔ Reset + reconfigure complete."
              sleep 365d
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }

        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: KC_DB
            value: "postgres"
          - name: KC_DB_URL
            value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
          - name: KC_DB_SCHEMA
            value: "keycloak"
          - name: KC_HOSTNAME_URL
            value: "https://keycloak.app.suncoast.systems"
          - name: KC_HOSTNAME_ADMIN_URL
            value: "https://keycloak.app.suncoast.systems"
          - name: KC_HEALTH_ENABLED
            value: "true"
          - name: KC_HOSTNAME_STRICT
            value: "false"
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_TRANSACTION_XA_ENABLED
            value: "false"
          - name: KC_HOSTNAME_STRICT_HTTPS
            value: "true"
          - name: KC_HTTP_RELATIVE_PATH
            value: "/"
          - name: KC_HTTP_COOKIE_SAME_SITE
            value: "LAX"
          - name: KC_FEATURES
            value: "scripts"
          - name: KC_PROFILE
            value: "preview"
          - name: KC_LOG_LEVEL
            value: DEBUG
          - name: QUARKUS_LOG_CATEGORY__LIQUIBASE__LEVEL
            value: DEBUG
          - name: QUARKUS_LOG_CATEGORY__org.keycloak.quarkus.runtime.storage.legacy.liquibase__LEVEL
            value: DEBUG
          command: ["/bin/sh","-lc"]
          args:
            - >
              source /vault/secrets/keycloak-admin &&
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)" &&
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)" &&
              /opt/keycloak/bin/kc.sh start --features=scripts
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: kc-scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true
