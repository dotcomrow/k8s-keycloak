apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → keycloak..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: keycloak/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: keycloak
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keycloak
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              #!/bin/sh
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE=keycloak
              VAULTADMIN_USER=vaultadmin

              # Alpine packages
              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              # --- Wait for Vault token ---
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              # --- Ensure KV v2 mount at secret/ (idempotent) ---
              echo "🧩 Ensuring KV v2 at mount 'secret/'..."
              SECRET_MOUNT_TYPE="$(vault secrets list -format=json | jq -r '.["secret/"].type // empty' || true)"
              SECRET_MOUNT_VER="$(vault secrets list -format=json | jq -r '.["secret/"].options.version // empty' || true)"
              if [ -z "$SECRET_MOUNT_TYPE" ]; then
                echo "ℹ️ Mount 'secret/' not found; enabling KV v2..."
                vault secrets enable -path=secret -version=2 kv
              else
                if [ "$SECRET_MOUNT_TYPE" != "kv" ] || [ "$SECRET_MOUNT_VER" != "2" ]; then
                  echo "❌ Mount 'secret/' exists but is not KV v2 (type=$SECRET_MOUNT_TYPE version=$SECRET_MOUNT_VER)."
                  echo "   Refusing to proceed to avoid breaking existing data. Please migrate to KV v2 or adjust your injector templates."
                  exit 1
                fi
              fi

              # --- Seed Keycloak admin creds at secret/keycloak/admin (KV v2) if absent ---
              echo "🔐 Seeding Keycloak admin creds (if missing) at secret/keycloak/admin..."
              if vault kv get -format=json secret/keycloak/admin >/dev/null 2>&1; then
                echo "✅ Admin secret already exists; leaving as-is."
              else
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/keycloak/admin username=admin password="$PASS"
                echo "✅ Seeded admin secret at secret/keycloak/admin"
              fi

              # --- Wait for DB availability ---
              until getent hosts "$PGHOST" >/dev/null 2>&1; do
                echo "🔄 Waiting for DNS for $PGHOST..."
                sleep 3
              done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do
                echo "⏳ Waiting for DB port $PGPORT..."
                sleep 3
              done
              echo "✅ YugabyteDB reachable on $PGHOST:$PGPORT"

              # --- Fetch vaultadmin password from Vault (KV v2 then v1 fallback) ---
              echo "🔐 Fetching $VAULTADMIN_USER password from Vault..."
              VAULTADMIN_PASS=""
              if OUT="$(vault kv get -format=json "secret/$VAULTADMIN_USER" 2>/dev/null)"; then
                VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.value // .data.data.password // empty')"
              fi
              [ -z "$VAULTADMIN_PASS" ] && VAULTADMIN_PASS="$(vault kv get -field=value "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
              [ -z "$VAULTADMIN_PASS" ] && VAULTADMIN_PASS="$(vault kv get -field=password "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
              if [ -z "$VAULTADMIN_PASS" ]; then
                echo "❌ Could not find $VAULTADMIN_USER password in Vault (secret/$VAULTADMIN_USER)."
                exit 1
              fi
              export PGPASSWORD="$VAULTADMIN_PASS"

              # --- Ensure database exists ---
              while :; do
                echo "📦 Checking if DB '$DB' exists..."
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                if [ "$DB_EXISTS" = "1" ]; then
                  echo "✅ DB '$DB' already exists"
                  break
                fi
                echo "📦 Creating DB '$DB' owned by $VAULTADMIN_USER..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ DB '$DB' created"
                  break
                fi
                echo "🔁 Yugabyte not ready for create; retrying..."
                sleep 3
              done

              # --- Ensure base ROLE exists ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') THEN
                  CREATE ROLE keycloak NOLOGIN;
                END IF;
              END
              \$\$;
              EOSQL

              # --- Schema + grants (idempotent) ---
              until psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<'EOSQL'
              CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION vaultadmin;
              ALTER SCHEMA keycloak OWNER TO vaultadmin;
              GRANT keycloak TO vaultadmin;

              -- App role privileges
              GRANT USAGE, CREATE ON SCHEMA keycloak TO keycloak;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA keycloak TO keycloak;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA keycloak TO keycloak;
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES TO keycloak;
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT USAGE, SELECT ON SEQUENCES TO keycloak;

              -- vaultadmin privileges
              GRANT USAGE, CREATE ON SCHEMA keycloak TO vaultadmin;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA keycloak TO vaultadmin;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA keycloak TO vaultadmin;
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES TO vaultadmin;
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON SEQUENCES TO vaultadmin;
              EOSQL
              do
                echo "⚠️ Schema/grants not yet applied; retrying in 5s..."
                sleep 5
              done
              echo "✅ Schema & grants ensured"

              # --- Wait for role propagation ---
              echo "⏳ Waiting for role 'keycloak' to propagate..."
              until psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_roles WHERE rolname='keycloak'" | grep -q 1; do
                sleep 1
              done
              echo "✅ Role visible everywhere"

              # --- Ensure Database engine + connection ---
              echo "🧩 Ensuring Vault Database engine + connection..."
              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
              fi
              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="$ROLE" \
                connection_url="postgresql://{{username}}:{{password}}@${PGHOST}:${PGPORT}/yugabyte?sslmode=disable" \
                username="$VAULTADMIN_USER" \
                password="$VAULTADMIN_PASS"

              # --- Dynamic role + policy (incl. KV v2 admin secret) + K8s binding ---
              vault write yugabyte-db/roles/$ROLE \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' INHERIT IN ROLE $ROLE VALID UNTIL '{{expiration}}';" \
                default_ttl="48h" \
                max_ttl="48h"

              vault policy write "$ROLE" - <<EOF
              path "yugabyte-db/creds/$ROLE" {
                capabilities = ["read"]
              }
              path "secret/data/keycloak/admin" {
                capabilities = ["read"]
              }
              EOF

              vault write auth/kubernetes/role/$ROLE \
                bound_service_account_names="keycloak" \
                bound_service_account_namespaces="keycloak" \
                policies="$ROLE" \
                ttl=48h

              # --- Verify dynamic creds issuance ---
              echo "🔁 Verifying Vault dynamic credential issuance..."
              attempt=0; delay=2
              while :; do
                attempt=$((attempt+1))
                CREDS_JSON="$(vault read -format=json "yugabyte-db/creds/$ROLE" 2>/dev/null || true)"
                if [ -n "$CREDS_JSON" ] && printf '%s' "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null 2>&1; then
                  echo "✅ Issued on attempt $attempt"
                  break
                fi
                echo "❌ Attempt $attempt failed; retrying in ${delay}s..."
                sleep "$delay"
                [ "$delay" -lt 30 ] && delay=$(( delay * 2 ))
                [ "$delay" -gt 30 ] && delay=30
              done

              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"

              # Helper to run SQL and show errors
              run_psql() {
                SQL="$1"
                echo "---------------- SQL ----------------"
                echo "$SQL"
                echo "-------------------------------------"
                set +e
                echo "$SQL" | psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -v ON_ERROR_STOP=1 2>&1 | tee /tmp/psql_output.log
                STATUS=$?
                set -e
                if [ $STATUS -ne 0 ]; then
                  echo "❌ psql failed:"
                  cat /tmp/psql_output.log
                  exit $STATUS
                fi
              }

              # Final sanity checks with the dynamic user
              run_psql "SELECT current_user;"
              run_psql "SELECT has_schema_privilege(current_user, 'keycloak', 'USAGE') AS schema_usage;"
              run_psql "SET ROLE $ROLE; CREATE TABLE IF NOT EXISTS keycloak.test_perm_check (id SERIAL PRIMARY KEY); RESET ROLE;"
              run_psql "SELECT has_table_privilege(current_user, 'keycloak.test_perm_check', 'SELECT,INSERT,UPDATE,DELETE') AS table_access;"
              run_psql "SELECT has_sequence_privilege(current_user, 'keycloak.test_perm_check_id_seq', 'USAGE') AS sequence_usage;"
              run_psql "SELECT r.rolname FROM pg_roles r JOIN pg_auth_members m ON r.oid = m.roleid JOIN pg_roles u ON u.oid = m.member WHERE u.rolname = current_user;"

              echo "🎉 Keycloak admin creds seeded + Vault DB role ready + Yugabyte privileges set."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        linkerd.io/inject: enabled
      annotations:
        # === Vault Agent Injector for dynamic DB creds (Yugabyte/Postgres engine) ===
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"

        # DB creds stay as you had them
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/creds/keycloak"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/creds/keycloak" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/creds/keycloak"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/creds/keycloak" -}}{{ .Data.password }}{{- end -}}

        # Admin creds – KV v2 explicit path
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          KEYCLOAK_ADMIN={{ .Data.data.username }}
          KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Make sure Linkerd doesn't intercept Vault traffic
        config.linkerd.io/skip-outbound-ports: "8200"
    spec:
      serviceAccountName: keycloak
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        # Static DB settings (Yugabyte Postgres compatibility)
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
        - name: KC_PROXY
          value: "edge"
        - name: KC_HOSTNAME
          value: "keycloak.app.suncoast.systems"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"

        # Start Keycloak after exporting Vault-injected creds from files to env
        command: ["/bin/sh","-lc"]
        args:
        - >
          source /vault/secrets/keycloak-admin &&
          export KC_DB_USERNAME="$(cat /vault/secrets/db-username)" &&
          export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)" &&
          /opt/keycloak/bin/kc.sh start

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 12
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
---
# APISIX route to expose Keycloak GUI at keycloak.app.suncoast.systems
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: apisix
  http:
  - name: keycloak-web
    match:
      hosts:
      - keycloak.app.suncoast.systems
      paths:
      - /
    backends:
    - serviceName: keycloak
      servicePort: 8080
