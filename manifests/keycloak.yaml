apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-keycloak-admin-in-vault
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: init
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              if vault kv get -format=json secret/keycloak/admin >/dev/null 2>&1; then
                echo "✅ secret/keycloak/admin exists; skipping."
                exit 0
              fi

              PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
              vault kv put secret/keycloak/admin username=admin password="$PASS"
              echo "✅ Seeded secret/keycloak/admin."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → keycloak..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: keycloak/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: keycloak
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keycloak
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token

      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh
              set -euo pipefail

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE=keycloak
              VAULTADMIN_USER=vaultadmin

              # Install PostgreSQL client tools
              apk add --no-cache bash curl postgresql15-client jq

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              # --- Wait for Vault token ---
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              # --- Wait for DB availability ---
              until getent hosts "$PGHOST" >/dev/null; do
                echo "🔄 Waiting for DNS for $PGHOST..."
                sleep 3
              done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do
                echo "⏳ Waiting for DB port $PGPORT..."
                sleep 3
              done
              echo "✅ YugabyteDB is reachable"

              # --- Fetch vaultadmin password from Vault ---
              echo "🔐 Fetching vaultadmin password from Vault..."
              while true; do
                VAULTADMIN_PASS="$(vault kv get -field=value secret/$VAULTADMIN_USER 2>/dev/null || true)"
                if [ -n "$VAULTADMIN_PASS" ]; then
                  export PGPASSWORD="$VAULTADMIN_PASS"
                  break
                fi
                echo "🔁 Waiting for secret/$VAULTADMIN_USER to become available..."
                sleep 3
              done

              # --- Ensure $DB database exists ---
              while true; do
                echo "📦 Checking if $DB exists..."
                DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)

                if [[ "$DB_EXISTS" == "1" ]]; then
                  echo "✅ Database $DB already exists"
                  break
                fi

                echo "📦 Creating database $DB..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ Database $DB created successfully"
                  break
                else
                  echo "🔁 Waiting for Yugabyte to accept DB operations..."
                  sleep 3
                fi
              done

              # --- Ensure ROLE exists ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$ROLE') THEN
                  CREATE ROLE $ROLE;
                END IF;
              END
              \$\$;
              EOSQL

              while true; do
                echo "📦 Attempting to create keycloak schema and grant privileges..."
                
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
                CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION $VAULTADMIN_USER;
                ALTER SCHEMA keycloak OWNER TO $VAULTADMIN_USER;
                GRANT $ROLE TO $VAULTADMIN_USER;
                -- Grants for app role
                GRANT USAGE, CREATE ON SCHEMA keycloak TO $ROLE;
                GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA keycloak TO $ROLE;
                GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA keycloak TO $ROLE;
                ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES TO $ROLE;
                ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT USAGE, SELECT ON SEQUENCES TO $ROLE;

                -- Grants for vaultadmin (both existing and future)
                GRANT USAGE, CREATE ON SCHEMA keycloak TO $VAULTADMIN_USER;
                GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA keycloak TO $VAULTADMIN_USER;
                GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA keycloak TO $VAULTADMIN_USER;
                ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES TO $VAULTADMIN_USER;
                ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON SEQUENCES TO $VAULTADMIN_USER;
              EOSQL

                if [ $? -eq 0 ]; then
                  echo "✅ Schema creation and grants completed successfully."
                  break
                else
                  echo "⚠️ Schema creation failed. Retrying in 5 seconds..."
                  sleep 5
                fi
              done

              # --- Ensure ROLE exists (idempotent) ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') THEN CREATE ROLE keycloak NOLOGIN; END IF; END \$\$;"

              # --- Wait for catalog propagation ---
              echo "⏳ Waiting for role 'keycloak' to be visible on all t-servers..."
              attempt=0
              while true; do
                attempt=$((attempt + 1))
                if psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc \
                    "SELECT 1 FROM pg_roles WHERE rolname = 'keycloak'" | grep -q 1; then
                  echo "✅ Role propagated after $attempt attempt(s)"
                  break
                fi
                echo "🔄 Attempt $attempt: role not yet visible; retrying in 1 s..."
                sleep 1
              done

              # --- Create dynamic Vault role ---
              echo "🔐 Creating dynamic Vault role..."
              vault write yugabyte-db/roles/$ROLE \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' INHERIT IN ROLE $ROLE VALID UNTIL '{{expiration}}';" \
                default_ttl="48h" \
                max_ttl="48h"

              echo "✅ Vault role '$ROLE' created"

              # --- Create Vault policy ---
              echo "📜 Writing Vault policy '$ROLE'..."
              vault policy write "$ROLE" - <<EOF
              path "yugabyte-db/creds/$ROLE" {
                capabilities = ["read"]
              }
              EOF

              # --- Bind K8s SA to Vault role ---
              echo "🔗 Binding Kubernetes SA to Vault role..."
              vault write auth/kubernetes/role/$ROLE \
                bound_service_account_names="$ROLE" \
                bound_service_account_namespaces="keycloak" \
                policies="$ROLE" \
                ttl=48h

              echo "🔁 Verifying Vault credential issuance for role: ${ROLE:-<unset>} ..."
              attempt=0
              delay=2   # start with 2s, will back off up to 30s

              while true; do
                attempt=$((attempt + 1))

                CREDS_JSON="$(vault read -format=json "yugabyte-db/creds/${ROLE}" 2>/dev/null || true)"

                # Validate: non-empty JSON; if jq is present, also ensure username/password exist
                if [ -n "$CREDS_JSON" ]; then
                  if command -v jq >/dev/null 2>&1; then
                    if printf '%s' "$CREDS_JSON" \
                      | jq -e '.data.username and .data.password' >/dev/null 2>&1; then
                      echo "✅ Credentials issued on attempt $attempt."
                      break
                    fi
                  else
                    echo "ℹ️ 'jq' not found; accepting non-empty JSON."
                    echo "✅ Credentials issued on attempt $attempt."
                    break
                  fi
                fi

                echo "❌ Attempt $attempt: Failed to issue dynamic credentials from Vault. Retrying in ${delay}s..."
                sleep "$delay"
                # Exponential backoff capped at 30s
                if [ "$delay" -lt 30 ]; then
                  delay=$(( delay * 2 ))
                  [ "$delay" -gt 30 ] && delay=30
                fi
              done

              DB_USER=$(echo "$CREDS_JSON" | jq -r .data.username)
              DB_PASS=$(echo "$CREDS_JSON" | jq -r .data.password)
              export PGPASSWORD="$DB_PASS"

              # --- Function to run and log SQL ---
              run_psql() {
                local SQL="$1"
                echo "🔎 Running SQL:"
                echo "$SQL"
                echo "--------------------------"
                set +e
                echo "$SQL" | psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -v ON_ERROR_STOP=1 2>&1 | tee /tmp/psql_output.log
                STATUS=$?
                set -e
                echo "🔎 Exit status: $STATUS"
                if [ "$STATUS" -ne 0 ]; then
                  echo "❌ psql failed:"
                  cat /tmp/psql_output.log
                  exit $STATUS
                fi
              }

              # --- Validate permissions ---
              echo "🔍 Validating dynamic user permissions..."
              # --- Validate permissions ---
              # --- Set default privileges from dynamic user ---
              # Wrapper: never exits the parent shell even if run_psql calls exit or set -e is on
              safe_run_psql() {
                ( set +e; run_psql "$1" )
                return $?  # propagate subshell's exit code
              }

              attempt=0
              while true; do
                attempt=$((attempt+1))
                echo "📦 Attempt $attempt: setting grants and default privileges..."

                ok=true

                # Ensure schema exists (idempotent; remove if another step is responsible)
                # safe_run_psql "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION $VAULTADMIN_USER;" || ok=false
                safe_run_psql "ALTER SCHEMA keycloak OWNER TO $VAULTADMIN_USER;" || ok=false

                # Grants to vaultadmin
                safe_run_psql "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA keycloak TO vaultadmin;" || ok=false
                safe_run_psql "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA keycloak TO vaultadmin;" || ok=false

                # Default privileges for $ROLE
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $ROLE;" || ok=false
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT USAGE, SELECT ON SEQUENCES TO $ROLE;" || ok=false

                # Default privileges for vaultadmin
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vaultadmin;" || ok=false
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT USAGE, SELECT ON SEQUENCES TO vaultadmin;" || ok=false

                if $ok; then
                  echo "✅ Grants and default privileges applied successfully."
                  break
                else
                  echo "⚠️ Failed to apply one or more statements. Retrying in 5 seconds..."
                  sleep 5
                fi
              done
              
              run_psql "SELECT current_user;"
              run_psql "SELECT has_schema_privilege(current_user, 'keycloak', 'USAGE') AS schema_usage;"
              run_psql "SET ROLE $ROLE; CREATE TABLE IF NOT EXISTS keycloak.test_perm_check (id SERIAL PRIMARY KEY); RESET ROLE;"
              run_psql "SELECT has_table_privilege(current_user, 'keycloak.test_perm_check', 'SELECT,INSERT,UPDATE,DELETE') AS table_access;"
              run_psql "SELECT has_sequence_privilege(current_user, 'keycloak.test_perm_check_id_seq', 'USAGE') AS sequence_usage;"
              run_psql "SELECT r.rolname FROM pg_roles r JOIN pg_auth_members m ON r.oid = m.roleid JOIN pg_roles u ON u.oid = m.member WHERE u.rolname = current_user;"

              echo "🎉 keycloak Vault + Yugabyte initialization complete!"

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        linkerd.io/inject: enabled
      annotations:
        # === Vault Agent Injector for dynamic DB creds (Yugabyte/Postgres engine) ===
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/creds/keycloak"
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/creds/keycloak"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/creds/keycloak" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/creds/keycloak" -}}{{ .Data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/keycloak-admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/keycloak-admin" -}}
          KEYCLOAK_ADMIN={{ .Data.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD={{ .Data.KEYCLOAK_ADMIN_PASSWORD }}
          {{- end -}}
    spec:
      serviceAccountName: keycloak
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN_PASSWORD

        # Static DB settings (Yugabyte Postgres compatibility)
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
        - name: KC_PROXY
          value: "edge"
        - name: KC_HOSTNAME
          value: "keycloak.app.suncoast.systems"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"

        # Start Keycloak after exporting Vault-injected creds from files to env
        command: ["/bin/sh","-lc"]
        args:
        - >
          source /vault/secrets/keycloak-admin &&
          export KC_DB_USERNAME="$(cat /vault/secrets/db-username)" &&
          export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)" &&
          /opt/keycloak/bin/kc.sh start --optimized

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 12
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
---
# APISIX route to expose Keycloak GUI at keycloak.app.suncoast.systems
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: apisix
  http:
  - name: keycloak-web
    match:
      hosts:
      - keycloak.app.suncoast.systems
      paths:
      - /
    backends:
    - serviceName: keycloak
      servicePort: 8080
