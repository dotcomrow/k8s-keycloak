apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → keycloak..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: keycloak/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              #!/bin/sh
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=keycloak
              ROLE_GROUP=keycloak          # NOLOGIN group for DML
              ROLE_OWNER=keycloak_app      # LOGIN stable owner (password rotates)
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              # --- Wait for Vault token ---
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              # --- Ensure KV v2 mount at secret/ (for KC admin creds) ---
              echo "🧩 Ensuring KV v2 at mount 'secret/'..."
              if ! vault secrets list -format=json | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null 2>&1; then
                if vault secrets list -format=json | jq -e 'has("secret/")' >/dev/null 2>&1; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                else
                  vault secrets enable -path=secret -version=2 kv
                fi
              fi

              # --- Seed Keycloak admin creds at secret/keycloak/admin if absent ---
              echo "🔐 Seeding Keycloak admin creds (if missing) at secret/keycloak/admin..."
              if ! vault kv get -format=json secret/keycloak/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/keycloak/admin username=admin password="$PASS"
                echo "✅ Seeded admin secret at secret/keycloak/admin"
              else
                echo "✅ Admin secret already present"
              fi

              # --- Wait for DB availability ---
              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              # --- Fetch vaultadmin password from Vault ---
              echo "🔐 Fetching $VAULTADMIN_USER password from Vault..."
              VAULTADMIN_PASS=""
              if OUT="$(vault kv get -format=json "secret/$VAULTADMIN_USER" 2>/dev/null)"; then
                VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.value // .data.data.password // empty')"
              fi
              [ -z "$VAULTADMIN_PASS" ] && VAULTADMIN_PASS="$(vault kv get -field=value "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
              [ -z "$VAULTADMIN_PASS" ] && VAULTADMIN_PASS="$(vault kv get -field=password "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
              [ -z "$VAULTADMIN_PASS" ] && { echo "❌ missing secret/$VAULTADMIN_USER"; exit 1; }
              export PGPASSWORD="$VAULTADMIN_PASS"

              # --- Ensure database exists ---
              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB' owned by $VAULTADMIN_USER..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                echo "🔁 Retry create DB in 3s..."; sleep 3
              done

              # --- Roles: group + stable owner + let vaultadmin assume owner ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              # --- Schema creation / ownership (do minimal work as vaultadmin) ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${ROLE_OWNER};
              ALTER SCHEMA keycloak OWNER TO ${ROLE_OWNER};
              -- Convenience: make owner default to the keycloak schema
              ALTER ROLE ${ROLE_OWNER} SET search_path = keycloak;
              EOSQL

              # --- If Liquibase bootstrap tables already exist, make sure the stable owner owns them ---
              # (run as vaultadmin; harmless if they don't exist)
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" -v ON_ERROR_STOP=0 <<EOSQL
              ALTER TABLE IF EXISTS keycloak.databasechangeloglock OWNER TO ${ROLE_OWNER};
              ALTER TABLE IF EXISTS keycloak.databasechangelog    OWNER TO ${ROLE_OWNER};
              EOSQL

              # --- All grants & default privileges as the OWNER (prevents permission errors) ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              SET ROLE ${ROLE_OWNER};

              -- App group can create and fully use objects; Liquibase tables included
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA keycloak TO ${ROLE_GROUP};
              GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA keycloak TO ${ROLE_GROUP};

              -- Future objects created by the owner also grant to the group
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES   TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak
                GRANT USAGE, SELECT                ON SEQUENCES TO ${ROLE_GROUP};

              -- (optional) keep vaultadmin with full access for ops
              GRANT USAGE, CREATE ON SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA keycloak TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON TABLES    TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA keycloak GRANT ALL ON SEQUENCES TO ${VAULTADMIN_USER};

              RESET ROLE;
              EOSQL

              echo "✅ Schema owned by ${ROLE_OWNER}; grants & defaults applied as owner"

              # --- Vault DB engine config (idempotent) ---
              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
              fi

              # --- Static role for rotating the owner password ---
              vault write yugabyte-db/static-roles/keycloak-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE ${ROLE_OWNER} WITH PASSWORD '{{password}}';" \
                rotation_period="720h"

              # --- Policy & K8s role for the Keycloak pod ---
              vault policy write "keycloak" - <<'EOF'
              path "yugabyte-db/static-creds/keycloak-app" {
                capabilities = ["read"]
              }
              path "secret/data/keycloak/admin" {
                capabilities = ["read"]
              }
              EOF

              vault write auth/kubernetes/role/keycloak \
                bound_service_account_names="keycloak" \
                bound_service_account_namespaces="keycloak" \
                policies="keycloak" \
                ttl="48h"

              # Sanity check with static creds
              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/keycloak-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as \$DB_USER=$DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"

              echo "🎉 Keycloak DB prepared; Vault static role + policy + K8s binding ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-keycloak
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak   # <-- grants the SA from keycloak namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kc-script-github-admin
  namespace: keycloak
data:
  github-team-admin.js: |
    // Grants realm-management/realm-admin if user is in ORG/TEAM via GitHub API
    var SimpleHttp = Java.type("org.keycloak.broker.provider.util.SimpleHttp");

    // === EDIT THESE ===
    var WANT_ORG  = "<path:secret/data/k8s-teleport-teleport-github-org#value>";       // e.g. "suncoast-systems"
    var WANT_TEAM = "keycloak_admins"; // e.g. "platform-admins"
    var IDP_ALIAS = "github";

    function authenticate(context) {
      var session = context.getSession();
      var realm   = context.getRealm();
      var user    = context.getUser();

      // Get federated identity & access token from broker (requires Store Tokens)
      var fed = session.users().getFederatedIdentity(realm, user, IDP_ALIAS);
      if (fed == null || fed.getToken() == null) { context.success(); return; }

      var token = fed.getToken();

      // Call GitHub /user/teams (needs scope read:org)
      var resp = SimpleHttp.doGet("https://api.github.com/user/teams", session)
          .header("Authorization", "Bearer " + token)
          .asJson();

      var it = resp.iterator();
      var isMember = false;
      while (it.hasNext()) {
        var t = it.next();
        var slug = t.get("slug").asText();
        var org  = t.get("organization").get("login").asText();
        if (slug.equals(WANT_TEAM) && org.equalsIgnoreCase(WANT_ORG)) { isMember = true; break; }
      }

      // Map role realm-management/realm-admin on membership
      var client = session.clients().getClientByClientId(realm, "realm-management");
      var adminRole = client.getRole("realm-admin");
      if (isMember) user.grantRole(adminRole); else user.deleteRoleMapping(adminRole);

      context.success();
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # === Vault Agent Injector for static creds (rotating password) ===
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # Static creds (Vault static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds – KV v2 explicit path
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Make sure Linkerd doesn't intercept Vault traffic
        config.linkerd.io/skip-outbound-ports: "8200"
    spec:
      serviceAccountName: keycloak
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-github
        - name: kc-scripts
          configMap:
            name: kc-script-github-admin
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/keycloak-yugabyte-config to complete (will retry until ready)..."

              while true; do
                # Handle "job not created yet"
                if ! kubectl -n vault get job keycloak-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi

                # Fast path: succeeded >= 1
                SUCC="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
                SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi

                # Try a short 'wait' (doesn't abort on timeout)
                if kubectl -n vault wait --for=condition=complete job/keycloak-yugabyte-config --timeout=10s >/dev/null 2>&1; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi

                # Show a one-line status and keep looping
                FAIL="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                ACTV="$(kubectl -n vault get job keycloak-yugabyte-config -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                sleep 5
              done  
      containers:
        - name: keycloak-configurator
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash","-lc"]
          volumeMounts:
            - name: kc-scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true
          args:
            - |
              set -euo pipefail

              REALM="master"
              SERVER="http://127.0.0.1:8080"
              FLOW_ALIAS="GitHub-PostLogin"

              # --- Admin creds & GitHub OAuth secrets (Vault-injected) ---
              source /vault/secrets/keycloak-admin
              CLIENT_ID="<path:secret/data/keycloak-oauth-client-id#value>"
              CLIENT_SECRET="<path:secret/data/keycloak-oauth-client-secret#value>"

              # --- Tiny JSON helpers (no jq) ---
              json_objects_onelines() { tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g'; }
              flow_id_by_alias() {
                /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" \
                  | json_objects_onelines \
                  | grep -E "\"alias\"[[:space:]]*:[[:space:]]*\"$FLOW_ALIAS\"" \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                  | head -n1
              }

              wait_admin() {
                echo "Waiting for Keycloak admin API..."
                until /opt/keycloak/bin/kcadm.sh config credentials \
                        --server "$SERVER" --realm "$REALM" \
                        --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; do
                  sleep 3
                done
              }

              wait_idp() {
                until /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1; do
                  sleep 1
                done
              }

              # Use the flow's "available executions" list to check Script provider availability
              wait_script_provider_available() {
                local tries=0 max=60
                while :; do
                  # ensure flow exists before checking available
                  /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}" -r "$REALM" >/dev/null 2>&1 || \
                    /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
                      -s "alias=${FLOW_ALIAS}" \
                      -s 'description=Grant realm-admin to members of a GitHub team' \
                      -s providerId=basic-flow -s topLevel=true -s builtIn=false >/dev/null

                  # ask KC which executions can be added to THIS flow
                  if /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions/available" -r "$REALM" \
                      | json_objects_onelines | grep -q '"providerId"[[:space:]]*:[[:space:]]*"script"'; then
                    echo "Script authenticator is available for flow ${FLOW_ALIAS}."
                    return 0
                  fi

                  tries=$((tries+1))
                  if [ "$tries" -ge "$max" ]; then
                    echo "FATAL: Script authenticator not available after waiting. Server features:"
                    /opt/keycloak/bin/kcadm.sh get serverinfo | head -n 200 || true
                    return 1
                  fi
                  sleep 2
                done
              }

              create_mapper_file() {
                local file="$1" tries=0
                while :; do
                  if /opt/keycloak/bin/kcadm.sh create identity-provider/instances/github/mappers -r "$REALM" -f "$file"; then
                    return 0
                  fi
                  tries=$((tries+1))
                  [ "$tries" -ge 10 ] && { echo "FATAL: failed to create mapper from $file"; exit 1; }
                  sleep 2
                done
              }

              wait_admin
              set -x

              # ===== HARD RESET =====
              # 1) Delete GitHub IdP if present
              /opt/keycloak/bin/kcadm.sh get identity-provider/instances/github -r "$REALM" >/dev/null 2>&1 && \
                /opt/keycloak/bin/kcadm.sh delete identity-provider/instances/github -r "$REALM" || true

              # 2) Delete our flow by ID (robust)
              FLOW_ID="$(flow_id_by_alias || true)"
              if [ -n "${FLOW_ID:-}" ]; then
                /opt/keycloak/bin/kcadm.sh delete "authentication/flows/${FLOW_ID}" -r "$REALM" || true
                sleep 1
              fi

              # ===== RECREATE =====
              # 3) Create IdP
              /opt/keycloak/bin/kcadm.sh create identity-provider/instances -r "$REALM" \
                -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                -s "config.clientId=$CLIENT_ID" \
                -s "config.clientSecret=$CLIENT_SECRET" \
                -s 'config.defaultScope=read:user user:email read:org' \
                -s 'config.guiOrder=1' -s 'config.hideOnLoginPage=false'
              wait_idp

              # 4) Add mappers (OIDC IdP mappers)
              cat >/tmp/mapper-email.json <<'JSON'
              { "name":"email", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"email", "user.attribute":"email", "syncMode":"INHERIT" } }
              JSON
              cat >/tmp/mapper-username.json <<'JSON'
              { "name":"username", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"login", "user.attribute":"username", "syncMode":"INHERIT" } }
              JSON
              cat >/tmp/mapper-name.json <<'JSON'
              { "name":"name", "identityProviderAlias":"github",
                "identityProviderMapper":"oidc-user-attribute-idp-mapper",
                "config":{ "claim":"name", "user.attribute":"firstName", "syncMode":"INHERIT" } }
              JSON
              create_mapper_file /tmp/mapper-email.json
              create_mapper_file /tmp/mapper-username.json
              create_mapper_file /tmp/mapper-name.json

              # 5) (Re)create top-level post-login flow (idempotent)
              /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
                -s "alias=${FLOW_ALIAS}" \
                -s 'description=Grant realm-admin to members of a GitHub team' \
                -s providerId=basic-flow -s topLevel=true -s builtIn=false || true

              # 6) WAIT until the Script provider is actually offered for this flow
              wait_script_provider_available

              # 7) Add Script authenticator execution (providerId=script)
              /opt/keycloak/bin/kcadm.sh create "authentication/flows/${FLOW_ALIAS}/executions/execution" -r "$REALM" \
                -s provider=script || true

              # Find execution id for that script
              EXEC_ID="$(
                /opt/keycloak/bin/kcadm.sh get "authentication/flows/${FLOW_ALIAS}/executions" -r "$REALM" 2>/dev/null \
                | json_objects_onelines \
                | grep -E '"providerId"[[:space:]]*:[[:space:]]*"script"' \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                | head -n1
              )"
              [ -z "${EXEC_ID:-}" ] && { echo "FATAL: could not find script execution id"; exit 1; }

              # Make REQUIRED
              /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}" -r "$REALM" -s 'requirement=REQUIRED'

              # 8) Attach/update JS
              SCRIPT_ESCAPED="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' /opt/keycloak/scripts/github-team-admin.js)"
              cat >/tmp/script-cfg.json <<EOF
              { "alias": "GitHub Team Admin", "config": { "script": "${SCRIPT_ESCAPED}" } }
              EOF
              /opt/keycloak/bin/kcadm.sh create "authentication/executions/${EXEC_ID}/config" -r "$REALM" -f /tmp/script-cfg.json \
                || {
                    CFG_ID=$(/opt/keycloak/bin/kcadm.sh get "authentication/executions/${EXEC_ID}/config" -r "$REALM" \
                                | json_objects_onelines \
                                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
                    /opt/keycloak/bin/kcadm.sh update "authentication/executions/${EXEC_ID}/config/${CFG_ID}" -r "$REALM" -f /tmp/script-cfg.json
                  }

              # 9) Wire the IdP to use this post-login flow
              /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r "$REALM" \
                -s "postLoginFlowAlias=${FLOW_ALIAS}"

              # 10) Realm knobs
              /opt/keycloak/bin/kcadm.sh update "realms/${REALM}" \
                -s sslRequired=EXTERNAL \
                -s loginWithEmailAllowed=true \
                -s registrationAllowed=false \
                -s rememberMe=true \
                -s resetPasswordAllowed=true \
                -s bruteForceProtected=true \
                -s permanentLockout=false

              set +x
              echo "✔ Hard reset + full reconfigure finished."
              sleep 365d

        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: KC_DB
            value: "postgres"
          - name: KC_DB_URL
            value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
          - name: KC_DB_SCHEMA
            value: "keycloak"
          - name: KC_HOSTNAME_URL
            value: "https://keycloak.app.suncoast.systems"
          - name: KC_HOSTNAME_ADMIN_URL
            value: "https://keycloak.app.suncoast.systems"
          - name: KC_HEALTH_ENABLED
            value: "true"
          - name: KC_HOSTNAME_STRICT
            value: "false"
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_TRANSACTION_XA_ENABLED
            value: "false"
          - name: KC_HOSTNAME_STRICT_HTTPS
            value: "true"
          - name: KC_HTTP_RELATIVE_PATH
            value: "/"                 # ensures cookie Path="/"
          - name: KC_HTTP_COOKIE_SAME_SITE
            value: "LAX" 
          - name: KC_FEATURES
            value: "scripts"
          - name: KC_PROFILE
            value: "preview"

          command: ["/bin/sh","-lc"]
          args:
            - >
              source /vault/secrets/keycloak-admin &&
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)" &&
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)" &&
              /opt/keycloak/bin/kc.sh start --features=scripts

          startupProbe:
            tcpSocket:
              port: http        # uses the named port 8080
            periodSeconds: 5
            failureThreshold: 120   # up to ~10 minutes, adjust as you like
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"

          volumeMounts:
            - name: kc-scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true