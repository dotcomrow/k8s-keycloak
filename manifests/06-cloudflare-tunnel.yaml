apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-tunnel-external-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-store-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: externalsecrets-keycloak
          serviceAccountRef:
            name: cloudflare-tunnel-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-keycloak-token
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-keycloak
  target:
    name: cloudflare-tunnel-keycloak-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: value
      remoteRef:
        # Vault KVv2 path: secret/data/cloudflare-tunnel-keycloak-token
        key: cloudflare-tunnel-keycloak-token
        property: value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        # Keep tunnel pods out of the service mesh unless you intentionally need it there.
        linkerd.io/inject: "disabled"
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-keycloak-token
                  key: value
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
