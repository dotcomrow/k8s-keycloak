apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-configurator
  namespace: keycloak
  labels:
    app: keycloak-configurator
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
  annotations:
    # Keep this in the same wave as keycloak deployment:
    # keycloak pods stay NotReady until this Job succeeds.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  # Never give up quickly: keep retrying until configuration succeeds.
  backoffLimit: 1000000
  template:
    metadata:
      labels:
        app: keycloak-configurator
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: authentication
      annotations:
        linkerd.io/inject: "disabled"
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        # Keep Vault init-only so the Job can complete cleanly.
        vault.hashicorp.com/agent-pre-populate-only: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ printf "%q" .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ printf "%q" .Data.data.password }}
          {{- end -}}

        # GitHub OAuth + org/team for provider
        vault.hashicorp.com/agent-inject-secret-github-client-id: "secret/data/keycloak-oauth-client-id"
        vault.hashicorp.com/agent-inject-template-github-client-id: |
          {{- with secret "secret/data/keycloak-oauth-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-client-secret: "secret/data/keycloak-oauth-client-secret"
        vault.hashicorp.com/agent-inject-template-github-client-secret: |
          {{- with secret "secret/data/keycloak-oauth-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-org: "secret/data/k8s-teleport-teleport-github-org"
        vault.hashicorp.com/agent-inject-template-github-org: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-org" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin-team: "secret/data/keycloak-admin-team"
        vault.hashicorp.com/agent-inject-template-keycloak-admin-team: |
          {{- with secret "secret/data/keycloak-admin-team" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-role-map: "secret/data/keycloak-github-role-map"
        vault.hashicorp.com/agent-inject-template-github-role-map: |
          {{- with secret "secret/data/keycloak-github-role-map" -}}{{ .Data.data.value }}{{- end -}}

        # Google OIDC + Groups (Cloud Identity)
        vault.hashicorp.com/agent-inject-secret-google-client-id: "secret/data/keycloak-google-client-id"
        vault.hashicorp.com/agent-inject-template-google-client-id: |
          {{- with secret "secret/data/keycloak-google-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-client-secret: "secret/data/keycloak-google-client-secret"
        vault.hashicorp.com/agent-inject-template-google-client-secret: |
          {{- with secret "secret/data/keycloak-google-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-email: "secret/data/keycloak-google-admin-email"
        vault.hashicorp.com/agent-inject-template-google-admin-email: |
          {{- with secret "secret/data/keycloak-google-admin-email" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-group: "secret/data/keycloak-google-admin-group"
        vault.hashicorp.com/agent-inject-template-google-admin-group: |
          {{- with secret "secret/data/keycloak-google-admin-group" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-sa-json: "secret/data/keycloak-google-sa-json"
        vault.hashicorp.com/agent-inject-template-google-sa-json: |
          {{- with secret "secret/data/keycloak-google-sa-json" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-group-role-map: "secret/data/keycloak-google-group-role-map"
        vault.hashicorp.com/agent-inject-template-google-group-role-map: |
          {{- with secret "secret/data/keycloak-google-group-role-map" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-configurator-client-secret: "secret/data/keycloak-configurator-client-secret"
        vault.hashicorp.com/agent-inject-template-keycloak-configurator-client-secret: |
          {{- with secret "secret/data/keycloak-configurator-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-gravitee-introspection: "secret/data/keycloak-client-id-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-id-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-id-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-gravitee-introspection: "secret/data/keycloak-client-secret-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-secret-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-secret-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-graphql-api: "secret/data/keycloak-client-id-graphql-api"
        vault.hashicorp.com/agent-inject-template-client-id-graphql-api: |
          {{- with secret "secret/data/keycloak-client-id-graphql-api" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-graphql-api: "secret/data/keycloak-client-secret-graphql-api"
        vault.hashicorp.com/agent-inject-template-client-secret-graphql-api: |
          {{- with secret "secret/data/keycloak-client-secret-graphql-api" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-cms-site-internal: "secret/data/keycloak-client-id-cms-site-internal"
        vault.hashicorp.com/agent-inject-template-client-id-cms-site-internal: |
          {{- with secret "secret/data/keycloak-client-id-cms-site-internal" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-cms-site-internal: "secret/data/keycloak-client-secret-cms-site-internal"
        vault.hashicorp.com/agent-inject-template-client-secret-cms-site-internal: |
          {{- with secret "secret/data/keycloak-client-secret-cms-site-internal" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-cms-site-external: "secret/data/keycloak-client-id-cms-site-external"
        vault.hashicorp.com/agent-inject-template-client-id-cms-site-external: |
          {{- with secret "secret/data/keycloak-client-id-cms-site-external" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-cms-site-external: "secret/data/keycloak-client-secret-cms-site-external"
        vault.hashicorp.com/agent-inject-template-client-secret-cms-site-external: |
          {{- with secret "secret/data/keycloak-client-secret-cms-site-external" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-openwebui: "secret/data/keycloak-client-id-openwebui"
        vault.hashicorp.com/agent-inject-template-client-id-openwebui: |
          {{- with secret "secret/data/keycloak-client-id-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-openwebui: "secret/data/keycloak-client-secret-openwebui"
        vault.hashicorp.com/agent-inject-template-client-secret-openwebui: |
          {{- with secret "secret/data/keycloak-client-secret-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-hasura-console-proxy: "secret/data/keycloak-client-id-hasura-console-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-hasura-console-proxy: |
          {{- with secret "secret/data/keycloak-client-id-hasura-console-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-hasura-console-proxy: "secret/data/keycloak-client-secret-hasura-console-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-hasura-console-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-hasura-console-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-workbench: "secret/data/keycloak-client-id-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-id-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-workbench: "secret/data/keycloak-client-secret-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-workbench-proxy: "secret/data/keycloak-client-id-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-drools-workbench-proxy: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        # Also write the rendered clientId to a file that matches the dynamic value (needed when the ID comes from Vault)
        vault.hashicorp.com/agent-inject-secret-client-id-dwb-proxy: "secret/data/keycloak-client-id-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-dwb-proxy: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-file-client-id-dwb-proxy: "client-id-drools-workbench-proxy-fkd8z6i5q2rmgf4p"
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-workbench-proxy: "secret/data/keycloak-client-secret-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-workbench-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        # Ensure secret file matches the rendered clientId (needed by configurator to set client secret)
        vault.hashicorp.com/agent-inject-secret-client-secret-dwb-proxy: "secret/data/keycloak-client-secret-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-dwb-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-file-client-secret-dwb-proxy: "client-secret-drools-workbench-proxy-fkd8z6i5q2rmgf4p"
        vault.hashicorp.com/agent-inject-secret-client-id-drools-kie-server: "secret/data/keycloak-client-id-drools-kie-server"
        vault.hashicorp.com/agent-inject-template-client-id-drools-kie-server: |
          {{- with secret "secret/data/keycloak-client-id-drools-kie-server" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-kie-server: "secret/data/keycloak-client-secret-drools-kie-server"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-kie-server: |
          {{- with secret "secret/data/keycloak-client-secret-drools-kie-server" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-kie-server-service: "secret/data/keycloak-client-id-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-id-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-id-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-kie-server-service: "secret/data/keycloak-client-secret-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-secret-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-ollama-service: "secret/data/keycloak-client-id-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-id-ollama-service: |
          {{- with secret "secret/data/keycloak-client-id-ollama-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-ollama-service: "secret/data/keycloak-client-secret-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-secret-ollama-service: |
          {{- with secret "secret/data/keycloak-client-secret-ollama-service" -}}{{ .Data.data.value }}{{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        vault.hashicorp.com/agent-inject-secret-vaultadmin: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-vaultadmin: |
          {{- with secret "secret/data/vaultadmin" -}}
          {{- if .Data.data.password -}}{{ .Data.data.password }}{{ else }}{{ .Data.data.value }}{{ end -}}
          {{- end -}}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: dedicated
                    operator: In
                    values:
                      - srvr-node
      serviceAccountName: keycloak

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      # Retry container execution in the same Pod until it succeeds.
      restartPolicy: OnFailure

      containers:
        # --- One-time configuration sidecar (IdPs + flows + attach providers) ---
        - name: keycloak-configurator
          image: ghcr.io/dotcomrow/keycloak-image:sha-a9789d9
          imagePullPolicy: Always
          env:
            - name: KEYCLOAK_REALM
              value: "external"
            - name: KEYCLOAK_INTERNAL_REALM
              value: "internal"
            - name: KEYCLOAK_EXTERNAL_REALM
              value: "external"
            - name: KEYCLOAK_LEGACY_EXTERNAL_REALM
              value: "apps"
            - name: KEYCLOAK_MIGRATE_APPS_REALM
              value: "true"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_MODE
              value: "auto"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_DELETE_SOURCE
              value: "true"
            - name: KEYCLOAK_MIGRATE_APPS_REALM_FORCE_DELETE
              value: "false"
            - name: KEYCLOAK_INTERNAL_REALM_ROLES
              valueFrom:
                configMapKeyRef:
                  name: keycloak-role-config-internal
                  key: internal-realm-roles
            - name: KEYCLOAK_TOKEN_EXCHANGE_RULES
              valueFrom:
                configMapKeyRef:
                  name: keycloak-token-exchange-config
                  key: rules
                  optional: true
            - name: APPS_GITHUB_ENABLED
              value: "true"
            - name: APPS_GITHUB_ONLY
              value: "true"
            - name: EXTERNAL_DISABLE_LOCAL_LOGIN
              value: "true"
            - name: KEYCLOAK_EXTERNAL_ADMIN_MODE
              value: "group"
            - name: KEYCLOAK_RULES_ADMIN_TEAM
              value: "rules_admin"
            - name: ADMIN_GITHUB_ENABLED
              value: "false"
            - name: PROVIDER_WARN
              value: "false"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              
              ADMIN_REALM="master"
              INTERNAL_REALM="${KEYCLOAK_INTERNAL_REALM:-internal}"
              EXTERNAL_REALM="${KEYCLOAK_EXTERNAL_REALM:-${KEYCLOAK_REALM:-apps}}"
              LEGACY_EXTERNAL_REALM="${KEYCLOAK_LEGACY_EXTERNAL_REALM:-apps}"
              MIGRATE_APPS_REALM="${KEYCLOAK_MIGRATE_APPS_REALM:-false}"
              MIGRATE_APPS_REALM_MODE="${KEYCLOAK_MIGRATE_APPS_REALM_MODE:-auto}"
              MIGRATE_APPS_REALM_DELETE_SOURCE="${KEYCLOAK_MIGRATE_APPS_REALM_DELETE_SOURCE:-false}"
              MIGRATE_APPS_REALM_FORCE_DELETE="${KEYCLOAK_MIGRATE_APPS_REALM_FORCE_DELETE:-false}"
              SERVER="http://keycloak-bootstrap.keycloak.svc.cluster.local:8080"
              FLOW_GH="GitHub-PostLogin"
              FLOW_GGL="Google-PostLogin"
              PROVIDER_GH="github-team-admin"
              PROVIDER_GGL="google-groups-authenticator"
              FLOW_BROWSER_GH="browser-github-only"
              FLOW_BROWSER_GGL="browser-google-only"
              FLOW_BROWSER_EXTERNAL_IDP="browser-external-idp-only"
              FIRST_BROKER_FLOW="first-broker-login-autolink"
              FIRST_BROKER_BASE="first broker login"
              PROVIDER_IDP_AUTO_LINK="idp-auto-link"
              PROVIDER_WARN="${PROVIDER_WARN:-false}"
              ADMIN_REALM_FORCE_GITHUB_REDIRECT="${ADMIN_REALM_FORCE_GITHUB_REDIRECT:-false}"
              ADMIN_GITHUB_ENABLED="${ADMIN_GITHUB_ENABLED:-false}"
              INTERNAL_GITHUB_ENABLED="${APPS_GITHUB_ENABLED:-true}"
              INTERNAL_GITHUB_HIDE_ON_LOGIN="${APPS_GITHUB_HIDE_ON_LOGIN:-false}"
              INTERNAL_GITHUB_ONLY="${APPS_GITHUB_ONLY:-false}"
              KCADM="/opt/keycloak/bin/kcadm.sh"
              KCADM_CONFIG="/tmp/kcadm.config"
              export KCADM_CONFIG
                            
              on_err(){ code=$?; echo "Configurator error (exit $code) at line ${BASH_LINENO[0]}: ${BASH_COMMAND:-unknown}"; exit "$code"; }
              trap on_err ERR
              fatal(){ echo "❌ $*"; exit 1; }
              
              for f in /vault/secrets/keycloak-admin \
                       /vault/secrets/github-client-id \
                       /vault/secrets/github-client-secret \
                       /vault/secrets/github-org \
                       /vault/secrets/keycloak-admin-team; do
                for i in {1..60}; do
                  [ -s "$f" ] && break
                  sleep 1
                done
                if [ ! -s "$f" ]; then
                  fatal "Missing required secret file: $f"
                fi
              done

              source /vault/secrets/keycloak-admin
              CLIENT_ID="$(cat /vault/secrets/github-client-id)"
              CLIENT_SECRET="$(cat /vault/secrets/github-client-secret)"
              GITHUB_ORG="$(cat /vault/secrets/github-org)"
              GITHUB_TEAM="$(cat /vault/secrets/keycloak-admin-team)"
              RULES_ADMIN_TEAM="${KEYCLOAK_RULES_ADMIN_TEAM:-rules_admin}"
              GOOGLE_CLIENT_ID="$(cat /vault/secrets/google-client-id 2>/dev/null || true)"
              GOOGLE_CLIENT_SECRET="$(cat /vault/secrets/google-client-secret 2>/dev/null || true)"
              GITHUB_ROLE_MAP_JSON="$(cat /vault/secrets/github-role-map 2>/dev/null || true)"
              GOOGLE_GROUP_ROLE_MAP_JSON="$(cat /vault/secrets/google-group-role-map 2>/dev/null || true)"
              EXTERNAL_ADMIN_EMAIL=""
              if [ -s /vault/secrets/google-admin-email ]; then
                EXTERNAL_ADMIN_EMAIL="$(tr -d '\r\n' < /vault/secrets/google-admin-email)"
              fi
              EXTERNAL_ADMIN_GROUP=""
              if [ -s /vault/secrets/google-admin-group ]; then
                EXTERNAL_ADMIN_GROUP="$(tr -d '\r\n' < /vault/secrets/google-admin-group)"
              fi
              EXTERNAL_ADMIN_MODE="${KEYCLOAK_EXTERNAL_ADMIN_MODE:-user}"
              INTERNAL_REALM_ROLES_RAW="${KEYCLOAK_INTERNAL_REALM_ROLES:-}"
              CONFIG_CLIENT_ID="keycloak-configurator"
              CONFIG_CLIENT_SECRET="$(cat /vault/secrets/keycloak-configurator-client-secret 2>/dev/null || true)"
              CONFIGURATOR_DELETE_CLIENT="${CONFIGURATOR_DELETE_CLIENT:-false}"
              CLIENT_SECRET_MAP_FILE="/vault/secrets/client-secrets"
              CLIENT_SECRET_DIR="/vault/secrets"
              CLIENT_SECRET_PREFIX="client-secret-"
              CLIENT_ID_DIR="/vault/secrets"
              CLIENT_CONFIG_DIR_INTERNAL="/opt/keycloak/data/clients/internal"
              CLIENT_CONFIG_DIR_EXTERNAL="/opt/keycloak/data/clients/external"
              EXTERNAL_DISABLE_LOCAL_LOGIN="${EXTERNAL_DISABLE_LOCAL_LOGIN:-true}"
              INTERNAL_DISABLE_DIRECT_GRANTS="${INTERNAL_DISABLE_DIRECT_GRANTS:-false}"
              EXTERNAL_DISABLE_DIRECT_GRANTS="${EXTERNAL_DISABLE_DIRECT_GRANTS:-true}"
              OPENWEBUI_CLIENT_ID="openwebui"
              OLLAMA_SERVICE_CLIENT_ID="ollama-service"
              DROOLS_WORKBENCH_CLIENT_ID="drools-workbench-5k32f99itpcixgacte"
              DROOLS_SERVICE_CLIENT_ID="drools-kie-server-service-f92trmqismx56jf87a"
              GRAVITEE_INTROSPECT_CLIENT_ID="gravitee-introspection"
              GRAVITEE_INTROSPECT_CLIENT_SECRET="$(cat /vault/secrets/client-secret-gravitee-introspection 2>/dev/null || true)"
              HASURA_CONSOLE_PROXY_CLIENT_ID="hasura-console-proxy"
              GRAPHQL_API_CLIENT_ID="graphql-api"
              if [ -s "${CLIENT_ID_DIR}/client-id-openwebui" ]; then
                OPENWEBUI_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-openwebui")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-ollama-service" ]; then
                OLLAMA_SERVICE_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-ollama-service")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-drools-workbench" ]; then
                DROOLS_WORKBENCH_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-drools-workbench")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-drools-kie-server-service" ]; then
                DROOLS_SERVICE_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-drools-kie-server-service")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-gravitee-introspection" ]; then
                GRAVITEE_INTROSPECT_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-gravitee-introspection")"
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-hasura-console-proxy" ]; then
                HASURA_CONSOLE_PROXY_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-hasura-console-proxy")"
              fi
              if [ -s "${CLIENT_CONFIG_DIR_EXTERNAL}/graphql-api.json" ]; then
                graph_id="$(sed -n "s/.*\"clientId\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "${CLIENT_CONFIG_DIR_EXTERNAL}/graphql-api.json" | head -n1 | tr -d '\r')"
                path_prefix="<pat"
                path_prefix="${path_prefix}h:"
                if [ -n "${graph_id:-}" ] && ! printf '%s' "$graph_id" | grep -q "^${path_prefix}"; then
                  GRAPHQL_API_CLIENT_ID="$graph_id"
                fi
              fi
              if [ -s "${CLIENT_ID_DIR}/client-id-graphql-api" ]; then
                GRAPHQL_API_CLIENT_ID="$(tr -d '\r\n' < "${CLIENT_ID_DIR}/client-id-graphql-api")"
              fi
              
              login_with_client() {
                [ -n "${CONFIG_CLIENT_SECRET:-}" ] || return 1
                $KCADM config credentials --server "$SERVER" --realm "$ADMIN_REALM" \
                  --client "$CONFIG_CLIENT_ID" --secret "$CONFIG_CLIENT_SECRET" >/dev/null 2>&1
              }

              login_with_admin() {
                $KCADM config credentials --server "$SERVER" --realm "$ADMIN_REALM" \
                  --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1
              }

              clean_id() {
                printf '%s' "$1" | tr -d '"' | tr -d '[:space:]'
              }

              # Caches to reduce expensive repetitive kcadm calls during long reconciliation runs.
              declare -A CLIENT_UUID_CACHE=()
              declare -A CLIENT_SCOPE_UUID_CACHE=()
              declare -A CLIENT_DEFAULT_SCOPES_CACHE=()
              declare -A SCOPE_MAPPER_CSV_CACHE=()
              declare -A CLIENT_MAPPER_CSV_CACHE=()
              declare -A SA_ID_CACHE=()
              declare -A SA_REALM_ROLES_CACHE=()
              declare -A SA_CLIENT_ROLES_CACHE=()

              client_uuid() {
                local realm="$1"
                local clientId="$2"
                local key="${realm}|${clientId}"
                local value=""
                if [ "${CLIENT_UUID_CACHE[$key]+set}" = "set" ]; then
                  printf '%s' "${CLIENT_UUID_CACHE[$key]}"
                  return 0
                fi
                value=$($KCADM get clients -r "$realm" -q "clientId=$clientId" --fields id --format csv 2>/dev/null | tail -n1 || true)
                value="$(clean_id "$value")"
                CLIENT_UUID_CACHE[$key]="$value"
                printf '%s' "$value"
              }

              client_scope_uuid() {
                local realm="$1"
                local scopeName="$2"
                local key="${realm}|${scopeName}"
                local value=""
                local scope_line=""
                if [ "${CLIENT_SCOPE_UUID_CACHE[$key]+set}" = "set" ]; then
                  printf '%s' "${CLIENT_SCOPE_UUID_CACHE[$key]}"
                  return 0
                fi
                scope_line=$($KCADM get client-scopes -r "$realm" --fields id,name --format csv 2>/dev/null | grep -m1 "\"${scopeName}\"" || true)
                value="$(printf '%s' "$scope_line" | cut -d',' -f1 | tr -d '"' | tr -d '[:space:]')"
                CLIENT_SCOPE_UUID_CACHE[$key]="$value"
                printf '%s' "$value"
              }

              refresh_scope_mapper_cache() {
                local realm="$1"
                local scope_uuid="$2"
                local key="${realm}|${scope_uuid}"
                local csv=""
                csv="$($KCADM get "client-scopes/$scope_uuid/protocol-mappers/models" -r "$realm" --fields id,name --format csv 2>/dev/null || true)"
                SCOPE_MAPPER_CSV_CACHE[$key]="$csv"
              }

              scope_mapper_id() {
                local realm="$1"
                local scope_uuid="$2"
                local mapper_name="$3"
                local key="${realm}|${scope_uuid}"
                local csv=""
                local line=""
                csv="${SCOPE_MAPPER_CSV_CACHE[$key]-}"
                if [ -z "${csv:-}" ]; then
                  refresh_scope_mapper_cache "$realm" "$scope_uuid"
                  csv="${SCOPE_MAPPER_CSV_CACHE[$key]-}"
                fi
                line="$(printf '%s\n' "$csv" | grep -m1 "\"${mapper_name}\"" || true)"
                printf '%s' "$line" | cut -d',' -f1 | tr -d '"' | tr -d '[:space:]'
              }

              refresh_client_mapper_cache() {
                local realm="$1"
                local client_uuid="$2"
                local key="${realm}|${client_uuid}"
                local csv=""
                csv="$($KCADM get "clients/$client_uuid/protocol-mappers/models" -r "$realm" --fields id,name --format csv 2>/dev/null || true)"
                CLIENT_MAPPER_CSV_CACHE[$key]="$csv"
              }

              client_mapper_id() {
                local realm="$1"
                local client_uuid="$2"
                local mapper_name="$3"
                local key="${realm}|${client_uuid}"
                local csv=""
                local line=""
                csv="${CLIENT_MAPPER_CSV_CACHE[$key]-}"
                if [ -z "${csv:-}" ]; then
                  refresh_client_mapper_cache "$realm" "$client_uuid"
                  csv="${CLIENT_MAPPER_CSV_CACHE[$key]-}"
                fi
                line="$(printf '%s\n' "$csv" | grep -m1 "\"${mapper_name}\"" || true)"
                printf '%s' "$line" | cut -d',' -f1 | tr -d '"' | tr -d '[:space:]'
              }

              append_role_map_entry() {
                local json="$1"
                local key="$2"
                local role="$3"
                local trimmed=""
                local json_flat=""
                local role_escaped=""
                local key_regex=""
                local role_regex=""
                local key_repl=""
                if [ -z "${key:-}" ] || [ -z "${role:-}" ]; then
                  printf '%s' "$json"
                  return 0
                fi
                if [ -z "${json:-}" ]; then
                  printf '{"%s":["%s"]}' "$key" "$role"
                  return 0
                fi
                json_flat="$(printf '%s' "$json" | tr -d '\n')"
                key_regex="$(printf '%s' "$key" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                role_regex="$(printf '%s' "$role" | sed 's/[.[\\*^$(){}+?|]/\\\\&/g; s/|/\\\\|/g')"
                key_repl="$(printf '%s' "$key" | sed 's/[&|]/\\\\&/g')"
                if printf '%s' "$json_flat" | grep -q "\"${key_regex}\""; then
                  if printf '%s' "$json_flat" | grep -q "\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[[^]]*\"${role_regex}\""; then
                    printf '%s' "$json_flat"
                    return 0
                  fi
                  role_escaped="$(printf '%s' "$role" | sed 's/[&|]/\\\\&/g')"
                  printf '%s' "$json_flat" | sed "s|\"${key_regex}\"[[:space:]]*:[[:space:]]*\\[\\([^]]*\\)\\]|\"${key_repl}\":[\\1,\"${role_escaped}\"]|"
                  return 0
                fi
                trimmed="$(printf '%s' "$json_flat" | sed 's/[[:space:]]*$//')"
                if printf '%s' "$trimmed" | grep -q '^{' && printf '%s' "$trimmed" | grep -q '}$'; then
                  local inner="${trimmed#\{}"
                  inner="${inner%\}}"
                  if [ -z "${inner//[[:space:]]/}" ]; then
                    printf '{"%s":["%s"]}' "$key" "$role"
                  else
                    printf '%s' "${trimmed%\}}"
                    printf ',\"%s\":[\"%s\"]}' "$key" "$role"
                  fi
                  return 0
                fi
                printf '%s' "$json"
              }

              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${GITHUB_TEAM:-}" ]; then
                admin_key="${GITHUB_ORG}/${GITHUB_TEAM}"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$admin_key" "client:realm-management:realm-admin")"
              fi
              if [ -n "${GITHUB_ORG:-}" ] && [ -n "${RULES_ADMIN_TEAM:-}" ]; then
                rules_admin_key="${GITHUB_ORG}/${RULES_ADMIN_TEAM}"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:rest-all")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_access")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:drools_service_access")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:kie-server")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:process-admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:manager")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:rest-project")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "realm:user")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:realm-management:realm-admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:analyst")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:developer")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:user")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:manager")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:process-admin")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:rest-all")"
                GITHUB_ROLE_MAP_JSON="$(append_role_map_entry "$GITHUB_ROLE_MAP_JSON" "$rules_admin_key" "client:${DROOLS_WORKBENCH_CLIENT_ID}:rest-project")"
              fi
              if [ "$EXTERNAL_ADMIN_MODE" = "group" ] && [ -n "${EXTERNAL_ADMIN_GROUP:-}" ]; then
                GOOGLE_GROUP_ROLE_MAP_JSON="$(append_role_map_entry "$GOOGLE_GROUP_ROLE_MAP_JSON" "$EXTERNAL_ADMIN_GROUP" "client:realm-management:realm-admin")"
              fi

              ensure_configurator_client() {
                [ -n "${CONFIG_CLIENT_SECRET:-}" ] || { echo "⚠️  Missing configurator client secret (skipping client auth)"; return 1; }
                CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                CID="$(clean_id "$CID")"
                if [ -z "${CID:-}" ]; then
                  if ! $KCADM create clients -r "$ADMIN_REALM" \
                    -s "clientId=$CONFIG_CLIENT_ID" \
                    -s "name=Keycloak Configurator" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$CONFIG_CLIENT_SECRET"; then
                    echo "⚠️  Failed to create configurator client"
                    return 1
                  fi
                  CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  CID="$(clean_id "$CID")"
                else
                  $KCADM update "clients/$CID" -r "$ADMIN_REALM" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$CONFIG_CLIENT_SECRET" || true
                fi
                if [ -z "${CID:-}" ]; then
                  echo "⚠️  Configurator client id not found after create/update"
                  return 1
                fi
                SA_ID=$($KCADM get "clients/$CID/service-account-user" -r "$ADMIN_REALM" 2>/dev/null \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" | head -n1 || true)
                SA_ID="$(clean_id "$SA_ID")"
                if [ -n "${SA_ID:-}" ]; then
                  for role in realm-admin admin create-realm manage-realm view-realm manage-users manage-clients manage-identity-providers manage-authorization manage-events view-events query-realms query-users query-clients query-groups view-users view-clients view-identity-providers; do
                    $KCADM add-roles -r "$ADMIN_REALM" --uid "$SA_ID" \
                      --cclientid realm-management --rolename "$role" >/dev/null 2>&1 || true
                  done
                fi
              }

              ensure_confidential_service_client() {
                local realm="$1"
                local client_id="$2"
                local client_secret="$3"
                if [ -z "${client_id:-}" ] || [ -z "${client_secret:-}" ]; then
                  return 0
                fi
                local cid
                cid="$(client_uuid "$realm" "$client_id")"
                if [ -z "${cid:-}" ]; then
                  $KCADM create clients -r "$realm" \
                    -s "clientId=$client_id" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "attributes.standard.token.exchange.enabled=true" \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$client_secret" >/dev/null 2>&1 || true
                else
                  $KCADM update "clients/$cid" -r "$realm" \
                    -s enabled=true \
                    -s serviceAccountsEnabled=true \
                    -s publicClient=false \
                    -s standardFlowEnabled=false \
                    -s implicitFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "attributes.standard.token.exchange.enabled=true" \
                    -s "clientAuthenticatorType=client-secret" \
                    -s "secret=$client_secret" >/dev/null 2>&1 || true
                fi
              }

              ensure_audience_mapper() {
                local realm="$1"
                local client_id="$2"
                local audience="$3"
                local mapper_name=""
                local cid=""
                local mapper_id=""
                if [ -z "${realm:-}" ] || [ -z "${client_id:-}" ] || [ -z "${audience:-}" ]; then
                  return 0
                fi
                mapper_name="audience-${audience}"
                cid="$(client_uuid "$realm" "$client_id")"
                if [ -z "${cid:-}" ]; then
                  return 0
                fi
                mapper_id=$($KCADM get "clients/$cid/protocol-mappers/models" -r "$realm" -q "name=$mapper_name" --fields id --format csv 2>/dev/null | tail -n1 || true)
                mapper_id="$(clean_id "$mapper_id")"
                if [ -n "${mapper_id:-}" ]; then
                  $KCADM update "clients/$cid/protocol-mappers/models/$mapper_id" -r "$realm" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-audience-mapper" \
                    -s "config.included.client.audience=$audience" \
                    -s "config.access.token.claim=true" \
                    -s "config.id.token.claim=false" >/dev/null 2>&1 || true
                else
                  $KCADM create "clients/$cid/protocol-mappers/models" -r "$realm" \
                    -s "name=$mapper_name" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-audience-mapper" \
                    -s "config.included.client.audience=$audience" \
                    -s "config.access.token.claim=true" \
                    -s "config.id.token.claim=false" >/dev/null 2>&1 || true
                fi
              }

              ensure_user_admin() {
                local realm="$1"
                local email="$2"
                local username="${3:-}"
                local uid=""
                if [ -z "${realm:-}" ] || [ -z "${email:-}" ]; then
                  return 0
                fi
                uid=$($KCADM get users -r "$realm" -q email="$email" --fields id --format csv 2>/dev/null | tail -n1 || true)
                uid="$(clean_id "$uid")"
                if [ -z "${uid:-}" ] && [ -n "${username:-}" ]; then
                  uid=$($KCADM get users -r "$realm" -q username="$username" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  uid="$(clean_id "$uid")"
                fi
                if [ -z "${uid:-}" ]; then
                  local uname="${username:-$email}"
                  $KCADM create users -r "$realm" \
                    -s "username=$uname" \
                    -s "email=$email" \
                    -s enabled=true \
                    -s emailVerified=true >/dev/null 2>&1 || true
                  uid=$($KCADM get users -r "$realm" -q email="$email" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  uid="$(clean_id "$uid")"
                fi
                if [ -z "${uid:-}" ]; then
                  echo "⚠️  Unable to ensure admin user in realm ${realm} for ${email}"
                  return 1
                fi
                $KCADM add-roles -r "$realm" --uid "$uid" \
                  --cclientid realm-management --rolename realm-admin >/dev/null 2>&1 || true
              }

              echo "Waiting for Keycloak admin API..."
              AUTH_MODE=""
              ADMIN_ESCALATED="false"
              for i in {1..120}; do
                if login_with_admin; then
                  AUTH_MODE="admin"
                  break
                fi
                if login_with_client; then
                  AUTH_MODE="client"
                  break
                fi
                sleep 2
              done
              if [ -z "${AUTH_MODE:-}" ]; then
                echo "❌ Unable to authenticate to Keycloak admin API"
                fatal "Unable to authenticate to Keycloak admin API"
              fi
              if [ "$AUTH_MODE" = "admin" ]; then
                ADMIN_ESCALATED="true"
                ensure_configurator_client || true
                if [ "${PREFER_CLIENT_AUTH:-false}" = "true" ] && login_with_client; then
                  AUTH_MODE="client"
                else
                  AUTH_MODE="admin"
                fi
              fi
              echo "✅ Admin API ready (auth: $AUTH_MODE)."

              kcadm_create_realm() {
                local realm="$1"
                local out=""
                out="$($KCADM create realms -s "realm=${realm}" -s enabled=true 2>&1 || true)"
                if [ -z "${out:-}" ]; then
                  return 0
                fi
                if ! echo "$out" | grep -qiE "Conflict|already exists|duplicate"; then
                  echo "$out" | grep -qiE "error|exception|failed" || return 0
                fi
                if echo "$out" | grep -qiE "Conflict|already exists|duplicate"; then
                  echo "⚠️  Realm already exists; continuing."
                  return 0
                fi
                echo "❌ kcadm create realm failed: ${out}"
                return 1
              }

              realm_exists() {
                local realm="$1"
                if $KCADM get "realms/${realm}" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get realms -q "realm=${realm}" --fields realm >/dev/null 2>&1; then
                  if $KCADM get realms -q "realm=${realm}" --fields realm | grep -q "\"realm\"[[:space:]]*:[[:space:]]*\"${realm}\""; then
                    return 0
                  fi
                fi
                return 1
              }

              ensure_realm() {
                local realm="$1"
                if realm_exists "$realm"; then
                  return 0
                fi
                # Prefer admin for realm creation if available (avoids permission/409 noise)
                if login_with_admin; then
                  ADMIN_ESCALATED="true"
                  if realm_exists "$realm"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  echo "Creating realm: ${realm}"
                  if kcadm_create_realm "${realm}"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  if realm_exists "$realm"; then
                    ensure_configurator_client || true
                    login_with_client >/dev/null 2>&1 || true
                    return 0
                  fi
                  echo "⚠️  Realm create failed with admin; falling back to client."
                  login_with_client >/dev/null 2>&1 || true
                fi
                echo "Creating realm: ${realm}"
                if kcadm_create_realm "${realm}"; then
                  return 0
                fi
                if realm_exists "$realm"; then
                  return 0
                fi
                fatal "Failed to ensure realm: ${realm}"
              }

              export_partial_realm() {
                local realm="$1"
                local outfile="$2"
                local errfile="${outfile}.err"
                if ! $KCADM create "realms/${realm}/partial-export" \
                  -s exportClients=true \
                  -s exportGroupsAndRoles=true \
                  -s exportUsers=true \
                  > "$outfile" 2> "$errfile"; then
                  echo "⚠️  Partial export failed for realm ${realm}: $(tail -n1 "$errfile" 2>/dev/null || true)"
                  return 1
                fi
                if ! grep -q '^[[:space:]]*[{[]' "$outfile"; then
                  echo "⚠️  Partial export output missing JSON for realm ${realm}"
                  if [ -s "$errfile" ]; then
                    echo "⚠️  Partial export stderr: $(tail -n1 "$errfile")"
                  fi
                  return 1
                fi
                return 0
              }

              import_partial_realm() {
                local realm="$1"
                local infile="$2"
                local out=""
                out="$($KCADM create "realms/${realm}/partialImport" \
                  -s ifResourceExists=OVERWRITE -f "$infile" 2>&1 || true)"
                if echo "$out" | grep -qiE "error|exception|failed"; then
                  echo "⚠️  Partial import failed for realm ${realm}: ${out}"
                  return 1
                fi
                return 0
              }

              try_rename_realm() {
                local from="$1"
                local to="$2"
                local out=""
                out="$($KCADM update "realms/${from}" -s "realm=${to}" -s enabled=true 2>&1 || true)"
                if [ -z "${out:-}" ]; then
                  return 0
                fi
                if echo "$out" | grep -qiE "error|exception|failed"; then
                  echo "⚠️  Rename realm failed (${from} -> ${to}): ${out}"
                  return 1
                fi
                return 0
              }

              delete_realm() {
                local realm="$1"
                if ! realm_exists "$realm"; then
                  return 0
                fi
                $KCADM delete "realms/${realm}" >/dev/null 2>&1 || true
                if realm_exists "$realm"; then
                  echo "⚠️  Failed to delete realm: ${realm}"
                  return 1
                fi
                echo "✅ Deleted realm: ${realm}"
                return 0
              }

              migrate_apps_realm() {
                if [ "${MIGRATE_APPS_REALM}" != "true" ]; then
                  return 0
                fi
                local source="${LEGACY_EXTERNAL_REALM}"
                local target="${EXTERNAL_REALM}"
                if [ -z "${source:-}" ] || [ -z "${target:-}" ]; then
                  echo "⚠️  Migration skipped: missing source/target realm names."
                  return 0
                fi
                if [ "$source" = "$target" ]; then
                  echo "ℹ️  Legacy realm matches target (${target}); no migration needed."
                  return 0
                fi
                if ! realm_exists "$source"; then
                  echo "ℹ️  Legacy realm not found (${source}); skipping migration."
                  return 0
                fi
                if realm_exists "$target"; then
                  echo "⚠️  Both legacy (${source}) and target (${target}) realms exist; skipping migration to avoid overwrite."
                  if [ "$MIGRATE_APPS_REALM_DELETE_SOURCE" = "true" ] && [ "$MIGRATE_APPS_REALM_FORCE_DELETE" = "true" ]; then
                    delete_realm "$source" || true
                  fi
                  return 0
                fi

                echo "🔁 Migrating realm '${source}' -> '${target}' (mode: ${MIGRATE_APPS_REALM_MODE})"

                if [ "$MIGRATE_APPS_REALM_MODE" != "export-import" ]; then
                  if try_rename_realm "$source" "$target"; then
                    if realm_exists "$target" && ! realm_exists "$source"; then
                      echo "✅ Realm renamed: ${source} -> ${target}"
                      return 0
                    fi
                  fi
                  if [ "$MIGRATE_APPS_REALM_MODE" = "rename" ]; then
                    fatal "Realm rename failed; set KEYCLOAK_MIGRATE_APPS_REALM_MODE=export-import to fallback."
                  fi
                  echo "⚠️  Realm rename failed; falling back to export/import."
                fi

                ensure_realm "$target"

                local tmp_dir="/tmp/keycloak-migrations"
                local export_file=""
                mkdir -p "$tmp_dir"
                export_file="${tmp_dir}/realm-${source}-partial-export.json"

                if ! export_partial_realm "$source" "$export_file"; then
                  fatal "Partial export failed for realm '${source}'"
                fi

                if ! import_partial_realm "$target" "$export_file"; then
                  fatal "Partial import failed for realm '${target}'"
                fi

                echo "✅ Partial export/import completed for '${source}' -> '${target}'"

                if [ "$MIGRATE_APPS_REALM_DELETE_SOURCE" = "true" ]; then
                  delete_realm "$source" || true
                fi
              }

              migrate_apps_realm

              ensure_realm "${INTERNAL_REALM}"
              ensure_realm "${EXTERNAL_REALM}"
              if [ "$EXTERNAL_ADMIN_MODE" = "user" ]; then
                ensure_user_admin "$EXTERNAL_REALM" "$EXTERNAL_ADMIN_EMAIL"
              fi
              
              # Use admin creds for master realm config to avoid permission edge cases
              if login_with_admin; then
                AUTH_MODE="admin"
              else
                echo "⚠️  Unable to login with admin; continuing with client creds for master realm."
              fi

              ensure_confidential_service_client "$INTERNAL_REALM" "$GRAVITEE_INTROSPECT_CLIENT_ID" "$GRAVITEE_INTROSPECT_CLIENT_SECRET"
              ensure_confidential_service_client "$EXTERNAL_REALM" "$GRAVITEE_INTROSPECT_CLIENT_ID" "$GRAVITEE_INTROSPECT_CLIENT_SECRET"
              ensure_audience_mapper "$INTERNAL_REALM" "$GRAVITEE_INTROSPECT_CLIENT_ID" "$GRAVITEE_INTROSPECT_CLIENT_ID"
              ensure_audience_mapper "$EXTERNAL_REALM" "$GRAVITEE_INTROSPECT_CLIENT_ID" "$GRAVITEE_INTROSPECT_CLIENT_ID"
              ensure_audience_mapper "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID" "$OPENWEBUI_CLIENT_ID"

              ensure_flow() {
                local realm="$1"
                local flow="$2"
                local desc="$3"
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=$flow" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc" || true
                fi
              }

              PROVIDER_LIST_LOADED="false"
              load_provider_list() {
                local out=""
                for i in {1..12}; do
                  out="$($KCADM get authentication/execution-providers -r "$ADMIN_REALM" --fields id,providerId --format csv 2>/dev/null || true)"
                  if printf '%s' "$out" | grep -qiE "Resource not found|No server specified|Try 'kcadm|error"; then
                    out=""
                  fi
                  if [ -n "${out:-}" ]; then
                    out="$(printf '%s\n' "$out" | sed '1d' | tr -d '\r' | tr ',' '\n' | tr -d '"' | sed '/^$/d' || true)"
                  fi
                  if [ -z "${out:-}" ]; then
                    out="$($KCADM get authentication/execution-providers -r "$ADMIN_REALM" 2>/dev/null || true)"
                    if ! printf '%s' "$out" | grep -q '^[[:space:]]*\[\|^[[:space:]]*{' ; then
                      out=""
                    fi
                    out="$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*"\(id\|providerId\)"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\2/p' | sed '/^$/d' || true)"
                  fi
                  if [ -n "${out:-}" ]; then
                    break
                  fi
                  sleep 1
                done
                PROVIDER_LIST_GLOBAL="${out:-}"
                PROVIDER_LIST_LOADED="true"
                if [ -z "${PROVIDER_LIST_GLOBAL:-}" ] && [ "$PROVIDER_WARN" = "true" ]; then
                  echo "⚠️  Unable to read execution providers list; will attempt to attach executions without pre-checks."
                fi
              }

              provider_exists() {
                local provider="$1"
                local out=""
                if [ "${PROVIDER_LIST_LOADED:-false}" != "true" ]; then
                  load_provider_list
                fi
                out="${PROVIDER_LIST_GLOBAL:-}"
                [ -z "${out:-}" ] && return 0
                if printf '%s\n' "$out" | grep -xq "$provider"; then
                  return 0
                fi
                return 1
              }

              flow_has_execution() {
                local realm="$1"
                local flow="$2"
                if $KCADM get "authentication/flows/$flow/executions" -r "$realm" 2>/dev/null \
                  | grep -q "\"id\"[[:space:]]*:[[:space:]]*\""; then
                  return 0
                fi
                return 1
              }

              flow_alias_exists() {
                local realm="$1"
                local alias="$2"
                if $KCADM get authentication/flows -r "$realm" 2>/dev/null \
                  | tr -d '\r' | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$alias\""; then
                  return 0
                fi
                return 1
              }

              add_exec_with_requirement() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                local requirement="$4"
                local existing_id=""
                EXECS=$($KCADM get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                existing_id=$(
                      echo "$EXECS" \
                        | tr -d "\n" \
                        | sed "s/},[[:space:]]*{/}\n{/g" \
                        | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$provider\"" \
                        | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" \
                        | head -n1 || true
                    )
                if [ -z "${existing_id:-}" ]; then
                  $KCADM create "authentication/flows/$flow/executions/execution" -r "$realm" -s provider="$provider" || true
                fi
                EID=""
                for i in {1..40}; do
                  EXECS=$($KCADM get "authentication/flows/$flow/executions" -r "$realm" || echo "[]")
                  EID=$(
                        echo "$EXECS" \
                          | tr -d "\n" \
                          | sed "s/},[[:space:]]*{/}\n{/g" \
                          | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"$provider\"" \
                          | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]\+\)\".*/\1/p" \
                          | head -n1 || true
                      )
                  [ -n "$EID" ] && break || sleep 1
                done
                if [ -z "${EID:-}" ]; then
                  echo "⚠️  Could not discover execution id for provider '$provider'. Skipping execution."
                  echo "$EXECS"
                  return 0
                fi
                printf '{ "id":"%s", "requirement":"%s" }\n' "$EID" "$requirement" >/tmp/r.json
                $KCADM update "authentication/flows/$flow/executions" -r "$realm" -f /tmp/r.json || true
              }

              add_exec_required() {
                add_exec_with_requirement "$1" "$2" "$3" "REQUIRED"
              }

              add_exec_alternative() {
                add_exec_with_requirement "$1" "$2" "$3" "ALTERNATIVE"
              }

              # Deny broker logins when the IdP provides an email verification flag and it's unverified.
              #
              # Policy:
              # - If the IdP imports an `email_verified` attribute and it is "false", deny access.
              # - If the attribute is missing (IdP doesn't provide verification), allow login (trust).
              #
              # This uses built-in conditional executions:
              # - conditional-user-attribute: only runs subflow when attribute exists AND matches expected value
              # - deny-access-authenticator: hard fail with configurable error message
              ensure_deny_unverified_idp_email_flow() {
                local realm="$1"
                local parent_flow="$2"
                local subflow="${parent_flow}-deny-unverified-idp-email"
                local desc="Deny when IdP reports unverified email (email_verified=false)"
                local exec_id=""
                local COND_OBJ=""
                local COND_ID=""
                local COND_CFG_ID=""
                local cond_cfg_alias=""
                local DENY_OBJ=""
                local DENY_ID=""
                local DENY_CFG_ID=""
                local deny_cfg_alias=""
                local deny_msg=""

                if [ -z "${realm:-}" ] || [ -z "${parent_flow:-}" ]; then
                  return 0
                fi

                if ! provider_exists "conditional-user-attribute" || ! provider_exists "deny-access-authenticator"; then
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing built-in conditional providers; cannot enforce email_verified in ${realm}/${parent_flow}."
                  fi
                  return 0
                fi

                # Create a subflow bound to the parent flow (idempotent).
                if ! flow_alias_exists "$realm" "$subflow"; then
                  $KCADM create "authentication/flows/${parent_flow}/executions/flow" -r "$realm" \
                    -s "alias=${subflow}" \
                    -s "type=basic-flow" \
                    -s "description=${desc}" >/dev/null 2>&1 || true
                fi

                # Mark the subflow execution as CONDITIONAL so it only runs when its conditions match.
                exec_id="$(
                  $KCADM get "authentication/flows/${parent_flow}/executions" -r "$realm" 2>/dev/null \
                    | tr -d "\n" \
                    | sed "s/},[[:space:]]*{/}\n{/g" \
                    | grep -E "\"displayName\"[[:space:]]*:[[:space:]]*\"${subflow}\"" \
                    | grep -E "\"authenticationFlow\"[[:space:]]*:[[:space:]]*true" \
                    | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                    | head -n1 || true
                )"
                exec_id="$(clean_id "${exec_id:-}")"
                if [ -n "${exec_id:-}" ]; then
                  printf '{ "id":"%s", "requirement":"%s" }\n' "$exec_id" "CONDITIONAL" >/tmp/subflow_req.json
                  $KCADM update "authentication/flows/${parent_flow}/executions" -r "$realm" -f /tmp/subflow_req.json >/dev/null 2>&1 || true
                fi

                # Condition: only execute when the imported `email_verified` attribute exists and matches false.
                add_exec_required "$realm" "$subflow" "conditional-user-attribute"
                COND_OBJ="$(
                  $KCADM get "authentication/flows/${subflow}/executions" -r "$realm" 2>/dev/null \
                    | tr -d "\n" \
                    | sed "s/},[[:space:]]*{/}\n{/g" \
                    | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"conditional-user-attribute\"" \
                    | head -n1 || true
                )"
                COND_ID="$(
                  printf '%s' "$COND_OBJ" \
                    | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                    | head -n1 || true
                )"
                COND_CFG_ID="$(
                  printf '%s' "$COND_OBJ" \
                    | sed -n "s/.*\"authenticationConfig\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                    | head -n1 || true
                )"
                COND_ID="$(clean_id "${COND_ID:-}")"
                COND_CFG_ID="$(clean_id "${COND_CFG_ID:-}")"
                cond_cfg_alias="deny-unverified-email-condition-${subflow}"
                if [ -n "${COND_ID:-}" ]; then
                  if [ -n "${COND_CFG_ID:-}" ]; then
                    $KCADM update "authentication/config/${COND_CFG_ID}" -r "$realm" \
                      -s "alias=${cond_cfg_alias}" \
                      -s "config.attribute_name=email_verified" \
                      -s "config.attribute_expected_value=(?i:false)" \
                      -s "config.include_group_attributes=false" \
                      -s "config.not=false" \
                      -s "config.regex=true" >/dev/null 2>&1 || true
                  else
                    $KCADM create "authentication/executions/${COND_ID}/config" -r "$realm" \
                      -s "alias=${cond_cfg_alias}" \
                      -s "config.attribute_name=email_verified" \
                      -s "config.attribute_expected_value=(?i:false)" \
                      -s "config.include_group_attributes=false" \
                      -s "config.not=false" \
                      -s "config.regex=true" >/dev/null 2>&1 || true
                  fi
                fi

                # Deny access when condition matches.
                add_exec_required "$realm" "$subflow" "deny-access-authenticator"
                DENY_OBJ="$(
                  $KCADM get "authentication/flows/${subflow}/executions" -r "$realm" 2>/dev/null \
                    | tr -d "\n" \
                    | sed "s/},[[:space:]]*{/}\n{/g" \
                    | grep -E "\"providerId\"[[:space:]]*:[[:space:]]*\"deny-access-authenticator\"" \
                    | head -n1 || true
                )"
                DENY_ID="$(
                  printf '%s' "$DENY_OBJ" \
                    | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                    | head -n1 || true
                )"
                DENY_CFG_ID="$(
                  printf '%s' "$DENY_OBJ" \
                    | sed -n "s/.*\"authenticationConfig\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                    | head -n1 || true
                )"
                DENY_ID="$(clean_id "${DENY_ID:-}")"
                DENY_CFG_ID="$(clean_id "${DENY_CFG_ID:-}")"
                deny_cfg_alias="deny-unverified-email-${subflow}"
                deny_msg="Email is not verified with the identity provider."
                if [ -n "${DENY_ID:-}" ]; then
                  if [ -n "${DENY_CFG_ID:-}" ]; then
                    $KCADM update "authentication/config/${DENY_CFG_ID}" -r "$realm" \
                      -s "alias=${deny_cfg_alias}" \
                      -s "config.denyErrorMessage=${deny_msg}" >/dev/null 2>&1 || true
                  else
                    $KCADM create "authentication/executions/${DENY_ID}/config" -r "$realm" \
                      -s "alias=${deny_cfg_alias}" \
                      -s "config.denyErrorMessage=${deny_msg}" >/dev/null 2>&1 || true
                  fi
                fi
              }
              
              ensure_redirect_flow() {
                local realm="$1"
                local flow="$2"
                local provider="$3"
                local desc="$4"
                # Auth execution config aliases must be unique per realm. Include the flow name
                # so we can have multiple redirect flows to the same IdP (e.g., Google).
                local cfg_alias="redirect-to-${provider}-${flow}"
              
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=${flow}" -s providerId=basic-flow -s topLevel=true -s builtIn=false \
                    -s "description=$desc" || true
                  $KCADM create "authentication/flows/${flow}/executions/execution" -r "$realm" \
                    -s provider=identity-provider-redirector || true
                fi
              
                REDIR_ID=""
                CFG_ID=""
                for i in {1..30}; do
                  EXECS=$($KCADM get "authentication/flows/${flow}/executions" -r "$realm" || echo "[]")
                  REDIR_OBJ=$(
                            echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                              | grep -E '"providerId" *: *"identity-provider-redirector"' \
                              | head -n1 || true
                          )
                  REDIR_ID=$(
                            echo "$REDIR_OBJ" \
                              | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                              | head -n1 || true
                          )
                  CFG_ID=$(
                            echo "$REDIR_OBJ" \
                              | sed -n "s/.*\"authenticationConfig\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                              | head -n1 || true
                          )
                  [ -n "${REDIR_ID:-}" ] && break || sleep 1
                done
                if [ -z "${REDIR_ID:-}" ]; then
                  $KCADM create "authentication/flows/${flow}/executions/execution" -r "$realm" \
                    -s provider=identity-provider-redirector || true
                  for i in {1..10}; do
                    EXECS=$($KCADM get "authentication/flows/${flow}/executions" -r "$realm" || echo "[]")
                    REDIR_OBJ=$(
                              echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                                | grep -E '"providerId" *: *"identity-provider-redirector"' \
                                | head -n1 || true
                            )
                    REDIR_ID=$(
                              echo "$REDIR_OBJ" \
                                | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                                | head -n1 || true
                            )
                    CFG_ID=$(
                              echo "$REDIR_OBJ" \
                                | sed -n "s/.*\"authenticationConfig\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                                | head -n1 || true
                            )
                    [ -n "${REDIR_ID:-}" ] && break || sleep 1
                  done
                fi
                [ -z "${REDIR_ID:-}" ] && { echo "⚠️  cannot find redirector execution for ${flow}; skipping"; return 0; }
              
                printf '{ "id":"%s", "requirement":"REQUIRED" }\n' "$REDIR_ID" >/tmp/r2.json
                $KCADM update "authentication/flows/${flow}/executions" -r "$realm" -f /tmp/r2.json || true
              
                if [ -n "${CFG_ID:-}" ]; then
                  $KCADM update "authentication/config/${CFG_ID}" -r "$realm" \
                    -s "alias=${cfg_alias}" -s "config.defaultProvider=${provider}" || true
                else
                  $KCADM create "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                    -s "alias=${cfg_alias}" -s "config.defaultProvider=${provider}" || true
                fi
              }

              ensure_idp_only_flow() {
                local realm="$1"
                local flow="$2"
                local default_provider="$3"
                local desc="$4"
                # Auth execution config aliases must be unique per realm. Include the flow name
                # so we can have multiple redirect flows to the same IdP (e.g., Google).
                local cfg_alias="redirect-to-${default_provider}-${flow}"

                ensure_flow "$realm" "$flow" "$desc"
                add_exec_required "$realm" "$flow" "identity-provider-redirector"

                if [ -z "${default_provider:-}" ]; then
                  echo "ℹ️  No default IdP set for ${flow}; use kc_idp_hint to select a provider."
                  return 0
                fi

                REDIR_ID=""
                CFG_ID=""
                for i in {1..30}; do
                  EXECS=$($KCADM get "authentication/flows/${flow}/executions" -r "$realm" || echo "[]")
                  REDIR_OBJ=$(
                            echo "$EXECS" | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                              | grep -E '"providerId" *: *"identity-provider-redirector"' \
                              | head -n1 || true
                          )
                  REDIR_ID=$(
                            echo "$REDIR_OBJ" \
                              | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                              | head -n1 || true
                          )
                  CFG_ID=$(
                            echo "$REDIR_OBJ" \
                              | sed -n "s/.*\"authenticationConfig\"[[:space:]]*:[[:space:]]*\"\\([^\"]\\+\\)\".*/\\1/p" \
                              | head -n1 || true
                          )
                  [ -n "${REDIR_ID:-}" ] && break || sleep 1
                done
                [ -z "${REDIR_ID:-}" ] && { echo "⚠️  cannot find redirector execution for ${flow}; skipping"; return 0; }
                if [ -n "${CFG_ID:-}" ]; then
                  $KCADM update "authentication/config/${CFG_ID}" -r "$realm" \
                    -s "alias=${cfg_alias}" -s "config.defaultProvider=${default_provider}" || true
                else
                  $KCADM create "authentication/executions/${REDIR_ID}/config" -r "$realm" \
                    -s "alias=${cfg_alias}" -s "config.defaultProvider=${default_provider}" || true
                fi
              }

              ensure_first_broker_flow_autolink() {
                local realm="$1"
                local flow="$FIRST_BROKER_FLOW"
                local base="$FIRST_BROKER_BASE"

                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$flow\""; then
                  base_path="$(printf '%s' "$base" | sed 's/ /%20/g')"
                  if ! $KCADM create "authentication/flows/${base_path}/copy" -r "$realm" -s "newName=${flow}" >/dev/null 2>&1; then
                    echo "⚠️  Unable to copy base broker flow in ${realm}; leaving default."
                    return 0
                  fi
                fi

                if provider_exists "$PROVIDER_IDP_AUTO_LINK"; then
                  add_exec_alternative "$realm" "$flow" "$PROVIDER_IDP_AUTO_LINK"
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${realm}: ${PROVIDER_IDP_AUTO_LINK} (skipping auto-link)"
                  fi
                fi

                $KCADM update "realms/${realm}" -s "firstBrokerLoginFlow=$flow" || true
              }
              
              ensure_github_idp() {
                local realm="$1"
                local hide_on_login="$2"
                if [ -z "${hide_on_login:-}" ]; then
                  hide_on_login="false"
                fi
                if $KCADM get identity-provider/instances/github -r "$realm" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/github -r "$realm" \
                    -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                    -s trustEmail=true \
                    -s "config.clientId=$CLIENT_ID" \
                    -s "config.clientSecret=$CLIENT_SECRET" \
                    -s 'config.defaultScope=read:user user:email read:org' \
                    -s 'config.syncMode=FORCE' \
                    -s 'config.guiOrder=1' -s "config.hideOnLoginPage=${hide_on_login}" \
                    || true
                else
                  $KCADM create identity-provider/instances -r "$realm" \
                    -s enabled=true -s storeToken=true -s alias=github -s providerId=github \
                    -s trustEmail=true \
                    -s "config.clientId=$CLIENT_ID" \
                    -s "config.clientSecret=$CLIENT_SECRET" \
                    -s 'config.defaultScope=read:user user:email read:org' \
                    -s 'config.syncMode=FORCE' \
                    -s 'config.guiOrder=1' -s "config.hideOnLoginPage=${hide_on_login}" \
                    || true
                fi
              }
              
              ensure_google_idp() {
                local realm="$1"
                if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
                  return 1
                fi
              
                if $KCADM get identity-provider/instances/google -r "$realm" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/google -r "$realm" \
                    -s enabled=true -s storeToken=false -s alias=google -s providerId=google \
                    -s trustEmail=true \
                    -s "config.clientId=$GOOGLE_CLIENT_ID" \
                    -s "config.clientSecret=$GOOGLE_CLIENT_SECRET" \
                    -s 'config.defaultScope=openid email profile' \
                    -s 'config.syncMode=FORCE' \
                    -s 'config.guiOrder=2' -s 'config.hideOnLoginPage=false' \
                    || true
                else
                  $KCADM create identity-provider/instances -r "$realm" \
                    -s enabled=true -s storeToken=false -s alias=google -s providerId=google \
                    -s trustEmail=true \
                    -s "config.clientId=$GOOGLE_CLIENT_ID" \
                    -s "config.clientSecret=$GOOGLE_CLIENT_SECRET" \
                    -s 'config.defaultScope=openid email profile' \
                    -s 'config.syncMode=FORCE' \
                    -s 'config.guiOrder=2' -s 'config.hideOnLoginPage=false' \
                    || true
                fi
              }

              ensure_github_user_attribute_mapper() {
                local realm="$1"
                local mapper_name="$2"
                local json_field="$3"
                local user_attribute="$4"
                local sync_mode="${5:-INHERIT}"

                if ! $KCADM get identity-provider/instances/github -r "$realm" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get "identity-provider/instances/github/mappers" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name}\""; then
                  return 0
                fi
                $KCADM create "identity-provider/instances/github/mappers" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "identityProviderAlias=github" \
                  -s "identityProviderMapper=github-user-attribute-mapper" \
                  -s "config.\"jsonField\"=${json_field}" \
                  -s "config.\"userAttribute\"=${user_attribute}" \
                  -s "config.\"syncMode\"=${sync_mode}" || true
              }

              # Import OIDC claims from an external IdP (e.g., Google) into Keycloak user attributes.
              # This is the "incoming" side of profile standardization; protocol mappers/client scopes
              # handle exposing the stored attributes to apps.
              ensure_oidc_user_attribute_mapper() {
                local realm="$1"
                local idp_alias="$2"
                local mapper_name="$3"
                local claim="$4"
                local user_attribute="$5"
                local sync_mode="${6:-INHERIT}"

                if [ -z "${realm:-}" ] || [ -z "${idp_alias:-}" ] || [ -z "${mapper_name:-}" ] || [ -z "${claim:-}" ] || [ -z "${user_attribute:-}" ]; then
                  return 0
                fi
                if ! $KCADM get "identity-provider/instances/${idp_alias}" -r "$realm" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get "identity-provider/instances/${idp_alias}/mappers" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name}\""; then
                  return 0
                fi
                $KCADM create "identity-provider/instances/${idp_alias}/mappers" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "identityProviderAlias=${idp_alias}" \
                  -s "identityProviderMapper=oidc-user-attribute-idp-mapper" \
                  -s "config.\"claim\"=${claim}" \
                  -s "config.\"user.attribute\"=${user_attribute}" \
                  -s "config.\"syncMode\"=${sync_mode}" >/dev/null 2>&1 || true
              }
              
              echo "Configuring admin realm: ${ADMIN_REALM}"
              echo "admin: load providers"
              load_provider_list || true
              if [ "$ADMIN_GITHUB_ENABLED" = "true" ]; then
                echo "admin: ensure github idp"
                ensure_github_idp "$ADMIN_REALM" "false" || true
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-avatar-url" "avatar_url" "picture" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-profile-url" "html_url" "profile" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-website" "blog" "website" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-company" "company" "company" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-location" "location" "location" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-bio" "bio" "bio" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-twitter-username" "twitter_username" "twitter_username" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-name" "name" "name" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-login" "login" "preferred_username" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-id" "id" "github_id" "INHERIT"
                ensure_github_user_attribute_mapper "$ADMIN_REALM" "github-node-id" "node_id" "github_node_id" "INHERIT"
                echo "admin: ensure first-broker flow"
                ensure_first_broker_flow_autolink "$ADMIN_REALM" || true
                echo "admin: ensure post-broker flow"
                ensure_flow "$ADMIN_REALM" "$FLOW_GH" "Post-broker: GitHub team admin" || true
                if provider_exists "$PROVIDER_GH"; then
                  echo "admin: add github-team-admin execution"
                  add_exec_required "$ADMIN_REALM" "$FLOW_GH" "$PROVIDER_GH" || true
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${ADMIN_REALM}: ${PROVIDER_GH} (skipping execution)"
                  fi
                fi
                if flow_has_execution "$ADMIN_REALM" "$FLOW_GH"; then
                echo "admin: set postBrokerLoginFlowAlias"
                $KCADM update identity-provider/instances/github -r "$ADMIN_REALM" \
                  -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
                else
                  echo "⚠️  GitHub post-broker flow has no executions in ${ADMIN_REALM}; skipping postBrokerLoginFlowAlias."
                fi
                if [ "$ADMIN_REALM_FORCE_GITHUB_REDIRECT" = "true" ]; then
                  echo "admin: ensure github-only browser flow"
                  ensure_redirect_flow "$ADMIN_REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
                  $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=${FLOW_BROWSER_GH}" || true
                else
                  $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=browser" || true
                fi
              else
                if $KCADM get identity-provider/instances/github -r "$ADMIN_REALM" >/dev/null 2>&1; then
                  $KCADM delete identity-provider/instances/github -r "$ADMIN_REALM" || true
                fi
                $KCADM update "realms/${ADMIN_REALM}" -s "browserFlow=browser" || true
              fi
              
              # Prefer admin for app realm config unless explicitly forced to client
              if [ "${PREFER_CLIENT_AUTH:-false}" = "true" ]; then
                if login_with_client; then
                  AUTH_MODE="client"
                else
                  echo "⚠️  Unable to switch to client creds; continuing with admin."
                fi
              fi

              echo "Configuring internal realm: ${INTERNAL_REALM}"
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ]; then
                ensure_github_idp "$INTERNAL_REALM" "$INTERNAL_GITHUB_HIDE_ON_LOGIN"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-avatar-url" "avatar_url" "picture" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-profile-url" "html_url" "profile" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-website" "blog" "website" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-company" "company" "company" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-location" "location" "location" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-bio" "bio" "bio" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-twitter-username" "twitter_username" "twitter_username" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-name" "name" "name" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-login" "login" "preferred_username" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-id" "id" "github_id" "INHERIT"
                ensure_github_user_attribute_mapper "$INTERNAL_REALM" "github-node-id" "node_id" "github_node_id" "INHERIT"
              else
                echo "ℹ️  GitHub IdP disabled in internal realm by config."
                if $KCADM get identity-provider/instances/github -r "$INTERNAL_REALM" >/dev/null 2>&1; then
                  $KCADM update identity-provider/instances/github -r "$INTERNAL_REALM" \
                    -s enabled=false -s 'config.hideOnLoginPage=true' || true
                fi
              fi
              ensure_first_broker_flow_autolink "$INTERNAL_REALM"
              ensure_flow "$INTERNAL_REALM" "$FLOW_GH" "Post-broker: GitHub teams"
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ] && provider_exists "$PROVIDER_GH"; then
                add_exec_required "$INTERNAL_REALM" "$FLOW_GH" "$PROVIDER_GH"
              else
                if [ "$PROVIDER_WARN" = "true" ]; then
                  echo "⚠️  Missing provider in ${INTERNAL_REALM}: ${PROVIDER_GH} (skipping execution)"
                fi
              fi
              ensure_deny_unverified_idp_email_flow "$INTERNAL_REALM" "$FLOW_GH" || true
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ] && flow_has_execution "$INTERNAL_REALM" "$FLOW_GH"; then
              $KCADM update identity-provider/instances/github -r "$INTERNAL_REALM" \
                -s "postBrokerLoginFlowAlias=$FLOW_GH" || true
              else
                echo "⚠️  GitHub post-broker flow has no executions in ${INTERNAL_REALM}; skipping postBrokerLoginFlowAlias."
              fi
              if [ "$INTERNAL_GITHUB_ENABLED" = "true" ]; then
                ensure_redirect_flow "$INTERNAL_REALM" "$FLOW_BROWSER_GH" "github" "Browser flow that redirects to GitHub"
              fi
              
              EXTERNAL_GOOGLE_READY="false"
              echo "Configuring external realm: ${EXTERNAL_REALM}"
              ensure_first_broker_flow_autolink "$EXTERNAL_REALM"
              if ensure_google_idp "$EXTERNAL_REALM"; then
                EXTERNAL_GOOGLE_READY="true"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-picture" "picture" "picture" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-profile" "profile" "profile" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-locale" "locale" "locale" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-name" "name" "name" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-given-name" "given_name" "given_name" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-family-name" "family_name" "family_name" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-email-verified" "email_verified" "email_verified" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-hd" "hd" "hd" "INHERIT"
                ensure_oidc_user_attribute_mapper "$EXTERNAL_REALM" "google" "google-sub" "sub" "google_sub" "INHERIT"
                ensure_flow "$EXTERNAL_REALM" "$FLOW_GGL" "Post-broker: Google groups only"
                if provider_exists "$PROVIDER_GGL"; then
                  add_exec_required "$EXTERNAL_REALM" "$FLOW_GGL" "$PROVIDER_GGL"
                else
                  if [ "$PROVIDER_WARN" = "true" ]; then
                    echo "⚠️  Missing provider in ${EXTERNAL_REALM}: ${PROVIDER_GGL} (skipping execution)"
                  fi
                fi
                ensure_deny_unverified_idp_email_flow "$EXTERNAL_REALM" "$FLOW_GGL" || true
                if flow_has_execution "$EXTERNAL_REALM" "$FLOW_GGL"; then
                  $KCADM update identity-provider/instances/google -r "$EXTERNAL_REALM" \
                    -s "postBrokerLoginFlowAlias=$FLOW_GGL" || true
                else
                  echo "⚠️  Google post-broker flow has no executions in ${EXTERNAL_REALM}; skipping postBrokerLoginFlowAlias."
                fi
              else
                echo "⚠️  Google IdP not configured (missing client id/secret)."
              fi
              if [ "$EXTERNAL_GOOGLE_READY" = "true" ]; then
                ensure_redirect_flow "$EXTERNAL_REALM" "$FLOW_BROWSER_GGL" "google" "Browser flow that redirects to Google"
              fi

              EXTERNAL_DEFAULT_IDP="${EXTERNAL_DEFAULT_IDP:-}"
              if [ -z "${EXTERNAL_DEFAULT_IDP:-}" ] && [ "$EXTERNAL_GOOGLE_READY" = "true" ]; then
                EXTERNAL_DEFAULT_IDP="google"
              fi
              EXTERNAL_IDP_ONLY_READY="false"
              if [ "$EXTERNAL_DISABLE_LOCAL_LOGIN" = "true" ]; then
                if [ -n "${EXTERNAL_DEFAULT_IDP:-}" ]; then
                  ensure_idp_only_flow "$EXTERNAL_REALM" "$FLOW_BROWSER_EXTERNAL_IDP" "$EXTERNAL_DEFAULT_IDP" "Browser flow that redirects to external IdPs"
                  EXTERNAL_IDP_ONLY_READY="true"
                else
                  echo "⚠️  EXTERNAL_DISABLE_LOCAL_LOGIN=true but no default IdP is configured; leaving browserFlow=browser to avoid lockout."
                fi
              fi
              
              if [ "$INTERNAL_REALM" != "$ADMIN_REALM" ]; then
                if [ "$INTERNAL_GITHUB_ONLY" = "true" ]; then
                  $KCADM update "realms/${INTERNAL_REALM}" -s "browserFlow=${FLOW_BROWSER_GH}" || true
                else
                  $KCADM update "realms/${INTERNAL_REALM}" -s "browserFlow=browser" || true
                fi
              fi
              if [ "$EXTERNAL_REALM" != "$ADMIN_REALM" ]; then
                if [ "$EXTERNAL_DISABLE_LOCAL_LOGIN" = "true" ] && [ "${EXTERNAL_IDP_ONLY_READY:-false}" = "true" ]; then
                  $KCADM update "realms/${EXTERNAL_REALM}" -s "browserFlow=${FLOW_BROWSER_EXTERNAL_IDP}" || true
                else
                  $KCADM update "realms/${EXTERNAL_REALM}" -s "browserFlow=browser" || true
                fi
              fi
              
              # Realm hygiene (unchanged)
              $KCADM update "realms/$INTERNAL_REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=true -s resetPasswordAllowed=true -s bruteForceProtected=true -s permanentLockout=false || true
              $KCADM update "realms/$EXTERNAL_REALM" \
                -s sslRequired=EXTERNAL -s loginWithEmailAllowed=true -s registrationAllowed=false \
                -s rememberMe=false -s resetPasswordAllowed=false -s bruteForceProtected=true -s permanentLockout=false || true
              # External app access tokens are kept short (15 minutes) and refreshed by shell runtime.
              $KCADM update "realms/$EXTERNAL_REALM" \
                -s accessTokenLifespan=900 \
                -s accessTokenLifespanForImplicitFlow=900 || true
              
              # 1) Disable Direct Access Grants (password grant)
              DG="disabled-direct-grant"
              ensure_disabled_direct_grant_flow() {
                local realm="$1"
                if ! $KCADM get authentication/flows -r "$realm" | grep -q "\"alias\" *: *\"$DG\""; then
                  $KCADM create authentication/flows -r "$realm" \
                    -s "alias=$DG" -s providerId=basic-flow -s topLevel=true -s builtIn=false || true
                fi
                $KCADM update "realms/$realm" -s "directGrantFlow=$DG" || true
              }
              if [ "$INTERNAL_DISABLE_DIRECT_GRANTS" = "true" ]; then
                ensure_disabled_direct_grant_flow "$INTERNAL_REALM"
              fi
              if [ "$EXTERNAL_DISABLE_DIRECT_GRANTS" = "true" ]; then
                ensure_disabled_direct_grant_flow "$EXTERNAL_REALM"
              fi
              
              # 2) Disable the bootstrap admin user in master (only after configurator client auth is working)
              if [ "${DISABLE_BOOTSTRAP_ADMIN:-false}" = "true" ] && [ "${AUTH_MODE:-}" = "client" ]; then
                ADMIN_ID=$($KCADM get users -r "$ADMIN_REALM" -q username="$KEYCLOAK_ADMIN" 2>/dev/null \
                  | tr -d "\n" | sed "s/},[[:space:]]*{/}\n{/g" \
                  | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1 || true)
                if [ -n "$ADMIN_ID" ]; then
                  $KCADM update "users/$ADMIN_ID" -r "$ADMIN_REALM" -s enabled=false -s 'credentials=[]' || true
                fi
              fi
              
              apply_clients_from_dir() {
                local realm="$1"
                local dir="$2"
                if [ -z "${dir:-}" ] || [ ! -d "$dir" ]; then
                  echo "ℹ️  client config dir missing or empty: $dir"
                  return 0
                fi
                echo "📦 Applying clients for realm '${realm}' from ${dir}"
                ls -al "$dir" || true
                for f in "$dir"/*.json; do
                  [ -f "$f" ] || continue
                  client_id_raw=$(sed -n "s/.*\"clientId\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$f" | head -n1)
                  if [ -z "${client_id_raw:-}" ]; then
                    echo "info: missing clientId in $f"
                    continue
                  fi
                  client_id="$client_id_raw"
                  effective_id="$client_id_raw"

                  # If clientId is an AVP placeholder, treat its suffix as the stable key for override/secret files.
                  path_prefix="<pat"
                  path_prefix="${path_prefix}h:"
                  client_id_placeholder="$(printf '%s' "$client_id_raw" | sed -n "s|^${path_prefix}secret/data/keycloak-client-id-\\([^#>]*\\)#value>$|\\1|p")"
                  if [ -n "${client_id_placeholder:-}" ]; then
                    client_id="$client_id_placeholder"
                    effective_id="$client_id_placeholder"
                  fi

                  override_id_file="${CLIENT_ID_DIR:-/vault/secrets}/client-id-${client_id}"
                  if [ -s "$override_id_file" ]; then
                    override_id="$(tr -d '\r\n' < "$override_id_file")"
                    if [ -n "${override_id:-}" ]; then
                      effective_id="$override_id"
                    fi
                  fi
                  echo "↳ Applying client config: $f (clientId=$client_id, effectiveId=$effective_id)"
                  json_file="$f"
                  if [ "$effective_id" != "$client_id" ]; then
                    esc_id="$(printf '%s' "$effective_id" | sed 's/[&|]/\\&/g')"
                    json_file="$(mktemp)"
                    sed "s|\"clientId\"[[:space:]]*:[[:space:]]*\"[^\"]*\"|\"clientId\":\"$esc_id\"|" "$f" > "$json_file"
                  fi
                  CID="$(client_uuid "$realm" "$effective_id")"
                  if [ -n "${CID:-}" ]; then
                    $KCADM update "clients/$CID" -r "$realm" -f "$json_file" || true
                  else
                    $KCADM create clients -r "$realm" -f "$json_file" || true
                    CLIENT_UUID_CACHE["${realm}|${effective_id}"]=""
                    CID="$(client_uuid "$realm" "$effective_id")"
                  fi
                  if [ -z "${CID:-}" ]; then
                    echo "⚠️  client not found after apply: ${effective_id} in realm ${realm}"
                  fi
                  if [ -n "${CID:-}" ]; then
                    CLIENT_UUID_CACHE["${realm}|${effective_id}"]="$CID"
                    CLIENT_UUID_CACHE["${realm}|${client_id}"]="$CID"
                    secret=""
                    # Prefer explicit secret from client JSON; fall back to secret files.
                    secret_from_json="$(sed -n "s/.*\"secret\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$json_file" | head -n1 || true)"
                    if [ -n "${secret_from_json:-}" ]; then
                      secret_from_json="$(printf '%s' "$secret_from_json" | tr -d '\r')"
                      # Build the placeholder prefix at runtime to avoid AVP replacement.
                      path_prefix="<pat"
                      path_prefix="${path_prefix}h:"
                      secret_placeholder="$(printf '%s' "$secret_from_json" | sed -n "s|^${path_prefix}secret/data/keycloak-client-secret-\\([^#>]*\\)#value>$|\\1|p")"
                      if [ -n "$secret_placeholder" ]; then
                        secret_file_placeholder="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${secret_placeholder}"
                        if [ -s "$secret_file_placeholder" ]; then
                          secret="$(tr -d '\r\n' < "$secret_file_placeholder")"
                        fi
                      elif [ "${secret_from_json#${path_prefix}}" = "$secret_from_json" ]; then
                        secret="$secret_from_json"
                      fi
                    fi
                    secret_file="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${client_id}"
                    secret_file_effective="${CLIENT_SECRET_DIR}/${CLIENT_SECRET_PREFIX}${effective_id}"
                    if [ -z "$secret" ] && [ -s "$secret_file" ]; then
                      secret="$(tr -d '\r\n' < "$secret_file")"
                    elif [ -z "$secret" ] && [ -s "$secret_file_effective" ]; then
                      secret="$(tr -d '\r\n' < "$secret_file_effective")"
                    elif [ -z "$secret" ] && [ -s "$CLIENT_SECRET_MAP_FILE" ]; then
                      secret="$(awk -F= -v cid="$client_id" '$1==cid { $1=""; sub(/^=/,""); print; exit }' "$CLIENT_SECRET_MAP_FILE")"
                    fi
                    if [ -n "${secret:-}" ]; then
                      $KCADM update "clients/$CID" -r "$realm" \
                        -s publicClient=false \
                        -s "clientAuthenticatorType=client-secret" \
                        -s "secret=$secret" || true
                      echo "🔐 Set client secret for $effective_id"
                    fi
                  fi
                  if [ "$json_file" != "$f" ] && [ -f "$json_file" ]; then
                    rm -f "$json_file"
                  fi
                done
              }

              disable_direct_grants_for_clients() {
                local realm="$1"
                ($KCADM get clients -r "$realm" --fields id,clientId,directAccessGrantsEnabled --format csv 2>/dev/null || true) \
                  | tail -n +2 | while IFS=, read -r id cid dag; do
                      id="$(clean_id "$id")"
                      cid="$(clean_id "$cid")"
                      [ -z "${id:-}" ] && continue
                      if [ "$dag" = "true" ] || [ "$dag" = "TRUE" ]; then
                        echo "🔒 Disabling direct grants for client: $cid"
                        $KCADM update "clients/$id" -r "$realm" -s directAccessGrantsEnabled=false || true
                      fi
                    done
              }

              enforce_pkce_for_client() {
                local realm="$1"
                local clientId="$2"
                CID="$(client_uuid "$realm" "$clientId")"
                if [ -n "${CID:-}" ]; then
                $KCADM update "clients/$CID" -r "$realm" \
                  -s "standardFlowEnabled=true" \
                  -s "directAccessGrantsEnabled=false" \
                  -s "implicitFlowEnabled=false" \
                  -s "serviceAccountsEnabled=true" \
                  -s "attributes.\"pkce.code.challenge.method\"=S256" || true
                else
                  echo "ℹ️  client not found for PKCE enforcement: $clientId"
                fi
              }

              enforce_standard_flow_for_client() {
                local realm="$1"
                local clientId="$2"
                CID="$(client_uuid "$realm" "$clientId")"
                if [ -n "${CID:-}" ]; then
                  $KCADM update "clients/$CID" -r "$realm" \
                    -s "standardFlowEnabled=true" \
                    -s "directAccessGrantsEnabled=false" \
                    -s "implicitFlowEnabled=false" \
                    -s "serviceAccountsEnabled=false" || true
                else
                  echo "ℹ️  client not found for standard flow enforcement: $clientId"
                fi
              }

              clear_pkce_for_client() {
                local realm="$1"
                local clientId="$2"
                CID="$(client_uuid "$realm" "$clientId")"
                if [ -n "${CID:-}" ]; then
                  $KCADM update "clients/$CID" -r "$realm" \
                    -s "attributes.\"pkce.code.challenge.method\"=" || true
                else
                  echo "ℹ️  client not found for PKCE clear: $clientId"
                fi
              }

              ensure_realm_roles_in_scope_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="realm-roles-as-scope"
                local mapper_id=""
                CID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CID:-}" ] && return 0
                mapper_id="$(client_mapper_id "$realm" "$CID" "$mapper_name")"
                if [ -n "${mapper_id:-}" ]; then
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                  -s "config.\"claim.name\"=scope" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=false" \
                  -s "config.\"userinfo.token.claim\"=false" \
                  -s "config.\"multivalued\"=true" || true
                refresh_client_mapper_cache "$realm" "$CID"
              }

              # Open WebUI reads roles from the OIDC userinfo response (not the access token),
              # so we must explicitly include realm roles in userinfo.
              ensure_realm_roles_in_userinfo_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="realm-roles-userinfo"
                CID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CID:-}" ] && return 0

                local mapper_id=""
                mapper_id="$(client_mapper_id "$realm" "$CID" "$mapper_name")"

                if [ -n "${mapper_id:-}" ]; then
                  $KCADM update "clients/$CID/protocol-mappers/models/$mapper_id" -r "$realm" \
                    -s "name=${mapper_name}" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                    -s "config.\"claim.name\"=roles" \
                    -s "config.\"jsonType.label\"=String" \
                    -s "config.\"access.token.claim\"=true" \
                    -s "config.\"id.token.claim\"=true" \
                    -s "config.\"userinfo.token.claim\"=true" \
                    -s "config.\"introspection.token.claim\"=true" \
                    -s "config.\"multivalued\"=true" || true
                  refresh_client_mapper_cache "$realm" "$CID"
                  return 0
                fi

                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                  -s "config.\"claim.name\"=roles" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=true" \
                  -s "config.\"introspection.token.claim\"=true" \
                  -s "config.\"multivalued\"=true" || true
                refresh_client_mapper_cache "$realm" "$CID"
              }

              ensure_realm_roles_claim_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="realm-roles-claim"
                CID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CID:-}" ] && return 0
                local mapper_id=""
                mapper_id="$(client_mapper_id "$realm" "$CID" "$mapper_name")"

                if [ -n "${mapper_id:-}" ]; then
                  $KCADM update "clients/$CID/protocol-mappers/models/$mapper_id" -r "$realm" \
                    -s "name=${mapper_name}" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                    -s "config.\"claim.name\"=realm_access.roles" \
                    -s "config.\"jsonType.label\"=String" \
                    -s "config.\"access.token.claim\"=true" \
                    -s "config.\"id.token.claim\"=true" \
                    -s "config.\"userinfo.token.claim\"=false" \
                    -s "config.\"multivalued\"=true" || true
                  refresh_client_mapper_cache "$realm" "$CID"
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-realm-role-mapper" \
                  -s "config.\"claim.name\"=realm_access.roles" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=false" \
                  -s "config.\"multivalued\"=true" || true
                refresh_client_mapper_cache "$realm" "$CID"
              }

              ensure_client_roles_claim_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="client-roles-claim"
                CID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CID:-}" ] && return 0
                local mapper_id=""
                mapper_id="$(client_mapper_id "$realm" "$CID" "$mapper_name")"

                if [ -n "${mapper_id:-}" ]; then
                  $KCADM update "clients/$CID/protocol-mappers/models/$mapper_id" -r "$realm" \
                    -s "name=${mapper_name}" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-usermodel-client-role-mapper" \
                    -s "config.\"usermodel.clientRoleMapping.clientId\"=${clientId}" \
                    -s "config.\"claim.name\"=resource_access.${clientId}.roles" \
                    -s "config.\"jsonType.label\"=String" \
                    -s "config.\"access.token.claim\"=true" \
                    -s "config.\"id.token.claim\"=true" \
                    -s "config.\"userinfo.token.claim\"=false" \
                    -s "config.\"multivalued\"=true" || true
                  refresh_client_mapper_cache "$realm" "$CID"
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-client-role-mapper" \
                  -s "config.\"usermodel.clientRoleMapping.clientId\"=${clientId}" \
                  -s "config.\"claim.name\"=resource_access.${clientId}.roles" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=false" \
                  -s "config.\"multivalued\"=true" || true
                refresh_client_mapper_cache "$realm" "$CID"
              }

              ensure_client_attribute_mapper() {
                local realm="$1"
                local clientId="$2"
                local mapper_name="$3"
                local user_attribute="$4"
                local claim_name="$5"
                local mapper_id=""
                CID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CID:-}" ] && return 0
                mapper_id="$(client_mapper_id "$realm" "$CID" "$mapper_name")"
                if [ -n "${mapper_id:-}" ]; then
                  return 0
                fi
                $KCADM create "clients/$CID/protocol-mappers/models" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-attribute-mapper" \
                  -s "config.\"user.attribute\"=${user_attribute}" \
                  -s "config.\"claim.name\"=${claim_name}" \
                  -s "config.\"jsonType.label\"=String" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=true" || true
                refresh_client_mapper_cache "$realm" "$CID"
              }

              log_progress() {
                echo "⏱️  $(date -u +%FT%TZ) $*"
              }
              
              log_progress "Applying internal realm clients and auth settings..."
              apply_clients_from_dir "$INTERNAL_REALM" "$CLIENT_CONFIG_DIR_INTERNAL"
              if [ "$INTERNAL_DISABLE_DIRECT_GRANTS" = "true" ]; then
                disable_direct_grants_for_clients "$INTERNAL_REALM"
              fi
              clear_pkce_for_client "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID"

              log_progress "Applying external realm clients and auth settings..."
              apply_clients_from_dir "$EXTERNAL_REALM" "$CLIENT_CONFIG_DIR_EXTERNAL"
              if [ "$EXTERNAL_DISABLE_DIRECT_GRANTS" = "true" ]; then
                disable_direct_grants_for_clients "$EXTERNAL_REALM"
              fi
              enforce_standard_flow_for_client "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID"
              enforce_pkce_for_client "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID"
              ensure_realm_roles_in_scope_mapper "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID"
              ensure_realm_roles_in_userinfo_mapper "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID"
              ensure_client_attribute_mapper "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "openwebui-picture" "picture" "picture"
              if ! $KCADM get clients -r "$EXTERNAL_REALM" -q "clientId=$OPENWEBUI_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 | grep -q .; then
                echo "⚠️  openwebui client not present in external realm (${EXTERNAL_REALM})"
              fi

              log_progress "Ensuring baseline realm roles..."
              # Sample roles for mapping (edit/remove as needed)
              if [ -n "${INTERNAL_REALM_ROLES_RAW:-}" ]; then
                roles_list="$(echo "$INTERNAL_REALM_ROLES_RAW" | tr ',\n' ' ')"
                for role in $roles_list; do
                  [ -z "${role:-}" ] && continue
                  log_progress "internal realm role: ${role}"
                  $KCADM get "roles/$role" -r "$INTERNAL_REALM" >/dev/null 2>&1 || \
                    $KCADM create roles -r "$INTERNAL_REALM" -s "name=$role" || true
                done
              else
                for role in openwebui_access ollama_access ollama_service_access; do
                  log_progress "internal realm role: ${role}"
                  $KCADM get "roles/$role" -r "$INTERNAL_REALM" >/dev/null 2>&1 || \
                    $KCADM create roles -r "$INTERNAL_REALM" -s "name=$role" || true
                done
              fi
              for role in tier_free tier_pro feature_x drools_access platform_batch_ui_user; do
                log_progress "external realm role: ${role}"
                $KCADM get "roles/$role" -r "$EXTERNAL_REALM" >/dev/null 2>&1 || \
                  $KCADM create roles -r "$EXTERNAL_REALM" -s "name=$role" || true
              done
              
              ensure_default_role_member() {
                local realm="$1"
                local role="$2"
                local default_role="default-roles-${realm}"
                if ! $KCADM get "roles/$role" -r "$realm" >/dev/null 2>&1; then
                  return 0
                fi
                if $KCADM get "roles/${default_role}/composites" -r "$realm" 2>/dev/null \
                  | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${role}\""; then
                  return 0
                fi
                $KCADM add-roles -r "$realm" --rname "$default_role" --rolename "$role" >/dev/null 2>&1 || true
              }

              ensure_default_role_member "$INTERNAL_REALM" "drools_access"
              ensure_default_role_member "$INTERNAL_REALM" "user"
              ensure_default_role_member "$EXTERNAL_REALM" "drools_access"
              ensure_default_role_member "$EXTERNAL_REALM" "platform_batch_ui_user"

              ensure_roles_from_map() {
                local realm="$1"
                local json="$2"
                local spec_count=0
                if [ -z "${json:-}" ]; then
                  return 0
                fi
                local specs
                specs=$(printf '%s' "$json" | tr -d '\n' | grep -o '"\\(realm\\|client\\):[^"]*"' | tr -d '"' || true)
                if [ -z "${specs:-}" ]; then
                  return 0
                fi
                while read -r spec; do
                  [ -z "${spec:-}" ] && continue
                  spec_count=$((spec_count + 1))
                  log_progress "role-map spec ${spec_count} (${realm}): ${spec}"
                  case "$spec" in
                    realm:*)
                      role="${spec#realm:}"
                      [ -z "${role:-}" ] && continue
                      $KCADM get "roles/$role" -r "$realm" >/dev/null 2>&1 || \
                        $KCADM create roles -r "$realm" -s "name=$role" || true
                      ;;
                    client:*)
                      rest="${spec#client:}"
                      cid="${rest%%:*}"
                      role="${rest#*:}"
                    if [ -z "${cid:-}" ] || [ -z "${role:-}" ] || [ "$cid" = "$role" ]; then
                      continue
                    fi
                    CLIENT_UUID="$(client_uuid "$realm" "$cid")"
                    if [ -n "${CLIENT_UUID:-}" ]; then
                      $KCADM get "clients/$CLIENT_UUID/roles/$role" -r "$realm" >/dev/null 2>&1 || \
                        $KCADM create "clients/$CLIENT_UUID/roles" -r "$realm" -s "name=$role" || true
                      else
                        echo "info: client not found for role spec: $spec"
                      fi
                      ;;
                  esac
                done <<<"$specs"
              }

              ensure_google_group_role_composites_from_map() {
                local realm="$1"
                local json="$2"
                local group_count=0
                if [ -z "${json:-}" ]; then
                  return 0
                fi
                local entries
                entries="$(printf '%s' "$json" | tr -d '\n' | grep -o '"[^"]*"[[:space:]]*:[[:space:]]*\[[^]]*\]' || true)"
                if [ -z "${entries:-}" ]; then
                  return 0
                fi
                while IFS= read -r entry; do
                  [ -z "${entry:-}" ] && continue
                  local group_key=""
                  local group_slug=""
                  local group_role=""
                  local specs=""
                  group_key="$(printf '%s' "$entry" | sed -n 's/^"\([^"]*\)".*/\1/p')"
                  [ -z "${group_key:-}" ] && continue
                  group_slug="$(printf '%s' "$group_key" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')"
                  [ -z "${group_slug:-}" ] && continue
                  group_role="ggl:${group_slug}"
                  group_count=$((group_count + 1))
                  log_progress "google-group composite map ${group_count}: ${group_role}"
                  if ! $KCADM get "roles/$group_role" -r "$realm" >/dev/null 2>&1; then
                    log_progress "google-group role missing, skipping composites: ${group_role}"
                    continue
                  fi
                  specs="$(printf '%s' "$entry" | grep -o '"\\(realm\\|client\\):[^"]*"' | tr -d '"' || true)"
                  [ -z "${specs:-}" ] && continue
                  while read -r spec; do
                    [ -z "${spec:-}" ] && continue
                    case "$spec" in
                      realm:*)
                        role="${spec#realm:}"
                        [ -z "${role:-}" ] && continue
                        $KCADM add-roles -r "$realm" --rname "$group_role" --rolename "$role" >/dev/null 2>&1 || true
                        ;;
                      client:*)
                        rest="${spec#client:}"
                        cid="${rest%%:*}"
                        role="${rest#*:}"
                        if [ -z "${cid:-}" ] || [ -z "${role:-}" ] || [ "$cid" = "$role" ]; then
                          continue
                        fi
                        $KCADM add-roles -r "$realm" --rname "$group_role" --cclientid "$cid" --rolename "$role" >/dev/null 2>&1 || true
                        ;;
                    esac
                  done <<<"$specs"
                done <<<"$entries"
              }
              
              log_progress "Applying role maps..."
              ensure_roles_from_map "$INTERNAL_REALM" "$GITHUB_ROLE_MAP_JSON"
              ensure_roles_from_map "$EXTERNAL_REALM" "$GOOGLE_GROUP_ROLE_MAP_JSON"
              ensure_google_group_role_composites_from_map "$EXTERNAL_REALM" "$GOOGLE_GROUP_ROLE_MAP_JSON"

              ensure_client_roles() {
                local realm="$1"
                local clientId="$2"
                shift 2
                local CLIENT_UUID=""
                local roles_json=""
                CLIENT_UUID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CLIENT_UUID:-}" ] && return 0
                roles_json="$($KCADM get "clients/$CLIENT_UUID/roles" -r "$realm" 2>/dev/null || true)"
                for role in "$@"; do
                  [ -z "${role:-}" ] && continue
                  if printf '%s' "$roles_json" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${role}\""; then
                    continue
                  fi
                  log_progress "client role create: realm=${realm} client=${clientId} role=${role}"
                  $KCADM create "clients/$CLIENT_UUID/roles" -r "$realm" -s "name=$role" >/dev/null 2>&1 || true
                  roles_json="${roles_json} {\"name\":\"${role}\"}"
                done
              }

              ensure_default_client_role_member() {
                local realm="$1"
                local clientId="$2"
                local role="$3"
                local default_role="default-roles-${realm}"
                [ -z "${role:-}" ] && return 0
                $KCADM add-roles -r "$realm" --rname "$default_role" --cclientid "$clientId" --rolename "$role" >/dev/null 2>&1 || true
              }

              ensure_client_scope() {
                local realm="$1"
                local clientId="$2"
                local scopeName="$3"
                local CLIENT_UUID=""
                local SCOPE_UUID=""
                local cache_key=""
                local default_scopes_json=""
                CLIENT_UUID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CLIENT_UUID:-}" ] && return 0
                SCOPE_UUID="$(client_scope_uuid "$realm" "$scopeName")"
                [ -z "${SCOPE_UUID:-}" ] && return 0

                cache_key="${realm}|${CLIENT_UUID}"
                if [ "${CLIENT_DEFAULT_SCOPES_CACHE[$cache_key]+set}" = "set" ]; then
                  default_scopes_json="${CLIENT_DEFAULT_SCOPES_CACHE[$cache_key]}"
                else
                  default_scopes_json="$($KCADM get "clients/$CLIENT_UUID/default-client-scopes" -r "$realm" 2>/dev/null || true)"
                  CLIENT_DEFAULT_SCOPES_CACHE[$cache_key]="$default_scopes_json"
                fi

                if printf '%s' "$default_scopes_json" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${scopeName}\""; then
                  return 0
                fi
                log_progress "attach default scope: realm=${realm} client=${clientId} scope=${scopeName}"
                $KCADM update "clients/$CLIENT_UUID/default-client-scopes/$SCOPE_UUID" -r "$realm" >/dev/null 2>&1 || true
                # Keep cache coherent after attaching a scope.
                CLIENT_DEFAULT_SCOPES_CACHE[$cache_key]="${default_scopes_json} {\"name\":\"${scopeName}\"}"
              }

              ensure_client_scope_attribute_mapper() {
                local realm="$1"
                local scope_uuid="$2"
                local mapper_name="$3"
                local user_attribute="$4"
                local claim_name="$5"
                local json_type="${6:-String}"
                local mapper_line=""
                local mapper_id=""
                local mapper_json=""
                local mapper_name_re=""
                local user_attribute_re=""
                local claim_name_re=""
                local json_type_re=""

                if [ -z "${realm:-}" ] || [ -z "${scope_uuid:-}" ] || [ -z "${mapper_name:-}" ] || [ -z "${user_attribute:-}" ] || [ -z "${claim_name:-}" ]; then
                  return 0
                fi
                log_progress "scope mapper reconcile: realm=${realm} mapper=${mapper_name}"

                mapper_name_re="$(printf '%s' "$mapper_name" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
                user_attribute_re="$(printf '%s' "$user_attribute" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
                claim_name_re="$(printf '%s' "$claim_name" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
                json_type_re="$(printf '%s' "$json_type" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"

                mapper_id="$(scope_mapper_id "$realm" "$scope_uuid" "$mapper_name")"
                if [ -z "${mapper_id:-}" ]; then
                  mapper_id=$($KCADM create "client-scopes/$scope_uuid/protocol-mappers/models" -r "$realm" \
                    -s "name=${mapper_name}" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-usermodel-attribute-mapper" \
                    -s "config.\"user.attribute\"=${user_attribute}" \
                    -s "config.\"claim.name\"=${claim_name}" \
                    -s "config.\"jsonType.label\"=${json_type}" \
                    -s "config.\"access.token.claim\"=true" \
                    -s "config.\"id.token.claim\"=true" \
                    -s "config.\"userinfo.token.claim\"=true" \
                    -i 2>/dev/null || true)
                  mapper_id="$(clean_id "$mapper_id")"
                  refresh_scope_mapper_cache "$realm" "$scope_uuid"
                  [ -n "${mapper_id:-}" ] || mapper_id="$(scope_mapper_id "$realm" "$scope_uuid" "$mapper_name")"
                fi
                [ -z "${mapper_id:-}" ] && return 0

                # Avoid expensive mapper updates when configuration is already correct.
                mapper_json="$($KCADM get "client-scopes/$scope_uuid/protocol-mappers/models/$mapper_id" -r "$realm" 2>/dev/null || true)"
                if [ -n "${mapper_json:-}" ] \
                  && printf '%s' "$mapper_json" | grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${mapper_name_re}\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"protocolMapper\"[[:space:]]*:[[:space:]]*\"oidc-usermodel-attribute-mapper\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"user\\.attribute\"[[:space:]]*:[[:space:]]*\"${user_attribute_re}\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"claim\\.name\"[[:space:]]*:[[:space:]]*\"${claim_name_re}\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"jsonType\\.label\"[[:space:]]*:[[:space:]]*\"${json_type_re}\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"access\\.token\\.claim\"[[:space:]]*:[[:space:]]*\"true\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"id\\.token\\.claim\"[[:space:]]*:[[:space:]]*\"true\"" \
                  && printf '%s' "$mapper_json" | grep -Eq "\"userinfo\\.token\\.claim\"[[:space:]]*:[[:space:]]*\"true\""; then
                  return 0
                fi

                $KCADM update "client-scopes/$scope_uuid/protocol-mappers/models/$mapper_id" -r "$realm" \
                  -s "name=${mapper_name}" \
                  -s "protocol=openid-connect" \
                  -s "protocolMapper=oidc-usermodel-attribute-mapper" \
                  -s "config.\"user.attribute\"=${user_attribute}" \
                  -s "config.\"claim.name\"=${claim_name}" \
                  -s "config.\"jsonType.label\"=${json_type}" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=true" \
                  -s "config.\"userinfo.token.claim\"=true" >/dev/null 2>&1 || true
              }

              # Common profile scope: attach to clients so apps can depend on consistent, high-signal profile claims.
              # Values come from user attributes populated by IdP mappers (GitHub, Google, etc).
              ensure_user_profile_scope() {
                local realm="$1"
                local scopeName="user-profile"
                local SCOPE_UUID=""
                SCOPE_UUID="$(client_scope_uuid "$realm" "$scopeName")"
                if [ -z "${SCOPE_UUID:-}" ]; then
                  SCOPE_UUID=$($KCADM create client-scopes -r "$realm" \
                    -s "name=$scopeName" \
                    -s "protocol=openid-connect" \
                    -i 2>/dev/null || true)
                  SCOPE_UUID="$(clean_id "$SCOPE_UUID")"
                  CLIENT_SCOPE_UUID_CACHE["${realm}|${scopeName}"]="$SCOPE_UUID"
                fi
                [ -z "${SCOPE_UUID:-}" ] && return 0

                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "picture" "picture" "picture"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "profile" "profile" "profile"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "website" "website" "website"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "locale" "locale" "locale"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "name" "name" "name"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "given_name" "given_name" "given_name"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "family_name" "family_name" "family_name"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "preferred_username" "preferred_username" "preferred_username"

                # Provider-specific extras (may be unset depending on IdP).
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "company" "company" "company"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "location" "location" "location"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "bio" "bio" "bio"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "twitter_username" "twitter_username" "twitter_username"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "email_verified" "email_verified" "email_verified" "boolean"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "hd" "hd" "hd"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "google_sub" "google_sub" "google_sub"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "github_id" "github_id" "github_id"
                ensure_client_scope_attribute_mapper "$realm" "$SCOPE_UUID" "github_node_id" "github_node_id" "github_node_id"
              }

              ensure_groups_scope() {
                local realm="$1"
                local scopeName="groups"
                local SCOPE_UUID=""
                local mapper_line=""
                local mapper_id=""
                SCOPE_UUID="$(client_scope_uuid "$realm" "$scopeName")"
                if [ -z "${SCOPE_UUID:-}" ]; then
                  SCOPE_UUID=$($KCADM create client-scopes -r "$realm" \
                    -s "name=$scopeName" \
                    -s "protocol=openid-connect" \
                    -i 2>/dev/null || true)
                  SCOPE_UUID="$(clean_id "$SCOPE_UUID")"
                  CLIENT_SCOPE_UUID_CACHE["${realm}|${scopeName}"]="$SCOPE_UUID"
                fi
                [ -z "${SCOPE_UUID:-}" ] && return 0
                mapper_line=$($KCADM get "client-scopes/$SCOPE_UUID/protocol-mappers/models" -r "$realm" \
                  --fields id,name --format csv 2>/dev/null | grep -m1 '"groups"' || true)
                mapper_id="$(printf '%s' "$mapper_line" | cut -d',' -f1 | tr -d '"' | tr -d '[:space:]')"
                if [ -z "${mapper_id:-}" ]; then
                  mapper_id=$($KCADM create "client-scopes/$SCOPE_UUID/protocol-mappers/models" -r "$realm" \
                    -s "name=groups" \
                    -s "protocol=openid-connect" \
                    -s "protocolMapper=oidc-group-membership-mapper" \
                    -i 2>/dev/null || true)
                  mapper_id="$(clean_id "$mapper_id")"
                fi
                [ -z "${mapper_id:-}" ] && return 0
                $KCADM update "client-scopes/$SCOPE_UUID/protocol-mappers/models/$mapper_id" -r "$realm" \
                  -s "config.\"full.path\"=false" \
                  -s "config.\"claim.name\"=groups" \
                  -s "config.\"access.token.claim\"=true" \
                  -s "config.\"id.token.claim\"=false" \
                  -s "config.\"userinfo.token.claim\"=false" >/dev/null 2>&1 || true
              }

              log_progress "Ensuring client roles/scopes for app clients..."
              ensure_client_roles "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID" user
              ensure_default_client_role_member "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID" "user"
              ensure_client_roles "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" \
                admin analyst developer user manager process-admin rest-all rest-project
              ensure_client_scope "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "roles"
              ensure_groups_scope "$INTERNAL_REALM"
              ensure_client_scope "$INTERNAL_REALM" "$HASURA_CONSOLE_PROXY_CLIENT_ID" "groups"
              ensure_realm_roles_claim_mapper "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID"
              ensure_client_roles_claim_mapper "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID"
              ensure_default_client_role_member "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "user"

              # Standardize profile claims for apps via a shared client scope in both realms.
              ensure_user_profile_scope "$INTERNAL_REALM"
              ensure_user_profile_scope "$EXTERNAL_REALM"

              # Attach as a default client scope so apps always receive the profile claims.
              ensure_client_scope "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "user-profile"
              ensure_client_scope "$INTERNAL_REALM" "$HASURA_CONSOLE_PROXY_CLIENT_ID" "user-profile"
              # Optional: OpenWebUI may exist in internal realm depending on deployment.
              ensure_client_scope "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "user-profile"
              ensure_client_scope "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "user-profile"
              ensure_client_scope "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID" "user-profile"

              # Ensure common OIDC email scope remains attached for apps that expect the standard 'email' claim.
              ensure_client_scope "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "email"
              ensure_client_scope "$INTERNAL_REALM" "$HASURA_CONSOLE_PROXY_CLIENT_ID" "email"
              ensure_client_scope "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "email"
              ensure_client_scope "$EXTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "email"
              ensure_client_scope "$EXTERNAL_REALM" "$GRAPHQL_API_CLIENT_ID" "email"
              log_progress "Completed client role/scope reconciliation."

              ensure_admin_auth_for_service_account_roles() {
                if login_with_admin; then
                  AUTH_MODE="admin"
                  ADMIN_ESCALATED="true"
                  log_progress "service-account role assignment using admin auth"
                  return 0
                fi
                echo "WARN: admin auth unavailable for service account role assignment; continuing with ${AUTH_MODE:-unknown}"
                login_with_client >/dev/null 2>&1 || true
                return 1
              }

              get_service_account_id() {
                local realm="$1"
                local client_uuid="$2"
                local cache_key="${realm}|${client_uuid}"
                local sa_id=""
                local attempt=""
                if [ "${SA_ID_CACHE[$cache_key]+set}" = "set" ]; then
                  printf '%s' "${SA_ID_CACHE[$cache_key]}"
                  return 0
                fi
                for attempt in 1 2 3 4 5; do
                  sa_id=$($KCADM get "clients/$client_uuid/service-account-user" -r "$realm" 2>/dev/null \
                    | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" | head -n1 || true)
                  sa_id="$(clean_id "$sa_id")"
                  if [ -n "${sa_id:-}" ]; then
                    SA_ID_CACHE[$cache_key]="$sa_id"
                    printf '%s' "$sa_id"
                    return 0
                  fi
                  sleep 1
                done
                return 1
              }

              refresh_sa_realm_roles_cache() {
                local realm="$1"
                local sa_id="$2"
                local key="${realm}|${sa_id}"
                SA_REALM_ROLES_CACHE[$key]="$($KCADM get "users/$sa_id/role-mappings/realm" -r "$realm" 2>/dev/null || true)"
              }

              sa_has_realm_role() {
                local realm="$1"
                local sa_id="$2"
                local role="$3"
                local key="${realm}|${sa_id}"
                local json="${SA_REALM_ROLES_CACHE[$key]-}"
                if [ -z "${json:-}" ]; then
                  refresh_sa_realm_roles_cache "$realm" "$sa_id"
                  json="${SA_REALM_ROLES_CACHE[$key]-}"
                fi
                printf '%s' "$json" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${role}\""
              }

              refresh_sa_client_roles_cache() {
                local realm="$1"
                local sa_id="$2"
                local target_uuid="$3"
                local target_client_id="$4"
                local key="${realm}|${sa_id}|${target_client_id}"
                SA_CLIENT_ROLES_CACHE[$key]="$($KCADM get "users/$sa_id/role-mappings/clients/$target_uuid" -r "$realm" 2>/dev/null || true)"
              }

              sa_has_client_role() {
                local realm="$1"
                local sa_id="$2"
                local target_uuid="$3"
                local target_client_id="$4"
                local role="$5"
                local key="${realm}|${sa_id}|${target_client_id}"
                local json="${SA_CLIENT_ROLES_CACHE[$key]-}"
                if [ -z "${json:-}" ]; then
                  refresh_sa_client_roles_cache "$realm" "$sa_id" "$target_uuid" "$target_client_id"
                  json="${SA_CLIENT_ROLES_CACHE[$key]-}"
                fi
                printf '%s' "$json" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"${role}\""
              }

              assign_realm_role_to_service_account() {
                local realm="$1"
                local clientId="$2"
                local role="$3"
                local cache_key=""
                log_progress "service-account realm role: client=${clientId} role=${role} realm=${realm}"
                CLIENT_UUID="$(client_uuid "$realm" "$clientId")"
                [ -z "${CLIENT_UUID:-}" ] && return 0
                SA_ID="$(get_service_account_id "$realm" "$CLIENT_UUID" || true)"
                [ -z "${SA_ID:-}" ] && return 0
                if sa_has_realm_role "$realm" "$SA_ID" "$role"; then
                  return 0
                fi
                $KCADM add-roles -r "$realm" --uid "$SA_ID" --rolename "$role" >/dev/null 2>&1 || true
                cache_key="${realm}|${SA_ID}"
                SA_REALM_ROLES_CACHE[$cache_key]="${SA_REALM_ROLES_CACHE[$cache_key]-} {\"name\":\"${role}\"}"
              }

              assign_client_role_to_service_account() {
                local realm="$1"
                local serviceClientId="$2"
                local targetClientId="$3"
                local role="$4"
                log_progress "service-account client role: service=${serviceClientId} target=${targetClientId} role=${role} realm=${realm}"
                local service_uuid=""
                local target_uuid=""
                local sa_id=""
                local cache_key=""
                service_uuid="$(client_uuid "$realm" "$serviceClientId")"
                [ -z "${service_uuid:-}" ] && return 0
                target_uuid="$(client_uuid "$realm" "$targetClientId")"
                [ -z "${target_uuid:-}" ] && return 0
                sa_id="$(get_service_account_id "$realm" "$service_uuid" || true)"
                [ -z "${sa_id:-}" ] && return 0
                if sa_has_client_role "$realm" "$sa_id" "$target_uuid" "$targetClientId" "$role"; then
                  return 0
                fi
                $KCADM add-roles -r "$realm" --uid "$sa_id" --cclientid "$targetClientId" --rolename "$role" >/dev/null 2>&1 || true
                cache_key="${realm}|${sa_id}|${targetClientId}"
                SA_CLIENT_ROLES_CACHE[$cache_key]="${SA_CLIENT_ROLES_CACHE[$cache_key]-} {\"name\":\"${role}\"}"
              }

              ensure_admin_auth_for_service_account_roles || true

              log_progress "Assigning service-account roles..."
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$OLLAMA_SERVICE_CLIENT_ID" "ollama_service_access"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "drools_service_access"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "kie-server"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "rest-all"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "admin"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-all"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "drools_service_access"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "admin"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "drools_admin"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "kie-server"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-all"
              assign_realm_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-project"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "admin"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-all"
              assign_client_role_to_service_account "$INTERNAL_REALM" "$DROOLS_WORKBENCH_CLIENT_ID" "$DROOLS_WORKBENCH_CLIENT_ID" "rest-project"

              enable_token_exchange_for_client() {
                local realm="$1"
                local target_client_id="$2"
                local allowed_client_id="$3"
                local target_uuid=""
                local allowed_uuid=""
                local perm_id=""
                local policy_name=""
                local policy_id=""
                local scope_id=""
                local default_resource_id=""
                local resource_json=""
                local resource_type=""
                local default_resource_name="Default Resource"
                if [ -z "${realm:-}" ] || [ -z "${target_client_id:-}" ] || [ -z "${allowed_client_id:-}" ]; then
                  return 0
                fi
                echo "ℹ️  token exchange: realm=$realm target=$target_client_id allowed=$allowed_client_id"
                target_uuid="$(client_uuid "$realm" "$target_client_id")"
                if [ -z "${target_uuid:-}" ]; then
                  echo "⚠️  token exchange target client not found: $target_client_id"
                  return 0
                fi
                allowed_uuid="$(client_uuid "$realm" "$allowed_client_id")"
                if [ -z "${allowed_uuid:-}" ]; then
                  echo "⚠️  token exchange allowed client not found: $allowed_client_id"
                  return 0
                fi
                echo "ℹ️  token exchange client ids: target_uuid=$target_uuid allowed_uuid=$allowed_uuid"

                scope_id=$($KCADM get "clients/$target_uuid/authz/resource-server/scope" -r "$realm" -q "name=token-exchange" --fields id --format csv 2>/dev/null | tail -n1 || true)
                scope_id="$(clean_id "$scope_id")"
                if [ -z "${scope_id:-}" ]; then
                  $KCADM create "clients/$target_uuid/authz/resource-server/scope" -r "$realm" \
                    -s "name=token-exchange" >/dev/null 2>&1 || true
                  scope_id=$($KCADM get "clients/$target_uuid/authz/resource-server/scope" -r "$realm" -q "name=token-exchange" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  scope_id="$(clean_id "$scope_id")"
                fi
                if [ -z "${scope_id:-}" ]; then
                  echo "⚠️  token exchange scope not found: token-exchange"
                  return 0
                fi
                echo "ℹ️  token exchange scope_id=$scope_id"

                get_resource_id_by_name() {
                  local realm="$1"
                  local client_uuid="$2"
                  local resource_name="$3"
                  local rid=""
                  rid="$($KCADM get "clients/$client_uuid/authz/resource-server/resource" -r "$realm" -q "name=$resource_name" --fields _id --format csv 2>/dev/null | tail -n1 || true)"
                  rid="$(clean_id "$rid")"
                  if [ -z "${rid:-}" ]; then
                    rid="$($KCADM get "clients/$client_uuid/authz/resource-server/resource" -r "$realm" -q "name=$resource_name" --fields id --format csv 2>/dev/null | tail -n1 || true)"
                    rid="$(clean_id "$rid")"
                  fi
                  printf '%s' "$rid"
                }

                default_resource_id="$(get_resource_id_by_name "$realm" "$target_uuid" "$default_resource_name")"
                if [ -z "${default_resource_id:-}" ]; then
                  # Keycloak 26+ does not always create a Default Resource automatically; create it so scope-permissions can bind.
                  resource_type="urn:${target_client_id}:resources:default"
                  tmp_resource_json="/tmp/token-exchange-resource-${target_uuid}.json"
                  printf '%s\n' \
                    '{' \
                    '  "name": "Default Resource",' \
                    "  \"type\": \"${resource_type}\"," \
                    '  "uris": ["/*"],' \
                    '  "scopes": ["token-exchange"]' \
                    '}' > "$tmp_resource_json"
                  $KCADM create "clients/$target_uuid/authz/resource-server/resource" -r "$realm" -f "$tmp_resource_json" >/dev/null 2>&1 || true
                  default_resource_id="$(get_resource_id_by_name "$realm" "$target_uuid" "$default_resource_name")"
                fi
                echo "ℹ️  token exchange default_resource_id=$default_resource_id"
                if [ -n "${default_resource_id:-}" ]; then
                  resource_json="$($KCADM get "clients/$target_uuid/authz/resource-server/resource/$default_resource_id" -r "$realm" 2>/dev/null || true)"
                  if ! printf '%s' "$resource_json" | grep -q '"token-exchange"'; then
                    resource_type="urn:${target_client_id}:resources:default"
                    tmp_resource_json="/tmp/token-exchange-resource-${target_uuid}.json"
                    printf '%s\n' \
                      '{' \
                      '  "name": "Default Resource",' \
                      "  \"type\": \"${resource_type}\"," \
                      '  "uris": ["/*"],' \
                      '  "scopes": ["token-exchange"]' \
                      '}' > "$tmp_resource_json"
                    $KCADM update "clients/$target_uuid/authz/resource-server/resource/$default_resource_id" -r "$realm" \
                      -f "$tmp_resource_json" >/dev/null 2>&1 || true
                  fi
                else
                  echo "⚠️  token exchange: Default Resource not available; binding permission without resources"
                fi

                policy_name="token-exchange-${allowed_client_id}"
                policy_id=$($KCADM get "clients/$target_uuid/authz/resource-server/policy/client" -r "$realm" -q "name=$policy_name" --fields id --format csv 2>/dev/null | tail -n1 || true)
                policy_id="$(clean_id "$policy_id")"
                echo "ℹ️  token exchange policy_name=$policy_name policy_id=$policy_id"
                if [ -z "${policy_id:-}" ]; then
                  if ! $KCADM create "clients/$target_uuid/authz/resource-server/policy/client" -r "$realm" \
                    -s "name=$policy_name" \
                    -s "logic=POSITIVE" \
                    -s "decisionStrategy=UNANIMOUS" \
                    -s "clients=[\"$allowed_uuid\"]"; then
                    echo "⚠️  token exchange policy create failed: realm=$realm target=$target_client_id allowed=$allowed_client_id"
                  fi
                  policy_id=$($KCADM get "clients/$target_uuid/authz/resource-server/policy/client" -r "$realm" -q "name=$policy_name" --fields id --format csv 2>/dev/null | tail -n1 || true)
                  policy_id="$(clean_id "$policy_id")"
                else
                  if ! $KCADM update "clients/$target_uuid/authz/resource-server/policy/client/$policy_id" -r "$realm" \
                    -s "clients=[\"$allowed_uuid\"]"; then
                    echo "⚠️  token exchange policy update failed: realm=$realm target=$target_client_id allowed=$allowed_client_id policy_id=$policy_id"
                  fi
                fi
                if [ -z "${policy_id:-}" ]; then
                  echo "⚠️  token exchange policy not found: $policy_name"
                  return 0
                fi

                get_permission_id_by_name() {
                  local realm="$1"
                  local client_uuid="$2"
                  local perm_name="$3"
                  local perm_list=""
                  local perm_id=""
                  perm_list="$($KCADM get "clients/$client_uuid/authz/resource-server/permission/scope" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                  if [ -z "${perm_list:-}" ]; then
                    printf '%s' ""
                    return 0
                  fi
                  perm_id="$(printf '%s' "$perm_list" \
                    | sed -n "s/.*\"id\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\"[^{]*\"name\"[[:space:]]*:[[:space:]]*\"${perm_name}\".*/\\1/p")"
                  printf '%s' "$perm_id"
                }

                # Use a distinct permission name to avoid colliding with policy names.
                perm_name="token-exchange-perm-${allowed_client_id}"
                perm_id="$(get_permission_id_by_name "$realm" "$target_uuid" "$perm_name")"
                perm_id="$(clean_id "$perm_id")"
                echo "ℹ️  token exchange perm_name=$perm_name perm_id=$perm_id"
                tmp_perm_json="/tmp/token-exchange-permission-${target_uuid}.json"
                # Use names (not ids). Keycloak rejects permissions when policy names collide.
                if [ -n "${default_resource_id:-}" ]; then
                  printf '%s\n' \
                    '{' \
                    "  \"name\": \"${perm_name}\"," \
                    '  "type": "scope",' \
                    '  "logic": "POSITIVE",' \
                    '  "decisionStrategy": "UNANIMOUS",' \
                    '  "resources": ["Default Resource"],' \
                    '  "scopes": ["token-exchange"],' \
                    "  \"policies\": [\"${policy_name}\"]" \
                    '}' > "$tmp_perm_json"
                else
                  printf '%s\n' \
                    '{' \
                    "  \"name\": \"${perm_name}\"," \
                    '  "type": "scope",' \
                    '  "logic": "POSITIVE",' \
                    '  "decisionStrategy": "UNANIMOUS",' \
                    '  "scopes": ["token-exchange"],' \
                    "  \"policies\": [\"${policy_name}\"]" \
                    '}' > "$tmp_perm_json"
                fi
                if [ -n "${perm_id:-}" ]; then
                  if ! $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id" -r "$realm" \
                    -f "$tmp_perm_json"; then
                    echo "⚠️  token exchange permission update failed: realm=$realm target=$target_client_id allowed=$allowed_client_id perm_id=$perm_id"
                    echo "    perm_json=$(tr -d '\n' < "$tmp_perm_json")"
                  fi
                else
                  if ! $KCADM create "clients/$target_uuid/authz/resource-server/permission/scope" -r "$realm" \
                    -f "$tmp_perm_json"; then
                    echo "⚠️  token exchange permission create failed: realm=$realm target=$target_client_id allowed=$allowed_client_id"
                    echo "    perm_json=$(tr -d '\n' < "$tmp_perm_json")"
                  fi
                fi

                # Enforce names-based associations (Keycloak accepts these reliably).
                perm_id="$(get_permission_id_by_name "$realm" "$target_uuid" "$perm_name")"
                perm_id="$(clean_id "$perm_id")"
                if [ -n "${perm_id:-}" ]; then
                  if [ -n "${default_resource_id:-}" ]; then
                    if ! $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id" -r "$realm" \
                      -s "resources=[\"${default_resource_name}\"]" \
                      -s 'scopes=["token-exchange"]' \
                      -s "policies=[\"${policy_name}\"]"; then
                      echo "⚠️  token exchange permission name-bind failed: realm=$realm target=$target_client_id allowed=$allowed_client_id perm_id=$perm_id"
                    fi
                  else
                    if ! $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id" -r "$realm" \
                      -s 'scopes=["token-exchange"]' \
                      -s "policies=[\"${policy_name}\"]"; then
                      echo "⚠️  token exchange permission name-bind failed (no default resource): realm=$realm target=$target_client_id allowed=$allowed_client_id perm_id=$perm_id"
                    fi
                  fi
                else
                  echo "⚠️  token exchange permission not found after create/update: $perm_name"
                fi
                if [ -n "${perm_id:-}" ]; then
                  perm_dump="$($KCADM get "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                  if [ -n "${perm_dump:-}" ]; then
                    echo "ℹ️  token exchange permission dump: ${perm_dump}"
                  fi
                fi

                # Also bind the built-in "token-exchange" permission (Keycloak appears to enforce this name).
                perm_name_default="token-exchange"
                perm_id_default="$(get_permission_id_by_name "$realm" "$target_uuid" "$perm_name_default")"
                perm_id_default="$(clean_id "$perm_id_default")"
                if [ -z "${perm_id_default:-}" ]; then
                  # Create the default permission if it doesn't exist (newer Keycloak doesn't always provision it).
                  tmp_perm_default_json="/tmp/token-exchange-default-permission-${target_uuid}.json"
                  printf '%s\n' \
                    '{' \
                    "  \"name\": \"${perm_name_default}\"," \
                    '  "type": "scope",' \
                    '  "logic": "POSITIVE",' \
                    '  "decisionStrategy": "UNANIMOUS"' \
                    '}' > "$tmp_perm_default_json"
                  $KCADM create "clients/$target_uuid/authz/resource-server/permission/scope" -r "$realm" \
                    -f "$tmp_perm_default_json" >/dev/null 2>&1 || true
                  perm_id_default="$(get_permission_id_by_name "$realm" "$target_uuid" "$perm_name_default")"
                  perm_id_default="$(clean_id "$perm_id_default")"
                fi
                if [ -n "${perm_id_default:-}" ]; then
                  if [ -n "${default_resource_id:-}" ]; then
                    if ! $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id_default" -r "$realm" \
                      -s "resources=[\"${default_resource_name}\"]" \
                      -s 'scopes=["token-exchange"]' \
                      -s "policies=[\"${policy_name}\"]"; then
                      echo "⚠️  token exchange default permission update failed: realm=$realm target=$target_client_id allowed=$allowed_client_id perm_id=$perm_id_default"
                    else
                      perm_dump_default="$($KCADM get "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id_default" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                      if [ -n "${perm_dump_default:-}" ]; then
                        echo "ℹ️  token exchange default permission dump: ${perm_dump_default}"
                      fi
                    fi
                  else
                    if ! $KCADM update "clients/$target_uuid/authz/resource-server/permission/scope/$perm_id_default" -r "$realm" \
                      -s 'scopes=["token-exchange"]' \
                      -s "policies=[\"${policy_name}\"]"; then
                      echo "⚠️  token exchange default permission update failed (no default resource): realm=$realm target=$target_client_id allowed=$allowed_client_id perm_id=$perm_id_default"
                    fi
                  fi
                else
                  echo "⚠️  token exchange default permission not found: ${perm_name_default}"
                fi

                perm_list_names="$($KCADM get "clients/$target_uuid/authz/resource-server/permission/scope" -r "$realm" 2>/dev/null | tr -d '\n' | sed -n 's/.*\"name\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' || true)"
                if [ -n "${perm_list_names:-}" ]; then
                  echo "ℹ️  token exchange permissions present: ${perm_list_names}"
                fi

                # Deep diagnostics for stubborn failures.
                authz_status="$($KCADM get "clients/$target_uuid" -r "$realm" 2>/dev/null | sed -n 's/.*\"authorizationServicesEnabled\"[[:space:]]*:[[:space:]]*\\([^,}]*\\).*/\\1/p' | head -n1 || true)"
                if [ -n "${authz_status:-}" ]; then
                  echo "ℹ️  token exchange authz enabled: ${authz_status}"
                fi
                scope_dump="$($KCADM get "clients/$target_uuid/authz/resource-server/scope" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                if [ -n "${scope_dump:-}" ]; then
                  echo "ℹ️  token exchange scopes dump: ${scope_dump}"
                fi
                resource_dump="$($KCADM get "clients/$target_uuid/authz/resource-server/resource" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                if [ -n "${resource_dump:-}" ]; then
                  echo "ℹ️  token exchange resources dump: ${resource_dump}"
                fi
                policy_dump="$($KCADM get "clients/$target_uuid/authz/resource-server/policy" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                if [ -n "${policy_dump:-}" ]; then
                  echo "ℹ️  token exchange policies dump: ${policy_dump}"
                fi
                perm_dump_all="$($KCADM get "clients/$target_uuid/authz/resource-server/permission" -r "$realm" 2>/dev/null | tr -d '\n' || true)"
                if [ -n "${perm_dump_all:-}" ]; then
                  echo "ℹ️  token exchange permissions dump: ${perm_dump_all}"
                fi
              }

              resolve_client_id() {
                local client_id="$1"
                local override_file="${CLIENT_ID_DIR:-/vault/secrets}/client-id-${client_id}"
                if [ -s "$override_file" ]; then
                  client_id="$(tr -d '\r\n' < "$override_file")"
                fi
                printf '%s' "$client_id"
              }

              apply_token_exchange_rules() {
                local rules="${KEYCLOAK_TOKEN_EXCHANGE_RULES:-}"
                local line=""
                local realm=""
                local rest=""
                local allowed=""
                local targets=""
                if [ -z "${rules//[[:space:]]/}" ]; then
                  return 0
                fi
                if login_with_admin; then
                  echo "ℹ️  token exchange: using admin auth for authz configuration"
                else
                  echo "⚠️  token exchange: admin auth unavailable; proceeding with client auth"
                fi
                while IFS= read -r line || [ -n "$line" ]; do
                  line="${line%%#*}"
                  line="$(printf '%s' "$line" | tr -d '\r')"
                  line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                  [ -z "$line" ] && continue
                  echo "ℹ️  token exchange rule: ${line}"
                  realm="$EXTERNAL_REALM"
                  rest="$line"
                  if printf '%s' "$line" | grep -q ':'; then
                    realm="${line%%:*}"
                    rest="${line#*:}"
                  fi
                  allowed="${rest%%=*}"
                  targets="${rest#*=}"
                  if [ -z "${allowed//[[:space:]]/}" ] || [ -z "${targets//[[:space:]]/}" ] || [ "$rest" = "$targets" ]; then
                    echo "⚠️  invalid token exchange rule: $line"
                    continue
                  fi
                  allowed="$(printf '%s' "$allowed" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                  allowed="$(resolve_client_id "$allowed")"
                  echo "ℹ️  token exchange resolved allowed=${allowed}"
                  IFS=',' read -r -a target_list <<< "$targets"
                  for target in "${target_list[@]}"; do
                    target="$(printf '%s' "$target" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                    [ -z "$target" ] && continue
                    target="$(resolve_client_id "$target")"
                    echo "ℹ️  token exchange resolved target=${target}"
                    enable_token_exchange_for_client "$realm" "$target" "$allowed"
                  done
                done <<< "$rules"
              }

              enable_token_exchange_for_client "$INTERNAL_REALM" "$DROOLS_SERVICE_CLIENT_ID" "$DROOLS_SERVICE_CLIENT_ID"
              log_progress "Applying token-exchange rules..."
              apply_token_exchange_rules

              set_client_flow_override() {
                local realm="$1"
                local clientId="$2"
                local flow="$3"
                local override=""
                if [ -z "${flow:-}" ]; then
                  echo "ℹ️  flow not set (skipping override for $clientId)"
                  return 0
                fi
                CID="$(client_uuid "$realm" "$clientId")"
                if [ -n "${CID:-}" ]; then
                  override=$($KCADM get "clients/$CID" -r "$realm" 2>/dev/null \
                    | tr -d "\n" \
                    | sed -n "s/.*\"authenticationFlowBindingOverrides\"[[:space:]]*:[[:space:]]*{[^}]*\"browser\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" \
                    | head -n1 || true)
                  if [ -n "${override:-}" ] && ! flow_alias_exists "$realm" "$override"; then
                    $KCADM update "clients/$CID" -r "$realm" -s "authenticationFlowBindingOverrides={}" >/dev/null 2>&1 || true
                    echo "ℹ️  cleared invalid browser flow override '$override' for $clientId"
                  fi
                  if ! flow_alias_exists "$realm" "$flow"; then
                    echo "ℹ️  flow not found: $flow (skipping override for $clientId)"
                    return 0
                  fi
                  if ! $KCADM get "authentication/flows/$flow" -r "$realm" >/dev/null 2>&1; then
                    echo "ℹ️  flow alias not resolvable: $flow (skipping override for $clientId)"
                    return 0
                  fi
                  if ! $KCADM update "clients/$CID" -r "$realm" \
                    -s "authenticationFlowBindingOverrides.browser=$flow" >/dev/null 2>&1; then
                    echo "⚠️  Unable to set browser flow override ($flow) for client $clientId; skipping."
                  fi
                else
                  echo "ℹ️  client not found: $clientId (skipping override)"
                fi
              }

              clear_client_flow_override() {
                local realm="$1"
                local clientId="$2"
                local expected_flow="${3:-}"
                local override=""
                CID="$(client_uuid "$realm" "$clientId")"
                if [ -z "${CID:-}" ]; then
                  return 0
                fi
                override=$($KCADM get "clients/$CID" -r "$realm" 2>/dev/null \
                  | tr -d "\n" \
                  | sed -n "s/.*\"authenticationFlowBindingOverrides\"[[:space:]]*:[[:space:]]*{[^}]*\"browser\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" \
                  | head -n1 || true)
                if [ -z "${override:-}" ]; then
                  return 0
                fi
                if [ -n "${expected_flow:-}" ] && [ "$override" != "$expected_flow" ]; then
                  return 0
                fi
                $KCADM update "clients/$CID" -r "$realm" -s "authenticationFlowBindingOverrides={}" >/dev/null 2>&1 || true
                echo "ℹ️  cleared browser flow override '$override' for $clientId"
              }
              
              # Optionally enforce GitHub-only for internal apps
              if [ "$INTERNAL_GITHUB_ONLY" = "true" ]; then
                set_client_flow_override "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "$FLOW_BROWSER_GH"
              else
                clear_client_flow_override "$INTERNAL_REALM" "$OPENWEBUI_CLIENT_ID" "$FLOW_BROWSER_GH"
              fi
              
              if [ "$CONFIGURATOR_DELETE_CLIENT" = "true" ]; then
                CID=$($KCADM get clients -r "$ADMIN_REALM" -q "clientId=$CONFIG_CLIENT_ID" --fields id --format csv 2>/dev/null | tail -n1 || true)
                if [ -n "${CID:-}" ]; then
                  $KCADM delete "clients/$CID" -r "$ADMIN_REALM" || true
                fi
              fi

              log_progress "Configurator script reached finalization."
              echo "✔ Configurator finished."
          volumeMounts:
            - name: keycloak-client-config-internal
              mountPath: /opt/keycloak/data/clients/internal
              readOnly: true
            - name: keycloak-client-config-external
              mountPath: /opt/keycloak/data/clients/external
              readOnly: true

      volumes:
        - name: keycloak-client-config-internal
          configMap:
            name: keycloak-client-config-internal
        - name: keycloak-client-config-external
          configMap:
            name: keycloak-client-config-external
            optional: true
