apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.114
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-bootstrap
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    teleport.dev/name: "keycloak-admin"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "keycloak-admin.teleport.app.suncoast.systems"
    teleport.dev/description: "Keycloak Admin Console"
    teleport.dev/path: "admin"
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
    teleport.dev/enroll: "true"
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-account-theme
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  theme.properties: |
    parent=keycloak.v3
    styles=css/account-lockdown.css
    scripts=js/account-lockdown.js
    logo=/public/blank-logo.svg
  content.json: |
    [
      { "label": "personalInfo", "path": "" },
      {
        "label": "accountSecurity",
        "children": [
          { "label": "signingIn", "path": "account-security/signing-in" },
          { "label": "deviceActivity", "path": "account-security/device-activity" },
          {
            "label": "linkedAccounts",
            "path": "account-security/linked-accounts",
            "isVisible": "isLinkedAccountsEnabled"
          }
        ]
      },
      {
        "label": "organizations",
        "path": "organizations",
        "isVisible": "isViewOrganizationsEnabled"
      },
      {
        "label": "resources",
        "path": "resources",
        "isVisible": "isMyResourcesEnabled"
      },
      {
        "label": "oid4vci",
        "path": "oid4vci",
        "isVisible":"isOid4VciEnabled"
      }
    ]
  messages_en.properties: |
    personalInfoDescription=Your profile information is managed by your linked identity provider. To make changes, update the identity provider profile and then sign in again.
    signingInDescription=Manage second-factor sign-in methods. Password setup and profile editing are disabled in this account page.
    linkedAccountsIntroMessage=Link additional login providers here. Unlinking providers is disabled in this account page.
  blank-logo.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="1" height="1" viewBox="0 0 1 1" aria-hidden="true"></svg>
  account-lockdown.css: |
    #save-btn,
    #cancel-btn,
    #update-email-btn,
    #delete-account-btn,
    [data-testid="applications"],
    [data-testid="options-toggle"],
    [data-testid="options-kebab-toggle"],
    [id$="-idp-unlink"] {
      display: none !important;
    }

    #suncoast-account-readonly-note {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-left: 4px solid #2b9af3;
      background: #f0f8ff;
      color: #1f1f1f;
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    #suncoast-idp-profile-panel {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #d2dbe5;
      background: #f8fafc;
      color: #1f2933;
      border-radius: 6px;
    }

    #suncoast-idp-profile-panel h3 {
      margin: 0 0 0.6rem 0;
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    #suncoast-idp-profile-panel .suncoast-idp-help {
      margin: 0 0 0.6rem 0;
      color: #334155;
      font-size: 0.9rem;
    }

    #suncoast-idp-profile-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #suncoast-idp-profile-panel th,
    #suncoast-idp-profile-panel td {
      padding: 0.45rem 0.4rem;
      vertical-align: top;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    #suncoast-idp-profile-panel th {
      width: 32%;
      color: #0f172a;
      font-weight: 600;
      white-space: nowrap;
    }

    #suncoast-idp-profile-panel td {
      color: #1f2937;
      word-break: break-word;
    }

    #suncoast-idp-profile-panel .suncoast-idp-empty {
      color: #475569;
      font-style: italic;
      margin: 0.3rem 0 0;
    }

    #suncoast-account-roles-panel {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #d2dbe5;
      background: #f8fafc;
      color: #1f2933;
      border-radius: 6px;
    }

    #suncoast-account-roles-panel h3 {
      margin: 0 0 0.45rem 0;
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    #suncoast-account-roles-panel .suncoast-roles-help {
      margin: 0 0 0.55rem 0;
      color: #334155;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    #suncoast-account-roles-panel .suncoast-roles-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    #suncoast-account-roles-panel .suncoast-roles-summary-item {
      border: 1px solid #dbe5ef;
      border-radius: 0.45rem;
      background: #ffffff;
      padding: 0.4rem 0.45rem;
      min-height: 3.2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #suncoast-account-roles-panel .suncoast-roles-summary-label {
      font-size: 0.72rem;
      color: #475569;
      margin-bottom: 0.12rem;
    }

    #suncoast-account-roles-panel .suncoast-roles-summary-value {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
    }

    #suncoast-account-roles-panel .suncoast-roles-list-wrapper {
      display: grid;
      gap: 0.5rem;
    }

    #suncoast-account-roles-panel .suncoast-roles-list-title {
      margin: 0;
      font-size: 0.84rem;
      font-weight: 600;
      color: #0f172a;
    }

    #suncoast-account-roles-panel .suncoast-roles-list {
      margin: 0;
      padding: 0.45rem;
      border: 1px solid #dbe5ef;
      border-radius: 0.45rem;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 0.34rem;
      max-height: 10.5rem;
      overflow: auto;
    }

    #suncoast-account-roles-panel .suncoast-role-chip {
      display: inline-block;
      border: 1px solid #d0d7e2;
      border-radius: 999px;
      background: #f8fafc;
      color: #111827;
      padding: 0.14rem 0.45rem;
      font-size: 0.72rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    #suncoast-account-roles-panel .suncoast-roles-empty {
      margin: 0;
      color: #64748b;
      font-style: italic;
      font-size: 0.82rem;
    }

    #suncoast-account-roles-panel .suncoast-roles-tree {
      margin: 0;
      padding-left: 1rem;
      display: grid;
      gap: 0.35rem;
      color: #1f2937;
      font-size: 0.82rem;
      line-height: 1.3;
    }

    #suncoast-account-roles-panel .suncoast-roles-tree li::marker {
      color: #475569;
    }

    #suncoast-account-roles-panel .suncoast-membership-source {
      display: grid;
      gap: 0.45rem;
    }

    #suncoast-account-roles-panel .suncoast-membership-source + .suncoast-membership-source {
      padding-top: 0.65rem;
      border-top: 1px solid #e2e8f0;
    }

    #suncoast-account-roles-panel .suncoast-roles-note {
      margin: 0.3rem 0 0;
      font-size: 0.78rem;
      color: #475569;
    }

    #suncoast-account-roles-section {
      scroll-margin-top: 5.5rem;
    }

    #suncoast-account-roles-jump-link,
    #suncoast-account-roles-jump-link:visited,
    #suncoast-account-roles-jump-link:hover,
    #suncoast-account-roles-jump-link:focus,
    #suncoast-account-roles-jump-link:active {
      color: inherit !important;
      text-decoration: none !important;
    }

    @media (max-width: 860px) {
      #suncoast-account-roles-panel .suncoast-roles-summary {
        grid-template-columns: 1fr;
      }
    }

    #suncoast-account-return-link {
      display: none !important;
    }
  account-lockdown.js: |
    (function () {
      "use strict";

      var NOTE_ID = "suncoast-account-readonly-note";
      var IDP_PANEL_ID = "suncoast-idp-profile-panel";
      var RETURN_LINK_ID = "suncoast-account-return-link";
      var NOTE_TEXT = "Profile edits are disabled. Update your linked identity provider to change your name, email, or other profile details.";
      var PROFILE_FIELDS = [
        "username",
        "email",
        "firstName",
        "lastName",
        "name",
        "given_name",
        "family_name",
        "preferred_username",
        "locale",
        "email_verified",
        "phone_number",
        "phone_number_verified",
        "device_id",
        "profile",
        "website",
        "picture",
        "company",
        "location",
        "bio",
        "twitter_username",
        "hd",
        "google_sub",
        "github_id",
        "github_node_id"
      ];
      var SIGN_OUT_LABELS = {
        "Sign out": true,
        "Sign out all devices": true
      };
      var accountProfilePromise = null;
      var idpProfileRouteKey = "";
      var idpProfileFetchStarted = false;
      var ROLES_PANEL_ID = "suncoast-account-roles-panel";
      var ROLES_SECTION_ANCHOR_ID = "suncoast-account-roles-section";
      var ROLES_JUMP_LINK_ID = "suncoast-account-roles-jump-link";
      var ROLES_LOADING_TEXT = "Loading role memberships...";
      var ROLES_UNAVAILABLE_TEXT = "Role details are unavailable for this account.";
      var ROLES_INHERITANCE_UNAVAILABLE_TEXT = "Composite inheritance details are unavailable.";
      var ROLES_IDP_LOOKUP_UNAVAILABLE_TEXT =
        "Live identity-provider membership lookup is unavailable.";
      var ROLES_HELP_TEXT =
        "Roles are resolved live from the identity-provider teams and groups currently linked to this account.";
      var rolesStatePromise = null;
      var rolesRouteKey = "";
      var rolesFetchStarted = false;
      var rolesLastResolvedState = null;

      function hideElement(el) {
        if (!el) {
          return;
        }
        el.style.display = "none";
        el.setAttribute("aria-hidden", "true");
      }

      function hideSelectors() {
        var selectors = [
          "#save-btn",
          "#cancel-btn",
          "#update-email-btn",
          "#delete-account-btn",
          "[data-testid='applications']",
          "[data-testid='options-toggle']",
          "[data-testid='options-kebab-toggle']",
          "[id$='-idp-unlink']"
        ];
        selectors.forEach(function (selector) {
          document.querySelectorAll(selector).forEach(hideElement);
        });
      }

      function isPersonalInfoPage() {
        var path = window.location.pathname || "";
        var hash = (window.location.hash || "").toLowerCase();
        if (!/\/account(?:\/|$)/.test(path)) {
          return false;
        }
        if (/\/account-security(?:\/|$)/.test(path) || /\/groups(?:\/|$)/.test(path) || /\/organizations(?:\/|$)/.test(path) || /\/resources(?:\/|$)/.test(path) || /\/oid4vci(?:\/|$)/.test(path) || /\/applications(?:\/|$)/.test(path)) {
          return false;
        }
        var hashRoute = hash.replace(/^#\/?/, "").replace(/^\/+/, "");
        if (!hashRoute) {
          return true;
        }
        if (
          hashRoute.indexOf("personal-info") === 0 ||
          hashRoute.indexOf(ROLES_SECTION_ANCHOR_ID.toLowerCase()) !== -1
        ) {
          return true;
        }
        var blockedPrefixes = ["account-security", "groups", "organizations", "resources", "oid4vci", "applications"];
        for (var i = 0; i < blockedPrefixes.length; i += 1) {
          var prefix = blockedPrefixes[i];
          if (hashRoute === prefix || hashRoute.indexOf(prefix + "/") === 0) {
            return false;
          }
        }
        return true;
      }

      function hidePasswordWidgets() {
        var passwordSelectors = [
          "[data-testid='password/title']",
          "[data-testid='password/help']",
          "[data-testid='password/help-text']",
          "[data-testid='password/create']",
          "[data-testid='password/credential-list']",
          "[data-testid='password/not-set-up']"
        ];
        passwordSelectors.forEach(function (selector) {
          document.querySelectorAll(selector).forEach(function (el) {
            var section = el.closest("section");
            hideElement(section || el);
          });
        });
      }

      function hideSignOutButtons() {
        document.querySelectorAll("button").forEach(function (button) {
          var text = (button.textContent || "").trim();
          if (SIGN_OUT_LABELS[text]) {
            hideElement(button);
          }
        });
      }

      function hideDeviceSignOutControls() {
        if (!/\/account-security\/device-activity/.test(window.location.pathname)) {
          return;
        }
        document.querySelectorAll(".pf-v5-c-page__main-section button").forEach(function (button) {
          if (button.id === "refresh-page") {
            return;
          }
          hideElement(button);
        });
      }

      function findPersonalInfoContainer() {
        var root =
          document.querySelector("[role='main']") ||
          document.querySelector("main") ||
          document.body;
        if (!root) {
          return null;
        }

        var candidates = [];

        function addCandidate(node) {
          if (!node) {
            return;
          }
          if (candidates.indexOf(node) !== -1) {
            return;
          }
          candidates.push(node);
        }

        var selectors = [
          "[data-testid='personal-info-form']",
          "[data-testid='personal-info']",
          "[data-testid='personalInfo']",
          "[data-testid='page-user-profile']",
          "[data-testid='user-profile']",
          "form[data-testid='personal-info-form']",
          "[data-testid='personal-info'] form",
          "form"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var matches = root.querySelectorAll(selectors[i]);
          for (var m = 0; m < matches.length; m += 1) {
            addCandidate(matches[m]);
          }
        }

        function hasAnyField(node, selectorsList) {
          if (!node) {
            return false;
          }
          for (var idx = 0; idx < selectorsList.length; idx += 1) {
            if (node.querySelector(selectorsList[idx])) {
              return true;
            }
          }
          return false;
        }

        function scoreCandidate(node) {
          if (!node || typeof node.querySelector !== "function") {
            return 0;
          }
          var score = 0;
          if (node.matches && node.matches("form")) {
            score += 2;
          }
          if (
            hasAnyField(node, [
              "input[name='username']",
              "input[id='username']",
              "input[id*='username']",
              "input[name='preferred_username']",
              "input[id*='preferred']"
            ])
          ) {
            score += 4;
          }
          if (
            hasAnyField(node, [
              "input[name='email']",
              "input[id='email']",
              "input[id*='email']"
            ])
          ) {
            score += 4;
          }
          if (
            hasAnyField(node, [
              "input[name='firstName']",
              "input[id*='first']",
              "input[name='given_name']"
            ])
          ) {
            score += 2;
          }
          if (
            hasAnyField(node, [
              "input[name='lastName']",
              "input[id*='last']",
              "input[name='family_name']"
            ])
          ) {
            score += 2;
          }
          if (
            hasAnyField(node, [
              "select[name='locale']",
              "input[name='locale']"
            ])
          ) {
            score += 1;
          }
          var text = (node.textContent || "").toLowerCase();
          if (text.indexOf("personal info") !== -1 || text.indexOf("personal information") !== -1) {
            score += 1;
          }
          return score;
        }

        var best = null;
        var bestScore = 0;
        for (var c = 0; c < candidates.length; c += 1) {
          var candidate = candidates[c];
          var score = scoreCandidate(candidate);
          if (score > bestScore) {
            best = candidate;
            bestScore = score;
          }
        }

        if (best) {
          return best;
        }

        var existingPanel = document.getElementById(ROLES_PANEL_ID);
        if (existingPanel && existingPanel.parentElement) {
          return existingPanel.parentElement;
        }

        return null;
      }

      function findPersonalInfoInsertAnchor(container) {
        if (!container) {
          return null;
        }
        if (container.matches && container.matches("form")) {
          return container;
        }
        var form = container.querySelector("form");
        if (form) {
          return form;
        }
        return container.firstElementChild || null;
      }

      function addReadonlyNote() {
        if (!isPersonalInfoPage()) {
          return;
        }
        if (document.getElementById(NOTE_ID)) {
          return;
        }
        var container = findPersonalInfoContainer();
        if (!container) {
          return;
        }
        var anchor = findPersonalInfoInsertAnchor(container);
        var parent = container;
        if (anchor && anchor.parentElement && anchor.parentElement !== container) {
          parent = anchor.parentElement;
        }
        var note = document.createElement("div");
        note.id = NOTE_ID;
        note.textContent = NOTE_TEXT;
        parent.insertBefore(note, anchor || null);
      }

      function lockPersonalInfoFields() {
        if (!isPersonalInfoPage()) {
          return;
        }
        document.querySelectorAll("form input, form textarea").forEach(function (field) {
          field.setAttribute("readonly", "readonly");
          field.setAttribute("aria-readonly", "true");
        });
        document.querySelectorAll("form select").forEach(function (field) {
          field.setAttribute("disabled", "disabled");
          field.setAttribute("aria-disabled", "true");
        });
      }

      function getRealmFromPath() {
        var match = window.location.pathname.match(/\/realms\/([^/]+)\//);
        if (!match || !match[1]) {
          return "";
        }
        try {
          return decodeURIComponent(match[1]);
        } catch (err) {
          return match[1];
        }
      }

      function getQueryParam(name) {
        if (!name) {
          return "";
        }
        try {
          var params = new URLSearchParams(window.location.search || "");
          return (params.get(name) || "").trim();
        } catch (err) {
          var escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var regex = new RegExp("[?&]" + escapedName + "=([^&#]*)");
          var match = regex.exec(window.location.search || "");
          if (!match || !match[1]) {
            return "";
          }
          try {
            return decodeURIComponent(match[1].replace(/\+/g, " ")).trim();
          } catch (decodeErr) {
            return match[1].trim();
          }
        }
      }

      function parseUrl(value) {
        if (!value || typeof value !== "string") {
          return null;
        }
        try {
          return new URL(value, window.location.origin);
        } catch (err) {
          return null;
        }
      }

      function isAllowedReturnUrl(url) {
        if (!url) {
          return false;
        }
        var protocol = (url.protocol || "").toLowerCase();
        var host = (url.hostname || "").toLowerCase();
        if (protocol === "http:" && (host === "localhost" || host === "127.0.0.1")) {
          return true;
        }
        if (protocol !== "https:") {
          return false;
        }
        return (
          host === "suncoast.systems" ||
          host === "localhost" ||
          host === "127.0.0.1" ||
          /\.suncoast\.systems$/.test(host)
        );
      }

      function resolveReturnToUrl() {
        var fromQuery = getQueryParam("referrer_uri");
        var parsedQuery = parseUrl(fromQuery);
        if (isAllowedReturnUrl(parsedQuery)) {
          return parsedQuery.toString();
        }

        var fromReferrer = (document.referrer || "").trim();
        var parsedReferrer = parseUrl(fromReferrer);
        if (isAllowedReturnUrl(parsedReferrer)) {
          return parsedReferrer.toString();
        }

        return "";
      }

      function findHeaderActionsContainer() {
        var selectors = [
          "[data-testid='page-header-toolbar']",
          ".pf-v5-c-page__header-tools",
          ".pf-v5-c-masthead__content",
          "header .pf-v5-c-toolbar__content",
          "header"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var match = document.querySelector(selectors[i]);
          if (match) {
            return match;
          }
        }
        return null;
      }

      function findFallbackReturnLinkContainer() {
        var selectors = [
          "[role='main']",
          "main",
          ".pf-v5-c-page__main",
          "body"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var match = document.querySelector(selectors[i]);
          if (match) {
            return match;
          }
        }
        return document.body || null;
      }

      function ensureReturnToHeaderLink() {
        var existing = document.getElementById(RETURN_LINK_ID);
        if (existing && existing.parentElement) {
          existing.parentElement.removeChild(existing);
        }
      }

      function looksLikeJwt(value) {
        return typeof value === "string" && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(value);
      }

      function tokenFromObject(value) {
        if (!value || typeof value !== "object") {
          return "";
        }
        var keys = ["access_token", "accessToken", "token", "id_token", "idToken"];
        for (var i = 0; i < keys.length; i += 1) {
          var token = value[keys[i]];
          if (looksLikeJwt(token)) {
            return token;
          }
        }
        return "";
      }

      function safeJsonParse(raw) {
        if (!raw || typeof raw !== "string") {
          return null;
        }
        try {
          return JSON.parse(raw);
        } catch (err) {
          return null;
        }
      }

      function normalizeString(value) {
        if (typeof value !== "string") {
          return "";
        }
        return value.trim();
      }

      function decodeBase64UrlSegment(value) {
        if (!value || typeof value !== "string") {
          return "";
        }
        var normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        while (normalized.length % 4 !== 0) {
          normalized += "=";
        }
        try {
          return atob(normalized);
        } catch (err) {
          return "";
        }
      }

