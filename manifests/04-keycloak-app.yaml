              aliases.push(alias);
            });
            if (!aliases.length && fallbackProviderAlias) {
              aliases.push(fallbackProviderAlias);
            }
            return aliases;
          })
          .catch(function () {
            if (fallbackProviderAlias) {
              return [fallbackProviderAlias];
            }
            return [];
          });
      }

      function fetchGithubRolesFromToken(brokerToken) {
        if (!brokerToken) {
          return Promise.resolve([]);
        }
        return requestJsonExternal("https://api.github.com/user/teams?per_page=100", brokerToken, {
          "X-GitHub-Api-Version": "2022-11-28",
          "Accept": "application/vnd.github+json"
        }).then(function (teams) {
          if (!Array.isArray(teams)) {
            return [];
          }
          var roleNames = [];
          teams.forEach(function (team) {
            if (!team || typeof team !== "object") {
              return;
            }
            var roleName = normalizeRoleName(team.slug || team.name || "");
            if (!roleName || roleNames.indexOf(roleName) !== -1) {
              return;
            }
            roleNames.push(roleName);
          });
          return roleNames;
        });
      }

      function fetchGoogleRolesFromToken(brokerToken) {
        if (!brokerToken) {
          return Promise.resolve([]);
        }
        var roleNames = [];
        var payload = parseJwtPayload(brokerToken);
        addRoleNamesFromClaims(roleNames, payload);
        return requestJsonExternal("https://www.googleapis.com/oauth2/v3/userinfo", brokerToken)
          .then(function (userinfo) {
            addRoleNamesFromClaims(roleNames, userinfo);
            return roleNames;
          })
          .catch(function () {
            return roleNames;
          });
      }

      function fetchGenericRolesFromToken(brokerToken) {
        if (!brokerToken) {
          return Promise.resolve([]);
        }
        var roleNames = [];
        var payload = parseJwtPayload(brokerToken);
        addRoleNamesFromClaims(roleNames, payload);
        return Promise.resolve(roleNames);
      }

      function fetchProviderRoles(realm, providerAlias, token) {
        var alias = normalizeProviderAlias(providerAlias);
        if (!alias) {
          return Promise.resolve([]);
        }
        return requestBrokerToken(realm, alias, token).then(function (brokerToken) {
          if (!brokerToken) {
            throw new Error("Missing broker token");
          }
          if (alias.indexOf("github") !== -1) {
            return fetchGithubRolesFromToken(brokerToken);
          }
          if (alias.indexOf("google") !== -1) {
            return fetchGoogleRolesFromToken(brokerToken);
          }
          return fetchGenericRolesFromToken(brokerToken);
        });
      }

      function fetchIdpDirectRoles(realm, token, fallbackProviderAlias) {
        return fetchLinkedProviderAliases(realm, token, fallbackProviderAlias).then(function (aliases) {
          if (!Array.isArray(aliases) || !aliases.length) {
            return {
              roles: [],
              lookupAvailable: false
            };
          }
          var providerRequests = aliases.map(function (alias) {
            return fetchProviderRoles(realm, alias, token).then(function (providerRoles) {
              return {
                ok: true,
                roles: Array.isArray(providerRoles) ? providerRoles : []
              };
            }).catch(function () {
              return {
                ok: false,
                roles: []
              };
            });
          });
          return Promise.all(providerRequests).then(function (results) {
            var roleNames = [];
            var lookupAvailable = false;
            results.forEach(function (providerResult) {
              if (providerResult && providerResult.ok) {
                lookupAvailable = true;
              }
              var providerRoles = providerResult && Array.isArray(providerResult.roles)
                ? providerResult.roles
                : [];
              if (!Array.isArray(providerRoles)) {
                return;
              }
              providerRoles.forEach(function (roleName) {
                var normalized = normalizeRoleName(roleName);
                if (!normalized || roleNames.indexOf(normalized) !== -1) {
                  return;
                }
                roleNames.push(normalized);
              });
            });
            return {
              roles: roleEntriesFromNames(roleNames),
              lookupAvailable: lookupAvailable
            };
          });
        });
      }

      function parseDirectRolesFromMappings(mappingsResponse) {
        var directRoles = [];
        if (!mappingsResponse || typeof mappingsResponse !== "object") {
          return directRoles;
        }

        var realmMappings = Array.isArray(mappingsResponse.realmMappings)
          ? mappingsResponse.realmMappings
          : [];
        realmMappings.forEach(function (entry) {
          var roleName = normalizeString(entry && entry.name);
          if (!roleName) {
            return;
          }
          directRoles.push({
            scope: "realm",
            clientId: "",
            clientUuid: "",
            role: roleName,
            composite: Boolean(entry && entry.composite)
          });
        });

        var clientMappings =
          mappingsResponse.clientMappings &&
          typeof mappingsResponse.clientMappings === "object" &&
          !Array.isArray(mappingsResponse.clientMappings)
            ? mappingsResponse.clientMappings
            : {};
        Object.keys(clientMappings).forEach(function (key) {
          var clientEntry = clientMappings[key];
          if (!clientEntry || typeof clientEntry !== "object" || Array.isArray(clientEntry)) {
            return;
          }
          var clientId = normalizeString(clientEntry.client) || normalizeString(key);
          var clientUuid = normalizeString(clientEntry.id);
          var mappings = Array.isArray(clientEntry.mappings) ? clientEntry.mappings : [];
          mappings.forEach(function (mappingRole) {
            var roleName = normalizeString(mappingRole && mappingRole.name);
            if (!roleName || !clientId) {
              return;
            }
            directRoles.push({
              scope: "client",
              clientId: clientId,
              clientUuid: clientUuid,
              role: roleName,
              composite: Boolean(mappingRole && mappingRole.composite)
            });
          });
        });

        return directRoles;
      }

      function fetchCompositeChildrenForRole(realm, token, roleEntry, clientIdLookup) {
        if (!roleEntry || !roleEntry.composite) {
          return Promise.resolve([]);
        }
        var realmName = normalizeString(realm);
        if (!realmName) {
          return Promise.resolve([]);
        }

        var baseAdmin = window.location.origin + "/admin/realms/" + encodeURIComponent(realmName);
        var endpoint = "";
        if (roleEntry.scope === "realm") {
          endpoint =
            baseAdmin + "/roles/" + encodeURIComponent(roleEntry.role) + "/composites?briefRepresentation=true";
        } else if (roleEntry.scope === "client" && roleEntry.clientUuid) {
          endpoint =
            baseAdmin +
            "/clients/" +
            encodeURIComponent(roleEntry.clientUuid) +
            "/roles/" +
            encodeURIComponent(roleEntry.role) +
            "/composites?briefRepresentation=true";
        } else {
          return Promise.resolve([]);
        }

        return requestJson(endpoint, token)
          .then(function (composites) {
            if (!Array.isArray(composites)) {
              return [];
            }
            return composites
              .map(function (entry) {
                if (!entry || typeof entry !== "object") {
                  return null;
                }
                var roleName = normalizeString(entry.name);
                if (!roleName) {
                  return null;
                }
                if (entry.clientRole) {
                  var compositeContainerId = normalizeString(entry.containerId);
                  var compositeClientId =
                    (clientIdLookup &&
                      Object.prototype.hasOwnProperty.call(clientIdLookup, compositeContainerId) &&
                      normalizeString(clientIdLookup[compositeContainerId])) ||
                    compositeContainerId;
                  return {
                    scope: "client",
                    clientId: compositeClientId,
                    role: roleName
                  };
                }
                return {
                  scope: "realm",
                  clientId: "",
                  role: roleName
                };
              })
              .filter(Boolean);
          })
          .catch(function () {
            return [];
          });
      }

      function buildCompositeTree(realm, token, directRoles) {
        if (!Array.isArray(directRoles) || !directRoles.length) {
          return Promise.resolve({ available: false, edges: [] });
        }

        var directCompositeRoles = directRoles.filter(function (roleEntry) {
          return Boolean(roleEntry && roleEntry.composite);
        });
        if (!directCompositeRoles.length) {
          return Promise.resolve({ available: true, edges: [] });
        }

        var clientIdLookup = {};
        directRoles.forEach(function (roleEntry) {
          if (!roleEntry || roleEntry.scope !== "client") {
            return;
          }
          var roleClientUuid = normalizeString(roleEntry.clientUuid);
          var roleClientId = normalizeString(roleEntry.clientId);
          if (!roleClientUuid || !roleClientId) {
            return;
          }
          clientIdLookup[roleClientUuid] = roleClientId;
        });

        var requests = directCompositeRoles.map(function (roleEntry) {
          return fetchCompositeChildrenForRole(realm, token, roleEntry, clientIdLookup).then(function (children) {
            return {
              parent: roleEntry,
              children: children
            };
          });
        });

        return Promise.all(requests)
          .then(function (edges) {
            return { available: true, edges: edges };
          })
          .catch(function () {
            return { available: false, edges: [] };
          });
      }

      function fetchAccountProfile() {
        if (accountProfilePromise) {
          return accountProfilePromise;
        }
        var realm = getRealmFromPath();
        if (!realm) {
          accountProfilePromise = Promise.resolve(null);
          return accountProfilePromise;
        }

        var base = window.location.origin + "/realms/" + encodeURIComponent(realm) + "/account";
        var endpoints = [
          base + "/?userProfileMetadata=true",
          base + "/",
          base
        ];
        var token = findAccountAccessToken();

        function tryEndpoint(index, useToken) {
          if (index >= endpoints.length) {
            if (useToken && token) {
              return tryEndpoint(0, false);
            }
            return Promise.resolve(null);
          }
          var accessToken = useToken ? token : "";
          return requestAccountProfile(endpoints[index], accessToken).catch(function () {
            return tryEndpoint(index + 1, useToken);
          });
        }

        accountProfilePromise = tryEndpoint(0, true);
        return accountProfilePromise;
      }

      function toDisplayString(value) {
        if (value === null || typeof value === "undefined") {
          return "";
        }
        if (Array.isArray(value)) {
          return value
            .filter(function (entry) {
              return entry !== null && typeof entry !== "undefined" && String(entry).trim() !== "";
            })
            .map(function (entry) {
              return String(entry);
            })
            .join(", ");
        }
        if (typeof value === "boolean") {
          return value ? "true" : "false";
        }
        if (typeof value === "object") {
          try {
            return JSON.stringify(value);
          } catch (err) {
            return String(value);
          }
        }
        return String(value);
      }

      function extractProfileFields(profile) {
        if (!profile || typeof profile !== "object") {
          return [];
        }
        var attributes = profile.attributes && typeof profile.attributes === "object" ? profile.attributes : {};
        var rows = [];
        PROFILE_FIELDS.forEach(function (field) {
          var value = "";
          if (Object.prototype.hasOwnProperty.call(profile, field)) {
            value = toDisplayString(profile[field]);
          } else if (Object.prototype.hasOwnProperty.call(attributes, field)) {
            value = toDisplayString(attributes[field]);
          }
          if (value) {
            rows.push({ key: field, value: value });
          }
        });

        if (Object.keys(attributes).length) {
          Object.keys(attributes)
            .sort()
            .forEach(function (key) {
              if (PROFILE_FIELDS.indexOf(key) !== -1) {
                return;
              }
              var extraValue = toDisplayString(attributes[key]);
              if (!extraValue) {
                return;
              }
              rows.push({ key: key, value: extraValue });
            });
        }

        return rows;
      }

      function currentRouteKey() {
        return (window.location.pathname || "") + "|" + (window.location.hash || "");
      }

      function renderIdpProfilePanel(profile) {
        if (!isPersonalInfoPage()) {
          return;
        }
        var container = findPersonalInfoContainer();
        if (!container) {
          return;
        }
        var rows = extractProfileFields(profile);
        var existingPanel = document.getElementById(IDP_PANEL_ID);

        if (!rows.length) {
          if (existingPanel && existingPanel.parentElement) {
            existingPanel.parentElement.removeChild(existingPanel);
          }
          return;
        }

        var rowsSignature = JSON.stringify(rows);
        if (existingPanel && existingPanel.getAttribute("data-rows-signature") === rowsSignature) {
          return;
        }

        var panel = existingPanel || document.createElement("section");
        panel.id = IDP_PANEL_ID;
        panel.setAttribute("data-rows-signature", rowsSignature);
        panel.replaceChildren();

        var title = document.createElement("h3");
        title.textContent = "IdP Profile Data";
        panel.appendChild(title);

        var table = document.createElement("table");
        var tbody = document.createElement("tbody");
        rows.forEach(function (row) {
          var tr = document.createElement("tr");
          var th = document.createElement("th");
          th.textContent = row.key;
          var td = document.createElement("td");
          td.textContent = row.value;
          tr.appendChild(th);
          tr.appendChild(td);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        panel.appendChild(table);

        if (!existingPanel) {
          var note = document.getElementById(NOTE_ID);
          var anchor = findPersonalInfoInsertAnchor(container);
          var parent = container;
          if (anchor && anchor.parentElement && anchor.parentElement !== container) {
            parent = anchor.parentElement;
          }
          if (note && note.parentElement === parent && note.nextSibling) {
            parent.insertBefore(panel, note.nextSibling);
          } else {
            parent.insertBefore(panel, anchor || null);
          }
        }
      }

      function findRolesJumpTarget() {
        var panel = document.getElementById(ROLES_PANEL_ID);
        if (!panel) {
          return null;
        }
        var anchor = panel.querySelector("#" + ROLES_SECTION_ANCHOR_ID);
        return anchor || panel;
      }

      function ensureRolesJumpLink() {
        function bindRolesJumpAction(control) {
          if (!control) {
            return;
          }
          if (control.getAttribute("data-suncoast-roles-bound") === "true") {
            return;
          }
          control.setAttribute("data-suncoast-roles-bound", "true");
          control.addEventListener("click", function (event) {
            event.preventDefault();
            var targetPanel = document.getElementById(ROLES_PANEL_ID);
            if (targetPanel && typeof targetPanel.scrollIntoView === "function") {
              targetPanel.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        }

        if (!isPersonalInfoPage()) {
          var existing = document.getElementById(ROLES_JUMP_LINK_ID);
          if (existing && existing.parentElement) {
            var existingListItem = existing.closest("li");
            if (existingListItem && existingListItem.parentElement) {
              existingListItem.parentElement.removeChild(existingListItem);
            } else {
              existing.parentElement.removeChild(existing);
            }
          }
          return;
        }

        var target = findRolesJumpTarget();
        if (!target) {
          return;
        }

        var existingLink = document.getElementById(ROLES_JUMP_LINK_ID);
        if (existingLink) {
          if (existingLink.tagName.toLowerCase() !== "button") {
            var replacement = document.createElement("button");
            replacement.type = "button";
            replacement.id = ROLES_JUMP_LINK_ID;
            replacement.className = existingLink.className || "pf-v5-c-nav__link";
            replacement.textContent = existingLink.textContent || "Roles";
            replacement.setAttribute("aria-label", "Roles");
            if (existingLink.parentElement) {
              existingLink.parentElement.replaceChild(replacement, existingLink);
              existingLink = replacement;
            }
          }
          existingLink.removeAttribute("href");
          bindRolesJumpAction(existingLink);
          return;
        }

        var jumpLists = [
          "[data-testid='jump-to-section'] ul",
          "[data-testid='jumpToSection'] ul",
          "nav[aria-label='Jump to section'] ul",
          "[aria-label='Jump to section'] ul"
        ];
        var list = null;
        for (var i = 0; i < jumpLists.length; i += 1) {
          list = document.querySelector(jumpLists[i]);
          if (list) {
            break;
          }
        }
        if (!list) {
          return;
        }

        var templateInteractive = list.querySelector("a, button, [role='link'], [role='button']");
        var templateListItem = templateInteractive
          ? templateInteractive.closest("li")
          : list.querySelector("li");
        var listItem = templateListItem
          ? templateListItem.cloneNode(true)
          : document.createElement("li");
        if (!templateListItem) {
          listItem.className = "pf-v5-c-nav__item";
        }
        if (listItem.classList) {
          listItem.classList.remove("pf-m-current", "active");
        }
        listItem.removeAttribute("aria-current");

        var control = listItem.querySelector("a, button, [role='link'], [role='button']");
        var controlClassName = control && control.className ? control.className : "pf-v5-c-nav__link";
        var controlElement = document.createElement("button");
        controlElement.type = "button";
        controlElement.className = controlClassName;
        if (control && control.parentElement === listItem) {
          listItem.replaceChild(controlElement, control);
        } else {
          listItem.appendChild(controlElement);
        }
        control = controlElement;
        if (control.classList) {
          control.classList.remove("pf-m-current", "active");
        }
        control.removeAttribute("aria-current");

        control.id = ROLES_JUMP_LINK_ID;
        control.textContent = "Roles";
        control.setAttribute("aria-label", "Roles");
        control.removeAttribute("href");
        bindRolesJumpAction(control);

        if (!listItem.contains(control)) {
          listItem.appendChild(control);
        }

        var personalInfoItem = null;
        var navItems = list.querySelectorAll("li");
        for (var navIndex = 0; navIndex < navItems.length; navIndex += 1) {
          var navItem = navItems[navIndex];
          var navControl = navItem.querySelector("a, button, [role='link'], [role='button']");
          if (!navControl) {
            continue;
          }
          var navText = (navControl.textContent || "").trim().toLowerCase();
          if (navText === "personal info" || navText === "personalinfo") {
            personalInfoItem = navItem;
            break;
          }
        }
        if (personalInfoItem && personalInfoItem.parentElement === list) {
          if (personalInfoItem.nextSibling) {
            list.insertBefore(listItem, personalInfoItem.nextSibling);
          } else {
            list.appendChild(listItem);
          }
        } else {
          list.appendChild(listItem);
        }
      }

      function renderRoleList(container, roles, emptyText) {
        if (!container) {
          return;
        }
        container.replaceChildren();
        if (!Array.isArray(roles) || roles.length === 0) {
          var empty = document.createElement("p");
          empty.className = "suncoast-roles-empty";
          empty.textContent = emptyText;
          container.appendChild(empty);
          return;
        }
        roles.forEach(function (entry) {
          var chip = document.createElement("span");
          chip.className = "suncoast-role-chip";
          chip.textContent = roleDisplayName(entry);
          container.appendChild(chip);
        });
      }

      function renderCompositeTree(container, compositeTree) {
        if (!container) {
          return;
        }
        container.replaceChildren();
        if (
          !compositeTree ||
          typeof compositeTree !== "object" ||
          !Array.isArray(compositeTree.edges) ||
          compositeTree.edges.length === 0
        ) {
          var none = document.createElement("p");
          none.className = "suncoast-roles-empty";
          none.textContent = "No composite role expansion detected.";
          container.appendChild(none);
          return;
        }

        var list = document.createElement("ul");
        list.className = "suncoast-roles-tree";
        compositeTree.edges.forEach(function (edge) {
          if (!edge || !edge.parent) {
            return;
          }
          var item = document.createElement("li");
          var children = Array.isArray(edge.children) ? edge.children : [];
          if (!children.length) {
            item.textContent = roleDisplayName(edge.parent) + " → (no child roles)";
            list.appendChild(item);
            return;
          }
          var childNames = children
            .map(function (child) {
              return roleDisplayName(child);
            })
            .filter(Boolean)
            .sort();
          item.textContent = roleDisplayName(edge.parent) + " → " + childNames.join(", ");
          list.appendChild(item);
        });
        if (!list.children.length) {
          var fallback = document.createElement("p");
          fallback.className = "suncoast-roles-empty";
          fallback.textContent = "No composite role expansion detected.";
          container.appendChild(fallback);
          return;
        }
        container.appendChild(list);
      }

      function renderMembershipSources(container, sources) {
        if (!container) {
          return;
        }
        container.replaceChildren();
        if (!Array.isArray(sources) || sources.length === 0) {
          var empty = document.createElement("p");
          empty.className = "suncoast-roles-empty";
          empty.textContent = "No identity-provider membership sources were returned.";
          container.appendChild(empty);
          return;
        }

        sources.forEach(function (source) {
          var sourceWrap = document.createElement("div");
          sourceWrap.className = "suncoast-membership-source";

          var sourceTitle = document.createElement("p");
          sourceTitle.className = "suncoast-roles-list-title";
          var statusText = source.success ? "resolved" : source.attempted ? "unavailable" : "skipped";
          sourceTitle.textContent =
            source.source +
            " (" +
            statusText +
            ", " +
            source.memberships.length +
            " memberships, " +
            source.roles.length +
            " roles)";
          sourceWrap.appendChild(sourceTitle);

          if (source.message) {
            var message = document.createElement("p");
            message.className = "suncoast-roles-note";
            message.textContent = source.message;
            sourceWrap.appendChild(message);
          }

          var membershipsTitle = document.createElement("p");
          membershipsTitle.className = "suncoast-roles-list-title";
          membershipsTitle.textContent = "Memberships";
          sourceWrap.appendChild(membershipsTitle);

          var membershipsList = document.createElement("div");
          membershipsList.className = "suncoast-roles-list";
          renderTextChipList(membershipsList, source.memberships, "No memberships returned from this source.");
          sourceWrap.appendChild(membershipsList);

          var rolesTitle = document.createElement("p");
          rolesTitle.className = "suncoast-roles-list-title";
          rolesTitle.textContent = "Resolved roles";
          sourceWrap.appendChild(rolesTitle);

          var rolesList = document.createElement("div");
          rolesList.className = "suncoast-roles-list";
          renderTextChipList(rolesList, source.roles, "No roles resolved from this source.");
          sourceWrap.appendChild(rolesList);

          container.appendChild(sourceWrap);
        });
      }

      function renderRolesPanel(state) {
        if (!isPersonalInfoPage()) {
          var existing = document.getElementById(ROLES_PANEL_ID);
          if (existing && existing.parentElement) {
            existing.parentElement.removeChild(existing);
          }
          return;
        }
        var container = findPersonalInfoContainer();
        if (!container) {
          return;
        }
        var parent = container;
        if (container.matches && container.matches("form") && container.parentElement) {
          parent = container.parentElement;
        }

        var panel = document.getElementById(ROLES_PANEL_ID) || document.createElement("section");
        panel.id = ROLES_PANEL_ID;
        panel.replaceChildren();

        var titleAnchor = document.createElement("span");
        titleAnchor.id = ROLES_SECTION_ANCHOR_ID;
        panel.appendChild(titleAnchor);

        var title = document.createElement("h3");
        title.textContent = "Roles";
        panel.appendChild(title);

        var helpText = document.createElement("p");
