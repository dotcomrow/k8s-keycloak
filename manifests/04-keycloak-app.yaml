apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.114
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-bootstrap
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    teleport.dev/name: "keycloak-admin"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "keycloak-admin.teleport.app.suncoast.systems"
    teleport.dev/description: "Keycloak Admin Console"
    teleport.dev/path: "admin"
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: authentication
    teleport.dev/enroll: "true"
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-account-theme
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  theme.properties: |
    parent=keycloak.v3
    styles=css/account-lockdown.css
    scripts=js/account-lockdown.js
    logo=/public/blank-logo.svg
  content.json: |
    [
      { "label": "personalInfo", "path": "" },
      {
        "label": "accountSecurity",
        "children": [
          { "label": "signingIn", "path": "account-security/signing-in" },
          { "label": "deviceActivity", "path": "account-security/device-activity" },
          {
            "label": "linkedAccounts",
            "path": "account-security/linked-accounts",
            "isVisible": "isLinkedAccountsEnabled"
          }
        ]
      },
      {
        "label": "organizations",
        "path": "organizations",
        "isVisible": "isViewOrganizationsEnabled"
      },
      {
        "label": "resources",
        "path": "resources",
        "isVisible": "isMyResourcesEnabled"
      },
      {
        "label": "oid4vci",
        "path": "oid4vci",
        "isVisible":"isOid4VciEnabled"
      }
    ]
  messages_en.properties: |
    personalInfoDescription=Your profile information is managed by your linked identity provider. To make changes, update the identity provider profile and then sign in again.
    signingInDescription=Manage second-factor sign-in methods. Password setup and profile editing are disabled in this account page.
    linkedAccountsIntroMessage=Link additional login providers here. Unlinking providers is disabled in this account page.
  blank-logo.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="1" height="1" viewBox="0 0 1 1" aria-hidden="true"></svg>
  account-lockdown.css: |
    #save-btn,
    #cancel-btn,
    #update-email-btn,
    #delete-account-btn,
    [data-testid="applications"],
    [data-testid="options-toggle"],
    [data-testid="options-kebab-toggle"],
    [id$="-idp-unlink"] {
      display: none !important;
    }

    #suncoast-account-readonly-note {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-left: 4px solid #2b9af3;
      background: #f0f8ff;
      color: #1f1f1f;
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    #suncoast-idp-profile-panel {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #d2dbe5;
      background: #f8fafc;
      color: #1f2933;
      border-radius: 6px;
    }

    #suncoast-idp-profile-panel h3 {
      margin: 0 0 0.6rem 0;
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    #suncoast-idp-profile-panel .suncoast-idp-help {
      margin: 0 0 0.6rem 0;
      color: #334155;
      font-size: 0.9rem;
    }

    #suncoast-idp-profile-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #suncoast-idp-profile-panel th,
    #suncoast-idp-profile-panel td {
      padding: 0.45rem 0.4rem;
      vertical-align: top;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    #suncoast-idp-profile-panel th {
      width: 32%;
      color: #0f172a;
      font-weight: 600;
      white-space: nowrap;
    }

    #suncoast-idp-profile-panel td {
      color: #1f2937;
      word-break: break-word;
    }

    #suncoast-idp-profile-panel .suncoast-idp-empty {
      color: #475569;
      font-style: italic;
      margin: 0.3rem 0 0;
    }

    #suncoast-account-return-link {
      display: none !important;
    }
  account-lockdown.js: |
    (function () {
      "use strict";

      var NOTE_ID = "suncoast-account-readonly-note";
      var IDP_PANEL_ID = "suncoast-idp-profile-panel";
      var RETURN_LINK_ID = "suncoast-account-return-link";
      var NOTE_TEXT = "Profile edits are disabled. Update your linked identity provider to change your name, email, or other profile details.";
      var PROFILE_FIELDS = [
        "username",
        "email",
        "firstName",
        "lastName",
        "name",
        "given_name",
        "family_name",
        "preferred_username",
        "locale",
        "email_verified",
        "phone_number",
        "phone_number_verified",
        "device_id",
        "profile",
        "website",
        "picture",
        "company",
        "location",
        "bio",
        "twitter_username",
        "hd",
        "google_sub",
        "github_id",
        "github_node_id"
      ];
      var SIGN_OUT_LABELS = {
        "Sign out": true,
        "Sign out all devices": true
      };
      var accountProfilePromise = null;
      var idpProfileRouteKey = "";
      var idpProfileFetchStarted = false;

      function hideElement(el) {
        if (!el) {
          return;
        }
        el.style.display = "none";
        el.setAttribute("aria-hidden", "true");
      }

      function hideSelectors() {
        var selectors = [
          "#save-btn",
          "#cancel-btn",
          "#update-email-btn",
          "#delete-account-btn",
          "[data-testid='applications']",
          "[data-testid='options-toggle']",
          "[data-testid='options-kebab-toggle']",
          "[id$='-idp-unlink']"
        ];
        selectors.forEach(function (selector) {
          document.querySelectorAll(selector).forEach(hideElement);
        });
      }

      function isPersonalInfoPage() {
        var path = window.location.pathname || "";
        var hash = (window.location.hash || "").toLowerCase();
        if (!/\/account(?:\/|$)/.test(path)) {
          return false;
        }
        if (/\/account-security(?:\/|$)/.test(path) || /\/groups(?:\/|$)/.test(path) || /\/organizations(?:\/|$)/.test(path) || /\/resources(?:\/|$)/.test(path) || /\/oid4vci(?:\/|$)/.test(path) || /\/applications(?:\/|$)/.test(path)) {
          return false;
        }
        if (!hash) {
          return true;
        }
        return hash.indexOf("personal-info") !== -1 || hash === "#/" || hash === "#";
      }

      function hidePasswordWidgets() {
        var passwordSelectors = [
          "[data-testid='password/title']",
          "[data-testid='password/help']",
          "[data-testid='password/help-text']",
          "[data-testid='password/create']",
          "[data-testid='password/credential-list']",
          "[data-testid='password/not-set-up']"
        ];
        passwordSelectors.forEach(function (selector) {
          document.querySelectorAll(selector).forEach(function (el) {
            var section = el.closest("section");
            hideElement(section || el);
          });
        });
      }

      function hideSignOutButtons() {
        document.querySelectorAll("button").forEach(function (button) {
          var text = (button.textContent || "").trim();
          if (SIGN_OUT_LABELS[text]) {
            hideElement(button);
          }
        });
      }

      function hideDeviceSignOutControls() {
        if (!/\/account-security\/device-activity/.test(window.location.pathname)) {
          return;
        }
        document.querySelectorAll(".pf-v5-c-page__main-section button").forEach(function (button) {
          if (button.id === "refresh-page") {
            return;
          }
          hideElement(button);
        });
      }

      function findPersonalInfoContainer() {
        var selectors = [
          "[data-testid='personal-info-form']",
          "[data-testid='personal-info']",
          "main form[data-testid='personal-info-form']",
          "main [data-testid='personal-info'] form",
          "main form"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var container = document.querySelector(selectors[i]);
          if (container) {
            return container;
          }
        }
        return null;
      }

      function findPersonalInfoInsertAnchor(container) {
        if (!container) {
          return null;
        }
        if (container.matches && container.matches("form")) {
          return container;
        }
        var form = container.querySelector("form");
        if (form) {
          return form;
        }
        return container.firstElementChild || null;
      }

      function addReadonlyNote() {
        if (!isPersonalInfoPage()) {
          return;
        }
        if (document.getElementById(NOTE_ID)) {
          return;
        }
        var container = findPersonalInfoContainer();
        if (!container) {
          return;
        }
        var anchor = findPersonalInfoInsertAnchor(container);
        var parent = container;
        if (anchor && anchor.parentElement && anchor.parentElement !== container) {
          parent = anchor.parentElement;
        }
        var note = document.createElement("div");
        note.id = NOTE_ID;
        note.textContent = NOTE_TEXT;
        parent.insertBefore(note, anchor || null);
      }

      function lockPersonalInfoFields() {
        if (!isPersonalInfoPage()) {
          return;
        }
        document.querySelectorAll("form input, form textarea").forEach(function (field) {
          field.setAttribute("readonly", "readonly");
          field.setAttribute("aria-readonly", "true");
        });
        document.querySelectorAll("form select").forEach(function (field) {
          field.setAttribute("disabled", "disabled");
          field.setAttribute("aria-disabled", "true");
        });
      }

      function getRealmFromPath() {
        var match = window.location.pathname.match(/\/realms\/([^/]+)\//);
        if (!match || !match[1]) {
          return "";
        }
        try {
          return decodeURIComponent(match[1]);
        } catch (err) {
          return match[1];
        }
      }

      function getQueryParam(name) {
        if (!name) {
          return "";
        }
        try {
          var params = new URLSearchParams(window.location.search || "");
          return (params.get(name) || "").trim();
        } catch (err) {
          var escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var regex = new RegExp("[?&]" + escapedName + "=([^&#]*)");
          var match = regex.exec(window.location.search || "");
          if (!match || !match[1]) {
            return "";
          }
          try {
            return decodeURIComponent(match[1].replace(/\+/g, " ")).trim();
          } catch (decodeErr) {
            return match[1].trim();
          }
        }
      }

      function parseUrl(value) {
        if (!value || typeof value !== "string") {
          return null;
        }
        try {
          return new URL(value, window.location.origin);
        } catch (err) {
          return null;
        }
      }

      function isAllowedReturnUrl(url) {
        if (!url) {
          return false;
        }
        var protocol = (url.protocol || "").toLowerCase();
        var host = (url.hostname || "").toLowerCase();
        if (protocol === "http:" && (host === "localhost" || host === "127.0.0.1")) {
          return true;
        }
        if (protocol !== "https:") {
          return false;
        }
        return (
          host === "suncoast.systems" ||
          host === "localhost" ||
          host === "127.0.0.1" ||
          /\.suncoast\.systems$/.test(host)
        );
      }

      function resolveReturnToUrl() {
        var fromQuery = getQueryParam("referrer_uri");
        var parsedQuery = parseUrl(fromQuery);
        if (isAllowedReturnUrl(parsedQuery)) {
          return parsedQuery.toString();
        }

        var fromReferrer = (document.referrer || "").trim();
        var parsedReferrer = parseUrl(fromReferrer);
        if (isAllowedReturnUrl(parsedReferrer)) {
          return parsedReferrer.toString();
        }

        return "";
      }

      function findHeaderActionsContainer() {
        var selectors = [
          "[data-testid='page-header-toolbar']",
          ".pf-v5-c-page__header-tools",
          ".pf-v5-c-masthead__content",
          "header .pf-v5-c-toolbar__content",
          "header"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var match = document.querySelector(selectors[i]);
          if (match) {
            return match;
          }
        }
        return null;
      }

      function findFallbackReturnLinkContainer() {
        var selectors = [
          "[role='main']",
          "main",
          ".pf-v5-c-page__main",
          "body"
        ];
        for (var i = 0; i < selectors.length; i += 1) {
          var match = document.querySelector(selectors[i]);
          if (match) {
            return match;
          }
        }
        return document.body || null;
      }

      function ensureReturnToHeaderLink() {
        var existing = document.getElementById(RETURN_LINK_ID);
        if (existing && existing.parentElement) {
          existing.parentElement.removeChild(existing);
        }
      }

      function looksLikeJwt(value) {
        return typeof value === "string" && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(value);
      }

      function tokenFromObject(value) {
        if (!value || typeof value !== "object") {
          return "";
        }
        var keys = ["access_token", "accessToken", "token", "id_token", "idToken"];
        for (var i = 0; i < keys.length; i += 1) {
          var token = value[keys[i]];
          if (looksLikeJwt(token)) {
            return token;
          }
        }
        return "";
      }

      function safeJsonParse(raw) {
        if (!raw || typeof raw !== "string") {
          return null;
        }
        try {
          return JSON.parse(raw);
        } catch (err) {
          return null;
        }
      }

      function findAccountAccessToken() {
        var stores = [window.sessionStorage, window.localStorage];
        for (var s = 0; s < stores.length; s += 1) {
          var store = null;
          try {
            store = stores[s];
          } catch (err) {
            continue;
          }
          if (!store) {
            continue;
          }
          try {
            for (var i = 0; i < store.length; i += 1) {
              var key = store.key(i);
              if (!key) {
                continue;
              }
              var value = store.getItem(key);
              if (!value) {
                continue;
              }
              if (looksLikeJwt(value)) {
                return value;
              }
              var parsed = safeJsonParse(value);
              var token = tokenFromObject(parsed);
              if (token) {
                return token;
              }
            }
          } catch (err) {
            continue;
          }
        }
        return "";
      }

      function requestAccountProfile(endpoint, token) {
        var headers = {
          Accept: "application/json"
        };
        if (token) {
          headers.Authorization = "Bearer " + token;
        }
        return fetch(endpoint, {
          method: "GET",
          credentials: "include",
          headers: headers
        }).then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          var contentType = response.headers.get("content-type") || "";
          if (contentType.indexOf("application/json") === -1) {
            throw new Error("Unsupported content type");
          }
          return response.json();
        });
      }

      function fetchAccountProfile() {
        if (accountProfilePromise) {
          return accountProfilePromise;
        }
        var realm = getRealmFromPath();
        if (!realm) {
          accountProfilePromise = Promise.resolve(null);
          return accountProfilePromise;
        }

        var base = window.location.origin + "/realms/" + encodeURIComponent(realm) + "/account";
        var endpoints = [
          base + "/?userProfileMetadata=true",
          base + "/",
          base
        ];
        var token = findAccountAccessToken();

        function tryEndpoint(index, useToken) {
          if (index >= endpoints.length) {
            if (useToken && token) {
              return tryEndpoint(0, false);
            }
            return Promise.resolve(null);
          }
          var accessToken = useToken ? token : "";
          return requestAccountProfile(endpoints[index], accessToken).catch(function () {
            return tryEndpoint(index + 1, useToken);
          });
        }

        accountProfilePromise = tryEndpoint(0, true);
        return accountProfilePromise;
      }

      function toDisplayString(value) {
        if (value === null || typeof value === "undefined") {
          return "";
        }
        if (Array.isArray(value)) {
          return value
            .filter(function (entry) {
              return entry !== null && typeof entry !== "undefined" && String(entry).trim() !== "";
            })
            .map(function (entry) {
              return String(entry);
            })
            .join(", ");
        }
        if (typeof value === "boolean") {
          return value ? "true" : "false";
        }
        if (typeof value === "object") {
          try {
            return JSON.stringify(value);
          } catch (err) {
            return String(value);
          }
        }
        return String(value);
      }

      function extractProfileFields(profile) {
        if (!profile || typeof profile !== "object") {
          return [];
        }
        var attributes = profile.attributes && typeof profile.attributes === "object" ? profile.attributes : {};
        var rows = [];
        PROFILE_FIELDS.forEach(function (field) {
          var value = "";
          if (Object.prototype.hasOwnProperty.call(profile, field)) {
            value = toDisplayString(profile[field]);
          } else if (Object.prototype.hasOwnProperty.call(attributes, field)) {
            value = toDisplayString(attributes[field]);
          }
          if (value) {
            rows.push({ key: field, value: value });
          }
        });

        if (Object.keys(attributes).length) {
          Object.keys(attributes)
            .sort()
            .forEach(function (key) {
              if (PROFILE_FIELDS.indexOf(key) !== -1) {
                return;
              }
              var extraValue = toDisplayString(attributes[key]);
              if (!extraValue) {
                return;
              }
              rows.push({ key: key, value: extraValue });
            });
        }

        return rows;
      }

      function currentRouteKey() {
        return (window.location.pathname || "") + "|" + (window.location.hash || "");
      }

      function renderIdpProfilePanel(profile) {
        if (!isPersonalInfoPage()) {
          return;
        }
        var container = findPersonalInfoContainer();
        if (!container) {
          return;
        }
        var rows = extractProfileFields(profile);
        var existingPanel = document.getElementById(IDP_PANEL_ID);

        if (!rows.length) {
          if (existingPanel && existingPanel.parentElement) {
            existingPanel.parentElement.removeChild(existingPanel);
          }
          return;
        }

        var rowsSignature = JSON.stringify(rows);
        if (existingPanel && existingPanel.getAttribute("data-rows-signature") === rowsSignature) {
          return;
        }

        var panel = existingPanel || document.createElement("section");
        panel.id = IDP_PANEL_ID;
        panel.setAttribute("data-rows-signature", rowsSignature);
        panel.replaceChildren();

        var title = document.createElement("h3");
        title.textContent = "IdP Profile Data";
        panel.appendChild(title);

        var table = document.createElement("table");
        var tbody = document.createElement("tbody");
        rows.forEach(function (row) {
          var tr = document.createElement("tr");
          var th = document.createElement("th");
          th.textContent = row.key;
          var td = document.createElement("td");
          td.textContent = row.value;
          tr.appendChild(th);
          tr.appendChild(td);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        panel.appendChild(table);

        if (!existingPanel) {
          var note = document.getElementById(NOTE_ID);
          var anchor = findPersonalInfoInsertAnchor(container);
          var parent = container;
          if (anchor && anchor.parentElement && anchor.parentElement !== container) {
            parent = anchor.parentElement;
          }
          if (note && note.parentElement === parent && note.nextSibling) {
            parent.insertBefore(panel, note.nextSibling);
          } else {
            parent.insertBefore(panel, anchor || null);
          }
        }
      }

      function ensureIdpProfilePanel() {
        // Disabled intentionally: account-console self-fetch can cause load stalls
        // and retry loops under some auth/cookie states.
        return;
      }

      function redirectApplicationsPage() {
        var path = window.location.pathname;
        if (!/\/account\/applications($|\/|\?)/.test(path)) {
          return false;
        }
        window.location.replace(path.replace(/\/applications($|\/.*)/, "/"));
        return true;
      }

      function hideApplicationsNavLink() {
        document.querySelectorAll("a").forEach(function (link) {
          var href = (link.getAttribute("href") || "").trim();
          var text = (link.textContent || "").trim();
          var navContainer = link.closest("nav, [role='navigation'], .pf-v5-c-nav");
          var isApplicationsHref =
            /\/account\/applications($|[/?#])/.test(href) ||
            /^applications($|[/?#])/.test(href);

          if (!isApplicationsHref && !(navContainer && text === "Applications")) {
            return;
          }

          var navItem =
            link.closest(".pf-v5-c-nav__item") ||
            link.closest("li") ||
            link.closest("[role='listitem']");
          hideElement(navItem || link);
        });
      }

      function hideGroupsNavLink() {
        document.querySelectorAll("a").forEach(function (link) {
          var href = (link.getAttribute("href") || "").trim();
          var text = (link.textContent || "").trim();
          var navContainer = link.closest("nav, [role='navigation'], .pf-v5-c-nav");
          var isGroupsHref =
            /\/account\/groups($|[/?#])/.test(href) ||
            /^groups($|[/?#])/.test(href);

          if (!isGroupsHref && !(navContainer && text === "Groups")) {
            return;
          }

          var navItem =
            link.closest(".pf-v5-c-nav__item") ||
            link.closest("li") ||
            link.closest("[role='listitem']");
          hideElement(navItem || link);
        });
      }

      function hideHeaderBrand() {
        var selectors = [
          "[data-testid='brand'] img",
          "[data-testid='brand'] svg",
          "[data-testid='page-header-brand'] img",
          "[data-testid='page-header-brand'] svg",
          ".pf-v5-c-masthead__brand img",
          ".pf-v5-c-masthead__brand svg",
          ".pf-v5-c-page__header-brand-link img",
          ".pf-v5-c-page__header-brand-link svg"
        ];
        selectors.forEach(function (selector) {
          document.querySelectorAll(selector).forEach(hideElement);
        });
      }

      function applyLockdown() {
        if (redirectApplicationsPage()) {
          return;
        }
        ensureReturnToHeaderLink();
        hideApplicationsNavLink();
        hideGroupsNavLink();
        hideSelectors();
        hidePasswordWidgets();
        hideSignOutButtons();
        hideDeviceSignOutControls();
        lockPersonalInfoFields();
        addReadonlyNote();
        ensureIdpProfilePanel();
      }

      var applyLockdownScheduled = false;
      function scheduleApplyLockdown() {
        if (applyLockdownScheduled) {
          return;
        }
        applyLockdownScheduled = true;
        window.requestAnimationFrame(function () {
          applyLockdownScheduled = false;
          applyLockdown();
        });
      }

      applyLockdown();
      var observer = new MutationObserver(scheduleApplyLockdown);
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener("popstate", scheduleApplyLockdown);
      window.addEventListener("hashchange", scheduleApplyLockdown);
    })();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  # Initial schema migration on Yugabyte can be slow and may require multiple retries.
  # Increase the deadline so ArgoCD doesn't fail sync due to ProgressDeadlineExceeded.
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        reloader.stakater.com/auto: "true"
        linkerd.io/inject: "enabled"
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-keycloak-admin: "secret/data/keycloak/admin"
        vault.hashicorp.com/agent-inject-template-keycloak-admin: |
          {{- with secret "secret/data/keycloak/admin" -}}
          export KEYCLOAK_ADMIN={{ printf "%q" .Data.data.username }}
          export KEYCLOAK_ADMIN_PASSWORD={{ printf "%q" .Data.data.password }}
          {{- end -}}

        # GitHub OAuth + org/team for provider
        vault.hashicorp.com/agent-inject-secret-github-client-id: "secret/data/keycloak-oauth-client-id"
        vault.hashicorp.com/agent-inject-template-github-client-id: |
          {{- with secret "secret/data/keycloak-oauth-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-client-secret: "secret/data/keycloak-oauth-client-secret"
        vault.hashicorp.com/agent-inject-template-github-client-secret: |
          {{- with secret "secret/data/keycloak-oauth-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-org: "secret/data/k8s-teleport-teleport-github-org"
        vault.hashicorp.com/agent-inject-template-github-org: |
          {{- with secret "secret/data/k8s-teleport-teleport-github-org" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-admin-team: "secret/data/keycloak-admin-team"
        vault.hashicorp.com/agent-inject-template-keycloak-admin-team: |
          {{- with secret "secret/data/keycloak-admin-team" -}}{{ .Data.data.value }}{{- end -}}

        # Google OIDC + Groups (Cloud Identity)
        vault.hashicorp.com/agent-inject-secret-google-client-id: "secret/data/keycloak-google-client-id"
        vault.hashicorp.com/agent-inject-template-google-client-id: |
          {{- with secret "secret/data/keycloak-google-client-id" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-client-secret: "secret/data/keycloak-google-client-secret"
        vault.hashicorp.com/agent-inject-template-google-client-secret: |
          {{- with secret "secret/data/keycloak-google-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-email: "secret/data/keycloak-google-admin-email"
        vault.hashicorp.com/agent-inject-template-google-admin-email: |
          {{- with secret "secret/data/keycloak-google-admin-email" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-admin-group: "secret/data/keycloak-google-admin-group"
        vault.hashicorp.com/agent-inject-template-google-admin-group: |
          {{- with secret "secret/data/keycloak-google-admin-group" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-google-sa-json: "secret/data/keycloak-google-sa-json"
        vault.hashicorp.com/agent-inject-template-google-sa-json: |
          {{- with secret "secret/data/keycloak-google-sa-json" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-keycloak-configurator-client-secret: "secret/data/keycloak-configurator-client-secret"
        vault.hashicorp.com/agent-inject-template-keycloak-configurator-client-secret: |
          {{- with secret "secret/data/keycloak-configurator-client-secret" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-gravitee-introspection: "secret/data/keycloak-client-id-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-id-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-id-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-gravitee-introspection: "secret/data/keycloak-client-secret-gravitee-introspection"
        vault.hashicorp.com/agent-inject-template-client-secret-gravitee-introspection: |
          {{- with secret "secret/data/keycloak-client-secret-gravitee-introspection" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-graphql-api: "secret/data/keycloak-client-id-graphql-api"
        vault.hashicorp.com/agent-inject-template-client-id-graphql-api: |
          {{- with secret "secret/data/keycloak-client-id-graphql-api" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-graphql-api: "secret/data/keycloak-client-secret-graphql-api"
        vault.hashicorp.com/agent-inject-template-client-secret-graphql-api: |
          {{- with secret "secret/data/keycloak-client-secret-graphql-api" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-openwebui: "secret/data/keycloak-client-id-openwebui"
        vault.hashicorp.com/agent-inject-template-client-id-openwebui: |
          {{- with secret "secret/data/keycloak-client-id-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-openwebui: "secret/data/keycloak-client-secret-openwebui"
        vault.hashicorp.com/agent-inject-template-client-secret-openwebui: |
          {{- with secret "secret/data/keycloak-client-secret-openwebui" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-hasura-console-proxy: "secret/data/keycloak-client-id-hasura-console-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-hasura-console-proxy: |
          {{- with secret "secret/data/keycloak-client-id-hasura-console-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-hasura-console-proxy: "secret/data/keycloak-client-secret-hasura-console-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-hasura-console-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-hasura-console-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-workbench: "secret/data/keycloak-client-id-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-id-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-workbench: "secret/data/keycloak-client-secret-drools-workbench"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-workbench: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-workbench-proxy: "secret/data/keycloak-client-id-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-drools-workbench-proxy: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        # Also write the rendered clientId to a file that matches the dynamic value (needed when the ID comes from Vault)
        vault.hashicorp.com/agent-inject-secret-client-id-dwb-proxy: "secret/data/keycloak-client-id-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-id-dwb-proxy: |
          {{- with secret "secret/data/keycloak-client-id-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-file-client-id-dwb-proxy: "client-id-drools-workbench-proxy-fkd8z6i5q2rmgf4p"
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-workbench-proxy: "secret/data/keycloak-client-secret-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-workbench-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        # Ensure secret file matches the rendered clientId (needed by configurator to set client secret)
        vault.hashicorp.com/agent-inject-secret-client-secret-dwb-proxy: "secret/data/keycloak-client-secret-drools-workbench-proxy"
        vault.hashicorp.com/agent-inject-template-client-secret-dwb-proxy: |
          {{- with secret "secret/data/keycloak-client-secret-drools-workbench-proxy" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-file-client-secret-dwb-proxy: "client-secret-drools-workbench-proxy-fkd8z6i5q2rmgf4p"
        vault.hashicorp.com/agent-inject-secret-client-id-drools-kie-server: "secret/data/keycloak-client-id-drools-kie-server"
        vault.hashicorp.com/agent-inject-template-client-id-drools-kie-server: |
          {{- with secret "secret/data/keycloak-client-id-drools-kie-server" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-kie-server: "secret/data/keycloak-client-secret-drools-kie-server"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-kie-server: |
          {{- with secret "secret/data/keycloak-client-secret-drools-kie-server" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-drools-kie-server-service: "secret/data/keycloak-client-id-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-id-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-id-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-drools-kie-server-service: "secret/data/keycloak-client-secret-drools-kie-server-service"
        vault.hashicorp.com/agent-inject-template-client-secret-drools-kie-server-service: |
          {{- with secret "secret/data/keycloak-client-secret-drools-kie-server-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-ollama-service: "secret/data/keycloak-client-id-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-id-ollama-service: |
          {{- with secret "secret/data/keycloak-client-id-ollama-service" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-secret-ollama-service: "secret/data/keycloak-client-secret-ollama-service"
        vault.hashicorp.com/agent-inject-template-client-secret-ollama-service: |
          {{- with secret "secret/data/keycloak-client-secret-ollama-service" -}}{{ .Data.data.value }}{{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        vault.hashicorp.com/agent-inject-secret-vaultadmin: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-vaultadmin: |
          {{- with secret "secret/data/vaultadmin" -}}
          {{- if .Data.data.password -}}{{ .Data.data.password }}{{ else }}{{ .Data.data.value }}{{ end -}}
          {{- end -}}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: dedicated
                    operator: In
                    values:
                      - srvr-node
      serviceAccountName: keycloak

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: kc-preflight-sync
          emptyDir: {}
        - name: kc-configurator-gate
          emptyDir: {}
        - name: keycloak-client-config-internal
          configMap:
            name: keycloak-client-config-internal
        - name: keycloak-client-config-external
          configMap:
            name: keycloak-client-config-external
            optional: true
        - name: keycloak-account-theme
          configMap:
            name: keycloak-account-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: content.json
                path: resources/content.json
              - key: messages_en.properties
                path: messages/messages_en.properties
              - key: account-lockdown.js
                path: resources/js/account-lockdown.js
              - key: account-lockdown.css
                path: resources/css/account-lockdown.css
              - key: blank-logo.svg
                path: resources/public/blank-logo.svg

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              wait_job() {
                local JOB="$1"
                echo "Waiting for Job vault/${JOB} to complete (will retry until ready)..."
                while true; do
                  if ! kubectl -n vault get job "${JOB}" >/dev/null 2>&1; then
                    echo "  └─ job ${JOB} not found yet..."
                    sleep 5
                    continue
                  fi
                  SUCC="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                  if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  if kubectl -n vault wait --for=condition=complete "job/${JOB}" --timeout=10s >/dev/null 2>&1; then
                    echo "✅ job ${JOB} is complete."
                    break
                  fi
                  FAIL="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                  ACTV="$(kubectl -n vault get job "${JOB}" -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                  echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                  sleep 5
                done
              }

              for job in keycloak-vault-k8s-role keycloak-yugabyte-config; do
                wait_job "$job"
              done

      containers:
        - name: kc-db-preflight
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: PGPORT
              value: "5433"
            # Maintenance DB for admin operations like DROP/CREATE DATABASE.
            # The sidecar will fall back to yugabyte/postgres/template1 automatically if this doesn't exist.
            - name: PGMAINTENANCE_DB
              value: "yugabyte"
            - name: PGDATABASE
              value: "keycloak"
            - name: PGSCHEMA
              value: "keycloak"
            - name: PGSCHEMA_OWNER
              value: "keycloak_app"
            - name: PGADMIN_USER
              value: "vaultadmin"
            # Default safe behavior: do not reset automatically; the Keycloak wrapper requests actions explicitly.
            - name: KC_RESET_SCHEMA_IF_NO_REALMS
              value: "false"
            # Hard override: if set true, will drop schema even if realms exist (DANGEROUS).
            - name: KC_FORCE_DROP_SCHEMA
              value: "false"
            # Default-safe: disable reset-db unless explicitly overridden by operators.
            - name: KC_ENABLE_RESET_DB
              value: "true"
            - name: KC_BOOTSTRAP_MASTER_DIRECT_GRANT
              value: "true"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -Eeuo pipefail

              sync_dir="/kc-preflight"
              req_file="${sync_dir}/request"
              done_file="${sync_dir}/done"

              retry() {
                local max="$1"
                shift
                local n=1
                while true; do
                  if "$@"; then return 0; fi
                  if [ "$n" -ge "$max" ]; then return 1; fi
                  sleep $((n * 2))
                  n=$((n + 1))
                done
              }

              i=0
              while [ "$i" -lt 120 ]; do
                if [ -s /vault/secrets/vaultadmin ]; then break; fi
                echo "waiting for /vault/secrets/vaultadmin..."
                i=$((i + 1))
                sleep 1
              done
              if [ ! -s /vault/secrets/vaultadmin ]; then
                echo "ERROR: /vault/secrets/vaultadmin not found or empty"
                sleep 3600
                exit 1
              fi

              export PGUSER="${PGADMIN_USER}"
              export PGPASSWORD="$(tr -d '\r\n' < /vault/secrets/vaultadmin)"

              psql_admin() {
                local db="$1"
                shift
                psql -h "$PGHOST" -p "$PGPORT" -d "$db" "$@"
              }

              choose_maint_db() {
                local db=""
                for db in "${PGMAINTENANCE_DB:-}" yugabyte postgres template1; do
                  [ -n "${db:-}" ] || continue
                  if psql_admin "$db" -tAc "select 1" >/dev/null 2>&1; then
                    echo "$db"
                    return 0
                  fi
                done
                return 1
              }

              echo "preflight sidecar: waiting for DB server ${PGHOST}:${PGPORT}..."
              maint_db=""
              until maint_db="$(choose_maint_db)"; do
                sleep 2
              done
              echo "preflight sidecar: DB reachable (maintenance db=${maint_db})"

              ensure_database() {
                local exists=""
                exists="$(psql_admin "$maint_db" -Atc "select 1 from pg_database where datname='${PGDATABASE}';" 2>/dev/null || true)"
                if [ "$exists" != "1" ]; then
                  echo "creating database ${PGDATABASE} (owner=${PGSCHEMA_OWNER})..."
                  retry 10 psql_admin "$maint_db" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PGDATABASE}\" OWNER \"${PGSCHEMA_OWNER}\";" >/dev/null
                else
                  # Best-effort: align DB owner.
                  psql_admin "$maint_db" -v ON_ERROR_STOP=1 -c "ALTER DATABASE \"${PGDATABASE}\" OWNER TO \"${PGSCHEMA_OWNER}\";" >/dev/null 2>&1 || true
                fi
              }

              ensure_schema() {
                ensure_database
                retry 10 psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS ${PGSCHEMA} AUTHORIZATION ${PGSCHEMA_OWNER}; ALTER SCHEMA ${PGSCHEMA} OWNER TO ${PGSCHEMA_OWNER}; ALTER ROLE ${PGSCHEMA_OWNER} SET search_path = ${PGSCHEMA}; GRANT USAGE, CREATE ON SCHEMA ${PGSCHEMA} TO ${PGSCHEMA_OWNER};" >/dev/null
              }

              reset_schema() {
                ensure_database
                retry 10 psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS ${PGSCHEMA} CASCADE; CREATE SCHEMA ${PGSCHEMA} AUTHORIZATION ${PGSCHEMA_OWNER}; ALTER ROLE ${PGSCHEMA_OWNER} SET search_path = ${PGSCHEMA}; GRANT USAGE, CREATE ON SCHEMA ${PGSCHEMA} TO ${PGSCHEMA_OWNER};"
              }

              reset_database() {
                if [ "${KC_ENABLE_RESET_DB:-false}" != "true" ]; then
                  echo "KC_ENABLE_RESET_DB is not true; refusing reset-db"
                  return 0
                fi

                echo "dropping and recreating database ${PGDATABASE}..."
                # Disconnect active sessions so DROP DATABASE can succeed.
                psql_admin "$maint_db" -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${PGDATABASE}' AND pid <> pg_backend_pid();" >/dev/null 2>&1 || true

                retry 10 psql_admin "$maint_db" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"${PGDATABASE}\";"
                retry 10 psql_admin "$maint_db" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PGDATABASE}\" OWNER \"${PGSCHEMA_OWNER}\";"
                reset_schema
              }

              reconcile_liquibase_compat() {
                # Keycloak Liquibase may try to drop legacy constraint UK_RU8... during
                # 2.5.0-unicode-other-dbs even when it does not exist in partially-migrated DBs.
                # Add a no-op placeholder constraint only when needed so the migration can proceed.
                local legacy_constraint="uk_ru8tt6t700s9v50bu18ws5ha6"
                local changeset_id="2.5.0-unicode-other-dbs"
                local changeset_author="hmlnarik@redhat.com"

                psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 <<SQL
                DO \$\$
                BEGIN
                  IF to_regclass('${PGSCHEMA}.user_entity') IS NULL THEN
                    RETURN;
                  END IF;

                  IF to_regclass('${PGSCHEMA}.databasechangelog') IS NOT NULL
                     AND EXISTS (
                       SELECT 1
                       FROM ${PGSCHEMA}.databasechangelog
                       WHERE id = '${changeset_id}'
                         AND author = '${changeset_author}'
                     ) THEN
                    RETURN;
                  END IF;

                  IF NOT EXISTS (
                    SELECT 1
                    FROM pg_constraint c
                    JOIN pg_class t ON t.oid = c.conrelid
                    JOIN pg_namespace n ON n.oid = t.relnamespace
                    WHERE n.nspname = '${PGSCHEMA}'
                      AND t.relname = 'user_entity'
                      AND lower(c.conname) = lower('${legacy_constraint}')
                  ) THEN
                    EXECUTE 'ALTER TABLE ${PGSCHEMA}.user_entity ADD CONSTRAINT ${legacy_constraint} CHECK (1=1)';
                  END IF;
                END
                \$\$;
              SQL
              }

              mkdir -p "$sync_dir"
              echo "ok" > "${sync_dir}/sidecar-ready"

              while true; do
                if [ ! -f "$req_file" ]; then
                  sleep 1
                  continue
                fi

                req="$(cat "$req_file" 2>/dev/null || true)"
                echo "preflight request received: ${req}"

                action="ensure"
                reason=""
                while IFS='=' read -r k v; do
                  [ -n "${k:-}" ] || continue
                  case "$k" in
                    action) action="${v:-}" ;;
                    reason) reason="${v:-}" ;;
                  esac
                done < "$req_file" || true
                action="${action:-ensure}"
                echo "preflight action=${action} reason=${reason}"

                did_reset="false"
                case "$action" in
                  reset-db)
                    reset_database
                    did_reset="true"
                    ;;
                  reset-schema)
                    reset_schema
                    did_reset="true"
                    ;;
                  ensure|"")
                    ensure_schema
                    ;;
                  *)
                    echo "unknown preflight action '${action}'; defaulting to ensure"
                    ensure_schema
                    ;;
                esac

                reconcile_liquibase_compat

                # Realm row count is our safety valve: if master realm exists, don't do destructive actions implicitly.
                realm_table="$(psql_admin "$PGDATABASE" -Atc "select to_regclass('${PGSCHEMA}.realm');" 2>/dev/null || true)"
                realm_rows="0"
                if [ -n "${realm_table:-}" ] && [ "${realm_table}" != "null" ]; then
                  realm_rows="$(psql_admin "$PGDATABASE" -Atc "select count(*) from ${PGSCHEMA}.realm;" 2>/dev/null || echo 0)"
                  realm_rows="${realm_rows:-0}"
                fi

                # Best-effort: keep master direct-grant enabled for the configurator bootstrap.
                if [ "${KC_BOOTSTRAP_MASTER_DIRECT_GRANT:-true}" = "true" ] && [ "${did_reset}" != "true" ] && [ "${realm_rows}" != "0" ]; then
                  admin_user="admin"
                  if [ -s /vault/secrets/keycloak-admin ]; then
                    . /vault/secrets/keycloak-admin
                    admin_user="${KEYCLOAK_ADMIN:-admin}"
                  fi

                  realm_id="$(psql_admin "$PGDATABASE" -Atc "select id from ${PGSCHEMA}.realm where name='master' limit 1;" 2>/dev/null || true)"
                  if [ -n "${realm_id:-}" ]; then
                    psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 \
                      -c "UPDATE ${PGSCHEMA}.user_entity SET enabled=true WHERE realm_id='${realm_id}' AND username='${admin_user}';" >/dev/null 2>&1 || true
                    psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 \
                      -c "UPDATE ${PGSCHEMA}.client SET direct_access_grants_enabled=true WHERE realm_id='${realm_id}' AND client_id='admin-cli';" >/dev/null 2>&1 || true

                    dg_id="$(psql_admin "$PGDATABASE" -Atc "select id from ${PGSCHEMA}.authentication_flow where realm_id='${realm_id}' and lower(alias) in ('direct grant','direct grant flow','direct-grant') limit 1;" 2>/dev/null || true)"
                    if [ -n "${dg_id:-}" ]; then
                      psql_admin "$PGDATABASE" -v ON_ERROR_STOP=1 \
                        -c "UPDATE ${PGSCHEMA}.realm SET direct_grant_flow='${dg_id}' WHERE id='${realm_id}';" >/dev/null 2>&1 || true
                    fi
                  fi
                fi

                printf 'action=%s realm_rows=%s did_reset=%s ts=%s\n' "${action}" "${realm_rows}" "${did_reset}" "$(date -u +%FT%TZ)" > "${done_file}" || true
                rm -f "$req_file"
              done
          volumeMounts:
            - name: kc-preflight-sync
              mountPath: /kc-preflight
        - name: kc-configurator-gate
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              gate_file="/kc-configurator-gate/done"
              mkdir -p /kc-configurator-gate
              echo "kc-configurator-gate waiting for keycloak-configurator completion"

              while true; do
                succ="$(kubectl -n keycloak get job keycloak-configurator -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
                succ="${succ:-0}"
                completion_time="$(kubectl -n keycloak get job keycloak-configurator -o jsonpath='{.status.completionTime}' 2>/dev/null || true)"
                completion_time="${completion_time:-}"
                if [ "$succ" -ge 1 ] 2>/dev/null; then
                  date -u +%FT%TZ > "$gate_file"
                  echo "✅ keycloak-configurator job completed (completionTime=${completion_time:-unknown}); readiness gate opened."
                  break
                fi
                echo "⏳ waiting for keycloak-configurator job completion (succeeded=${succ}, completionTime=${completion_time:-none})..."
                sleep 5
              done
              tail -f /dev/null
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -s /kc-configurator-gate/done
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          volumeMounts:
            - name: kc-configurator-gate
              mountPath: /kc-configurator-gate

        # --- Keycloak runtime ---
        - name: keycloak
          image: ghcr.io/dotcomrow/keycloak-image:sha-81baae9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          env:
            - name: KEYCLOAK_REALM
              value: "external"
            # DB
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/keycloak"
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "currentSchema=keycloak"
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "5"
            # Recovery reset defaults are non-destructive.
            # Options (if explicitly overridden): never | once | always
            - name: KC_RESET_DB_ON_FAILURE_MODE
              value: "never"
            - name: KC_RESET_DB_ON_DUPLICATE_ERRORS
              value: "true"

            # Feature flags
            - name: KC_FEATURES
              value: "token-exchange,token-exchange-standard,token-exchange-external-internal"
            # Allow larger subject_token payloads for OIDC token exchange.
            # Default is 4000 and currently truncates internal user tokens.
            - name: KC_SPI_LOGIN_PROTOCOL__OPENID_CONNECT__REQ_PARAMS_DEFAULT_MAX_SIZE
              value: "12000"

            # Logging
            - name: KC_LOG
              value: "console,file"
            - name: KC_LOG_FILE
              value: "/opt/keycloak/data/log/keycloak.log"
            - name: KC_LOG_LEVEL
              value: "INFO,systems.suncoast.kc.github:DEBUG,systems.suncoast.kc.google:DEBUG,org.keycloak.authentication:DEBUG,org.keycloak.events:DEBUG,org.keycloak.protocol.oidc:DEBUG,org.keycloak.protocol.oidc.grants:TRACE,org.keycloak.protocol.oidc.grants.TokenExchangeGrant:TRACE,org.keycloak.protocol.oidc.endpoints.TokenEndpoint:TRACE,org.keycloak.protocol.oidc.utils.AuthorizeTokenExecutor:TRACE,org.keycloak.authorization:DEBUG,org.keycloak.services.resources.admin.permissions:DEBUG"
            # Proxy & Hostname (Keycloak 26.5 hostname v2)
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME
              value: "https://auth.suncoast.systems"
            - name: KC_HOSTNAME_ADMIN
              value: "https://keycloak-admin.teleport.app.suncoast.systems"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_TRANSACTION_XA_ENABLED
              value: "false"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_HTTP_COOKIE_SAME_SITE
              value: "NONE"
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /opt/keycloak/data/log

              # Admin + DB creds from Vault agent
              source /vault/secrets/keycloak-admin
              export KC_DB_USERNAME="$(cat /vault/secrets/db-username)"
              export KC_DB_PASSWORD="$(cat /vault/secrets/db-password)"

              # Export org/team for the custom provider
              export GITHUB_ORG="$(cat /vault/secrets/github-org)"
              export GITHUB_TEAM="$(cat /vault/secrets/keycloak-admin-team)"
              export GITHUB_ADMIN_GRANT_ALL="${GITHUB_ADMIN_GRANT_ALL:-false}"
              export DEBUG_ALWAYS_GRANT="${DEBUG_ALWAYS_GRANT:-false}"
              export GITHUB_ADMIN_USERNAMES="${GITHUB_ADMIN_USERNAMES:-}"
              export GITHUB_AUTO_ROLES="${GITHUB_AUTO_ROLES:-true}"
              export GITHUB_ROLE_PREFIX="${GITHUB_ROLE_PREFIX:-}"

              # Google Groups auth (Cloud Identity)
              export GOOGLE_ADMIN_EMAIL="$(cat /vault/secrets/google-admin-email)"
              EXTERNAL_ADMIN_GROUP=""
              if [ -s /vault/secrets/google-admin-group ]; then
                EXTERNAL_ADMIN_GROUP="$(tr -d '\r\n' < /vault/secrets/google-admin-group)"
              fi
              export GOOGLE_SA_JSON_PATH="/vault/secrets/google-sa-json"
              export GOOGLE_ROLE_PREFIX="${GOOGLE_ROLE_PREFIX:-}"
              export GOOGLE_AUTO_ROLES="${GOOGLE_AUTO_ROLES:-true}"
              export GOOGLE_STRICT_REVOKE="${GOOGLE_STRICT_REVOKE:-true}"
              export GOOGLE_GROUPS_TTL_SECONDS="${GOOGLE_GROUPS_TTL_SECONDS:-600}"
              export GOOGLE_GROUPS="${GOOGLE_GROUPS:-}"
              if [ -n "${EXTERNAL_ADMIN_GROUP:-}" ]; then
                if [ -n "${GOOGLE_GROUPS:-}" ]; then
                  export GOOGLE_GROUPS="${GOOGLE_GROUPS},${EXTERNAL_ADMIN_GROUP}"
                else
                  export GOOGLE_GROUPS="${EXTERNAL_ADMIN_GROUP}"
                fi
              fi

              sync_dir="/kc-preflight"
              req_file="${sync_dir}/request"
              done_file="${sync_dir}/done"

              request_preflight() {
                local action="${1:-ensure}"
                local reason="${2:-}"
                mkdir -p "$sync_dir"
                rm -f "$done_file"
                printf 'action=%s\nreason=%s\nts=%s\n' "$action" "$reason" "$(date -u +%FT%TZ)" > "$req_file"
                i=0
                while [ "$i" -lt 900 ]; do
                  sleep 1
                  if [ ! -f "$req_file" ]; then
                    break
                  fi
                  i=$((i + 1))
                done
                if [ -f "$req_file" ]; then
                  echo "❌ DB preflight did not complete in time."
                  exit 1
                fi
                if [ -f "$done_file" ]; then
                  echo "✅ DB preflight: $(tr -d '\n' < "$done_file" || true)"
                else
                  echo "✅ DB preflight: done"
                fi
              }

              kc_pid=""
              term_handler() {
                echo "⏹ received termination signal"
                if [ -n "${kc_pid:-}" ]; then
                  kill -TERM "$kc_pid" 2>/dev/null || true
                  wait "$kc_pid" 2>/dev/null || true
                fi
                exit 0
              }
              trap term_handler TERM INT

              max_attempts="${KC_STARTUP_MAX_ATTEMPTS:-30}"
              base_backoff="${KC_STARTUP_BASE_BACKOFF_SECONDS:-5}"
              max_backoff="${KC_STARTUP_MAX_BACKOFF_SECONDS:-60}"
              reset_mode="${KC_RESET_DB_ON_FAILURE_MODE:-never}"
              reset_on_dupe="${KC_RESET_DB_ON_DUPLICATE_ERRORS:-false}"
              reset_marker_file="${sync_dir}/reset-db-performed"
              attempt=0

              log_tail() {
                local n="${1:-2000}"
                if [ -f "${KC_LOG_FILE:-/opt/keycloak/data/log/keycloak.log}" ]; then
                  tail -n "$n" "${KC_LOG_FILE:-/opt/keycloak/data/log/keycloak.log}" 2>/dev/null || true
                fi
              }

              is_duplicate_object_failure() {
                log_tail 2500 | grep -Eqi '(already exists|duplicate key value|duplicate object|relation[[:space:]].*already exists|constraint[[:space:]].*already exists|multiple primary keys)'
              }

              while true; do
                attempt=$((attempt + 1))
                if [ "$attempt" -gt "$max_attempts" ]; then
                  echo "❌ Keycloak exceeded max startup attempts (${max_attempts}); giving up."
                  exit 1
                fi

                echo "▶️  Starting Keycloak (attempt ${attempt}/${max_attempts})..."
                request_preflight "ensure" "attempt=${attempt}"

                /opt/keycloak/bin/kc.sh start --optimized \
                  --spi-connections-liquibase--quarkus--index-creation-threshold=0 &
                kc_pid="$!"
                set +e
                wait "$kc_pid"
                rc="$?"
                set -e
                kc_pid=""

                if [ "$rc" -eq 0 ]; then
                  exit 0
                fi

                preflight_action="ensure"
                preflight_reason="attempt=${attempt} rc=${rc}"

                if [ "${reset_on_dupe}" = "true" ] && is_duplicate_object_failure; then
                  preflight_action="reset-db"
                  preflight_reason="duplicate objects detected in logs"
                elif [ "${reset_mode}" = "always" ]; then
                  preflight_action="reset-db"
                  preflight_reason="KC_RESET_DB_ON_FAILURE_MODE=always"
                elif [ "${reset_mode}" = "once" ] && [ ! -f "${reset_marker_file}" ]; then
                  preflight_action="reset-db"
                  preflight_reason="KC_RESET_DB_ON_FAILURE_MODE=once (first failure)"
                fi

                if [ "${preflight_action}" = "reset-db" ]; then
                  echo "🧨 Scheduling DB reset before next attempt (${preflight_reason})"
                  request_preflight "reset-db" "${preflight_reason}"
                  touch "${reset_marker_file}" || true
                fi

                backoff="$((base_backoff * attempt))"
                if [ "$backoff" -gt "$max_backoff" ]; then
                  backoff="$max_backoff"
                fi
                echo "❌ Keycloak exited (code=${rc}); retrying in ${backoff}s..."
                sleep "$backoff"
              done
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          volumeMounts:
            - name: kc-preflight-sync
              mountPath: /kc-preflight
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: keycloak-client-config-internal
              mountPath: /opt/keycloak/data/clients/internal
              readOnly: true
            - name: keycloak-client-config-external
              mountPath: /opt/keycloak/data/clients/external
              readOnly: true
            - name: keycloak-account-theme
              mountPath: /opt/keycloak/themes/suncoast-account/account
              readOnly: true
