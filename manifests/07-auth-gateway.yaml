apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-auth-gateway-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "6"
data:
  LISTEN_ADDR: ":8080"
  EXTERNAL_BASE_URL: "https://login.suncoast.systems"
  CALLBACK_PATH: "/callback"
  KEYCLOAK_ISSUER: "https://auth.suncoast.systems/realms/external"
  OIDC_CLIENT_ID: "auth-gateway-public"
  OIDC_EXCHANGE_CLIENT_ID: "auth-gateway-exchange"
  OIDC_EXCHANGE_CLIENT_SECRET_FILE: "/vault/secrets/oidc-exchange-client-secret"
  OIDC_SCOPE: "openid profile email"
  HASURA_TOKEN_AUDIENCE_FILE: "/vault/secrets/client-id-graphql-api"
  STATE_TTL: "10m"
  EXCHANGE_CODE_TTL: "2m"
  APP_CODE_PARAM: "gateway_code"
  CLEANUP_INTERVAL: "5m"
  DB_HOST: "yb-tserver-service.yugabyte.svc.cluster.local"
  DB_PORT: "5433"
  DB_NAME: "keycloak"
  DB_SEARCH_PATH: "keycloak"
  DB_SSLMODE: "disable"
  # Comma-separated list of allowed browser origins for API calls.
  # Example: "https://admin.suncoast.systems,https://shell.suncoast.systems"
  CORS_ALLOW_ORIGINS: "*.suncoast.systems,localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-auth-gateway
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  labels:
    app: keycloak-auth-gateway
    app.kubernetes.io/name: keycloak-auth-gateway
    app.kubernetes.io/component: authentication
spec:
  type: ClusterIP
  selector:
    app: keycloak-auth-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-gateway-admin-api
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-keycloak
  target:
    name: auth-gateway-admin-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: value
      remoteRef:
        # Vault KVv2 path: secret/data/auth-gateway-admin-api
        key: auth-gateway-admin-api
        property: value
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-auth-gateway-schema-guard
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "7"
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}
    spec:
      serviceAccountName: keycloak
      restartPolicy: Never
      containers:
        - name: schema-guard
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: yb-tserver-service.yugabyte.svc.cluster.local
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: keycloak
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              DB_USER="$(cat /vault/secrets/db-username)"
              DB_PASSWORD="$(cat /vault/secrets/db-password)"
              export PGPASSWORD="${DB_PASSWORD}"

              for attempt in $(seq 1 120); do
                if psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -tAc "SELECT 1" >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for database (${attempt}/120)..."
                sleep 5
              done

              for attempt in $(seq 1 120); do
                if psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 <<'SQL'
              SELECT CASE
                WHEN EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = 'keycloak'
                    AND table_name = 'auth_gateway_allowed_apps'
                ) THEN 1
                ELSE 0
              END AS has_allowed_apps \gset

              \if :has_allowed_apps
                ALTER TABLE keycloak.auth_gateway_allowed_apps
                  ADD COLUMN IF NOT EXISTS base_urls jsonb;

                UPDATE keycloak.auth_gateway_allowed_apps
                SET base_urls = jsonb_build_array(base_url)
                WHERE base_urls IS NULL
                  OR jsonb_typeof(base_urls) <> 'array'
                  OR base_urls = '[]'::jsonb;

                ALTER TABLE keycloak.auth_gateway_allowed_apps
                  ALTER COLUMN base_urls SET DEFAULT jsonb_build_array();

                ALTER TABLE keycloak.auth_gateway_allowed_apps
                  ALTER COLUMN base_urls SET NOT NULL;
              \endif
              SQL
                then
                  echo "auth gateway schema guard completed"
                  exit 0
                fi
                echo "schema guard attempt ${attempt}/120 failed; retrying..."
                sleep 5
              done

              echo "failed to normalize auth gateway schema"
              exit 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-auth-gateway
  namespace: keycloak
  labels:
    app: keycloak-auth-gateway
    app.kubernetes.io/name: keycloak-auth-gateway
    app.kubernetes.io/component: authentication
    platform.suncoast.systems/vpa-exclude: "true"
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-auth-gateway
  template:
    metadata:
      labels:
        app: keycloak-auth-gateway
      annotations:
        reloader.stakater.com/auto: "true"
        linkerd.io/inject: "enabled"

        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/keycloak-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/keycloak-app" -}}{{ .Data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-client-id-graphql-api: "secret/data/keycloak-client-id-graphql-api"
        vault.hashicorp.com/agent-inject-template-client-id-graphql-api: |
          {{- with secret "secret/data/keycloak-client-id-graphql-api" -}}{{ .Data.data.value }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-oidc-exchange-client-secret: "secret/data/keycloak-client-secret-auth-gateway-exchange"
        vault.hashicorp.com/agent-inject-template-oidc-exchange-client-secret: |
          {{- with secret "secret/data/keycloak-client-secret-auth-gateway-exchange" -}}{{ .Data.data.value }}{{- end -}}
    spec:
      serviceAccountName: keycloak
      containers:
        - name: auth-gateway
          image: ghcr.io/dotcomrow/keycloak-auth-gateway:sha-9d5e6cb
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: keycloak-auth-gateway-config
          env:
            - name: DB_USER_FILE
              value: /vault/secrets/db-username
            - name: DB_PASSWORD_FILE
              value: /vault/secrets/db-password
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: auth-gateway-admin-api
                  key: value
                  optional: false
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-gateway-oidc-client
                  key: client-secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
